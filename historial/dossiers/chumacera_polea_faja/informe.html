reprint; los valores del activo son vacío. Las ecuaciones no figuran en el extracto registrado: verificar en la fuente."},{"id":"P3","texto":"La kurtosis detecta defecto incipiente pero NO es monótona: vuelve a valores normales cuando el defecto se extiende. Por tanto, una kurtosis baja no prueba un rodamiento sano y no sirve sola para pronóstico.","nivel":"EVIDENCIA","evidencia":["E-8003"],"nota":"Revisión de 2008 que no cuantifica tiempos de aviso ni trata fajas."},{"id":"P4","texto":"Los umbrales de kurtosis 3 (operación con restricciones) y 5 (inaceptable) circulan en la literatura, pero los autores de la revisión no hallaron sustento teórico ni empírico, y no hay datos públicos de su fiabilidad. No son estándar para chumaceras de fajas y no se adoptan como alarma.","nivel":"EVIDENCIA","evidencia":["E-8001"],"nota":"Se citan solo para advertir que no están validados."},{"id":"P5","texto":"Las etapas de degradación descritas son cualitativas: 1 ultrasonido; 2 resonancia natural con defecto inicial; 3 frecuencias de defecto y armónicos; 4 etapa final previa a la falla. No traen duraciones, por lo que no permiten fijar un intervalo P-F.","nivel":"EVIDENCIA","evidencia":["E-8008"],"nota":"Datos de banco acelerado; sin tiempos de aviso."},{"id":"P6","texto":"Los resultados de ML en banco no demuestran generalización: una exactitud de 99,4 % no dice qué partición usó (por activo, condición o segmentos al azar); con partición que retiene una condición, la exactitud cae a 40,64 % en JNU, bajo una línea base de clase mayoritaria, mientras la regresión logística (57,91 %) generaliza mejor que los conjuntos de árboles.","nivel":"EVIDENCIA","evidencia":["E-8007","E-8010"],"nota":"Resúmenes de autores, preprints no arbitrados, sin fajas. E-8010 es un preprint 2026 de identificador no contrastado."},{"id":"P7","texto":"Los propios autores reconocen que muchas técnicas se desarrollan y prueban en condiciones controladas, lo que limita su adaptabilidad. Las mejoras reportadas (hasta 15,8 %) son frente a una referencia elegida por los autores, en banco.","nivel":"EVIDENCIA","evidencia":["E-8011","E-8518"],"nota":"No son prueba de desempeño en campo."},{"id":"P8","texto":"Un modelo de supervivencia (CoxPH, bosque de supervivencia) se validó para vida remanente en un conjunto de banco acelerado, con error en minutos y censura aleatoria. Sirve como método candidato por tratar la censura, pero la escala (minutos, carga muy alta) no se traslada a una polea de baja velocidad con vida de meses.","nivel":"EVIDENCIA","evidencia":["E-8009"],"nota":"Preprint no arbitrado; el error no equivale a tiempo de aviso en campo."},{"id":"P9","texto":"Los bancos públicos abiertos (rodamientos de bolas, carga y velocidad variables o fallas aceleradas) sirven para depurar código y comparar métodos, no para fijar umbrales ni intervalos del activo. Uno de ellos tiene solo 2 ensayos de falla y sin censura declarada: mínimo absoluto para Weibull.","nivel":"SINTESIS","evidencia":["E-7001","E-7002","E-7003","E-8009"],"nota":"Razonamiento: banco no representa baja velocidad, soporte de chumacera ni lubricación de campo. Validar con un experto del activo."},{"id":"P10","texto":"La confianza mejora combinando vibración con aceite, termografía y otros indicadores, y la comparación contra una condición propia del activo es más defendible que un límite genérico.","nivel":"SINTESIS","evidencia":["E-8003","E-8001"],"nota":"Razonamiento: si el límite genérico no tiene sustento (P4), la referencia debe salir de datos propios del activo en buen estado. Validar con un experto del activo."},{"id":"P11","texto":"Un baseline de ingeniería (tendencia de envolvente en las frecuencias de defecto, más temperatura y condición del lubricante) debe existir y ser superado con evidencia antes de justificar cualquier modelo de aprendizaje. Con pocas fallas por modo, el aprendizaje supervisado no es estimable.","nivel":"SINTESIS","evidencia":["E-8010","E-8003","E-8009"],"nota":"Razonamiento: el único contraste de generalización leído muestra que un modelo simple supera a conjuntos de árboles fuera de la condición de entrenamiento. Validar con un experto del activo. E-8010 es un preprint 2026 de identificador no contrastado."}],"estrategia":[{"etapa":"0. Definición previa (sin modelo)","accion":"Fijar con el negocio el objetivo (detección, diagnóstico o RUL), el horizonte H y el costo de falso negativo frente a falso positivo; definir qué es 'falla funcional' y qué es censura (retiro preventivo, cambio por otra causa). Registrar velocidad real, datos de placa del rodamiento y configuración de la polea. Instalar el flujo de datos: mismo punto de medición, misma orientación, misma frecuencia de muestreo y bitácora de intervenciones.","condicion_para_avanzar":"Horizonte, costos y definición de falla aprobados por una persona responsable; punto y método de medición fijados. Valores: VACÍO hasta que el negocio los entregue.","evidencia":["E-8008","E-8009"],"nivel":"SINTESIS"},{"etapa":"1. Línea base y umbral desde datos propios","accion":"Medir el activo en buen estado y construir su referencia propia (RMS, kurtosis, espectro de envolvente en BPFO, BPFI, BSF, FTF, temperatura), con carta de control o tendencia. Elegir la banda de filtro de envolvente en el activo y documentarla. No usar kurtosis 3 y 5 como alarma: están sin sustento y la kurtosis cae al crecer el defecto. Los umbrales se expresan como desviación respecto de la línea base propia y los aprueba un experto del activo.","condicion_para_avanzar":"Línea base con mediciones repetidas del activo sano, verificación de repetibilidad del punto de medición y criterio de umbral aprobado por humano. Cantidad mínima de mediciones: VACÍO (no hay fuente leída).","evidencia":["E-8001","E-8003","E-8006"],"nivel":"SINTESIS"},{"etapa":"2. Detección (baseline estadístico)","accion":"Operar alerta por desviación de la línea base propia combinando envolvente, temperatura y aceite o grasa, en modo sombra (sin actuar) y registrando cada alerta con la inspección posterior. Medir falsas alarmas por activo-mes y recall por evento, no por puntos. Comparar contra el baseline de umbral de ingeniería y tendencia.","condicion_para_avanzar":"Piloto en sombra completado con alertas verificadas por inspección y falsos negativos revisados uno a uno. Para pasar a un detector aprendido: evidencia de que supera al baseline con validación hacia adelante y reserva de activos no vistos, y cantidad mínima de eventos reales según el protocolo del equipo (cifra: VACÍO).","evidencia":["E-8001","E-8003","E-8010"],"nivel":"SINTESIS","nota":"E-8010 es un preprint 2026 de identificador no contrastado."},{"etapa":"3. Diagnóstico (ubicación y tipo del defecto)","accion":"Usar el espectro de envolvente para atribuir la alerta a pista externa, interna, elemento rodante o jaula mediante las frecuencias características, y cruzarlo con las etapas de degradación (etapa 3: frecuencias de defecto y armónicos). Un clasificador supervisado solo si existen fallas etiquetadas del propio activo o flota; antes, diagnóstico basado en reglas y criterio experto.","condicion_para_avanzar":"Diagnósticos contrastados con la inspección real del rodamiento desmontado. Para clasificador aprendido: fallas etiquetadas por modo suficientes (cifra: VACÍO), partición por activo completo y por tiempo, y recall de la clase crítica superior al del diagnóstico por reglas.","evidencia":["E-8008","E-8006","E-8010"],"nivel":"SINTESIS","nota":"E-8010 es un preprint 2026 de identificador no contrastado."},{"etapa":"4. Pronóstico (RUL o tiempo de aviso)","accion":"Primero estimar con datos propios el intervalo entre la primera detección y la falla funcional (P-F) por supervivencia clásica con censura (Weibull, Kaplan-Meier), tratando la censura como tal y no como RUL = 0. Solo después, evaluar CoxPH o bosque de supervivencia, que son los candidatos con respaldo en banco. El RUL se entrega como distribución con cobertura empírica medida por activo.","condicion_para_avanzar":"Cantidad mínima de fallas por modo cumplida (cifra: VACÍO; si no se alcanza, el resultado se rotula 'exploratorio'), validación hacia adelante y en activos reservados, calibración y cobertura de intervalos medidas, y aprobación humana para actuar. Intervalo P-F: VACÍO.","evidencia":["E-8009","E-8004"],"nivel":"SINTESIS"},{"etapa":"5. Operación, deriva y reentrenamiento","accion":"Piloto en sombra antes de actuar; plan de deriva por cambio de carga, velocidad, material transportado, lubricante o cambio de rodamiento; reentrenar solo con aprobación humana, y guardar script, semilla y versiones.","condicion_para_avanzar":"Criterio de deriva y de reentrenamiento definido y aprobado por una persona; cifras de disparo: VACÍO.","evidencia":["E-8011","E-8010"],"nivel":"SINTESIS","nota":"E-8010 es un preprint 2026 de identificador no contrastado."}],"riesgos_de_validacion":[{"riesgo":"Banco frente a campo: los conjuntos abiertos son rodamientos pequeños en banco, con carga muy alta y vida de minutos, o carga y velocidad variables, no polea de faja de baja velocidad. Umbrales, errores y exactitudes no se trasladan.","evidencia":["E-8009","E-7001","E-7003","E-8011"],"nivel":"SINTESIS"},{"riesgo":"Partición que infla el desempeño: una exactitud alta sin partición declarada no respalda generalización; al retener una condición la exactitud pudo caer a 40,64 %. La partición debe ser por activo completo y por tiempo, nunca por fotograma, segmento o ventana.","evidencia":["E-8007","E-8010"],"nivel":"SINTESIS"},{"riesgo":"Fuga de datos: segmentos de un mismo rodamiento en entrenamiento y prueba; selección de variables, filtro de envolvente o normalización ajustados con todos los datos; etiquetas construidas con información posterior al evento.","evidencia":["E-8010","E-8007"],"nivel":"SINTESIS"},{"riesgo":"Pocas fallas y censura: las fallas son raras y los datos censurados; con 2 ensayos de falla el ajuste Weibull está en el mínimo absoluto y sin censura declarada. Tratar la censura como RUL = 0 o descartarla sesga el resultado.","evidencia":["E-8009","E-7003"],"nivel":"SINTESIS"},{"riesgo":"Indicador no monótono: la kurtosis vuelve a lo normal al extenderse el defecto, de modo que una tendencia de kurtosis puede dar falsa tranquilidad.","evidencia":["E-8003"],"nivel":"SINTESIS"},{"riesgo":"Umbrales genéricos sin sustento (kurtosis 3 y 5) usados como alarma o como etiqueta de entrenamiento: se propagarían errores al modelo.","evidencia":["E-8001"],"nivel":"SINTESIS"},{"riesgo":"Comparar contra una referencia débil: las mejoras reportadas son frente a referencias elegidas por los autores; el modelo debe superar al umbral, la tendencia, la supervivencia clásica y el bosque aleatorio.","evidencia":["E-8011","E-8518","E-8010"],"nivel":"SINTESIS"},{"riesgo":"Selección de banda de envolvente: es la principal dificultad de la técnica; ajustarla con datos de prueba es fuga.","evidencia":["E-8006","E-8001"],"nivel":"SINTESIS"}],"vacios":["No hay datos del activo: no se entrenó ni evaluó ningún modelo; todo desempeño del activo es VACÍO.","Umbrales de alarma (vibración, envolvente, temperatura, kurtosis) para chumaceras de polea de faja: sin fuente leída. Los 3 y 5 de kurtosis carecen de sustento según E-8001.","Intervalo P-F y tiempo de aviso en campo: ninguna fuente leída lo da (E-8008 es cualitativa; E-8009 está en minutos y banco acelerado). Se estima con datos propios.","Cantidad mínima de fallas por modo y de mediciones de línea base: sin cifra en las fuentes leídas; la fija el protocolo del equipo con data_quality.audit al disponer de datos.","Horizonte H y costos de falso negativo y falso positivo: los define el negocio.","Frecuencias características numéricas, velocidad real y datos de placa del rodamiento del activo.","Cuántos ensayos de los bancos abiertos terminaron en falla y con qué censura (E-7001, E-7002 sin verificar); lectura de los reportes originales pendiente.","Fuentes SOLO-SNIPPET y NO-VERIFICADO (E-7004 a E-7010, E-8012 a E-8015, E-8521 a E-8530) sin abrir; pistas pendientes, no respaldan nada. Entre ellas hay bancos adicionales (por ejemplo E-7005, E-7006) y un estudio de monitoreo de rodillos (E-8012) por abrir.","Sin evidencia leída de que modelos fundacionales de series, modelos de lenguaje o gemelos digitales mejoren la predicción en este modo de falla; ningún porcentaje de reducción de paradas.","Modelos NO justificados hoy, por falta de fallas propias, de partición validada por activo y de superación demostrada del baseline: (a) redes profundas o CNN de diagnóstico, cuyas exactitudes de banco no generalizan (E-8007, E-8010, E-8011); (b) regresión de RUL con aprendizaje profundo entrenado en banco y aplicado al activo (E-8009); (c) transferencia directa de modelos o umbrales de banco a la polea; (d) detector de anomalías con alarma automática sin piloto en sombra; (e) cualquier modelo que use kurtosis 3 y 5 como etiqueta o alarma (E-8001). Lo que sí procede hoy: etapas 0 y 1 y, en sombra, la 2."]},"herramientas":true},"hipotesis":[],"tecnicas":[],"raices":[],"linea_tiempo":[],"series":[],"plan":[]},"evidencia":[{"id":"E-6001","tipo":"paper","acceso":"fragmento","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{"autores":"Wijaya, H., Rajeev, P., Gad, E., & Vivekanamtham, R.","anio":2021,"titulo":"Distributed optical fibre sensor for condition monitoring of mining conveyor using wavelet transform and artificial neural network","fuente":"Structural Control and Health Monitoring","volumen":"28(11)","doi":"10.1002/stc.2827"},"extracto":"Gurjar reported that more than 50% of all the conveyor belt failures are due to malfunctioning idlers. ... The majority of idler damage occurs due to factors such as improper lubrication, contamination and misalignment.","localizador":"Sección INTRODUCTION, párrafo 1 (fragmento 10.1002/stc.2827_0001)","afirma":"Cita secundaria (de un trabajo de Gurjar) de que más del 50 % de las fallas de transportadores de banda se deben a rodillos (idlers) defectuosos; y que la mayor parte del daño en rodillos se atribuye a lubricación inadecuada, contaminación y desalineación. Cita también que fallas de rodillos fueron causa principal de ignición (51 % en Australia, 46,7 % en Reino Unido, citando a Fernandez et al.).","limites":"Es una introducción que cita a otros: la cifra del 50 % no se verificó en su fuente primaria (no dice base de datos, tamaño ni año). Se refiere a RODILLOS (idlers), no a chumaceras de poleas. El estudio en sí es un prototipo de laboratorio de monitoreo con fibra óptica. No ordena modos de falla de poleas.","aplica_a":"Mecanismos y causas raíz (lubricación, contaminación, desalineación) en rodamientos de rodillos; ranking de componentes (solo como cita secundaria). Comparabilidad: baja a media para chumacera de polea.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Wijaya, H., Rajeev, P., Gad, E., & Vivekanamtham, R. (2021). Distributed optical fibre sensor for condition monitoring of mining conveyor using wavelet transform and artificial neural network. Structural Control and Health Monitoring, 28(11). https://doi.org/10.1002/stc.2827","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-6002","tipo":"paper","acceso":"fragmento","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{"autores":"Shanyavskiy, A. A., & Soldatenkov, A. P.","anio":2022,"titulo":"Crack path and regularities for ball-bearing fracture in the very-high-cycle fatigue regime","fuente":"Fatigue & Fracture of Engineering Materials & Structures","volumen":"45(11)","paginas":"3378-3392","doi":"10.1111/ffe.13782"},"extracto":"Such cases have been thoroughly investigated and classified according to the various reasons for damage: excessive loads, misalignment, tight fits, lubricant failure, wear, corrosion, fretting, and so on.","localizador":"Sección INTRODUCTION, párrafo 1 y 2 (fragmento 10.1111/ffe.13782_0001)","afirma":"Clasificación general de causas de daño en rodamientos (carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión, fricción por micro-movimiento) y que, en condiciones convencionales de operación según ISO 281:2007, la fatiga de contacto por rodadura (descascarado subsuperficial) es la causa de falla. Define L10 como la vida a la cual falla el 10 % de los rodamientos (L10=(C/F)^p, p=3 bolas, 10/3 rodillos).","limites":"Rodamientos de bolas en régimen de fatiga de ciclos muy altos; no es un estudio de transportadores ni de poleas. No da frecuencias de falla ni vida de diseño de poleas.","aplica_a":"Mecanismos físicos de falla de rodamientos (fatiga vs causas fuera de condición convencional); definición de L10. Comparabilidad: media (mecanismo general).","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Shanyavskiy, A. A., & Soldatenkov, A. P. (2022). Crack path and regularities for ball-bearing fracture in the very-high-cycle fatigue regime. Fatigue & Fracture of Engineering Materials & Structures, 45(11), 3378-3392. https://doi.org/10.1111/ffe.13782","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-6003","tipo":"paper","acceso":"fragmento","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{"autores":"Kenworthy, J., Hart, E., Stirling, J., Stock, A., Keller, J., Guo, Y., Brasseur, J., & Evans, R.","anio":2023,"titulo":"Wind turbine main bearing rating lives as determined by IEC 61400-1 and ISO 281: A critical review and exploratory case study","fuente":"Wind Energy","volumen":"27(2)","paginas":"179-197","doi":"10.1002/we.2883"},"extracto":"The basic rating life (for a population of bearings manufactured with commonly used high-quality material, of good manufacturing quality, and operating under conventional operating conditions) is the value of bearing life which 90% of the population are expected to attain or exceed.","localizador":"Sección BACKGROUND, párrafo 1 (fragmento 10.1002/we.2883_0003)","afirma":"Definición de vida nominal básica (L10) según ISO 281: vida que el 90 % de una población de rodamientos idénticos alcanza o supera, hasta el primer indicio de fatiga; la vida nominal modificada incorpora viscosidad del lubricante, contaminación y límite de carga de fatiga; ISO/TS 16281 considera desalineación, inclinación y holgura.","limites":"Contexto de aerogeneradores (rodamiento principal). No trata poleas de banda ni da horas de diseño para transportadores. La edición de ISO 281 no se verificó aquí. L10 predice solo fatiga de contacto, no otras causas.","aplica_a":"Interpretación de L10 como vida de diseño: 10 % de falla esperada antes de L10. Comparabilidad: baja en activo, alta en definición.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Kenworthy, J., Hart, E., Stirling, J., Stock, A., Keller, J., Guo, Y., Brasseur, J., & Evans, R. (2023). Wind turbine main bearing rating lives as determined by IEC 61400-1 and ISO 281: A critical review and exploratory case study. Wind Energy, 27(2), 179-197. https://doi.org/10.1002/we.2883","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-6004","tipo":"paper","acceso":"abstract","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{"autores":"Goode, T.","anio":1988,"titulo":"Preventing Early Failure of Pump Ball Bearings","fuente":"Opflow","volumen":"14(4)","paginas":"1-5","doi":"10.1002/j.1551-8701.1988.tb00751.x"},"extracto":"Ninety percent of premature pump ball bearing failure can be attributed to corrosion caused by contamination, poor handling before and during installation, lubricant failure, or overheating caused by improper fits in housings or shafts.","localizador":"Abstract (fragmento único 10.1002/j.1551-8701.1988.tb00751.x_0000)","afirma":"En bombas, el 90 % de las fallas prematuras de rodamientos de bolas se atribuye (según el autor) a corrosión por contaminación, mal manejo/instalación, falla de lubricante o sobrecalentamiento por ajustes inadecuados en alojamientos o ejes.","limites":"Bombas, no transportadores; artículo de divulgación de 1988; el resumen no da base de datos ni tamaño de muestra. Solo se leyó el resumen. Se usa por analogía de mecanismos, no como estadística de poleas.","aplica_a":"Causas raíz típicas de falla prematura de rodamientos: contaminación, instalación, lubricación, ajustes de alojamiento. Comparabilidad: baja.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Goode, T. (1988). Preventing Early Failure of Pump Ball Bearings. Opflow, 14(4), 1-5. https://doi.org/10.1002/j.1551-8701.1988.tb00751.x","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-6005","tipo":"otro","acceso":"snippet","via":"websearch","fecha_acceso":"2026-10-27","referencia":{"titulo":"Artículo en Tribology in Industry sobre fallas de poleas (título y autores no obtenidos)","fuente":"Tribology in Industry (según el buscador)","url":"https://tribology.rs/journals/aips/2171.pdf"},"extracto":"(resumen del buscador) las fallas de poleas incluyen fisuras por fatiga del eje, agrietamiento de la carcasa y fallas de soldadura; causas: diseño inadecuado, desviaciones de prácticas CEMA, reacondicionamiento inadecuado o condiciones imprevistas.","localizador":"resultado de búsqueda web 2026-10-27","afirma":"PISTA: existe un artículo que describe modos de falla de poleas (fatiga de eje, carcasa, soldadura). No respalda afirmaciones.","limites":"Solo resumen de buscador; la página no se pudo abrir (sin resolución de nombre desde este entorno). Título, autores y año sin verificar.","aplica_a":"Pista para modos de falla de la polea (eje/carcasa) distintos de la chumacera. Leer el PDF si se habilita el dominio.","revista_cuartil":null,"nivel_evidencia":"SOLO-SNIPPET","apa":"Autor no identificado (s. f.). Artículo en Tribology in Industry sobre fallas de poleas (título y autores no obtenidos). Tribology in Industry (según el buscador). https://tribology.rs/journals/aips/2171.pdf","avisos":[]},{"id":"E-6006","tipo":"otro","acceso":"snippet","via":"websearch","fecha_acceso":"2026-10-27","referencia":{"titulo":"Engineer Uptime into Your Conveyor's Bearings","fuente":"revista comercial (artículo técnico de revista comercial; según el buscador)","url":null},"extracto":"(resumen del buscador) para muchas aplicaciones una L10 de 30 000 horas se considera el mínimo; los diseñadores de transportadores suelen exigir L10 superior a 100 000 horas.","localizador":"resultado de búsqueda web 2026-10-27","afirma":"PISTA: práctica citada de L10 mínima de 30 000 h y diseño de transportadores con más de 100 000 h. No respalda cifras en entregables.","limites":"Snippet de revista comercial/vendedor; atribución del snippet a esta URL no verificada; sin norma ni base de datos. Nombre y enlace del sitio omitidos por la política de neutralidad.","aplica_a":"Vida de diseño L10 para rodamientos de poleas (pista).","revista_cuartil":null,"nivel_evidencia":"SOLO-SNIPPET","apa":"Autor no identificado (s. f.). Engineer Uptime into Your Conveyor's Bearings. revista comercial (artículo técnico de revista comercial; según el buscador).","avisos":[]},{"id":"E-6007","tipo":"otro","acceso":"snippet","via":"websearch","fecha_acceso":"2026-10-27","referencia":{"titulo":"Resumen de poleas de transportador (documento de fabricante de poleas)","fuente":"Documento comercial (según el buscador)","url":null},"extracto":"(resumen del buscador) vida del rodamiento diseñada para un mínimo de 75 000 horas L10 con factores de ajuste de vida iguales a 1; ejes dimensionados para vida infinita.","localizador":"resultado de búsqueda web 2026-10-27","afirma":"PISTA: una especificación comercial de poleas fija 75 000 h L10 mínimas. No respalda cifras en entregables.","limites":"Documento comercial de un fabricante; no abierto; no es norma ni estudio de campo. Nombre y enlace del sitio omitidos por la política de neutralidad.","aplica_a elson, 1990)","anio":2016,"titulo":"The RELIABILITY Procedure: Weibull regression example on Nelson load-accelerated rolling bearing data","url":null},"afirma":"PISTA de parametro publicado: forma Weibull 1.2434 (error estandar 0.1545; IC95 aprox. 0.97 a 1.59), 39 observaciones sin censura, datos de ensayo de rodamientos con carga acelerada (Nelson 1990).","limites":"Solo resumen de buscador; la escala depende de la carga del ensayo y no se reporta aqui; ensayo de laboratorio de rodamientos de rodillos, no de campo. No abierto. Nombre y enlace del sitio omitidos por la política de neutralidad.","aplica_a":"Contraste de la forma beta (rodamientos ~1.2) frente a supuestos","licencia":"no aplica","comparabilidad":"baja","nivel_evidencia":"SOLO-SNIPPET","apa":"software estadístico Institute (documentacion; datos de Nelson, 1990) (2016). The RELIABILITY Procedure: Weibull regression example on Nelson load-accelerated rolling bearing data.","avisos":[]},{"id":"E-7008","tipo":"otro","acceso":"snippet","via":"websearch","fecha_acceso":"2026-10-27","referencia":{"autores":"Autor no identificado en el resumen (articulo de revista tecnica)","anio":null,"titulo":"Calculating Machine Reliability from Bearing Life","url":"https://machinedesign.com/archive/article/21831948/calculating-machine-reliability-from-bearing-life"},"afirma":"PISTA: segun buscador, la forma beta para rodamientos varia con la carga (cerca de 1.0 con carga ligera, 4.0 o mas con carga pesada).","limites":"Solo resumen de buscador, articulo divulgativo sin autor ni anio verificados; no es dato de falla.","aplica_a":"Rango de beta de referencia (hipotesis)","licencia":"no aplica","comparabilidad":"baja","nivel_evidencia":"SOLO-SNIPPET","apa":"Autor no identificado en el resumen (articulo de revista tecnica) (s. f.). Calculating Machine Reliability from Bearing Life. https://machinedesign.com/archive/article/21831948/calculating-machine-reliability-from-bearing-life","avisos":[]},{"id":"E-7009","tipo":"otro","acceso":"snippet","via":"websearch","fecha_acceso":"2026-10-27","referencia":{"autores":"Autores no identificados (trabajo PSAM 12)","anio":null,"titulo":"PSAM 12 paper 168 (supuestos de forma Weibull para rodamientos)","url":"https://www.iapsam.org/psam12/proceedings/paper/paper_168_1.pdf"},"afirma":"PISTA: segun buscador, el articulo asume beta=1.5 para rodamientos de rodillos y 2.0 para de bolas (Weibayes) porque los datos de falla eran insuficientes.","limites":"Valores ASUMIDOS, no ajustados; solo resumen de buscador; no es dato de campo ni de faja.","aplica_a":"Referencia de supuesto beta para Weibayes (declarar como SUPUESTO)","licencia":"no aplica","comparabilidad":"baja","nivel_evidencia":"SOLO-SNIPPET","apa":"Autores no identificados (trabajo PSAM 12) (s. f.). PSAM 12 paper 168 (supuestos de forma Weibull para rodamientos). https://www.iapsam.org/psam12/proceedings/paper/paper_168_1.pdf","avisos":[]},{"id":"E-7010","tipo":"paper","acceso":"solo_referencia","via":"readme_repositorio","fecha_acceso":"2026-10-27","referencia":{"autores":"Javanmardi, A.; Aimiyekagbon, O. K.; Bender, A.; Kimotho, J. K.; Sextro, W.; Hullermeier, E.","anio":2024,"titulo":"Remaining Useful Lifetime Estimation of Bearings Operating under Time-Varying Conditions","fuente":"PHM Society European Conference 8(1)","doi":"10.36001/phme.2024.v8i1.4101","pais":"Alemania"},"afirma":"Articulo que describe el conjunto de E-7001 (citado en su README); no leido.","limites":"No leido: no respalda ninguna cifra. Pendiente para saber cuantos rodamientos fallaron y como se definio el fin de vida.","aplica_a":"Pendiente de lectura","nivel_evidencia":"NO-VERIFICADO","apa":"Javanmardi, A.; Aimiyekagbon, O. K.; Bender, A.; Kimotho, J. K.; Sextro, W.; Hullermeier, E. (2024). Remaining Useful Lifetime Estimation of Bearings Operating under Time-Varying Conditions. PHM Society European Conference 8(1). https://doi.org/10.36001/phme.2024.v8i1.4101","avisos":[]},{"id":"E-8001","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Burda, E. A., Zusman, G. V., Kudryavtseva, I. S., Naumenko, A. P., & Nicoletti, R.","anio":2022,"titulo":"An Overview of Vibration Analysis Techniques for the Fault Diagnostics of Rolling Bearings in Machinery","fuente":"Shock and Vibration","volumen":"2022(1)","doi":"10.1155/2022/6136231"},"extracto":"(chunk 10) If the kurtosis coefficient is less than 3, the bearing is in good condition; if the kurtosis coefficient is more than 3, operation with restrictions is permissible; if the kurtosis coefficient is more than 5, the operation of the bearing assembly is unacceptable. Unfortunately, it was not possible to find a theoretical or empirical substantiation of the given boundary values in the available sources. [...] (chunk 8) The obvious advantages of the method for determining the technical state of a rolling bearing from the spectrum of the VA signal envelope are as follows: high sensitivity, noise immunity, and the ability to identify the type and location of the defect.","localizador":"sec. 3, chunks 10 (kurtosis) y 8 (envolvente) del texto completo (conector Wiley)","afirma":"Revision: el RMS es poco sensible a defectos incipientes; la kurtosis responde a impulsos; existe un criterio de umbrales de kurtosis (3 y 5) cuyos autores de la revision no hallaron sustento teorico ni empirico; ademas no hay datos publicos sobre la fiabilidad de la kurtosis como criterio. Ademas: el espectro de la envolvente tiene alta sensibilidad, inmunidad al ruido e identifica tipo y ubicacion del defecto; su dificultad es elegir el ancho de banda del filtro; la evaluacion por espectro de velocidad detecta defectos solo en etapas tardias (segun la revision).","limites":"Revision narrativa; no mide nada propio. Los umbrales 3 y 5 NO son un estandar validado para chumaceras de fajas. Pais/institucion no verificados en la fuente leida. No trata fajas transportadoras.","aplica_a":"Deteccion: indicadores en tiempo (RMS, kurtosis); advertencia contra umbrales universales","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Burda, E. A., Zusman, G. V., Kudryavtseva, I. S., Naumenko, A. P., & Nicoletti, R. (2022). An Overview of Vibration Analysis Techniques for the Fault Diagnostics of Rolling Bearings in Machinery. Shock and Vibration, 2022(1). https://doi.org/10.1155/2022/6136231","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8003","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Jayaswal, P., Wadhwani, A. K., Mulchandani, K. B., & Kaneko, Y.","anio":2008,"titulo":"Machine Fault Signature Analysis","fuente":"International Journal of Rotating Machinery","volumen":"2008(1)","doi":"10.1155/2008/583982"},"extracto":"The statistical parameters such as kurtosis and skewness values are robust to varying bearing operating condition and are good indicators of incipient defects. The disadvantage, however, is that as the defect spreads across the bearing surfaces the values of these parameters drop back to normal","localizador":"chunk 12 del texto completo (conector Wiley)","afirma":"Revision: la kurtosis es buen indicador de defecto incipiente pero vuelve a valores normales cuando el defecto se extiende (curva no monotona); la envolvente (filtro pasabanda + demodulacion Hilbert o rectificacion) sirve con senales ruidosas; la confianza mejora combinando vibracion con aceite, termografia y otros indicadores.","limites":"Revision de 2008; no cuantifica tiempos de aviso. No trata fajas transportadoras. Pais no verificado en la fuente leida.","aplica_a":"Curva de degradacion de indicadores; diagnostico por envolvente; fusion de indicadores","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jayaswal, P., Wadhwani, A. K., Mulchandani, K. B., & Kaneko, Y. (2008). Machine Fault Signature Analysis. International Journal of Rotating Machinery, 2008(1). https://doi.org/10.1155/2008/583982","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8004","tipo":"paper","acceso":"abstract","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Buzzoni, M., Soave, E., D'Elia, G., Mucchi, E., Dalpiaz, G., & Reccia, E.","anio":2018,"titulo":"Development of an Indicator for the Assessment of Damage Level in Rolling Element Bearings Based on Blind Deconvolution Methods","fuente":"Shock and Vibration","volumen":"2018(1)","doi":"10.1155/2018/5384358"},"extracto":"The validation of the proposed indicator has been carried out by means of both simulated signal and a runtofailure experiment. The results highlight that the proposed indicator is able to detect more efficiently the fault occurrence and, most importantly, quicker than other established techniques.","localizador":"Resumen del autor (campo abstract / chunk 0, conector Wiley)","afirma":"Un indicador basado en deconvolucion ciega y kurtosis rastrea la degradacion del rodamiento (pista externa, interna, elemento rodante) y se valido con senal simulada y un ensayo hasta la falla.","limites":"Solo se leyo el resumen del autor (metadatos del conector); el ensayo hasta la falla es de banco, no de campo; no se leyeron cifras ni la condicion de carga.","aplica_a":"Deteccion temprana y seguimiento de severidad por kurtosis mejorada","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Buzzoni, M., Soave, E., D'Elia, G., Mucchi, E., Dalpiaz, G., & Reccia, E. (2018). Development of an Indicator for the Assessment of Damage Level in Rolling Element Bearings Based on Blind Deconvolution Methods. Shock and Vibration, 2018(1). https://doi.org/10.1155/2018/5384358","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8005","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Nguyen, P. H., Kim, J., & Caesarendra, W.","anio":2015,"titulo":"Multifault Diagnosis of Rolling Element Bearings Using a Wavelet Kurtogram and Vector Median-Based Feature Analysis","fuente":"Shock and Vibration","volumen":"2015(1)","doi":"10.1155/2015/320508"},"extracto":"The kurtogram method relies on spectral kurtosis, which was originally proposed by Dwyer [[5](#bib-0005)], to detect the presence of nonstationary transients and accurately indicate their location in the frequency bands of bearing signals.","localizador":"chunk 1 del texto completo (conector Wiley)","afirma":"El kurtograma (curtosis espectral) se usa para localizar la banda de frecuencia donde estan los transitorios del defecto, paso previo a la envolvente; sus variantes se proponen porque el kurtograma es sensible a componentes impulsivos ajenos.","limites":"Se leyo solo la introduccion; no se leyeron resultados ni validacion del articulo. Ensayo de banco presumible, no verificado. No trata fajas.","aplica_a":"Diagnostico: seleccion de banda con kurtograma","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Nguyen, P. H., Kim, J., & Caesarendra, W. (2015). Multifault Diagnosis of Rolling Element Bearings Using a Wavelet Kurtogram and Vector Median-Based Feature Analysis. Shock and Vibration, 2015(1). https://doi.org/10.1155/2015/320508","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8006","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Van, M., Franciosa, P., Ceglarek, D., & Lei, Y.","anio":2016,"titulo":"Rolling Element Bearing Fault Diagnosis Using Integrated Nonlocal Means Denoising with Modified Morphology Filter Operators","fuente":"Mathematical Problems in Engineering","volumen":"2016(1)","doi":"10.1155/2016/9657285"},"extracto":"In this method, first, the vibration signal is filtered around the mechanical resonance of the machine. Then, an amplitude demodulation technique and Fourier transform are applied to extract fault features. However, the selection of the filtering frequency band is a challenge in this approach.","localizador":"chunk 1 del texto completo (conector Wiley)","afirma":"Describe el procedimiento de analisis de envolvente (filtrar en la resonancia, demodular, FFT) para identificar las frecuencias caracteristicas del rodamiento y su principal dificultad (eleccion de banda).","limites":"Solo introduccion; no se leyo la validacion. No trata fajas.","aplica_a":"Diagnostico: envolvente y frecuencias caracteristicas","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Van, M., Franciosa, P., Ceglarek, D., & Lei, Y. (2016). Rolling Element Bearing Fault Diagnosis Using Integrated Nonlocal Means Denoising with Modified Morphology Filter Operators. Mathematical Problems in Engineering, 2016(1). https://doi.org/10.1155/2016/9657285","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8007","tipo":"paper","acceso":"abstract","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Dong, S., & Gupta, P.","anio":2022,"titulo":"An Integrated Method of Rolling Bearing Fault Diagnosis Based on Convolutional Neural Network Optimized by Sparrow Optimization Algorithm","fuente":"Scientific Programming","volumen":"2022(1)","doi":"10.1155/2022/6234169"},"extracto":"The model’s accuracy rate may reach 99.4 percent after repeated testing using samples, which is significantly superior to the classic fault detection approach and the fault diagnostic method based solely on shallow networks.","localizador":"Resumen del autor (campo abstract de metadatos, conector Wiley)","afirma":"Ejemplo de resultado tipico de CNN sobre rodamientos: exactitud reportada de 99,4 por ciento sobre muestras de prueba.","limites":"Solo resumen del autor. No se leyo que conjunto de datos ni que particion (por activo, por condicion o aleatoria por segmentos) uso; sin ese dato la cifra NO respalda generalizacion a campo. Es ejempl duracion ni tiempos de aviso. Sus datos son de banco de ensayo acelerado. Se leyeron solo partes del texto (aprox. primeros 40 kB).","aplica_a":"Curva tipica de degradacion; frecuencias caracteristicas","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2024). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv. https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-8009","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2024,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv","url":"https://arxiv.org/abs/2405.01614"},"extracto":"All bearings are run to failure under very high load to accelerate degradation. This significantly increases the risk of initiating bearing defects, but also the risk of local flash heating and subsequent uncontrolled damage to a bearing.","localizador":"Seccion 4.1 (hf://papers/2405.01614/paper.md, texto leido parcialmente) y resumen","afirma":"Validacion de un modelo de supervivencia para vida remanente en el conjunto publico XJTU-SY: 15 rodamientos de bolas de ranura profunda, 3 condiciones, 5 por condicion, validacion cruzada de 5 particiones; error absoluto medio de 14,7 min (IC95 13,6-15,8) con CoxPH y 12,6 min (IC95 11,8-13,4) con bosque de supervivencia a la carga mas alta con 25 por ciento de censura aleatoria. Tambien afirma que las fallas son raras y los datos censurados.","limites":"Banco de ensayo con degradacion acelerada por carga muy alta (12 kN, 2100 rpm; rodamiento de 12,82 kN de carga dinamica), minutos de vida, 15 rodamientos: NO es comparable con una chumacera de polea de faja de baja velocidad en meses. El error en minutos no se traslada a tiempo de aviso en campo. No se leyeron todas las secciones de resultados ni la discusion de limites. Preprint no arbitrado segun lo leido.","aplica_a":"Modelos predictivos de RUL; limites de generalizacion a campo","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2024). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv. https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-8010","tipo":"preprint","acceso":"abstract","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A.","anio":2026,"titulo":"Neutrosophic Ensemble Classification for Uncertainty-Aware Bearing Fault Detection: Evidence from Laboratory and Variable-Speed Industrial Benchmarks","fuente":"arXiv","url":"https://arxiv.org/abs/2610.06880"},"extracto":"On JNU, holding out 1000 rpm, accuracy collapses to 40.64 percent, below a majority-class baseline; Logistic Regression (57.91 percent) generalizes far better than the tree ensembles.","localizador":"Resumen del autor (hf://papers/2610.06880/paper.md; el lector declara que el texto completo no esta disponible)","afirma":"Con particion dejando fuera una condicion (leave-one-condition-out) en CWRU y JNU, el conjunto alcanza 100 por ciento en tres de cuatro cargas retenidas y 92,27 por ciento en la cuarta en CWRU, pero cae a 40,64 por ciento en JNU al retener 1000 rpm: la exactitud depende fuertemente de la particion y del conjunto. Tambien indica que rasgos de envolvente con frecuencias de falla separan casi perfectamente las clases en CWRU (99,57 por ciento con tres rasgos).","limites":"Solo resumen (el texto completo no estaba disponible en el lector). Preprint no arbitrado; el identificador arXiv 2610 y la fecha 2026-09-18 provienen del lector y no se contrastaron con otra fuente. Conjuntos de banco (CWRU, JNU), no de campo; no hay particion por activo en planta. No trata fajas.","aplica_a":"Limites de generalizacion de ML/DL; particion de validacion","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A. (2026). Neutrosophic Ensemble Classification for Uncertainty-Aware Bearing Fault Detection: Evidence from Laboratory and Variable-Speed Industrial Benchmarks. arXiv. https://arxiv.org/abs/2610.06880","avisos":[]},{"id":"E-8011","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M.","anio":2023,"titulo":"Real-Time Vibration-Based Bearing Fault Diagnosis Under Time-Varying Speed Conditions","fuente":"arXiv","url":"https://arxiv.org/abs/2311.18547"},"extracto":"However, many existing techniques are developed and tested under strictly controlled conditions, limiting their adaptability to the diverse and dynamic settings encountered in practical applications.","localizador":"Resumen del autor (hf://papers/2311.18547/paper.md, introduccion)","afirma":"Los propios autores senalan que muchas tecnicas se desarrollan y prueban en condiciones controladas, lo que limita su adaptabilidad; proponen una CNN en tiempo real bajo velocidad variable y ruido (mejoras de hasta 15,8 por ciento en exactitud sobre el estado del arte que ellos eligen).","limites":"Resumen e inicio de la introduccion. Banco de ensayo; no se leyo la particion ni el conjunto. Comparacion contra una linea base elegida por los autores. No trata fajas.","aplica_a":"Limites de generalizacion: ensayos controlados vs campo","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M. (2023). Real-Time Vibration-Based Bearing Fault Diagnosis Under Time-Varying Speed Conditions. arXiv. https://a   function srcs(sid){var o={};((dz.secciones[sid]||{}).elementos||[]).forEach(function(e){(e.evidencia||[]).forEach(function(i){o[i]=1})});return Object.keys(o)}
  var con=ord.filter(function(k){return((dz.secciones[k]||{}).elementos||[]).length}).length;
  var h='<div class="card"><h2>Cobertura del dossier</h2><div class="grid"><div class="kpi"><b>'+con+' de '+ord.length+'</b><span>secciones con evidencia leída (incluye Referencias)</span></div><div class="kpi"><b>'+(ord.length-con)+'</b><span>secciones VACÍO declarado</span></div><div class="kpi"><b>'+D.evidencia.length+'</b><span>entradas en el registro (incluye pistas)</span></div></div>'+
   '<h3>Fuentes citadas por sección y nivel de evidencia</h3><div id="dzb"></div><div style="font-size:12px;color:var(--mut)">'+Object.keys(LVC).map(function(k){return '<span style="color:'+LVC[k]+'">&#9632;</span> '+k}).join("  ")+'</div></div>';
  h+='<div class="card"><h2>Secciones</h2><label>Mostrar <select id="dzf"><option value="">todas</option><option value="con">solo con evidencia</option><option value="vac">solo VACÍO</option></select></label><label>Buscar <input id="dzq" type="text" style="width:170px"></label><div id="dzs"></div></div>';
  h+='<div class="card"><h2>Matriz sección × fuente</h2><p style="font-size:13px;color:var(--mut)">Cada punto es una fuente que respalda algo de esa sección. Pulse un punto para abrir la fuente.</p><div class="tw"><table id="dzm"></table></div></div>';
  host.innerHTML=h;
  /* barras apiladas */
  var W=760,rowH=24,H=ord.length*rowH+10,x0=210,mx=1;
  ord.forEach(function(k){mx=Math.max(mx,srcs(k).length)});
  var g='';ord.forEach(function(k,i){var y=i*rowH+4,x=x0,ss=srcs(k);g+='<text x="4" y="'+(y+14)+'">'+esc(dz.titulos[k]).slice(0,34)+'</text>';
    ss.sort().forEach(function(id){var w=(W-x0-30)/mx;g+='<rect x="'+x+'" y="'+y+'" width="'+(w-1)+'" height="16" fill="'+(LVC[EV[id].nivel_evidencia]||"var(--mut)")+'"><title>'+esc(id)+' '+esc(EV[id].nivel_evidencia)+'</title></rect>';x+=w});
    if(!ss.length)g+='<text x="'+x0+'" y="'+(y+13)+'" style="fill:var(--bad)">VACÍO</text>'});
  $("#dzb").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Fuentes por sección">'+g+'</svg>';
  function draw(){
    var f=$("#dzf").value,q=($("#dzq").value||"").toLowerCase();
    $("#dzs").innerHTML=ord.filter(function(k){var s=dz.secciones[k]||{},n=(s.elementos||[]).length;return(!f||(f==="con"?n>0:n===0))&&((dz.titulos[k]+" "+JSON.stringify(s)).toLowerCase().indexOf(q)>=0)}).map(function(k){
      var s=dz.secciones[k]||{},els=s.elementos||[];
      return '<details'+(els.length?'':' open')+' style="margin:6px 0"><summary><b>'+esc(dz.titulos[k])+'</b> <span class="badge '+(els.length?'confirmada':'descartada')+'">'+(els.length?els.length+' elemento(s)':'VACÍO')+'</span> <small>frente: '+esc(dz.frentes[k]||"")+'</small></summary>'+
        els.map(function(e){return '<p>• '+esc(e.titulo)+' '+chips(e.evidencia)+(e.limite?'<br><small>Límite: '+esc(e.limite)+'</small>':'')+'</p>'}).join("")+
        (s.vacio?'<div class="note bad">VACÍO: '+esc(s.vacio)+'</div>':'')+(s.nota?'<div class="note">'+esc(s.nota)+'</div>':'')+'</details>'}).join("")||"<p>Sin secciones con ese filtro.</p>";
  }
  host.addEventListener("input",draw);draw();
  var all={};ord.forEach(function(k){srcs(k).forEach(function(i){all[i]=1})});var cols=Object.keys(all).sort();
  $("#dzm").innerHTML='<tr><th>Sección</th>'+cols.map(function(i){return '<th style="font-size:10px">'+esc(i.slice(2))+'</th>'}).join("")+'</tr>'+ord.map(function(k){var ss=srcs(k);return '<tr><td>'+esc(dz.titulos[k])+'</td>'+cols.map(function(i){return '<td>'+(ss.indexOf(i)>=0?'<button class="chip" data-ev="'+i+'" style="padding:0 5px">●</button>':'')+'</td>'}).join("")+'</tr>'}).join("");
}

function vSim(host){
  host.innerHTML='<div class="card"><h2>Simulador didáctico del reemplazo por edad</h2><div class="note bad"><b>No es evidencia ni representa a la chumacera.</b> Los valores los elige quien usa la página; no hay para este modo de falla una forma, una escala ni costos con fuente leída. Úselo para entender cómo cambia el punto óptimo cuando tenga datos o parámetros citables.</div>'+
   '<label>β forma <input type="range" id="sb" min="0.5" max="5" step="0.05" value="2"> <b id="vb"></b></label><label>η escala (horas) <input type="number" id="se" value="10000" min="1"></label>'+
   '<label>Costo preventivo <input type="number" id="sp" value="1" min="0.01" step="0.1"></label><label>Costo de falla <input type="number" id="sf" value="5" min="0.01" step="0.1"></label><span style="font-size:12px;color:var(--mut)">(costos en unidades relativas que usted define)</span>'+
   '<div id="sr"></div><div id="s1"></div><div id="s2"></div><div id="s4"></div><div id="s5"></div><div id="s3"></div><div id="sz"></div></div>';
  function run(){
    var b=+$("#sb").value,e=+$("#se").value,cp=+$("#sp").value,cf=+$("#sf").value;$("#vb").textContent=b;
    var N=300,T=[],R=[],Hh=[],C=[],ts=e*3,i,t,cum=0,prevR=1,prevT=0;
    for(i=1;i<=N;i++){t=ts*i/N;var r=Math.exp(-Math.pow(t/e,b));cum+=(prevR+r)/2*(t-prevT);prevR=r;prevT=t;T.push(t);R.push(r);Hh.push(b/e*Math.pow(t/e,b-1));C.push((cp*r+cf*(1-r))/cum)}
    var k=0;C.forEach(function(v,j){if(v<C[k])k=j});var interior=b>1&&cf>cp&&k<N-1&&k>0,rtf=cf/(e*gamma1(b));
    $("#sr").innerHTML=interior?'<div class="grid"><div class="kpi"><b>'+fmt(T[k],0)+'</b><span>edad óptima con SUS valores de ejemplo (h)</span></div><div class="kpi"><b>'+fmt(C[k],5)+'</b><span>costo por hora en el óptimo</span></div><div class="kpi"><b>'+fmt(rtf,5)+'</b><span>costo por hora si se corre a la falla</span></div><div class="kpi"><b>'+fmt(100*(1-C[k]/rtf),1)+' %</b><span>ahorro teórico con sus valores, no un resultado del activo</span></div></div>':
      '<div class="note">Sin mínimo interior: '+(b<=1?'con β ≤ 1 el riesgo no crece con la edad y reemplazar por edad no reduce el costo.':cf<=cp?'si la falla no cuesta más que la prevención, esperar a la falla es igual o más barato.':'el mínimo cae fuera del rango mostrado.')+'</div>';
    var B10=e*Math.pow(-Math.log(0.9),1/b),B50=e*Math.pow(Math.LN2,1/b),MT=e*gamma1(b),vm=[{x:B10,label:"B10",c:"var(--c1)"},{x:B50,label:"B50",c:"var(--ok)"},{x:MT,label:"MTTF",c:"var(--warn)"}].filter(function(m){return m.x<=ts});
    var Fv=R.map(function(r){return 1-r}),fv=T.map(function(t){return b/e*Math.pow(t/e,b-1)*Math.exp(-Math.pow(t/e,b))});
    $("#sz").innerHTML='<div class="note"><b>Forma de la tasa de falla con β = '+b+':</b> '+(b<0.95?'decreciente (mortalidad infantil o mezcla de modos).':b>1.05?'creciente (desgaste): el reemplazo preventivo puede tener sentido.':'aproximadamente constante (fallas aleatorias): reemplazar por edad no ayuda.')+' B10 = '+fmt(B10,0)+' h, B50 = '+fmt(B50,0)+' h, MTTF = '+fmt(MT,0)+' h (con sus valores).</div>';
    lineChart($("#s1"),{x:T,series:[{name:"R(t) confiabilidad",y:R}],vlines:vm,titulo:"Confiabilidad",xfmt:function(v){return fmt(v,0)},key:"s1"});
    lineChart($("#s4"),{x:T,series:[{name:"f(t) densidad de fallas",y:fv}],vlines:vm,titulo:"Densidad de fallas",xfmt:function(v){return fmt(v,0)},key:"s4"});
    lineChart($("#s5"),{x:T,series:[{name:"F(t) probabilidad de falla",y:Fv}],vlines:vm,titulo:"Probabilidad de falla",xfmt:function(v){return fmt(v,0)},key:"s5"});
    lineChart($("#s2"),{x:T,series:[{name:"h(t) tasa de falla",y:Hh}],titulo:"Tasa de falla",xfmt:function(v){return fmt(v,0)},key:"s2"});
    lineChart($("#s3"),{x:T,series:[{name:"costo por hora C(T)",y:C}],vlines:interior?[{x:T[k],label:"óptimo",c:"var(--ok)"}]:[],hlines:[{y:rtf,label:"correr a la falla",c:"var(--warn)"}],titulo:"Costo por hora",xfmt:function(v){return fmt(v,0)},key:"s3"});
  }
  function gamma1(b){var z=1+1/b,g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
    function G(z){if(z<.5)return Math.PI/(Math.sin(Math.PI*z)*G(1-z));z-=1;var x=c[0];for(var i=1;i<g+2;i++)x+=c[i]/(z+i);var t=z+g+.5;return Math.sqrt(2*Math.PI)*Math.pow(t,z+.5)*Math.exp(-t)*x}return G(z)}
  host.addEventListener("input",run);CURSOR={};run();
  window.__sim=function(b,e,cp,cf){$("#sb").value=b;$("#se").value=e;$("#sp").value=cp;$("#sf").value=cf;run();return $("#sr").textContent};
}

/* ---------- análisis de ingeniería ---------- */
function nv(n){return n==="EVIDENCIA"?'<span class="lv t">EVIDENCIA</span>':'<span class="lv s">SÍNTESIS</span>'}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("inf:"+k)||"null");localStorage.setItem("inf:"+k,JSON.stringify(v))}catch(e){return null}}
function barChart(host,rows,o){ /* rows=[{label,value,color}] */
  var W=760,rh=24,H=rows.length*rh+8,mx=Math.max.apply(0,rows.map(function(r){return r.value}))||1,g='';
  rows.forEach(function(r,i){var y=i*rh+4,w=(W-260)*r.value/mx;g+='<text x="4" y="'+(y+14)+'">'+esc(String(r.label).slice(0,38))+'</text><rect x="250" y="'+y+'" width="'+Math.max(w,1)+'" height="16" fill="'+(r.color||"var(--c1)")+'"><title>'+esc(r.label)+': '+fmt(r.value,2)+'</title></rect><text x="'+(254+w)+'" y="'+(y+13)+'">'+fmt(r.value,0)+'</text>'});
  host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(o&&o.titulo||"barras")+'">'+g+'</svg>';
}
function listaEv(items,campo){return '<ul>'+(items||[]).map(function(x){return '<li>'+esc(x[campo||"texto"])+' '+nv(x.nivel)+' '+chips(x.evidencia)+(x.nota?'<br><small>'+esc(x.nota)+'</small>':'')+'</li>'}).join("")+'</ul>'}
function vaciosHtml(a){return (a&&a.length)?'<div class="note bad"><b>VACÍO</b><ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>':''}

function openHtml(h){var d=$("#drawer");d.innerHTML='<button class="x" aria-label="Cerrar">×</button>'+h;d.classList.add("on")}
function wrapTxt(t,n){var w=String(t).split(" "),l=[],c="";w.forEach(function(x){if((c+" "+x).trim().length>n){l.push(c);c=x}else c=(c+" "+x).trim()});if(c)l.push(c);return l}

function svgArbol(host,a){
  var N={};a.nodos.forEach(function(n){N[n.id]=n});var isChild={};a.nodos.forEach(function(n){(n.hijos||[]).forEach(function(h){isChild[h]=1})});
  var roots=a.nodos.filter(function(n){return!isChild[n.id]}),BW=186,BH=104,GX=14,GY=50,leaf=0,pos={},maxd=0;
  function lay(n,d){maxd=Math.max(maxd,d);var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean);
    if(!hs.length){pos[n.id]={x:leaf*(BW+GX),d:d};leaf++;return}
    hs.forEach(function(h){lay(h,d+1)});var xs=hs.map(function(h){return pos[h.id].x});pos[n.id]={x:(Math.min.apply(0,xs)+Math.max.apply(0,xs))/2,d:d}}
  roots.forEach(function(r){lay(r,0)});
  var W=Math.max(leaf,1)*(BW+GX)+20,H=(maxd+1)*(BH+GY)+10,g='';
  a.nodos.forEach(function(n){var P=pos[n.id];if(!P)return;(n.hijos||[]).forEach(function(h){var Q=pos[h];if(!Q)return;
    g+='<path d="M'+(P.x+BW/2+10)+' '+(P.d*(BH+GY)+BH+5)+' V'+(P.d*(BH+GY)+BH+GY/2)+' H'+(Q.x+BW/2+10)+' V'+(Q.d*(BH+GY)+5)+'" fill="none" stroke="var(--mut)"/>'})});
  a.nodos.forEach(function(n){var P=pos[n.id];if(!P)return;var x=P.x+10,y=P.d*(BH+GY)+5,col=n.nivel==="EVIDENCIA"?"var(--ok)":"var(--warn)";
    g+='<g class="nd" data-n="'+esc(n.id)+'" style="cursor:pointer"><rect x="'+x+'" y="'+y+'" width="'+BW+'" height="'+BH+'" rx="6" fill="var(--panel)" stroke="'+col+'" stroke-width="2"/>'+
      wrapTxt(n.texto,31).slice(0,8).map(function(l,i){return '<text x="'+(x+6)+'" y="'+(y+14+i*12)+'" style="fill:var(--ink)">'+esc(l)+'</text>'}).join("")+
      (n.hijos&&n.hijos.length?'<circle cx="'+(x+BW/2)+'" cy="'+(y+BH+14)+'" r="12" fill="var(--panel)" stroke="var(--mut)"/><text x="'+(x+BW/2)+'" y="'+(y+BH+18)+'" text-anchor="middle" style="fill:var(--ink)">'+esc(n.puerta)+'</text>':'')+'</g>'});
  host.innerHTML='<div class="tw"><svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Árbol de fallas">'+g+'</svg></div><div style="font-size:12px;color:var(--mut)"><span style="color:var(--ok)">&#9632;</span> respaldo directo de la evidencia · <span style="color:var(--warn)">&#9632;</span> síntesis del equipo · círculo = puerta lógica · pulse un nodo para ver sus fuentes</div>';
  host.querySelectorAll(".nd").forEach(function(el){el.onclick=function(){var n=N[el.dataset.n];openHtml('<h3>'+esc(n.id)+' '+nv(n.nivel)+'</h3><p>'+esc(n.texto)+'</p><p>'+chips(n.evidencia)+'</p><p><small>'+esc(n.nota||"")+'</small></p>')}});
}

function svgIshikawa(host,ish){
  var cats=Object.keys(ish),W=1400,H=640,sx=250,ex=W-200,my=H/2,g='<line x1="'+sx+'" y1="'+my+'" x2="'+ex+'" y2="'+my+'" stroke="var(--ink)" stroke-width="3"/><polygon points="'+ex+','+(my-8)+' '+(ex+14)+','+my+' '+ex+','+(my+8)+'" fill="var(--ink)"/><text x="'+(ex+20)+'" y="'+(my+4)+'" style="fill:var(--ink);font-weight:600">falla de la chumacera</text>';
  var perSide=Math.ceil(cats.length/2),step=(ex-sx-40)/perSide;
  cats.forEach(function(c,i){var up=i%2===0,col=Math.floor(i/2),bx=sx+40+col*step+step*0.6,by=up?20:H-20,ey=my;
    g+='<line x1="'+(bx-step*0.35)+'" y1="'+by+'" x2="'+bx+'" y2="'+ey+'" stroke="var(--c1)" stroke-width="2"/><text x="'+(bx-step*0.35)+'" y="'+(up?by-6:by+14)+'" text-anchor="middle" style="fill:var(--c1);font-weight:700;font-size:13px">'+esc(c)+'</text>';
    (ish[c]||[]).slice(0,4).forEach(function(it,k){var ty=up?by+26+k*62:by-18-k*62,tx=bx-step*0.35+(bx-(bx-step*0.35))*((ty-by)/(ey-by));
      wrapTxt(it.texto,40).slice(0,4).forEach(function(l,j){g+='<text x="'+(tx-8)+'" y="'+(ty+j*12)+'" text-anchor="end" style="fill:'+(it.nivel==="EVIDENCIA"?"var(--ok)":"var(--warn)")+'">'+esc(l)+'</text>'})});
    if(!(ish[c]||[]).length)g+='<text x="'+(bx-step*0.35)+'" y="'+(up?by+30:by-24)+'" text-anchor="middle" style="fill:var(--bad)">VACÍO</text>'});
  host.innerHTML='<div class="tw"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:1100px" role="img" aria-label="Diagrama de Ishikawa">'+g+'</svg></div><div style="font-size:12px;color:var(--mut)"><span style="color:var(--ok)">&#9632;</span> respaldo directo · <span style="color:var(--warn)">&#9632;</span> síntesis del equipo</div>';
}

  h+='<div class="card"><h2>Esquema cualitativo de la degradación</h2><div id="mp-deg"></div></div>';
  host.innerHTML=h;
  if(an.arbol)svgArbol($("#mp-arb"),an.arbol);
  if(an.acr&&an.acr.ishikawa)svgIshikawa($("#mp-ish"),an.acr.ishikawa);
  if(an.acr&&an.acr.ensayos&&an.acr.hipotesis){var hs=an.acr.hipotesis.map(function(x){return x.id}),t='<div class="tw"><table><tr><th>Ensayo o técnica</th>'+hs.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+'</tr>'+an.acr.ensayos.map(function(e){return '<tr><td>'+esc(e.ensayo.slice(0,90))+(e.ensayo.length>90?'…':'')+' '+chips(e.evidencia)+'</td>'+hs.map(function(x){return (e.para_hipotesis||[]).indexOf(x)>=0?'<td style="background:var(--acc);text-align:center;color:#fff">●</td>':'<td></td>'}).join("")+'</tr>'}).join("")+'</table></div><p style="font-size:12px;color:var(--mut)">Columnas sin punto: la evidencia leída no menciona ensayo para esa hipótesis (VACÍO).</p>';$("#mp-hm").innerHTML=t}
  if(an.fmeca)barChart($("#mp-doc"),an.fmeca.items.map(function(m){return{label:m.id+" "+m.modo,value:m.evidencia.length,color:"var(--c3)"}}),{titulo:"Fuentes por modo"});
  /* esquema de degradación (E-8008) y kurtosis no monótona (E-8003): curvas dibujadas a mano, sin escala */

function vArbol(host){
  var a=D.caso.analisis.arbol,N={};a.nodos.forEach(function(n){N[n.id]=n});
  var hijosDe={};a.nodos.forEach(function(n){(n.hijos||[]).forEach(function(h){hijosDe[h]=1})});
  var raices=a.nodos.filter(function(n){return!hijosDe[n.id]}),pv=store("arbolp")||{};
  host.innerHTML='<div class="card"><h2>Árbol de fallas</h2><p><b>Evento tope:</b> '+esc(a.evento_tope||"")+'</p><div class="note">La estructura (puertas OR y AND) es una propuesta respaldada por la evidencia citada en cada nodo o por síntesis con premisas; no está probada con datos del activo. Las probabilidades de los eventos básicos están vacías: ingrese las que conozca (de 0 a 1) y se calcula la probabilidad del evento tope suponiendo eventos independientes. <b>La compuerta AND del evento tope y la agrupación de causas latentes son hipótesis del equipo</b>: el AND supone que la falla funcional exige además que el daño avance sin ser detectado ni atendido, lo que depende de si existe un programa de monitoreo; las causas latentes actúan como habilitador de las causas físicas, no como alternativa independiente.</div><button class="btn" id="arb-ex">Expandir todo</button> <button class="btn" id="arb-co">Contraer todo</button><div id="arb-tr"></div></div><div class="card"><h2>Probabilidad del evento tope</h2><div id="arb-pt"></div></div>'+vaciosHtml(a.vacios);
  function nodo(n,depth){
    var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean),g=n.puerta;
    var cab='<span class="badge '+(g==="AND"?'posible':g==="OR"?'probable':'')+'">'+esc(g)+'</span> '+esc(n.texto)+' '+nv(n.nivel)+' '+chips(n.evidencia)+(n.nota?'<br><small>'+esc(n.nota)+'</small>':'');
    if(!hs.length)return '<li style="list-style:none;margin:4px 0">'+cab+' <label>p <input type="number" min="0" max="1" step="0.001" data-p="'+esc(n.id)+'" value="'+(pv[n.id]==null?"":pv[n.id])+'" style="width:70px"></label></li>';
    return '<li style="list-style:none;margin:4px 0"><details'+(depth<2?' open':'')+'><summary>'+cab+'</summary><ul style="border-left:2px solid var(--line);margin-left:6px;padding-left:12px">'+hs.map(function(h){return nodo(h,depth+1)}).join("")+'</ul></details></li>';
  }
  $("#arb-tr").innerHTML='<ul style="padding:0">'+raices.map(function(r){return nodo(r,0)}).join("")+'</ul>';
  function calc(n){var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean);if(!hs.length){return{p:pv[n.id]==null||pv[n.id]===""?null:+pv[n.id],falta:(pv[n.id]==null||pv[n.id]==="")?1:0}}
    var r=hs.map(calc),falta=r.reduce(function(x,y){return x+y.falta},0);if(falta)return{p:null,falta:falta};
    var p=n.puerta==="AND"?r.reduce(function(x,y){return x*y.p},1):1-r.reduce(function(x,y){return x*(1-y.p)},1);return{p:p,falta:0}}
  function out(){var tot=raices.map(calc),f=tot.reduce(function(x,y){return x+y.falta},0);
    $("#arb-pt").innerHTML=f?'<p>Faltan '+f+' probabilidad(es) de eventos básicos para calcular el evento tope.</p>':'<div class="grid">'+tot.map(function(t,i){return '<div class="kpi"><b>'+fmt(t.p,5)+'</b><span>P('+esc(raices[i].texto.slice(0,50))+')</span></div>'}).join("")+'</div><p style="font-size:12px;color:var(--mut)">Cálculo con las probabilidades que usted ingresó; no son datos de la evidencia.</p>'}
  host.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.p){pv[t.dataset.p]=t.value===""?null:Math.max(0,Math.min(1,+t.value));store("arbolp",pv);out()}});
  $("#arb-ex").onclick=function(){host.querySelectorAll("details").forEach(function(d){d.open=true})};$("#arb-co").onclick=function(){host.querySelectorAll("details").forEach(function(d){d.open=false})};
  out();
}

}

function vHistorial(host){
  var c=D.caso,hs=c.historial||[];
  host.innerHTML='<div class="card"><h2>Historial y línea base del caso</h2>'+(c.recurrencia?'<div class="note '+(c.recurrencia.detectada?'bad':'ok')+'"><b>Recurrencia:</b> '+esc(c.recurrencia.texto||"")+'</div>':'<div class="note">Sin casos previos comparables registrados: no se puede afirmar recurrencia ni actualizar una línea base.</div>')+
   '<div class="tw"><table><tr><th>Versión</th><th>Fecha</th><th>Cambio</th><th>Línea base</th></tr>'+hs.map(function(h){return '<tr><td>'+esc(h.version)+'</td><td>'+esc(h.fecha)+'</td><td>'+esc(h.cambio)+'</td><td>'+esc(h.baseline||"")+'</td></tr>'}).join("")+'</table></div></div>';
}

function vRastro(host){
  var c=D.caso,L=function(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+esc(typeof x==="string"?x:(x.texto||JSON.stringify(x)))+'</li>'}).join("")+'</ul>':'<p>Ninguno.</p>'};
  host.innerHTML=mkCard("Ajustes aplicados por las compuertas",D.ajustes.length?'<div class="tw"><table><tr><th>Dónde</th><th>Tipo</th><th>Detalle</th></tr>'+D.ajustes.map(function(a){return '<tr><td>'+esc(a.donde)+'</td><td>'+esc(a.tipo)+'</td><td>'+esc(a.detalle)+'</td></tr>'}).join("")+'</table></div>':'<p>Ninguno: todo lo afirmado tenía respaldo del nivel exigido.</p>')+
   mkCard("Vacíos (lo que no se encontró o no se tiene)",L(c.vacios))+mkCard("Supuestos",L(c.supuestos))+mkCard("Preguntas abiertas",L(c.preguntas))+
   mkCard("Reproducibilidad",'<p>Generado el '+esc(D.generado)+' con reliability_kit. Los números de vida se recalculan en el navegador y se contrastan con el kit de Python cuando hay valores de referencia. Todo el informe es un solo archivo sin peticiones externas.</p>'+(c.busqueda?'<pre class="code">'+esc(JSON.stringify(c.busqueda,null,1))+'</pre>':''));
}

/* ---------- arranque ---------- */
function boot(){
  if(!D){document.body.innerHTML="<p style='padding:20px'>El informe no tiene datos incrustados.</p>";return}
  D.evidencia.forEach(function(e){EV[e.id]=e});
  var m=D.caso.meta;$("#ttl").textContent=m.titulo;$("#sub").textContent=[m.activo,m.fecha_evento&&("evento "+m.fecha_evento),m.origen_datos&&("datos: "+m.origen_datos)].filter(Boolean).join(" · ");
  var c=D.caso;
  tab("res","Resumen",vResumen);
  tab("tl","Línea de tiempo",vTiempo,(c.linea_tiempo||[]).length>0);
  tab("sen","Señales",vSenales,(c.series||[]).length>0);
  tab("cau","Causas y técnicas",vCausas);
  tab("dos","Dossier",vDossier,!!c.dossier);
  var an=c.analisis||{};
  tab("map","Mapa visual",vMapa,!!(an.arbol||an.fmeca||an.acr));
  tab("fme","FMECA",vFmeca,!!(an.fmeca&&an.fmeca.items&&an.fmeca.items.length));
  tab("arb","Árbol de fallas",vArbol,!!(an.arbol&&an.arbol.nodos&&an.arbol.nodos.length));
  tab("acr","ACR",vAcr,!!(an.acr&&an.acr.hipotesis&&an.acr.hipotesis.length));
  tab("lcc","LCC",vLcc,!!(an.lcc&&an.lcc.elementos&&an.lcc.elementos.length));
  tab("vpr","Vida y predictivo",vVidaPred,!!(an.vida||an.predictivo));
  tab("her","Herramientas",vHerr,!!an.herramientas);
  tab("sim","Simulador",vSim,!!c.simulador);
  tab("dat","Datos",vDatos,(c.tablas||[]).length>0);
  tab("evi","Evidencia",vEvidencia);
  tab("vid","Vida",vVida);
  tab("pre","Predictivo",vPredictivo);
  tab("pla","Plan",vPlan,(c.plan||[]).length>0);
  tab("his","Historial",vHistorial);
  tab("ras","Rastro",vRastro);
  var tb=$("#tabs"),mn=$("#main");
  VIEWS.forEach(function(v,i){
    var b=document.createElement("button");b.textContent=v.label;b.setAttribute("role","tab");b.dataset.id=v.id;tb.appendChild(b);
    var s=document.createElement("section");s.className="tab";s.id="v-"+v.id;mn.appendChild(s);
    b.onclick=function(){sel(v.id)};
  });
  function sel(id){
    VIEWS.forEach(function(v){var s=$("#v-"+v.id),b=$('[data-id='+v.id+']',tb);var on=v.id===id;s.classList.toggle("on",on);b.setAttribute("aria-selected",on);
      if(on&&!s.dataset.done){s.dataset.done=1;try{v.fn(s)}catch(e){s.innerHTML='<div class="note bad">Error al dibujar esta vista: '+esc(e.message)+'</div>';window.__errores=(window.__errores||[]).concat(String(e))}}});
    try{history.replaceState(null,"","#"+id)}catch(e){}
  }
  var h=(location.hash||"").slice(1);sel(VIEWS.some(function(v){return v.id===h})?h:"res");
  $("#thm").onclick=function(){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
  window.__listo=true;
}
boot();
</script>
</body>
</html>
