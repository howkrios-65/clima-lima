ull,"nivel_evidencia":"SOLO-SNIPPET","apa":"Autor no identificado (s. f.). A Brief Review of Acoustic and Vibration Signal-Based Fault Detection for Belt Conveyor Idlers Using Machine Learning Models (título según el buscador). PMC9959905. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9959905/","avisos":[]},{"id":"E-9201","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Gück, C., Roelofs, C. M. A., & Faulstich, S.","anio":2024,"titulo":"CARE to Compare: A real-world dataset for anomaly detection in wind turbine data","fuente":"arXiv 2404.10320","url":"https://arxiv.org/abs/2404.10320"},"afirma":"Existe un criterio de evaluacion por evento para deteccion de anomalias en mantenimiento predictivo (CARE: cobertura, exactitud, fiabilidad, anticipacion) y un conjunto publico de datos de operacion real con intervalos de anomalia etiquetados y series normales. Sirve como plantilla de como medir un detector por evento, falsas alarmas y anticipacion, en vez de exactitud por segmento.","limites":"Son datos SCADA de aerogeneradores (36 turbinas, 3 parques), no vibracion ni rodamientos de poleas de faja. No se leyo la seccion de resultados por modelo. Autoinforme de los autores. Se leyo el texto hasta el limite de 30000 caracteres del lector.","aplica_a":"Metricas por evento y falsas alarmas para cualquier detector que se proponga para la chumacera. Comparabilidad: baja en el activo, media en metodologia de evaluacion.","revista_cuartil":null,"extracto":"The new dataset contains 89 years worth of real-world operating data of wind turbines, distributed across 44 labeled time frames for anomalies that led up to faults, as well as 51 time series representing normal behavior. ... This score considers the anomaly detection performance, the ability to recognize normal behavior properly and the capability to raise as few false alarms as possible while simultaneously detecting anomalies early.","localizador":"Abstract (paper.md del lector) e Introduction, parrafos 1 y 4","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Gück, C., Roelofs, C. M. A., & Faulstich, S. (2024). CARE to Compare: A real-world dataset for anomaly detection in wind turbine data. arXiv 2404.10320. https://arxiv.org/abs/2404.10320","avisos":[]},{"id":"E-9203","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M.","anio":2025,"titulo":"Towards a Universal Vibration Analysis Dataset: A Framework for Transfer Learning in Predictive Maintenance and Structural Health Monitoring","fuente":"arXiv 2504.11581","url":"https://arxiv.org/abs/2504.11581","pais":"Canada; Brasil (afiliaciones de los autores en el documento)"},"afirma":"Los propios autores de un marco de datos de vibracion advierten que CWRU no fue disenado para aprendizaje automatico y que cargas similares entre entrenamiento y prueba afectan la generalizacion, con riesgo de resultados enganosos. Remite a dos trabajos (Hendriks et al. 2022; Rauber et al. 2021) que no se leyeron.","limites":"Es un marco propuesto (preprint); se leyo hasta 25000 caracteres, sin la seccion de resultados de transferencia. Las dos referencias que sustentan la advertencia son solo_referencia. Datos de banco, no de planta.","aplica_a":"Fuga de datos y generalizacion en diagnostico con bancos publicos.","revista_cuartil":null,"extracto":"However, the CWRU dataset was not specifically designed with ML applications in mind, and care must be taken to avoid misleading results. For example, issues related to data with similar load conditions may affect the generalizability of models (Hendriks, Dumond, & Knox, 2022; Rauber, da Silva Loca, Boldt, Rodrigues, & Varejão, 2021).","localizador":"Seccion 2.1.1 Case Western Reserve University (CWRU), parrafo 2","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M. (2025). Towards a Universal Vibration Analysis Dataset: A Framework for Transfer Learning in Predictive Maintenance and Structural Health Monitoring. arXiv 2504.11581. https://arxiv.org/abs/2504.11581","avisos":[]},{"id":"E-9204","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M.","anio":2025,"titulo":"Towards a Universal Vibration Analysis Dataset: A Framework for Transfer Learning in Predictive Maintenance and Structural Health Monitoring","fuente":"arXiv 2504.11581","url":"https://arxiv.org/abs/2504.11581","pais":"Canada; Brasil (afiliaciones de los autores en el documento)"},"afirma":"Los bancos publicos de rodamientos que se reunen para entrenar modelos de vibracion operan a velocidades de 600 a 2100 rpm (HUST) y cerca de 1720 a 1797 rpm (CWRU), con rodamientos de bolas pequenos (por ejemplo 6203, 6205 en CWRU).","limites":"Descripcion de datasets, no un estudio de desempeno. No dice nada de velocidades por debajo de 600 rpm ni de rodamientos de gran tamano; esa ausencia solo es una observacion sobre los datasets listados en este documento. La velocidad de la polea del caso no esta en la fuente.","aplica_a":"Brecha de dominio entre bancos publicos (alta velocidad, rodamiento pequeno) y chumacera de polea de baja velocidad.","revista_cuartil":null,"extracto":"HUST data consists of a sampling frequency of 25,600 Hz with a sample duration of 20 seconds, and speeds ranging from 600 to 2,100 RPM ... The CWRU data consists of sampling frequencies of 12,000 and 48,000 Hz with a sample duration of 10 seconds, and speeds around 1,720 and 1,797 RPM","localizador":"Secciones 2.1.3 (HUST) y 2.1.1 (CWRU)","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M. (2025). Towards a Universal Vibration Analysis Dataset: A Framework for Transfer Learning in Predictive Maintenance and Structural Health Monitoring. arXiv 2504.11581. https://arxiv.org/abs/2504.11581","avisos":[]},{"id":"E-9205","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca (Aarhus University)"},"afirma":"En el conjunto XJTU-SY con validacion cruzada de 5 particiones y 25 por ciento de censura aleatoria, los modelos de supervivencia que admiten censura tuvieron menor error absoluto medio (12,6 y 14,7 min) que un modelo sin censura (18,5 min). El error se expresa en minutos, lo que indica vidas de minutos a horas.","limites":"Conjunto publico XJTU-SY de rodamientos de bolas (cinco por condicion); que sea un ensayo acelerado de banco es conocimiento previo del investigador, no verificado en el texto leido; en todo caso no se describe como dato de campo. Censura simulada al azar, no la censura real de una flota. Se leyo la introduccion y parte del trabajo relacionado (14000 caracteres). Tamano de muestra: cinco rodamientos por condicion segun el texto. El carácter acelerado del ensayo no está verificado en el texto leído.","aplica_a":"Pronostico de vida remanente; ventaja de modelar censura. Comparabilidad con la chumacera: baja.","revista_cuartil":null,"extracto":"When predicting the time to failure for bearings under the highest load (C1, 12.0 kN and 2100 RPM) with 25% random censoring, our approach achieves a mean absolute error (MAE) of 14.7 minutes (95% CI = 13.6-15.8) using a linear CoxPH model, and an MAE of 12.6 minutes (95% CI = 11.8-13.4) using a nonlinear Random Survival Forests model, compared to an MAE of 18.5 minutes (95% CI = 17.4-19.6) using a linear LASSO model that does not support censoring.","localizador":"Abstract","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9206","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca (Aarhus University)"},"afirma":"Los autores sostienen que los datos censurados son frecuentes porque las fallas de rodamientos son raras, que pocos estudios los tratan, y que ignorarlos sesga la estimacion. Es un argumento de los autores apoyado en citas que no se leyeron.","limites":"Es una afirmacion de introduccion con referencias no leidas. No cuantifica el sesgo. No es evidencia de campo.","aplica_a":"Planificacion de un pronostico con historial de planta: la censura (equipos cambiados antes de fallar) es un problema de diseno.","revista_cuartil":null,"extracto":"Censored or incomplete observations are a prevalent phenomenon given the rarity of failures or breakdowns in ball bearings [16], but so far, only few studies have attempted to model or address the consequences of censoring [69, 68, 23, 76] and the literature on censored data is limited. We can choose to ignore censored observations and analyze only the data where we know the true outcome, but this would lead to a loss of information and introduce an estimation bias in the model parameters [57].","localizador":"Seccion 1 Introduction, parrafo 4","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv 2405.01614. https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9207","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Razzaq, W., & Zhao, Y.-B.","anio":2025,"titulo":"CARLE: A Hybrid Deep-Shallow Learning Framework for Robust and Explainable RUL Estimation of Rolling Element Bearings","fuente":"arXiv 2510.17846","url":"https://arxiv.org/abs/2510.17846","pais":"China (University of Science and Technology of China)"},"afirma":"Cita secundaria de que 40 a 50 por ciento de las fallas de maquinaria se atribuye a rodamientos, y critica de los autores de que la mayoria de los metodos de pronostico son especificos de una tarea y poco aplicables en campo. Evalua con XJTU-SY y PRONOSTIA con validacion entre dominios.","limites":"La cifra de 40 a 50 por ciento es cita de otra fuente (no leida) y se refiere a maquinaria rotativa en general, no a transportadores. El modelo se evalua solo en XJTU-SY y PRONOSTIA (conjuntos publicos de rodamientos; no se describen como datos de campo). No se leyeron los resultados numericos (9000 caracteres leidos). El texto del lector muestra el simbolo de porcentaje con un artefacto de conversion.","aplica_a":"Pronostico de vida remanente; limites de generalizacion. Prevalencia de rodamientos entre causas de falla (solo como cita secundaria).","revista_cuartil":null,"extracto":"It has been estimated that 40 to 50% of machinery failures can be attributed to these bearings [1]. ... Most of the methods reported in the literature are task-oriented, diminishing their real-world applicability for many industrial machinery operations where real conditions are highly variable.","localizador":"Seccion 1 Introduction, parrafos 1 y 5","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Razzaq, W., & Zhao, Y.-B. (2025). CARLE: A Hybrid Deep-Shallow Learning Framework for Robust and Explainable RUL Estimation of Rolling Element Bearings. arXiv 2510.17846. https://arxiv.org/abs/2510.17846","avisos":[]},{"id":"E-9208","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M.","anio":2023,"titulo":"Real-Time Vibration-Based Bearing Fault Diagnosis Under Time-Varying Speed Conditions","fuente":"arXiv 2311.18547","url":"https://arxiv.org/abs/2311.18547"},"afirma":"Los autores afirman que muchas tecnicas de diagnostico se desarrollan y prueban en condiciones controladas, y que la vibracion es una tecnica fiable y economica para defectos incipientes (con citas no leidas). Propone una CNN para velocidad variable con mejoras de hasta 15,8 por ciento de exactitud sobre un metodo previo.","limites":"Banco de laboratorio con velocidad variable, no baja velocidad ni campo. La mejora de 15,8 por ciento es relativa a un metodo de referencia en sus propios datos. Se leyeron 9000 caracteres. Las afirmaciones sobre vibracion son citas secundarias.","aplica_a":"Generalizacion y vibracion como sensor; no sustenta desempeno a baja velocidad.","revista_cuartil":null,"extracto":"However, many existing techniques are developed and tested under strictly controlled conditions, limiting their adaptability to the diverse and dynamic settings encountered in practical applications. ... Nevertheless, studies have shown that vibration is one of the most reliable and cost-effective techniques, and allows capturing subtle changes in dynamics that are associated with early-stage defects","localizador":"Abstract; Seccion I Introduction, parrafo 1","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M. (2023). Real-Time Vibration-Based Bearing Fault Diagnosis Under Time-Varying Speed Conditions. arXiv 2311.18547. https://arxiv.org/abs/2311.18547","avisos":[]},{"id":"E-9209","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W.","anio":2024,"titulo":"BearLLM: A Prior Knowledge-Enhanced Bearing Health Management Framework with Unified Vibration Signal Representation","fuente":"arXiv 2408.11281","url":"https://arxiv.org/abs/2408.11281"},"afirma":"Segun los autores, la adaptacion de dominio pierde exactitud cuando las categorias de falla difieren entre origen y destino, y la generalizacion de dominio suele probarse con pocas condiciones de operacion parecidas. Proponen un modelo unico con una referencia sin falla como entrada, reportando resultados en nueve bancos publicos.","limites":"Es la descripcion de la literatura hecha por los autores del metodo; los resultados son autoinformados y en bancos de laboratorio. No se leyeron los experimentos (7000 caracteres leidos). No hay datos de campo.","aplica_a":"Generalizacion entre dominios; una referencia sin falla de la misma maquina como idea para linea base por activo.","revista_cuartil":null,"extracto":"Domain adaptation ... suffers from low accuracy when the source and target domains are category-inconsistent ... Domain generalization aims to extract domain-invariant features to improve performance on unseen domain [19, 47, 4], but it is often constrained to a limited number of working conditions with small differences, e.g., fewer than ten working conditions in [5, 22].","localizador":"Seccion 1 Introduction, parrafo 2","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W. (2024). BearLLM: abstract","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Purohit, H., Tanabe, R., Ichige, K., Endo, T., Nikaido, Y., Suefusa, K., & Kawaguchi, Y.","anio":2019,"titulo":"MIMII Dataset: Sound Dataset for Malfunctioning Industrial Machine Investigation and Inspection","fuente":"arXiv 1909.09347","url":"https://arxiv.org/abs/1909.09347"},"afirma":"Un conjunto publico de sonido de maquinas industriales (valvulas, bombas, ventiladores, rieles) en entorno de fabrica, con anomalias como contaminacion, fuga, desbalanceo y dano de riel. Muestra que la deteccion acustica de anomalias se ha desarrollado con maquinas distintas a transportadores.","limites":"Solo abstract. No incluye bandas transportadoras ni rodamientos de polea. No se verifico en el texto la forma de las anomalias ni las metricas.","aplica_a":"Monitoreo acustico: existencia de datos publicos comparables; no es evidencia sobre transportadores.","revista_cuartil":null,"extracto":"there are no public datasets that focus on the sound of industrial machines under normal and anomalous operating conditions in real factory environments. ... Normal sounds were recorded for different types of industrial machines (i.e., valves, pumps, fans, and slide rails)","localizador":"Abstract (el lector entrego solo metadatos y resumen)","nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Purohit, H., Tanabe, R., Ichige, K., Endo, T., Nikaido, Y., Suefusa, K., & Kawaguchi, Y. (2019). MIMII Dataset: Sound Dataset for Malfunctioning Industrial Machine Investigation and Inspection. arXiv 1909.09347. https://arxiv.org/abs/1909.09347","avisos":[]},{"id":"E-9212","tipo":"paper","acceso":"snippet","via":"websearch","fecha_acceso":"2026-10-27","referencia":{"autores":"Alharbi, F., et al. (autoria completa no vista)","anio":2023,"titulo":"A Brief Review of Acoustic and Vibration Signal-Based Fault Detection for Belt Conveyor Idlers Using Machine Learning Models","fuente":"Sensors","url":"https://www.ncbi.nlm.nih.gov lubrication, and improper mounting, among others [8, 30, 27, 12].","localizador":"Seccion 1 (Introduction), parrafo 1; hf://papers/2405.01614/paper.md, primeros 30000 bytes","afirma":"Afirmacion de introduccion, con cuatro referencias propias del preprint, de que las fallas y defectos de rodamientos se inducen a menudo por desgaste por contaminacion, mala lubricacion y montaje inadecuado. Respalda como lista cualitativa de factores (preguntas 1 y 2), sin cifras.","limites":"Cita secundaria: no se leyeron las referencias [8, 30, 27, 12]; no da frecuencias ni porcentajes por causa. El estudio es de prognosis con datos de banco (XJTU-SY), no de causas de falla en campo ni de chumaceras de polea. Preprint, no consta arbitraje en lo leido.","aplica_a":"Hipotesis de lubricacion deficiente, contaminacion y montaje inadecuado como causas de falla de rodamiento; comparabilidad baja (cita general).","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv:2405.01614 (v3, cs.LG). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9302","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2024,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv:2405.01614 (v3, cs.LG)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca (Departamento de Ingenieria Electrica y Computacion, Universidad de Aarhus, segun la portada)"},"extracto":"Bearing health depends on a wide range of factors, such as the operating condition, operating temperature, maintenance level, among others [78]. ... Approximately 90% of industrial bearings outlive the equipment in which they are installed, and the remaining 10% are replaced for preventive reasons. Only around 0.5% are replaced because of actual bearing failure [56].","localizador":"Seccion 3.1 (Elements of rolling bearings), parrafo 1; hf://papers/2405.01614/paper.md","afirma":"Cita secundaria de que la vida de un rodamiento depende de condicion de operacion, temperatura y nivel de mantenimiento, y de que aprox. 90 % de los rodamientos industriales sobrevive al equipo, 10 % se reemplaza de forma preventiva y solo alrededor de 0,5 % se reemplaza por falla real. Tambien define L10 como horas que duran el 90 % de un grupo identico a velocidad constante.","limites":"Las cifras 90 %, 10 % y 0,5 % vienen de la referencia [56] que no se leyo; no se sabe la poblacion ni el sector, y no son de transportadoras ni de ambientes de polvo. No cuantifica el efecto de la temperatura ni de la lubricacion.","aplica_a":"Contexto de L10 y de la baja tasa de falla real frente al reemplazo preventivo; no sirve para fijar una vida esperada de la chumacera del caso.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2024). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv:2405.01614 (v3, cs.LG). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9304","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Razzaq, W., & Zhao, Y.-B.","anio":2025,"titulo":"CARLE: A Hybrid Deep-Shallow Learning Framework for Robust and Explainable RUL Estimation of Rolling Element Bearings","fuente":"arXiv:2510.17846 (v1)","url":"https://arxiv.org/abs/2510.17846","pais":"China (School of Automation, University of Science and Technology of China, segun la portada)"},"extracto":"Rotational machinery is more prone to failure because of the availability of rolling-element bearings working under aggressive environments. It has been estimated that 40 to 50% of machinery failures can be attributed to these bearings","localizador":"Seccion 1 (Introduction), parrafo 1; hf://papers/2510.17846/paper.md, primeros 9000 bytes","afirma":"Cita secundaria de que se estima que 40 a 50 % de las fallas de maquinaria rotatoria se atribuyen a rodamientos de elementos rodantes, que operan en ambientes agresivos.","limites":"Cifra citada de la referencia [1] del preprint, no leida; no define poblacion ni sector ni criterio de atribucion, no distingue lubricacion, contaminacion o carga, y no es especifica de transportadoras de faja. El documento trata de prognosis con datos de banco.","aplica_a":"Importancia relativa del rodamiento entre los componentes de maquinaria rotatoria; comparabilidad baja a media.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Razzaq, W., & Zhao, Y.-B. (2025). CARLE: A Hybrid Deep-Shallow Learning Framework for Robust and Explainable RUL Estimation of Rolling Element Bearings. arXiv:2510.17846 (v1). https://arxiv.org/abs/2510.17846","avisos":[]},{"id":"E-9305","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv:2405.01614 (v3, cs.LG)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca (Departamento de Ingenieria Electrica y Computacion, Universidad de Aarhus, segun la portada)"},"extracto":"Initially, a healthy bearing exhibits frequencies solely linked to shaft phenomena, such as balance or misalignment.","localizador":"Seccion 3.2, pie de la Figura 1 (texto del pie), hf://papers/2405.01614/paper.md","afirma":"Describe que, en un rodamiento sano, el espectro de vibracion contiene solo frecuencias ligadas al eje (desbalance o desalineacion), antes de que aparezcan las frecuencias de defecto del rodamiento en las etapas posteriores. Apoya que la desalineacion se ve como componente de la frecuencia del eje y no como defecto de pista.","limites":"Es una descripcion cualitativa de un esquema (Figura 1), sin cifras de amplitud, sin umbrales y sin datos de desalineacion medida. No cuantifica el efecto de la desalineacion sobre la vida. No es de baja velocidad.","aplica_a":"Diagnostico diferencial desalineacion contra defecto de rodamiento (pregunta 2 y 4); comparabilidad baja.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv:2405.01614 (v3, cs.LG). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9306","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2024,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv:2405.01614 (v3, cs.LG)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca (Departamento de Ingenieria Electrica y Computacion, Universidad de Aarhus, segun la portada)"},"extracto":"Mechanical engineers have traditionally used model-based methods, which are based solely on threshold values of different signals at predetermined fault frequencies. These models can only describe the signal characteristics of a few specific types of faults, but faults in the real world are often more complicated.","localizador":"Seccion 1 (Introduction), parrafo 2; hf://papers/2405.01614/paper.md","afirma":"Afirma que los umbrales fijos sobre bandas de frecuencia de falla predeterminadas solo describen unos pocos tipos de falla y que las fallas reales suelen ser mas complejas, lo que motiva metodos basados en datos. Respalda cautela al usar un umbral unico de severidad.","limites":"Es una opinion de introduccion sin cifras ni valores de umbral. No contiene umbrales de vibracion ni de temperatura ni validacion para baja velocidad. El estudio propone un metodo de datos validado en banco acelerado (minutos de vida).","aplica_a":"Limite de los umbrales fijos de vibracion (pregunta 4); comparabilidad baja.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2024). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv:2405.01614 (v3, cs.LG). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9307","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv:2405.01614 (v3, cs.LG)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca (Departamento de Ingenieria Electrica y Computacion, Universidad de Aarhus, segun la portada)"},"extracto":"operational anomalies appear minimally on the surface of the rolling elements. ... a large number of harmonics will often be energized during overrolling, leading to the excitation of eigenfrequencies of the bearing components that are typically in the range from 10kHz to higher.","localizador":"Seccion 3.2 (Defect evolution and failure monitoring), parrafo 1; hf://papers/2405.01614/paper.md","afirma":"Describe que un defecto incipiente excita frecuencias propias de los componentes tipicamente desde 10 kHz hacia arriba, detectables por envolvente en banda impulsiva, y que al avanzar el defecto la vibracion crece en amplitud a menor frecuencia. Apoya que la deteccion temprana requiere ancho de banda alto, no solo velocidad RMS de baja frecuencia.","limites":"Descripcion cualitativa con una cifra de banda (10 kHz); no da umbrales de severidad ni diferencia baja velocidad. Los datos de la prueba son a 2100 a 2400 rpm con muestreo de 25,6 kHz, distintos de una polea lenta. No se verifico la afirmacion en su fuente primaria.","aplica_a":"Seleccion de banda y tecnica de vigilancia (envolvente) para deteccion temprana (pregunta 4); comparabilidad baja a media.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv:2405.01614 (v3, cs.LG). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9401","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extracto":"Operating condition L10h [h] Radial force [kN] Rotating speed [rpm] Bearing dataset\nC1 9.6 12.0 2100 Bearing 1_1 to 1_5\nC2 11.7 11.0 2250 Bearing 2_1 to 2_5\nC3 14.6 10.0 2400 Bearing 3_1 to 3_5\n ... The dataset contains measurements of 15 deep grove ball bearings of type LDK UER204 with a dynamic load rating of 12.82 kN.","localizador":"Seccion 4.1 y Tabla reprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extracto":"Because the XJTU-SY dataset only includes complete observations, i.e., the failure time is always known, we introduce random and independent censoring by a fixed percentage ... we selected 25%, 50%, and 75%, resulting in three censored data sets with the respective level of censoring. ... we calculate the time of censoring ... as a random number between one and the observed event time","localizador":"Seccion 4.5 (hf://papers/2405.01614/paper.md)","afirma":"Definicion de censura usada: censura derecha aleatoria e independiente, simulada sobre datos completos, con 25, 50 y 75 % de las muestras; el tiempo de censura es un numero aleatorio entre uno y el tiempo de evento observado.","limites":"Ensayo acelerado de banco (XJTU-SY: 15 rodamientos de bolas LDK UER204, 5 por condicion, cargas radiales de 10 a 12 kN, 2100 a 2400 rpm) con censura simulada al azar sobre datos completos; no es dato de campo ni de una chumacera de polea de faja; los valores absolutos (minutos) no son transferibles. Extracto con espacios y simbolos matematicos del HTML normalizados (NFKC). La censura es sintetica: la base solo tiene fallas observadas; no representa suspensiones reales de una flota.","aplica_a":"Pronostico de vida remanente (RUL) de rodamientos con censura; comparabilidad con la chumacera de polea: baja.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9406","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extracto":"For bearings under high load (C1), we use w = 2 and l = −1. For medium load (C2), we use w = 4 and l = −3. For the light load (C3), we use w = 6 and l = −5. ... This produces three supervised learning datasets, DC1 (N = 635, d = 12), DC2 (N = 1586, d = 12) and DC3 (N = 4930, d = 12), where N is the number of samples and d is the number of features.","localizador":"Seccion 4.4 (hf://papers/2405.01614/paper.md)","afirma":"Preprocesamiento: promedio movil (ventana w, rezago l) por condicion; tres conjuntos supervisados de N = 635, 1586 y 4930 muestras con d = 12 caracteristicas de dominio del tiempo.","limites":"Ensayo acelerado de banco (XJTU-SY: 15 rodamientos de bolas LDK UER204, 5 por condicion, cargas radiales de 10 a 12 kN, 2100 a 2400 rpm) con censura simulada al azar sobre datos completos; no es dato de campo ni de una chumacera de polea de faja; los valores absolutos (minutos) no son transferibles. Extracto con espacios y simbolos matematicos del HTML normalizados (NFKC).","aplica_a":"Pronostico de vida remanente (RUL) de rodamientos con censura; comparabilidad con la chumacera de polea: baja.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9407","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extracto":"we arrange a stratified 5-fold cross-validation procedure, ensuring that event times and censoring levels remain consistent across all folds. For each fold, we apply z-score data normalization to all features and compute the event horizon on the training set. ... If the respective model requires a validation set for early stopping, we allocate 30% of the training set for this purpose. ... For the baseline CoxPH model, we set the convergence criterion to 10−9 and a maximum of 100 iterations for all conditions.","localizador":"Seccion 5.1 (hf://papers/2405.01614/paper.md)","afirma":"Validacion cruzada estratificada de 5 particiones, normalizacion z-score, 30 % del entrenamiento para validacion cuando hace falta; CoxPH con criterio de convergencia 10-9 y maximo de 100 iteraciones.","limites":"Ensayo acelerado de banco (XJTU-SY: 15 rodamientos de bolas LDK UER204, 5 por condicion, cargas radiales de 10 a 12 kN, 2100 a 2400 rpm) con censura simulada al azar sobre datos completos; no es dato de campo ni de una chumacera de polea de faja; los valores absolutos (minutos) no son transferibles. Extracto con espacios y simbolos matematicos del HTML normalizados (NFKC).","aplica_a":"Pronostico de vida remanente (RUL) de rodamientos con censura; comparabilidad con la chumacera de polea: baja.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9408","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extracto":"For the GBSA and RSF models, aligned with the three operating conditions, we set the number of estimators to {100, 200, 400}, the minimum number of samples needed to split to {5, 10, 20}, the minimum number of samples in a leaf node to {3, 5, 10} and a maximum depth of {3, 5, 10}. For the MTLR model, we use batch sizes of {32, 64, 128}, hidden sizes of {16, 32, 64}, a fixed dropout rate of 0.25","localizador":"Seccion 5.1 (hiperparametros, parte 1) (hf://papers/2405.01614/paper.md)","afirma":"Hiperparametros de GBSA y RSF (estimadores 100/200/400; division minima 5/10/20; hoja minima 3/5/10; profundidad 3/5/10, uno por condicion) y de MTLR (lote 32/64/128; capas ocultas 16/32/64; abandono 0.25).","limites":"Ensayo acelerado de banco (XJTU-SY: 15 rodamientos de bolas LDK UER204, 5 por condicion, cargas radiales de 10 a 12 kN, 2100 a 2400 rpm) con censura simulada al azar sobre datos completos; no es dato de campo ni de una chumacera de polea de faja; los valores absolutos (minutos) no son transferibles. Extracto con espacios y simbolos matematicos del HTML normalizados (NFKC).","aplica_a":"Pronostico de vida remanente (RUL) de rodamientos con censura; comparabilidad con la chumacera de polea: baja.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9409","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extracto":"a learning rate of 8 × 10−5 using the Adam optimizer ... a penalty term of 0.01, and 5000 training epochs ... For the BNNSurv model, we use batch an  general, the RSF model has the lowest MAE in operating conditions and in censoring levels ... However, the main trend is that censoring generally decreases predictive accuracy","localizador":"Seccion 5.4 (hf://papers/2405.01614/paper.md)","afirma":"Interpretacion de los autores de la Tabla 6: menor MAE con carga alta (horizonte corto, deterioro rapido); RSF con menor MAE en general; mas censura reduce la exactitud.","limites":"Ensayo acelerado de banco (XJTU-SY: 15 rodamientos de bolas LDK UER204, 5 por condicion, cargas radiales de 10 a 12 kN, 2100 a 2400 rpm) con censura simulada al azar sobre datos completos; no es dato de campo ni de una chumacera de polea de faja; los valores absolutos (minutos) no son transferibles. Extracto con espacios y simbolos matematicos del HTML normalizados (NFKC).","aplica_a":"Pronostico de vida remanente (RUL) de rodamientos con censura; comparabilidad con la chumacera de polea: baja.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9431","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extrac diction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extracto":"the bearings in the XJTU-SY dataset fail at entirely different times, even for the same operating conditions. This points to other factors – e.g., temperature, lubrication, and previous wear having a significant influence on the lifetime. ... The XJTU-SY dataset only comes with five bearings per operating condition and they have all been subjected to accelerated degradation, which substantially shortens their lifespan compared to actual industrial bearings.","localizador":"Secciones 5.3 y 6.4 (hf://papers/2405.01614/paper.md)","afirma":"Los autores indican que los rodamientos del mismo banco fallan en tiempos muy distintos y atribuyen la dispersion a temperatura, lubricacion y desgaste previo; reconocen que la degradacion acelerada acorta la vida frente a rodamientos industriales.","limites":"Ensayo acelerado de banco (XJTU-SY: 15 rodamientos de bolas LDK UER204, 5 por condicion, cargas radiales de 10 a 12 kN, 2100 a 2400 rpm) con censura simulada al azar sobre datos completos; no es dato de campo ni de una chumacera de polea de faja; los valores absolutos (minutos) no son transferibles. Extracto con espacios y simbolos matematicos del HTML normalizados (NFKC). La atribucion a temperatura, lubricacion y desgaste previo es interpretacion de los autores, no medida en el ensayo.","aplica_a":"Pronostico de vida remanente (RUL) de rodamientos con censura; comparabilidad con la chumacera de polea: baja.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint). https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-9433","tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2025,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv 2405.01614 (version publicada: Expert Systems with Applications, segun la cabecera del preprint)","url":"https://arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extracto":"the vibration patterns observed in the XJTU-SY dataset are the result of excessive load on the bearings, preventing proper lubrication and leading to immediate surface damage and rapid degradation of the raceway. Although the proposed method performed well on the XJTU-SY dataset, which features bearings that undergo accelerated degradation, industrial settings often present a different challenge, where degradation is less apparent and wear develops gradually over time.","localizador":"Seccion 6.2 (hf://papers/2405.01614/paper.md)","afirma":"Limite declarado por los autores: la carga excesiva del banco impide la lubricacion adecuada y causa dano superficial rapido; en planta el desgaste es gradual y el metodo debe recalibrarse.","limites":"Ensayo acelerado de banco (XJTU-SY: 15 rodamientos de bolas LDK UER204, 5 por condicion, cargas radiales de 10 a 12 kN, 2100 a 2400 rpm) con censura simulada al azar sobre datos completos; no es dato de campo ni de una chumacera de polea de faja; los valores absolutos (minutos) no son transferibles. Extracto con espacios y simbolos matematicos del HTML normalizados (NFKC).","aplica_a":"Pronostico de vida remanente (RUL) de rodamie
