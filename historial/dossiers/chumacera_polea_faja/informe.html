n predictive maintenance and structural health monitoring","fuente":"arXiv:2504.11581 (preprint)","url":"https://arxiv.org/abs/2504.11581","pais":"Canadá; Brasil (afiliaciones de los autores en el documento)","institucion":"University of Ottawa; Universidade Federal do Espírito Santo; Instituto Federal do Espírito Santo (afiliaciones en el documento)"},"extracto":"Dataset Folds H I O B ... Total 280 1542 1540 1580 ... Total 280 1522 1540 1600 ... HUST N/A 600 600 600 405 ... UORED-VAFCLS N/A 800 200 200 200 ... PADERBORN N/A 1918 1267 1907 0 ... where H, I, O and B represent healthy, inner race, outer race and ball faults, respectively","localizador":"Sección 4.2, Tabla 3 (filas de totales transcritas), hf://papers/2504.11581/paper.md","afirma":"Conteo de muestras por estado del rodamiento (H sano, I pista interna, O pista externa, B bola): CWRU por carga 280/1542/1540/1580; CWRU por severidad 280/1522/1540/1600; HUST 600/600/600/405; UORED-VAFCLS 800/200/200/200; PADERBORN 1918/1267/1907/0 (sin bola). Los sanos son una fracción pequeña en CWRU.","limites":"Conteos de segmentos de espectrograma tras el muestreo de los autores, no de máquinas ni de horas de operación. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Desbalance entre sano y con falla en bancos públicos. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9455","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M. (2025). Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring. arXiv:2504.11581 (preprint). https://arxiv.org/abs/2504.11581","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M.","anio":2025,"titulo":"Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring","fuente":"arXiv:2504.11581 (preprint)","url":"https://arxiv.org/abs/2504.11581","pais":"Canadá; Brasil (afiliaciones de los autores en el documento)","institucion":"University of Ottawa; Universidade Federal do Espírito Santo; Instituto Federal do Espírito Santo (afiliaciones en el documento)"},"extracto":"For the CWRU Load Division, the full fine tuning method from ImageNet weights achieved a mean balanced accuracy of 97.58% and an macro F1 score of 97.46%, with standard deviations of 4.30% and 4.53%, respectively. ... In comparison, Full fine tuning from VibNet weights resulted in a slightly lower mean balanced accuracy of 97.39% and a macro F1 score of 97.32%, but with reduced standard deviations of 3.79% and 3.94%. ... Partial fine tuning on VibNet weights showed a mean balanced accuracy of 95.66% and a macro F1 score of 95.66%, while partial fine tuning on ImageNet weights resulted in significantly lower performance, with a mean accuracy of 90.04% and an F1 score of 89.94%.","localizador":"Sección 4.3, párrafo 2 (división por carga), hf://papers/2504.11581/paper.md","afirma":"En CWRU con pliegues por carga, el afinado completo desde pesos ImageNet logra 97.58 % de exactitud balanceada media (F1 macro 97.46 %), desde VibNet 97.39 % (97.32 %), el afinado parcial desde VibNet 95.66 % y desde ImageNet 90.04 % (89.94 %).","limites":"Un solo banco (CWRU), K = 4, sin intervalos de confianza (solo desviaciones estándar entre pliegues). Rodamientos pequeños de bolas a ~1,720 y 1,797 rpm. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Generalización entre cargas en banco. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9456","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M. (2025). Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring. arXiv:2504.11581 (preprint). https://arxiv.org/abs/2504.11581","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M.","anio":2025,"titulo":"Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring","fuente":"arXiv:2504.11581 (preprint)","url":"https://arxiv.org/abs/2504.11581","pais":"Canadá; Brasil (afiliaciones de los autores en el documento)","institucion":"University of Ottawa; Universidade Federal do Espírito Santo; Instituto Federal do Espírito Santo (afiliaciones en el documento)"},"extracto":"In the CWRU Severity Division, the full fine tuning method on ImageNet weights achieved a mean accuracy of 64.38% and an F1 score of 65.12%, with higher standard deviations of 21.39% and 21.69%. ... Full fine tuning on VibNet weightsimproved the mean accuracy to 66.57% and the F1 score to 65.91%, albeit with slightly higher standard deviations of 22.47% and 22.94%. ... The training from scratch model resulted in a mean accuracy of 64.35% and an F1 score of 58.00%, with a notable reduction in the standard deviation of the F1 score to 10.43%.","localizador":"Sección 4.3, párrafo 3 (división por severidad), hf://papers/2504.11581/paper.md","afirma":"En CWRU con pliegues por severidad de falla, la exactitud baja a 64.38 % (afinado completo desde ImageNet, desviación 21.39 %), 66.57 % (desde VibNet, desviación 22.47 %) y 64.35 % (desde cero, F1 58.00 %), frente a 97.58 % en la división por carga.","limites":"Un solo banco y K = 4; las desviaciones de más de 20 puntos indican que el resultado depende mucho de qué pliegue se retiene. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Generalización a una severidad no vista; límite de los modelos entrenados en banco. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9457","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M. (2025). Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring. arXiv:2504.11581 (preprint). https://arxiv.org/abs/2504.11581","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M.","anio":2025,"titulo":"Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring","fuente":"arXiv:2504.11581 (preprint)","url":"https://arxiv.org/abs/2504.11581","pais":"Canadá; Brasil (afiliaciones de los autores en el documento)","institucion":"University of Ottawa; Universidade Federal do Espírito Santo; Instituto Federal do Espírito Santo (afiliaciones en el documento)"},"extracto":"Partial fine tuning on VibNet weights showed the best performance in this division, with a mean accuracy of 66.88% and an F1 score of 66.21%, while Partial fine tuning on ImageNet weights had the lowest performance, with a mean accuracy of 58.26% and an F1 score of 52.75%. ... VibNet partial and full fine tuning respectively achieved the best and second-best results in the severity division, which is the more difficult diagnosis problem in the CWRU dataset.","localizador":"Sección 4.3, párrafo 3 (final), hf://papers/2504.11581/paper.md","afirma":"En la división por severidad, el mejor resultado es el afinado parcial desde VibNet (66.88 %; F1 66.21 %) y el peor el afinado parcial desde ImageNet (58.26 %; F1 52.75 %); los autores señalan que la severidad es el problema más difícil de CWRU.","limites":"Preliminar, un banco, sin prueba de significancia; la diferencia entre mejor y segundo es de décimas frente a desviaciones de más de 20 puntos. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Generalización entre severidades. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9458","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M. (2025). Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring. arXiv:2504.11581 (preprint). https://arxiv.org/abs/2504.11581","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M.","anio":2025,"titulo":"Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring","fuente":"arXiv:2504.11581 (preprint)","url":"https://arxiv.org/abs/2504.11581","pais":"Canadá; Brasil (afiliaciones de los autores en el documento)","institucion":"University of Ottawa; Universidade Federal do Espírito Santo; Instituto Federal do Espírito Santo (afiliaciones en el documento)"},"extracto":"Metric Method Mean (%) Std (%) Accuracy Score F1 Score Accuracy Score F1 Score ... Full Finetune ImageNet 97.58 97.46 4.30 4.53 ... Full Finetune VibNet 97.39 97.32 3.79 3.94 ... From Scratch 96.84 96.81 3.82 3.89 ... Partial Finetune VibNet 95.66 95.66 3.62 3.63 ... Partial Finetune ImageNet 90.04 89.94 14.86 15.53","localizador":"Sección 4.3, Tabla 4, primer bloque (celdas transcritas), hf://papers/2504.11581/paper.md","afirma":"Tabla 4, división por carga de CWRU (exactitud media, F1 medio, desviación de ambos, en %): ImageNet completo 97.58/97.46/4.30/4.53; VibNet completo 97.39/97.32/3.79/3.94; desde cero 96.84/96.81/3.82/3.89; VibNet parcial 95.66/95.66/3.62/3.63; ImageNet parcial 90.04/89.94/14.86/15.53.","limites":"La extracción del texto coloca la fila 'Partial Finetune ImageNet 90.04' bajo el rótulo de severidad; se asignó a la división por carga porque el texto de la Sección 4.3 lo dice así. Las desviaciones 14.86 y 15.53 provienen solo de esa fila. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Generalización entre cargas en banco. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9459","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M. (2025). Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring. arXiv:2504.11581 (preprint). https://arxiv.org/abs/2504.11581","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M.","anio":2025,"titulo":"Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring","fuente":"arXiv:2504.11581 (preprint)","url":"https://arxiv.org/abs/2504.11581","pais":"Canadá; Brasil (afiliaciones de los autores en el documento)","institucion":"University of Ottawa; Universidade Federal do Espírito Santo; Instituto Federal do Espírito Santo (afiliaciones en el documento)"},"extracto":"Full Finetune ImageNet 64.38 65.12 21.39 21.69 ... Full Finetune VibNet 66.57 65.91 22.47 22.94 ... From Scratch 64.35 58.00 20.18 10.43 ... Partial Finetune VibNet 66.88 66.21 21.38 21.69 ... Partial Finetune ImageNet 58.26 52.75 4.31 7.00","localizador":"Sección 4.3, Tabla 4, segundo bloque (celdas transcritas), hf://papers/2504.11581/paper.md","afirma":"Tabla 4, división por severidad de CWRU (exactitud media, F1 medio, desviación de ambos, en %): ImageNet completo 64.38/65.12/21.39/21.69; VibNet completo 66.57/65.91/22.47/22.94; desde cero 64.35/58.00/20.18/10.43; VibNet parcial 66.88/66.21/21.38/21.69; ImageNet parcial 58.26/52.75/4.31/7.00.","limites":"Mismo banco y K = 4 que la fila anterior; las desviaciones de ~21 puntos hacen que las diferencias entre métodos sean menores que la variación entre pliegues. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Generalización a severidad no vista. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9460","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M. (2025). Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring. arXiv:2504.11581 (preprint). https://arxiv.org/abs/2504.11581","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M.","anio":2025,"titulo":"Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring","fuente":"arXiv:2504.11581 (preprint)","url":"https://arxiv.org/abs/2504.11581","pais":"Canadá; Brasil (afiliaciones de los autores en el documento)","institucion":"University of Ottawa; Universidade Federal do Espírito Santo; Instituto Federal do Espírito Santo (afiliaciones en el documento)"},"extracto":"However, the CWRU dataset was not specifically designed with ML applications in mind, and care must be taken to avoid misleading results. For example, issues related to data with similar load conditions may affect the generalizability of models ... Another challenge is the significant amount of healthy data when compared to faulty data, since machines aren't meant to fail.","localizador":"Sección 2.1.1, párrafo 2, y Sección 1, párrafo 2, hf://papers/2504.11581/paper.md","afirma":"Los autores advierten que CWRU no se diseñó para aprendizaje automático, que cargas parecidas entre entrenamiento y prueba afectan la generalización y que los datos sanos abundan más que los con falla.","limites":"Advertencia metodológica de los autores con referencias que no se leyeron. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Riesgo de resultados engañosos al validar con bancos. Comparabilidad: media como advertencia.","revista_cuartil":null,"id":"E-9461","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Sehri, M., Varejão, I., Hua, Z., Bonella, V., Santos, A., Boldt, F. A., Dumond, P., & Varejão, F. M. (2025). Towards a universal vibration analysis dataset: A framework for transfer learning in predictive maintenance and structural health monitoring. arXiv:2504.11581 (preprint). https://arxiv.org/abs/2504.11581","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M.","anio":2023,"titulo":"Real-time vibration-based bearing fault diagnosis under time-varying speed conditions","fuente":"arXiv:2311.18547 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2311.18547"},"extracto":"The motor was operated with time-varying speeds (680-2460 rpm) and the bearing in housing B was seeded with outer race, inner race, and bearing ball faults. ... The sampling frequency was set to 25.6 kHz and 2,100 seconds of vibration data were collected for each of the four classes. ... The vibration signals from the two sensors were first downsampled to 20 kHz","localizador":"Sección II-A y II-B, hf://papers/2311.18547/paper.md","afirma":"Banco KAIST usado: motor con velocidad variable de 680 a 2460 rpm, defectos sembrados en pista externa, pista interna y bola, 25.6 kHz de muestreo, 2,100 s por clase, reducido a 20 kHz.","limites":"Banco de laboratorio con defectos sembrados; la velocidad mínima es 680 rpm, por lo que el trabajo no cubre regímenes por debajo de ese valor. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Diagnóstico bajo velocidad variable; no sustenta desempeño a baja velocidad. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9462","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M. (2023). Real-time vibration-based bearing fault diagnosis under time-varying speed conditions. arXiv:2311.18547 (preprint; versión HTML v2). https://arxiv.org/abs/2311.18547","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M.","anio":2023,"titulo":"Real-time vibration-based bearing fault diagnosis under time-varying speed conditions","fuente":"arXiv:2311.18547 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2311.18547"},"extracto":"we corrupted the vibration waveforms with noise at the following SNR levels: 20 dB, 15 dB, 10 dB, 5 dB, 0 dB, and -5 dB ... corresponds to a segment length of 2,000 samples ... which yields a total of 21,000 segments ... we decided 10 Hz, or 0.1 seconds, is a suitable maximum rate of range ... First, we divided the 84,000 samples (four classes each having 21,000 segments) into five equally sized shuffled splits and maintained their class balance (stratified folds). ... each model was trained with 67,200 samples and tested with 16,800 samples","localizador":"Secciones II-B y II-C, hf://papers/2311.18547/paper.md","afirma":"Segmentos sin solape de 2,000 muestras (0.1 s), 21,000 por clase, 84,000 en total; validación cruzada de 5 pliegues estratificados barajados (67,200 de entrenamiento y 16,800 de prueba); ruido blanco añadido a 20, 15, 10, 5, 0 y -5 dB.","limites":"Interpretación del investigador: pliegues barajados de segmentos de las mismas grabaciones, sin retener una condición o grabación completa, por lo que no prueba generalización a otra máquina o régimen. Ruido blanco gaussiano sintético, no ruido de planta. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Protocolo de validación y robustez a ruido. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9463","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M. (2023). Real-time vibration-based bearing fault diagnosis under time-varying speed conditions. arXiv:2311.18547 (preprint; versión HTML v2). https://arxiv.org/abs/2311.18547","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M.","anio":2023,"titulo":"Real-time vibration-based bearing fault diagnosis under time-varying speed conditions","fuente":"arXiv:2311.18547 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2311.18547"},"extracto":"the Inner class is the easiest to predict as it had the least amount of accuracy drop; from 100% for clean signals to 95.6% for noisy signals at -5 dB SNR ... (up to a 3.6% point gain in average accuracy) ... the designed CNN outruns the PIResNet with a significant performance gain of up to 15.8% points. Nevertheless, our results are averaged over the five cross-validation splits while PIResNet results are drawn from the best-performing confusion matrices.","localizador":"Sección III-A, hf://papers/2311.18547/paper.md","afirma":"La clase pista interna conserva la exactitud (de 100 % sin ruido a 95.6 % con -5 dB); la CNN supera hasta 3.6 puntos de exactitud promedio y hasta 15.8 puntos en las matrices de confusión frente a PIResNet, comparando promedios de 5 pliegues contra los mejores resultados del otro método.","limites":"La Tabla I y la Figura 3 con los valores por nivel de ruido no figuran en el texto recuperado (solo sus pies), por lo que no se pudo transcribir la exactitud de cada SNR. La ganancia de 15.8 puntos compara contra el mejor caso del método rival, según los propios autores. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Robustez de defecto en pista interna ante ruido. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9464","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M. (2023). Real-time vibration-based bearing fault diagnosis under time-varying speed conditions. arXiv:2311.18547 (preprint; versión HTML v2). https://arxiv.org/abs/2311.18547","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M.","anio":2023,"titulo":"Real-time vibration-based bearing fault diagnosis under time-varying speed conditions","fuente":"arXiv:2311.18547 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2311.18547"},"extracto":"The results indicate an average inference time of 20.2 ms with a 0.36 standard deviation. This corresponds to a processing time approximately five times less than the duration of data acquisition. ... In total, the model has 558,660 trainable parameters. ... The present work has some limitations; it is confined to fixed noise levels and to diagnosing isolated faults.","localizador":"Secciones II-C, III-B y IV, hf://papers/2311.18547/paper.md","afirma":"La CNN tiene 558,660 parámetros entrenables y 20.2 ms de inferencia promedio (desviación 0.36) por ventana de 0.1 s, unas cinco veces menos que el tiempo de adquisición; los autores reconocen que se limita a niveles fijos de ruido y a fallas aisladas.","limites":"Tiempo medido en una computadora portátil con chip M1 Pro; no es un dispositivo de planta. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Viabilidad de cómputo en el borde. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9465","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M. (2023). Real-time vibration-based bearing fault diagnosis under time-varying speed conditions. arXiv:2311.18547 (preprint; versión HTML v2). https://arxiv.org/abs/2311.18547","avisos":[]},{"tipo":"preprint","acceso":"abstract","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A.","anio":2026,"titulo":"Neutrosophic ensemble classification for uncertainty-aware bearing fault detection: Evidence from laboratory and variable-speed industrial benchmarks","fuente":"arXiv:2610.06880 (preprint)","url":"https://arxiv.org/abs/2610.06880"},"extracto":"evaluated on two bearing benchmarks (CWRU and JNU, 600-1000 rpm) under a leave-one-condition-out protocol ... On CWRU, after correcting a file-to-class mapping error, the ensemble reaches 100.00 percent accuracy on three of four held-out loads (92.27 percent on the fourth) ... On JNU, holding out 1000 rpm, accuracy collapses to 40.64 percent, below a majority-class baseline; Logistic Regression (57.91 percent) generalizes far better than the tree ensembles.","localizador":"Resumen del autor (campo 'summary' de metadata.json y sección Abstract de paper.md de hf://papers/2610.06880; el lector solo devolvió metadatos y resumen, sin texto completo)","afirma":"Con retención de una condición (leave-one-condition-out), el ensamble llega a 100.00 % en tres de cuatro cargas retenidas de CWRU y 92.27 % en la cuarta, pero cae a 40.64 % en JNU al retener 1000 rpm, por debajo de una línea base de clase mayoritaria; la regresión logística llega a 57.91 %.","limites":"Solo resumen (VERIFICADO-ABSTRACT): sin tablas ni protocolo; el texto completo no estaba disponible en Markdown. Bancos de laboratorio (CWRU, JNU a 600-1000 rpm). Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Límite de generalización entre condiciones: el rendimiento depende de la partición. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9466","nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A. (2026). Neutrosophic ensemble classification for uncertainty-aware bearing fault detection: Evidence from laboratory and variable-speed industrial benchmarks. arXiv:2610.06880 (preprint). https://arxiv.org/abs/2610.06880","avisos":[]},{"tipo":"preprint","acceso":"abstract","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A.","anio":2026,"titulo":"Neutrosophic ensemble classification for uncertainty-aware bearing fault detection: Evidence from laboratory and variable-speed industrial benchmarks","fuente":"arXiv:2610.06880 (preprint)","url":"https://arxiv.org/abs/2610.06880"},"extracto":"(AURC 0.29 vs. 0.36 on the standard split; 0.54 vs. 0.73 under a harder single-condition reproduction) ... separate most fault classes almost perfectly (99.57 percent) using three interpretable features ... standalone Logistic Regression confidence outperforms the full decomposition, a boundary condition we report honestly","localizador":"Resumen del autor (metadata.json y Abstract de hf://papers/2610.06880)","afirma":"Fusionar un modelo temporal y uno de frecuencia y medir su divergencia de Jensen-Shannon da menor AURC (0.29 frente a 0.36 en la partición estándar; 0.54 frente a 0.73 en una reproducción más difícil de una sola condición) que la entropía de un modelo; con frecuencias de falla demoduladas por envolvente en CWRU, tres rasgos separan las clases en 99.57 %.","limites":"Solo resumen; el 99.57 % es solo en CWRU, sin retención de condición. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Incertidumbre del diagnóstico y rasgos basados en frecuencias de falla. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9467","nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A. (2026). Neutrosophic ensemble classification for uncertainty-aware bearing fault detection: Evidence from laboratory and variable-speed industrial benchmarks. arXiv:2610.06880 (preprint). https://arxiv.org/abs/2610.06880","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Gück, C., Roelofs, C. M. A., & Faulstich, S.","anio":2024,"titulo":"CARE to Compare: A real-world dataset for anomaly detection in wind turbine data","fuente":"arXiv:2404.10320 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2404.10320"},"extracto":"The CARE-score focuses on four key aspects that a good AD model for predictive maintenance should excel in, which are: ... Coverage: Detection of as many correct anomalies as possible ... Accuracy: Recognition of normal behavior ... Reliability: Few false alarm events ... Earliness: Detection of anomalies before fault gets critical. ... The third sub-score assesses classification performance on aggregated events, by applying an eventwise classification measure.","localizador":"Sección 4.1, hf://papers/2404.10320/paper.md","afirma":"El puntaje CARE tiene cuatro componentes: Coverage (cobertura de anomalías correctas), Accuracy (reconocimiento de comportamiento normal), Reliability (pocas falsas alarmas por evento) y Earliness (detección antes de que la falla sea crítica).","limites":"Datos de SCADA de aerogeneradores con resolución de 10 minutos, no vibración de chumaceras; solo la definición de la métrica es trasladable, no los valores. Los autores trabajan con la hipótesis de que el inicio de la anomalía está etiquetado.","aplica_a":"Métrica por evento y falsas alarmas para cualquier detector que se proponga para la chumacera. Comparabilidad: baja en el activo, media en metodología.","revista_cuartil":null,"id":"E-9468","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Gück, C., Roelofs, C. M. A., & Faulstich, S. (2024). CARE to Compare: A real-world dataset for anomaly detection in wind turbine data. arXiv:2404.10320 (preprint; versión HTML v2). https://arxiv.org/abs/2404.10320","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Gück, C., Roelofs, C. M. A., & Faulstich, S.","anio":2024,"titulo":"CARE to Compare: A real-world dataset for anomaly detection in wind turbine data","fuente":"arXiv:2404.10320 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2404.10320"},"extracto":"In this case, a value of β=1 2 ... is chosen to give more weight to precision than recall, thereby penalizing excessive false positives. ... which we set to 72. The idea behind this threshold is that in order to reach a criticality of 72 the algorithm must either detect at least 72 anomalies in a row, which equates to 12 hours of consecutive anomalies ... Setting the threshold at 72 was found to be the most appropriate for all 95 time series in this dataset and generally depends on the length of the time series and the use-case specific definitions of detected anomaly events. ... In the first half of the event, all detected anomalies are assigned a weight of 1. In the second half of the event, the weights decrease linearly to 0","localizador":"Sección 4.1.1 (Coverage, Reliability y Earliness), hf://papers/2404.10320/paper.md","afirma":"Coverage usa Fβ con β = 1/2 (el texto renderiza 'β=1 2'; más adelante aparece como F 1 2) para penalizar falsos positivos; Reliability marca un evento como alarma si la criticidad máxima supera 72 (12 horas de detecciones seguidas con datos cada 10 minutos); Earliness pondera con 1 la primera mitad del evento y decrece linealmente a 0 en la segunda.","limites":"El umbral 72 se calibró a series de 10 minutos y de 4 a 98 días de predicción; los autores dicen que depende de la duración de la serie y de la definición de evento. Otro intervalo de muestreo exige recalibrar. Datos de aerogeneradores, no de chumaceras.","aplica_a":"Definición de métricas por evento para un detector de la chumacera. Comparabilidad: baja en el activo, media en metodología.","revista_cuartil":null,"id":"E-9469","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Gück, C., Roelofs, C. M. A., & Faulstich, S. (2024). CARE to Compare: A real-world dataset for anomaly detection in wind turbine data. arXiv:2404.10320 (preprint; versión HTML v2). https://arxiv.org/abs/2404.10320","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Gück, C., Roelofs, C. M. A., & Faulstich, S.","anio":2024,"titulo":"CARE to Compare: A real-world dataset for anomaly detection in wind turbine data","fuente":"arXiv:2404.10320 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2404.10320"},"extracto":"where we choose ω 1=ω 2=ω 3=1 ... and ω 4=2 ... in order to weight the normal datasets to the same degree as datasets containing an anomaly event ... If no anomalies were detected at all, the CARE score will be 0. ... the predictions are worse than uniformly distributed random predictions","localizador":"Sección 4.1.1 (CARE), ecuaciones 4 y 5, hf://papers/2404.10320/paper.md","afirma":"CARE es un promedio ponderado con pesos 1, 1, 1 y 2 (Coverage, Earliness, Reliability y Accuracy sobre series normales); vale 0 si no se detecta ninguna anomalía y se iguala a la exactitud sobre series normales cuando esta cae por debajo de 0.5 (peor que predicción aleatoria uniforme).","limites":"El orden de los pesos (1 para Fβ promedio, WS promedio y EFβ; 2 para Acc promedio) sale de la ecuación 4 del texto; el umbral 0.5 de la ecuación 5 se renderiza con símbolos que no se pueden citar literalmente. Datos de aerogeneradores, no de chumaceras.","aplica_a":"Definición del puntaje CARE y sus componentes. Comparabilidad: baja en el activo, media en metodología.","revista_cuartil":null,"id":"E-9470","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Gück, C., Roelofs, C. M. A., & Faulstich, S. (2024). CARE to Compare: A real-world dataset for anomaly detection in wind turbine data. arXiv:2404.10320 (preprint; versión HTML v2). https://arxiv.org/abs/2404.10320","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Gück, C., Roelofs, C. M. A., & Faulstich, S.","anio":2024,"titulo":"CARE to Compare: A real-world dataset for anomaly detection in wind turbine data","fuente":"arXiv:2404.10320 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2404.10320"},"extracto":"The data consists of 95 datasets, containing 89 years of SCADA time series distributed across 36 different WTs from the three wind farms A, B and C. ... 44 out the 95 datasets contain a labeled anomaly event and the other 51 datasets represent normal behavior ... Turbines 5 9 22 36 ... Datasets 22 15 58 95 ... Anomaly events 11 6 27 44 ... Normal behavior 11 9 31 51 ... Features 86 257 957- ... Sensors 54 63 238-","localizador":"Sección 3.2 y tabla de estadísticas (celdas transcritas), hf://papers/2404.10320/paper.md","afirma":"El conjunto CARE reúne 95 series (89 años) de 36 aerogeneradores en 3 parques, con 44 eventos de anomalía etiquetados y 51 series de comportamiento normal; los parques A, B y C aportan 5, 9 y 22 turbinas y 86, 257 y 957 variables.","limites":"Aerogeneradores (parque A en tierra, B y C marinos): operación y fallas distintas de una polea de faja; datos anonimizados y con marcas de tiempo desplazadas; el inicio de la anomalía en el parque A es una estimación de los autores.","aplica_a":"Tamaño y balance de un conjunto público con eventos etiquetados. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9471","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Gück, C., Roelofs, C. M. A., & Faulstich, S. (2024). CARE to Compare: A real-world dataset for anomaly detection in wind turbine data. arXiv:2404.10320 (preprint; versión HTML v2). https://arxiv.org/abs/2404.10320","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Gück, C., Roelofs, C. M. A., & Faulstich, S.","anio":2024,"titulo":"CARE to Compare: A real-world dataset for anomaly detection in wind turbine data","fuente":"arXiv:2404.10320 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2404.10320"},"extracto":"The datasets consist of SCADA time series data for each turbine, with a resolution of 10 minutes. Each dataset includes one year worth of data for training a model, as well as 4 to 98 days of prediction data. ... For each turbine fault the preceding 14 days were marked with the status-ID 4 (fault) and the 3 days after the fault timestamp were marked with the status-ID 3 (service mode). ... Every sub-dataset must contain at least one whole year worth of data, to be able to learn seasonality-related effects.","localizador":"Secciones 3.1 y 3.2, y 3.3 (parque A), hf://papers/2404.10320/paper.md","afirma":"Cada serie trae un año de entrenamiento y de 4 a 98 días de predicción con datos cada 10 minutos; en el parque A se marcaron 14 días antes de cada falla como estado de falla y 3 días después como servicio, para evitar contaminar el entrenamiento.","limites":"Los 14 y 3 días son un criterio conservador de los autores para el parque A, sin información real de duración de la anomalía. Datos de aerogeneradores.","aplica_a":"Requisitos de datos para entrenar y evaluar detectores. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9472","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Gück, C., Roelofs, C. M. A., & Faulstich, S. (2024). CARE to Compare: A real-world dataset for anomaly detection in wind turbine data. arXiv:2404.10320 (preprint; versión HTML v2). https://arxiv.org/abs/2404.10320","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Gück, C., Roelofs, C. M. A., & Faulstich, S.","anio":2024,"titulo":"CARE to Compare: A real-world dataset for anomaly detection in wind turbine data","fuente":"arXiv:2404.10320 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2404.10320"},"extracto":"The strategy “random” gets the CARE-score of 0.5 and sets the lower bound to beat for good any anomaly detection algorithms. ... the trivial strategies “all anomaly” and “all normal” both get the score 0 ... With a score of 0.66 the AE approach represents a good anomaly detector ... The isolation forest approach does not outperform that threshold since it is not able to recognize normal behavior appropriately with the chosen parameter configuration.","localizador":"Sección 4.2.3, hf://papers/2404.10320/paper.md","afirma":"En el mini-benchmark de CARE, 'todo anomalía' y 'todo normal' obtienen 0, la estrategia aleatoria 0.5 (cota inferior a superar), el bosque de aislamiento no supera 0.5 y el autoencoder con umbral calibrado llega a 0.66.","limites":"Mini-benchmark ilustrativo de los autores con aerogeneradores; el valor del bosque de aislamiento figura solo en la Figura 3, no en el texto. 0.66 no es una referencia para chumaceras.","aplica_a":"Qué puntaje significa 'mejor que azar' en CARE. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9473","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Gück, C., Roelofs, C. M. A., & Faulstich, S. (2024). CARE to Compare: A real-world dataset for anomaly detection in wind turbine data. arXiv:2404.10320 (preprint; versión HTML v2). https://arxiv.org/abs/2404.10320","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W.","anio":2024,"titulo":"BearLLM: A prior knowledge-enhanced bearing health management framework with unified vibration signal representation","fuente":"arXiv:2408.11281 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2408.11281","institucion":"Intelligent Detection and Equipment Department, Shenyang Institute of Automation (según metadatos del modelo vinculado en Hugging Face; no figura en el texto leído)"},"extracto":"Dataset Sample Rate (kHz)Condi-tions∗Fault Types Time (s)Text ... CWRU 12 / 48 12 10 3932 ... DIRG 51.2 102 7 7140 ... HIT 20 40 3 9648 ... IMS 20 16 7 46480 ... JNU 100 45 4 3600 ... JUST 50 36 4 43986 ... MFPT 48.8 / 97.6 1 3 78 ... PU 64 4 5 7316 ... XJTU 25.6 6 10 13336 ... MBHM 12 ~100 262 10 135516 ... The same working conditions represent the same load, speed, and sensor.","localizador":"Sección 3, Tabla 1 (filas transcritas), hf://papers/2408.11281/paper.md","afirma":"Tabla 1 del paper: diez bancos con frecuencia de muestreo (kHz), número de condiciones de trabajo, tipos de falla y tiempo total (s); por ejemplo CWRU 12/48 kHz, 12 condiciones, 10 tipos, 3932 s; JNU 100 kHz, 45 condiciones; MBHM (conjunto combinado) 12 a ~100 kHz, 262 condiciones, 10 tipos, 135516 s.","limites":"Las columnas se infieren de la cabecera y del pie del paper; las celdas se transcriben tal como salen en la extracción (sin la columna de marcas de texto). La condición de trabajo se define como misma carga, velocidad y sensor. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Diversidad de condiciones en bancos públicos. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9474","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W. (2024). BearLLM: A prior knowledge-enhanced bearing health management framework with unified vibration signal representation. arXiv:2408.11281 (preprint; versión HTML v2). https://arxiv.org/abs/2408.11281","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W.","anio":2024,"titulo":"BearLLM: A prior knowledge-enhanced bearing health management framework with unified vibration signal representation","fuente":"arXiv:2408.11281 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2408.11281","institucion":"Intelligent Detection and Equipment Department, Shenyang Institute of Automation (según metadatos del modelo vinculado en Hugging Face; no figura en el texto leído)"},"extracto":"We trained on the MBHM(w/o JUST&IMS) dataset, comprising only 35% of the MBHM training data, and performed zero-shot tests on the JUST and IMS datasets separately. ... On the JUST dataset, our method achieves an accuracy of 90.22% without any fine-tuning. In contrast, the method without fault-free and residual channels achieves an accuracy of only 87.54%.","localizador":"Sección 5.3, párrafo 3, hf://papers/2408.11281/paper.md","afirma":"Entrenando sin los bancos JUST e IMS (35 % de los datos de entrenamiento), la prueba sin ajuste adicional (cero disparos) en JUST da 90.22 % de exactitud con la señal de referencia sin falla y 87.54 % sin los canales de referencia y residuo.","limites":"Prueba de transferencia entre bancos de laboratorio; el método exige una señal de referencia sin falla de las mismas condiciones de trabajo. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Generalización a un banco no visto con línea base sin falla. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9475","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W. (2024). BearLLM: A prior knowledge-enhanced bearing health management framework with unified vibration signal representation. arXiv:2408.11281 (preprint; versión HTML v2). https://arxiv.org/abs/2408.11281","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W.","anio":2024,"titulo":"BearLLM: A prior knowledge-enhanced bearing health management framework with unified vibration signal representation","fuente":"arXiv:2408.11281 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2408.11281","institucion":"Intelligent Detection and Equipment Department, Shenyang Institute of Automation (según metadatos del modelo vinculado en Hugging Face; no figura en el texto leído)"},"extracto":"Given that the IMS dataset is unbalanced (most samples are fault-free), the overall accuracy drops slightly from 98.52% to 97.81%. ... However, the method without two auxiliary channels tends to grossly underestimate the severity. For example, 61% of severe outer ring faults are classified as moderate, and 23% of moderate outer ring faults are identified as minor.","localizador":"Sección 5.3, párrafo 4, hf://papers/2408.11281/paper.md","afirma":"En IMS (muestras mayormente sanas), la exactitud cero disparos baja de 98.52 % a 97.81 % al quitar los canales de referencia y residuo, y sin ellos el 61 % de las fallas severas de pista externa se clasifican como moderadas y el 23 % de las moderadas como menores (se subestima la severidad).","limites":"IMS está desbalanceado, así que la exactitud global refleja sobre todo muestras sanas. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Riesgo de subestimar severidad sin línea base sin falla. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9476","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W. (2024). BearLLM: A prior knowledge-enhanced bearing health management framework with unified vibration signal representation. arXiv:2408.11281 (preprint; versión HTML v2). https://arxiv.org/abs/2408.11281","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers" ion signal representation","fuente":"arXiv:2408.11281 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2408.11281","institucion":"Intelligent Detection and Equipment Department, Shenyang Institute of Automation (según metadatos del modelo vinculado en Hugging Face; no figura en el texto leído)"},"extracto":"The MBHM contains 135,516 pairs of vibration signal segments and fault types, and 542,064 pairs of text cues and responses ... Our dataset contains 262 working conditions collected from nine publicly accessible datasets ... we empirically set n f=24000 ... We addressed potential label leakage by dividing the 9 public datasets into a 7:2:1 ratio individualy. ... “(+108%)” represents a relative improvement from 48.01% to 100%","localizador":"Secciones 3 y 4.1, 5.1 y pie de la Tabla 2, hf://papers/2408.11281/paper.md","afirma":"El conjunto MBHM reúne 135,516 segmentos de vibración con su falla, 262 condiciones de trabajo de nueve bancos públicos, n_f = 24000 componentes de frecuencia y una división 7:2:1 por banco; el pie de la Tabla 2 menciona una mejora relativa de 48.01 % a 100 % (+108 %) sin que el texto recuperado diga en qué método y banco.","limites":"La Tabla 2 completa (exactitudes por método) no figura en el texto recuperado, solo su pie. Banco de laboratorio con rodamientos pequeños de bolas a altas velocidades (cientos a miles de rpm), no una polea lenta de faja transportadora: sus cifras no son extrapolables a la chumacera de polea.","aplica_a":"Escala y protocolo de un modelo único multicondición. Comparabilidad: baja.","revista_cuartil":null,"id":"E-9478","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W. (2024). BearLLM: A prior knowledge-enhanced bearing health management framework with unified vibration signal representation. arXiv:2408.11281 (preprint; versión HTML v2). https://arxiv.org/abs/2408.11281","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W.","anio":2024,"titulo":"BearLLM: A prior knowledge-enhanced bearing health management framework with unified vibration signal representation","fuente":"arXiv:2408.11281 (preprint; versión HTML v2)","url":"https://arxiv.org/abs/2408.11281","institucion":"Intelligent Detection and Equipment Department, Shenyang Institute of Automation (según metadatos del modelo vinculado en Hugging Face; no figura en el texto leído)"},"extracto":"However, it relies on comparisons via fault-free signals under the same working conditions, which suggests that it cannot handle bearing health management tasks without prior fault-free knowledge. ... At the same time, signal comparison requires the same working conditions, so it cannot be applied to devices such as industrial robotic arms, whose working conditions (e.g., speed, load) vary over time","localizador":"Apéndice E, 'Limitation and Future Works', hf://papers/2408.11281/paper.md (segundo tramo)","afirma":"Los autores reconocen que el método necesita una señal sin falla de las mismas condiciones de trabajo (capturada tras la aceptación o el mantenimiento) y no sirve para equipos cuyas condiciones (velocidad, carga) varían en el tiempo.","limites":"Limitación declarada por los autores; no se evaluó con una máquina de planta.","aplica_a":"Línea base por activo: sin registro sano de la chumacera no se puede aplicar. Comparabilidad: media como idea de línea base.","revista_cuartil":null,"id":"E-9479","nivel_evidencia":"VERIFICADO-TEXTO","apa":"Peng, H., Liu, J., Du, J., Gao, J., & Wang, W. (2024). BearLLM: A prior knowledge-enhanced bearing health management framework with unified vibration signal representation. arXiv:2408.11281 (preprint; versión HTML v2). https://arxiv.org/abs/2408.11281","avisos":[]},{"tipo":"preprint","acceso":"texto_completo","via":"lector_hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"El-Ghoussani, A., De Vita, M function dnum(s){var t=Date.parse(s);return isNaN(t)?NaN:t/864e5}

/* ---------- estadística robusta (réplica de signals.py: mediana y MAD) ---------- */
function median(a){var b=a.filter(isFinite).slice().sort(function(x,y){return x-y}),n=b.length;if(!n)return NaN;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2}
function baseRobusta(y,n){var w=y.slice(0,n).filter(isFinite),m=median(w),s=1.4826*median(w.map(function(v){return Math.abs(v-m)}));if(!s){var mu=w.reduce(function(a,b){return a+b},0)/w.length;s=Math.sqrt(w.reduce(function(a,b){return a+(b-mu)*(b-mu)},0)/(w.length-1))||1e-12}return{med:m,sig:s,n:w.length}}
function primerCruce(y,u,p){var run=0;for(var i=0;i<y.length;i++){if(y[i]>u){run++;if(run>=p)return i-p+1}else run=0}return -1}
function cusum(y,mu,sig,k){var s=0,o=[];y.forEach(function(v){s=Math.max(0,s+(v-mu)/sig-k);o.push(s)});return o}

/* ---------- motor Weibull (máxima verosimilitud con censura a la derecha) ---------- */
function sortedData(d){return d.slice().sort(function(a,b){return a.t-b.t})}
function profLL(beta,t,c){var r=0,sf=0,st=0;for(var i=0;i<t.length;i++){st+=Math.pow(t[i],beta);if(!c[i]){r++;sf+=Math.log(t[i])}}return r*Math.log(beta)-r*Math.log(st/r)+(beta-1)*sf-r}
function solveBeta(t,c){
  var r=0,sf=0;t.forEach(function(v,i){if(!c[i]){r++;sf+=Math.log(v)}});
  function g(b){var a=0,bb=0;t.forEach(function(v){var p=Math.pow(v,b);a+=p*Math.log(v);bb+=p});return a/bb-1/b-sf/r}
  var lo=0.02,hi=100;if(g(lo)>0||g(hi)<0)return NaN;
  for(var k=0;k<200;k++){var mid=(lo+hi)/2;if(g(mid)>0)hi=mid;else lo=mid}
  return(lo+hi)/2;
}
function fitWeibull(data){
  var t=data.map(function(d){return d.t}),c=data.map(function(d){return !!d.censurado}),r=c.filter(function(x){return!x}).length;
  if(r<2)return{error:"se necesitan al menos 2 fallas para ajustar Weibull"};
  var beta=solveBeta(t,c);if(!isFinite(beta))return{error:"el estimador no converge (¿todos los tiempos iguales?)"};
  var st=0;t.forEach(function(v){st+=Math.pow(v,beta)});var eta=Math.pow(st/r,1/beta);
  return{beta:beta,eta:eta,r:r,n:t.length,ll:profLL(beta,t,c),t:t,c:c};
}
function bisect(f,a,b){var fa=f(a);for(var i=0;i<100;i++){var m=(a+b)/2,fm=f(m);if((fa>0)===(fm>0)){a=m;fa=fm}else b=m}return(a+b)/2}
var CHI=1.9207; /* chi-cuadrado(1, 0.95)/2 */
function ciBeta(f){
  var t=f.t,c=f.c,tgt=f.ll-CHI,h=function(b){return profLL(b,t,c)-tgt};
  var lo=h(0.02)<0?bisect(h,0.02,f.beta):0.02,hi=h(100)<0?bisect(h,f.beta,100):100;return[lo,hi];
}
function bLife(beta,eta,p){return eta*Math.pow(-Math.log(1-p),1/beta)}
function llTp(beta,tp,p,t,c){var eta=tp/Math.pow(-Math.log(1-p),1/beta),r=0,sf=0,s=0;for(var i=0;i<t.length;i++){s+=Math.pow(t[i]/eta,beta);if(!c[i]){r++;sf+=Math.log(t[i])}}return r*Math.log(beta)-r*beta*Math.log(eta)+(beta-1)*sf-s}
function maxOverBeta(tp,p,t,c){var a=0.05,b=60,gr=0.6180339887;for(var i=0;i<80;i++){var x1=b-gr*(b-a),x2=a+gr*(b-a);if(llTp(x1,tp,p,t,c)<llTp(x2,tp,p,t,c))a=x1;else b=x2}return llTp((a+b)/2,tp,p,t,c)}
function ciBLife(f,p){
  var tp=bLife(f.beta,f.eta,p),tgt=f.ll-CHI,h=function(x){return maxOverBeta(x,p,f.t,f.c)-tgt};
  var lo=tp,i=0;while(h(lo)>0&&i++<60)lo/=1.5;var hi=tp;i=0;while(h(hi)>0&&i++<60)hi*=1.5;
  return[bisect(h,lo,tp),bisect(h,tp,hi)];
}
function medianRanks(data){ /* rangos de Johnson con censura + aproximación de Bernard */
  var s=sortedData(data),n=s.length,prev=0,out=[],k=n;
  s.forEach(function(d,i){var rem=n-i;if(!d.censurado){var inc=(n+1-prev)/(1+rem);prev=prev+inc;out.push({t:d.t,F:(prev-0.3)/(n+0.4)})}});
  return out;
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bootR(data,tm,B,seed){
  var rng=mulberry(seed),out=[],n=data.length;
  for(var b=0;b<B;b++){var s=[];for(var i=0;i<n;i++)s.push(data[Math.floor(rng()*n)]);var f=fitWeibull(s);if(f.error)continue;out.push(Math.exp(-Math.pow(tm/f.eta,f.beta)))}

}

  host.innerHTML='<div class="card"><h2>Vida: Weibull de dos parámetros por máxima verosimilitud con censura</h2><p>'+esc(v.nota||"")+' '+chips(v.evidencia)+'</p>'+warn+test+
   '<div class="grid"><div class="kpi"><b>'+fmt(f.beta,3)+'</b><span>β forma · IC 95 % verosimilitud perfilada ['+fmt(cb[0],2)+'; '+fmt(cb[1],2)+']</span></div>'+

   '<div class="kpi"><b>'+fmt(b10,1)+'</b><span>B10 · IC 95 % ['+fmt(cb10[0],1)+'; '+fmt(cb10[1],1)+']</span></div>'+
   '<div class="kpi"><b>'+f.r+' / '+f.n+'</b><span>fallas / observaciones</span></div></div>'+
   '<p style="font-size:13px">Lectura de β: '+(f.beta<.95?'menor que 1, tasa decreciente (mortalidad infantil o mezcla de modos)':f.beta>1.05?'mayor que 1, desgaste (la tasa crece con la edad)':'cercano a 1, tasa aproximadamente constante')+

  var rk=medianRanks(v.datos);
  var W=760,H=300,m={l:50,r:14,t:10,b:30},lx=rk.map(function(p){return Math.log(p.t)}),ly=rk.map(function(p){return Math.log(-Math.log(1-p.F))});
  var xmin=Math.min.apply(0,lx.concat([Math.log(b10)]))-.3,xmax=Math.max.apply(0,lx)+.3,ymin=Math.min.apply(0,ly.concat([-3]))-.2,ymax=Math.max.apply(0,ly)+.4;

  var s='';[.01,.05,.1,.25,.5,.75,.9,.99].forEach(function(q){var yy=Math.log(-Math.log(1-q));s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(yy)+'" y2="'+Y(yy)+'" stroke="var(--line)"/><text x="4" y="'+(Y(yy)+4)+'">'+(q*100)+'%</text>'});
  for(var e=Math.ceil(xmin/Math.LN10);e<=xmax/Math.LN10;e++){var xx=e*Math.LN10;s+='<line y1="'+m.t+'" y2="'+(H-m.b)+'" x1="'+X(xx)+'" x2="'+X(xx)+'" stroke="var(--line)"/><text x="'+X(xx)+'" y="'+(H-10)+'" text-anchor="middle">10^'+e+'</text>'}
  s+='<line x1="'+X(xmin)+'" y1="'+Y(f.beta*(xmin-Math.log(f.eta)))+'" x2="'+X(xmax)+'" y2="'+Y(f.beta*(xmax-Math.log(f.eta)))+'" stroke="var(--c1)" stroke-width="1.6"/>';

  $("#wp").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Papel Weibull">'+s+'</svg><div style="font-size:12px;color:var(--mut)">Puntos: rangos de Johnson con aproximación de Bernard (solo fallas). La recta es el ajuste de máxima verosimilitud, no una regresión sobre los puntos.</div>';

function vSim(host){
  host.innerHTML='<div class="card"><h2>Simulador didáctico del reemplazo por edad</h2><div class="note bad"><b>No es evidencia ni representa a la chumacera.</b> Los valores los elige quien usa la página; no hay para este modo de falla una forma, una escala ni costos con fuente leída. Úselo para entender cómo cambia el punto óptimo cuando tenga datos o parámetros citables.</div>'+

   '<label>Costo preventivo <input type="number" id="sp" value="1" min="0.01" step="0.1"></label><label>Costo de falla <input type="number" id="sf" value="5" min="0.01" step="0.1"></label><span style="font-size:12px;color:var(--mut)">(costos en unidades relativas que usted define)</span>'+

      '<div class="note">Sin mínimo interior: '+(b<=1?'con β ≤ 1 el riesgo no crece con la edad y reemplazar por edad no reduce el costo.':cf<=cp?'si la falla no cuesta más que la prevención, esperar a la falla es igual o más barato.':'el mínimo cae fuera del rango mostrado.')+'</div>';

    var Fv=R.map(function(r){return 1-r}),fv=T.map(function(t){return b/e*Math.pow(t/e,b-1)*Math.exp(-Math.pow(t/e,b))});

    lineChart($("#s1"),{x:T,series:[{name:"R(t) confiabilidad",y:R}],vlines:vm,titulo:"R(t): confiabilidad",fixY:[0,1],xl:"horas de servicio",yl:"probabilidad de sobrevivir",desc:"Probabilidad de que el componente siga en servicio a cada edad, con los valores que usted eligió; se marcan B10, B50 y MTTF.",refsTxt:"relación estándar de la distribución Weibull; sin fuente en el registro (verificar en un texto de confiabilidad).",xfmt:function(v){return fmt(v,0)},key:"s1"});

function wrapTxt(t,n){var w=String(t).split(" "),l=[],c="";w.forEach(function(x){if((c+" "+x).trim().length>n){l.push(c);c=x}else c=(c+" "+x).trim()});if(c)l.push(c);return l}

function svgArbol(host,a){
  var N={};a.nodos.forEach(function(n){N[n.id]=n});var isChild={};a.nodos.forEach(function(n){(n.hijos||[]).forEach(function(h){isChild[h]=1})});
  var roots=a.nodos.filter(function(n){return!isChild[n.id]}),BW=250,BH=92,GX=64,GY=14,leaf=0,pos={},maxd=0;
  function lay(n,d){maxd=Math.max(maxd,d);var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean);
    if(!hs.length){pos[n.id]={y:leaf*(BH+GY),d:d};leaf++;return}
    hs.forEach(function(h){lay(h,d+1)});var ys=hs.map(function(h){return pos[h.id].y});pos[n.id]={y:(Math.min.apply(0,ys)+Math.max.apply(0,ys))/2,d:d}}
  roots.forEach(function(r){lay(r,0)});
  var W=(maxd+1)*(BW+GX)+10,H=Math.max(leaf,1)*(BH+GY)+10,g='';
  function X(d){return d*(BW+GX)+6}
  a.nodos.forEach(function(n){var P=pos[n.id];if(!P)return;(n.hijos||[]).forEach(function(h){var Q=pos[h];if(!Q)return;var x1=X(P.d)+BW,y1=P.y+BH/2+5,x2=X(Q.d),y2=Q.y+BH/2+5,mx=x1+GX/2;
    g+='<path d="M'+x1+' '+y1+' H'+mx+' V'+y2+' H'+x2+'" fill="none" stroke="var(--mut)" stroke-width="1.5"/>'})});
  a.nodos.forEach(function(n){var P=pos[n.id];if(!P)return;var x=X(P.d),y=P.y+5,col=n.nivel==="EVIDENCIA"?"var(--ok)":"var(--warn)";
    g+='<g class="nd" data-n="'+esc(n.id)+'" style="cursor:pointer"><rect x="'+x+'" y="'+y+'" width="'+BW+'" height="'+BH+'" rx="12" fill="var(--panel)" stroke="'+col+'" stroke-width="2.2"/><rect x="'+x+'" y="'+y+'" width="6" height="'+BH+'" rx="3" fill="'+col+'"/>'+
      wrapTxt(n.texto,38).slice(0,6).map(function(l,i){return '<text x="'+(x+14)+'" y="'+(y+17+i*14)+'" style="fill:var(--ink);font-size:12px">'+esc(l)+(i===5&&wrapTxt(n.texto,38).length>6?"…":"")+'</text>'}).join("")+
      (n.hijos&&n.hijos.length?'<circle cx="'+(x+BW+GX/2)+'" cy="'+(P.y+BH/2+5)+'" r="13" fill="var(--panel)" stroke="var(--mut)"/><text x="'+(x+BW+GX/2)+'" y="'+(P.y+BH/2+9)+'" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:10px">'+esc(n.puerta)+'</text>':'')+'</g>'});
  host.innerHTML='<div class="tw"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:'+Math.min(W,1000)+'px" role="img" aria-label="Árbol de fallas">'+g+'</svg></div><div class="leg"><span style="color:var(--ok)">&#9632;</span> respaldo directo de la evidencia · <span style="color:var(--warn)">&#9632;</span> síntesis del equipo · círculo = puerta lógica · pulse un nodo para ver sus fuentes</div>';
  host.querySelectorAll(".nd").forEach(function(el){el.onclick=function(){var n=N[el.dataset.n];openHtml('<h3>'+esc(n.id)+' '+nv(n.nivel)+'</h3><p>'+esc(n.texto)+'</p><p>'+chips(n.evidencia)+'</p><p><small>'+esc(n.nota||"")+'</small></p>')}});
}

function svgIshikawa(host,ish){
  var cats=Object.keys(ish),W=1400,H=640,sx=250,ex=W-200,my=H/2,g='<line x1="'+sx+'" y1="'+my+'" x2="'+ex+'" y2="'+my+'" stroke="var(--ink)" stroke-width="3"/><polygon points="'+ex+','+(my-8)+' '+(ex+14)+','+my+' '+ex+','+(my+8)+'" fill="var(--ink)"/><text x="'+(ex+20)+'" y="'+(my+4)+'" style="fill:var(--ink);font-weight:600">falla de la chumacera</text>';
  var perSide=Math.ceil(cats.length/2),step=(ex-sx-40)/perSide;
  cats.forEach(function(c,i){var up=i%2===0,col=Math.floor(i/2),bx=sx+40+col*step+step*0.6,by=up?20:H-20,ey=my;
    g+='<line x1="'+(bx-step*0.35)+'" y1="'+by+'" x2="'+bx+'" y2="'+ey+'" stroke="var(--c1)" stroke-width="2"/><text x="'+(bx-step*0.35)+'" y="'+(up?by-6:by+14)+'" text-anchor="middle" style="fill:var(--c1);font-weight:700;font-size:13px">'+esc(c)+'</text>';
    (ish[c]||[]).slice(0,4).forEach(function(it,k){var ty=up?by+26+k*62:by-40-k*62,tx=bx-step*0.35+(bx-(bx-step*0.35))*((ty-by)/(ey-by));
      wrapTxt(it.texto,40).slice(0,4).forEach(function(l,j){g+='<text x="'+(tx-8)+'" y="'+(ty+j*12)+'" text-anchor="end" style="fill:'+(it.nivel==="EVIDENCIA"?"var(--ok)":"var(--warn)")+'">'+esc(l)+'</text>'})});
    if(!(ish[c]||[]).length)g+='<text x="'+(bx-step*0.35)+'" y="'+(up?by+30:by-24)+'" text-anchor="middle" style="fill:var(--bad)">SIN DATOS PARA ARMARLO</text>'});
  host.innerHTML='<div class="tw"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:1100px" role="img" aria-label="Diagrama de Ishikawa">'+g+'</svg></div><div style="font-size:12px;color:var(--mut)"><span style="color:var(--ok)">&#9632;</span> respaldo directo · <span style="color:var(--warn)">&#9632;</span> síntesis del equipo</div>';
}

function vFmeca(host){
  var f=D.caso.analisis.fmeca,it=f.items||[],sv=store("fmeca")||{};
  host.innerHTML='<div class="card"><h2>FMECA y estrategia RCM preliminar</h2><p><b>Función:</b> '+esc(f.funcion||"")+'</p><div class="note">Los modos, causas y detección vienen de la evidencia o son síntesis con premisas citadas. <b>Severidad, ocurrencia y detección están vacías a propósito</b>: no hay datos del activo. Un experto puede puntuarlas (1 a 10) y el RPN y el ranking se calculan en el acto. El RPN tiene límites conocidos (la misma cifra puede mezclar riesgos muy distintos y S, O y D no son de escala de razón): úselo para ordenar la discusión, no como medida de riesgo; la escala debe calibrarse con el equipo. Los puntajes quedan solo en este navegador.</div><div class="tw"><table id="fm"></table></div></div>'+
   '<div class="card"><h2>Ranking por RPN (solo modos puntuados)</h2><div id="fmr"></div></div>'+vaciosHtml(f.vacios);
  function draw(){
    $("#fm").innerHTML='<tr><th>Id</th><th>Modo y mecanismo</th><th>Efectos</th><th>Causa</th><th>Detección</th><th>Tarea RCM propuesta</th><th>S</th><th>O</th><th>D</th><th>RPN</th></tr>'+it.map(function(m){
      var v=sv[m.id]||{},rp=(v.s&&v.o&&v.d)?v.s*v.o*v.d:null;
      var inp=function(k){return '<td><input type="number" min="1" max="10" data-id="'+esc(m.id)+'" data-k="'+k+'" value="'+(v[k]||"")+'" style="width:52px"></td>'};
      return '<tr><td>'+esc(m.id)+'</td><td><b>'+esc(m.modo)+'</b><br><small>'+esc(m.mecanismo||"")+'</small><br>'+nv(m.nivel)+' '+chips(m.evidencia)+(m.nota?'<br><small>'+lt(m.nota,100)+'</small>':'')+'</td><td>'+esc(m.efecto_local||"")+'<br><small>'+esc(m.efecto_sistema||"")+'</small></td><td>'+esc(m.causa||"")+'</td><td>'+esc(m.deteccion||"")+'</td><td>'+esc(m.tarea_rcm||"")+'</td>'+inp("s")+inp("o")+inp("d")+'<td><b>'+(rp==null?'—':rp)+'</b></td></tr>'}).join("");
    var rows=it.map(function(m){var v=sv[m.id]||{};return{label:m.id+" "+m.modo,value:(v.s&&v.o&&v.d)?v.s*v.o*v.d:0}}).filter(function(r){return r.value>0}).sort(function(a,b){return b.value-a.value});
    if(rows.length)barChart($("#fmr"),rows,{titulo:"RPN"});else $("#fmr").innerHTML='<p>Sin puntajes: ingrese S, O y D para ver el ranking.</p>';
  }
  host.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.k){var v=Math.max(1,Math.min(10,+t.value||0));sv[t.dataset.id]=sv[t.dataset.id]||{};sv[t.dataset.id][t.dataset.k]=v||undefined;store("fmeca",sv);setTimeout(draw,0)}});
  draw();
}

function vArbol(host){
  var a=D.caso.analisis.arbol,N={};a.nodos.forEach(function(n){N[n.id]=n});
  var hijosDe={};a.nodos.forEach(function(n){(n.hijos||[]).forEach(function(h){hijosDe[h]=1})});
  var raices=a.nodos.filter(function(n){return!hijosDe[n.id]}),pv=store("arbolp")||{};
  host.innerHTML='<div class="card"><h2>Árbol de fallas</h2><p><b>Evento tope:</b> '+esc(a.evento_tope||"")+'</p><div class="note">La estructura (puertas OR y AND) es una propuesta respaldada por la evidencia citada en cada nodo o por síntesis con premisas; no está probada con datos del activo. Las probabilidades de los eventos básicos están vacías: ingrese las que conozca (de 0 a 1) y se calcula la probabilidad del evento tope suponiendo eventos independientes. <b>La compuerta AND del evento tope y la agrupación de causas latentes son hipótesis del equipo</b>: el AND supone que la falla funcional exige además que el daño avance sin ser detectado ni atendido, lo que depende de si existe un programa de monitoreo; las causas latentes actúan como habilitador de las causas físicas, no como alternativa independiente.</div><button class="btn" id="arb-ex">Expandir todo</button> <button class="btn" id="arb-co">Contraer todo</button><div id="arb-tr"></div></div><div class="card"><h2>Probabilidad del evento tope</h2><div id="arb-pt"></div></div>'+vaciosHtml(a.vacios);
  function nodo(n,depth){
    var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean),g=n.puerta;
    var cab='<span class="badge '+(g==="AND"?'posible':g==="OR"?'probable':'')+'">'+esc(g)+'</span> '+esc(n.texto)+' '+nv(n.nivel)+' '+chips(n.evidencia)+(n.nota?'<br><small>'+lt(n.nota,100)+'</small>':'');
    if(!hs.length)return '<li style="list-style:none;margin:4px 0">'+cab+' <label>p <input type="number" min="0" max="1" step="0.001" data-p="'+esc(n.id)+'" value="'+(pv[n.id]==null?"":pv[n.id])+'" style="width:70px"></label></li>';
    return '<li style="list-style:none;margin:4px 0"><details'+(depth<2?' open':'')+'><summary>'+cab+'</summary><ul style="border-left:2px solid var(--line);margin-left:6px;padding-left:12px">'+hs.map(function(h){return nodo(h,depth+1)}).join("")+'</ul></details></li>';
  }
  $("#arb-tr").innerHTML='<ul style="padding:0">'+raices.map(function(r){return nodo(r,0)}).join("")+'</ul>';
  function calc(n){var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean);if(!hs.length){return{p:pv[n.id]==null||pv[n.id]===""?null:+pv[n.id],falta:(pv[n.id]==null||pv[n.id]==="")?1:0}}
    var r=hs.map(calc),falta=r.reduce(function(x,y){return x+y.falta},0);if(falta)return{p:null,falta:falta};
    var p=n.puerta==="AND"?r.reduce(function(x,y){return x*y.p},1):1-r.reduce(function(x,y){return x*(1-y.p)},1);return{p:p,falta:0}}
  function out(){var tot=raices.map(calc),f=tot.reduce(function(x,y){return x+y.falta},0);
    $("#arb-pt").innerHTML=f?'<p>Faltan '+f+' probabilidad(es) de eventos básicos para calcular el evento tope.</p>':'<div class="grid">'+tot.map(function(t,i){return '<div class="kpi"><b>'+fmt(t.p,5)+'</b><span>P('+esc(raices[i].texto.slice(0,50))+')</span></div>'}).join("")+'</div><p style="font-size:12px;color:var(--mut)">Cálculo con las probabilidades que usted ingresó; no son datos de la evidencia.</p>'}
  host.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.p){pv[t.dataset.p]=t.value===""?null:Math.max(0,Math.min(1,+t.value));store("arbolp",pv);out()}});
  $("#arb-ex").onclick=function(){host.querySelectorAll("details").forEach(function(d){d.open=true})};$("#arb-co").onclick=function(){host.querySelectorAll("details").forEach(function(d){d.open=false})};
  out();
}

function vHerr(host){
  host.innerHTML='<div class="card"><h2>Frecuencias características del rodamiento</h2><div class="note">Cinemática estándar de rodamientos; la evidencia registrada (<button class="chip" data-ev="E-8008">E-8008</button>) cita las ecuaciones BPFO, BPFI, BSF y FTF, pero su extracto registrado no las contiene: verifíquelas en la fuente. Los datos geométricos son de su rodamiento (catálogo), no de la evidencia. Supone aro exterior fijo, eje que gira y rodadura pura sin deslizamiento.</div>'+
   '<label>Elementos rodantes <input type="number" id="hn" value="" placeholder="n"></label><label>Diámetro del elemento d (mm) <input type="number" id="hd"></label><label>Diámetro primitivo D (mm) <input type="number" id="hD"></label><label>Ángulo de contacto (°) <input type="number" id="ha" value="0"></label><label>Velocidad del eje (rpm) <input type="number" id="hr"></label><div id="hf"></div><div id="hs"></div></div>'+
   '<div class="card"><h2>Vida nominal L10</h2><div class="note">Relación estándar L10 = (C/P)^p millones de revoluciones (p = 3 en bolas, 10/3 en rodillos). La fuente registrada <button class="chip" data-ev="E-6002">E-6002</button> la menciona; su extracto registrado no la contiene y la edición de la norma no está verificada. Es solo la vida de fatiga bajo condiciones convencionales.</div>'+
   '<label>Capacidad dinámica C <input type="number" id="her-c"></label><label>Carga equivalente P <input type="number" id="her-p"></label><label>Tipo <select id="her-t"><option value="3">bolas (p=3)</option><option value="3.3333333">rodillos (p=10/3)</option></select></label><label>rpm <input type="number" id="her-n"></label><div id="her-o"></div><div id="her-g"></div><p style="font-size:12px;color:var(--mut)">Curva de la relación L10 = (C/P)^p en millones de revoluciones frente a P/C (relación pura; no son datos de ningún rodamiento).</p></div>'+

  VIEWS.forEach(function(v){
    var b=document.createElement("button");b.innerHTML=ic(v.icon||"doc",18)+'<span>'+esc(v.label)+'</span>';b.setAttribute("role","tab");b.dataset.id=v.id;tb.appendChild(b);
    var s=document.createElement("section");s.className="tab";s.id="v-"+v.id;s.dataset.label=v.label;mn.appendChild(s);b.onclick=function(){sel(v.id)};
  });
  var cur="res";
  function sel(id,sub){cur=id;window.__cur=id;
    VIEWS.forEach(function(v){var s=$("#v-"+v.id),b=$('[data-id='+v.id+']',tb),on=v.id===id;s.classList.toggle("on",on);b.setAttribute("aria-selected",on);
      if(on&&!s.dataset.done){s.dataset.done=1;try{v.fn(s)}catch(e){s.innerHTML='<div class="note bad">Error al dibujar esta vista: '+esc(e.message)+'</div>';window.__errores=(window.__errores||[]).concat(String(e))}}});
    if(sub&&SUBSEL[id])SUBSEL[id](sub);
    try{history.replaceState(null,"","#"+id)}catch(e){}window.scrollTo(0,0)}
  window.__goto=sel;
  document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest("[data-go]");if(t)sel(t.dataset.go,t.dataset.sub)});
  var h=(location.hash||"").slice(1);sel(VIEWS.some(function(v){return v.id===h})?h:"res");
  function tema(v){var r=document.documentElement;if(v)r.dataset.theme=v;var d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);$("#t-dia").setAttribute("aria-pressed",!d);$("#t-noche").setAttribute("aria-pressed",d)}
  $("#t-dia").onclick=function(){tema("light")};$("#t-noche").onclick=function(){tema("dark")};tema();
  var dm=$("#dmenu");dm.innerHTML=DESCARGAS.map(function(d,i){return '<button data-d="'+i+'">'+ic(d[0],16)+esc(d[1])+'</button>'}).join("");
  $("#b-desc").onclick=function(e){e.stopPropagation();dm.hidden=!dm.hidden};
  dm.onclick=function(e){var b=e.target.closest("button");if(!b)return;var r=DESCARGAS[+b.dataset.d][2]();guardarArchivo(r[0],r[1]);dm.hidden=true};
  $("#b-imprimir").onclick=imprimir;$("#scrim").onclick=drawerOff;
  if(document.body.dataset.imprimir==="1")setTimeout(imprimir,700);
  $("#b-guardar").onclick=function(){var r=DESCARGAS[4][2]();guardarArchivo(r[0],r[1])};
  $("#b-cargar").onclick=function(){$("#f-cargar").click()};
  $("#f-cargar").onchange=function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(o.tipo!=="sesion-informe")throw 0;Object.keys(o.datos||{}).forEach(function(k){try{localStorage.setItem(k,o.datos[k])}catch(x){}});
    VIEWS.forEach(function(v){var s=$("#v-"+v.id);s.dataset.done="";s.innerHTML=""});Object.keys(SUBSEL).forEach(function(k){delete SUBSEL[k]});sel(cur);toast("Sesión cargada")}catch(x){toast("El archivo no es una sesión de este informe")}};rd.readAsText(f);e.target.value=""};
  document.addEventListener("click",function(e){if(!e.target.closest("#dmenu")&&e.target.id!=="b-desc"&&!e.target.closest("#b-desc"))dm.hidden=true;if(!e.target.closest(".search"))$("#sres").hidden=true});
  var IDX=null,sr=$("#sres");
  $("#q").addEventListener("input",function(){var q=this.value.trim().toLowerCase();if(!q){sr.hidden=true;return}IDX=IDX||buildIndex();var ws=q.split(/\s+/);
    var res=IDX.filter(function(r){var s=r.x.toLowerCase();return ws.every(function(w){return s.indexOf(w)>=0})}).slice(0,14);
    sr.innerHTML=res.length?res.map(function(r,i){var s=r.x,p=s.toLowerCase().indexOf(ws[0]),a=Math.max(0,p-40),snip=esc(s.slice(a,a+130));ws.forEach(function(w){snip=snip.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>")});return '<a data-i="'+i+'"><small>'+esc(r.t)+'</small>'+(a>0?"…":"")+snip+'…</a>'}).join(""):'<a><small>Sin resultados</small>No hay coincidencias para "'+esc(q)+'".</a>';
    sr.hidden=false;sr._r=res});
  sr.addEventListener("click",function(e){var a=e.target.closest("a[data-i]");if(!a)return;var r=sr._r[+a.dataset.i];sr.hidden=true;if(r.ev){sel(r.tab,r.sub);openEv(r.ev)}else sel(r.tab,r.sub)});
  $("#mclose").onclick=closeModal;$("#modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal()});
  window.__listo=true;
}
boot();
</script>
