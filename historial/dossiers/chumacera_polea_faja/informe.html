<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossier del modo de falla: chumacera de polea de faja transportadora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f7fc;--panel:#ffffff;--ink:#1e2b3a;--mut:#62758a;--line:#dbe6f1;--soft:#eaf2fa;--soft2:#f6f9fd;--acc:#4e8cc2;--acc2:#e3eef9;--ok:#4f9d75;--warn:#d99a42;--bad:#d96b72;--c1:#5b9bd5;--c2:#f2a65a;--c3:#7bbf8e;--c4:#b69bd6;--c5:#6cc3c3;--c6:#ecc96b;--shadow:0 1px 2px rgba(40,70,100,.06),0 8px 22px rgba(40,70,100,.07);--hero1:#d9eafa;--hero2:#efe6fa;--fb:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;--fh:"Manrope","Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1824;--panel:#152233;--ink:#e5eef8;--mut:#94a9bf;--line:#243a52;--soft:#1b2c40;--soft2:#182738;--acc:#79b2e6;--acc2:#1c3350;--ok:#6cc08f;--warn:#e6b05a;--bad:#ea8a90;--c1:#79b2e6;--c2:#f4b676;--c3:#8fd0a0;--c4:#c8afe6;--c5:#86d3d3;--c6:#f0d583;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);--hero1:#18314d;--hero2:#2a2440;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1824;--panel:#152233;--ink:#e5eef8;--mut:#94a9bf;--line:#243a52;--soft:#1b2c40;--soft2:#182738;--acc:#79b2e6;--acc2:#1c3350;--ok:#6cc08f;--warn:#e6b05a;--bad:#ea8a90;--c1:#79b2e6;--c2:#f4b676;--c3:#8fd0a0;--c4:#c8afe6;--c5:#86d3d3;--c6:#f0d583;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);--hero1:#18314d;--hero2:#2a2440;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb)}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.01em}
.ic{vertical-align:-3px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;font:600 15px var(--fh);color:var(--ink)}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff}
#tabs{display:flex;flex-direction:column;gap:3px}
#tabs button{display:flex;gap:10px;align-items:center;border:0;background:none;color:var(--mut);padding:10px 12px;border-radius:10px;font:500 14px var(--fb);cursor:pointer;text-align:left}
#tabs button:hover{background:var(--soft)}
#tabs button[aria-selected=true]{background:var(--acc2);color:var(--ink)}
#tabs button[aria-selected=true] .ic{color:var(--acc)}
.side-f{margin-top:auto;font-size:12px;color:var(--mut);padding:8px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#top h1{margin:0;font-size:17px;flex:1 1 260px;min-width:0}
#top h1 small{display:block;font:400 12px var(--fb);color:var(--mut)}
.search{position:relative;flex:1 1 280px;max-width:460px}
.search input[type=text]{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit}
.search .ic{position:absolute;left:11px;top:11px;color:var(--mut)}
#sres{position:absolute;left:0;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:30}
#sres a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
#sres a:hover{background:var(--soft)}#sres small{color:var(--mut);display:block}
#sres mark{background:var(--c6);color:#000;border-radius:3px;padding:0 1px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--mut);padding:7px 11px;font:500 13px var(--fb);cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button[aria-pressed=true]{background:var(--acc2);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:7px 12px;font:500 13px var(--fb);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--soft)}
#dmenu{position:absolute;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30;min-width:250px}
#dmenu button{display:flex;gap:9px;width:100%;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;font:500 14px var(--fb);cursor:pointer;text-align:left}
#dmenu button:hover{background:var(--soft)}
main{padding:18px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px));max-width:1240px}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;gap:8px;align-items:center}.card h3{margin:12px 0 6px;font-size:14px}
.hero{border-radius:20px;padding:22px;margin:0 0 16px;background:linear-gradient(120deg,var(--hero1),var(--hero2));border:1px solid var(--line)}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0 0 14px;color:var(--mut);max-width:70ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
#app>div,main,.card,.hero,.chart{min-width:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.kpi .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--acc2);color:var(--acc);flex:none}
.kpi b{display:block;font:600 20px var(--fh);line-height:1.1;white-space:nowrap}.kpi span{color:var(--mut);font-size:12px;display:block}
.hero .kpi{background:color-mix(in srgb,var(--panel) 80%,transparent)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--mut);padding:7px 13px;border-radius:999px;font:500 13px var(--fb);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.subpane{display:none}.subpane.on{display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;background:var(--soft2);position:sticky;top:0}
.tw{overflow-x:auto;border-radius:10px}
.chip{white-space:nowrap;display:inline-block;font:500 11px var(--fb);padding:1px 7px;margin:1px 2px;border-radius:999px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);color:var(--acc);background:var(--acc2);cursor:pointer}
.lv{font:500 11px var(--fb);padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.lv.t{background:var(--ok)}.lv.a{background:#7fb69a}.lv.s{background:var(--warn)}.lv.n{background:var(--bad)}.lv.u{background:var(--c4)}
.badge{font:500 12px var(--fb);padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--soft)}
.badge.confirmada{border-color:var(--ok);color:var(--ok)}.badge.probable{border-color:var(--acc);color:var(--acc)}.badge.posible{border-color:var(--warn);color:var(--warn)}.badge.descartada{border-color:var(--bad);color:var(--bad)}
.note{border-radius:12px;background:var(--soft);padding:9px 12px;margin:8px 0;font-size:13px;border:1px solid var(--line)}
.note.bad{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.note.ok{background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
label{font-size:13px;color:var(--mut);display:inline-block;margin:4px 12px 4px 0}
input[type=range]{vertical-align:middle;width:150px;accent-color:var(--acc)}
input[type=number],input[type=text],select,textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
input[type=number]{width:96px}
.lt .mas{color:var(--acc);cursor:pointer;font-weight:600}
svg text{fill:var(--mut);font:11px var(--fb)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 16px;box-shadow:var(--shadow)}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ch-h b{font:600 14px var(--fh)}
.ch-f{margin-top:6px;font-size:12px;color:var(--mut);background:var(--soft2);border-left:3px solid var(--c5);padding:6px 10px;border-radius:8px}
.rd{font-size:12px;color:var(--mut);min-height:16px}
.leg{font-size:12px;color:var(--mut)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;margin:0 0 10px}.tl .ev:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl .ev.ot:before{background:var(--c2)}.tl .ev.medicion:before{background:var(--c3)}.tl .ev.hito:before{background:var(--bad)}.tl .ev.accion:before{background:var(--ok)}.tl .ev.analisis:before{background:var(--c4)}
.tl small{color:var(--mut)}
#drawer{position:fixed;top:0;right:0;width:min(440px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:40}
#drawer.on{transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
#drawer blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid var(--acc);background:var(--soft);font-size:13px;border-radius:0 8px 8px 0}
.x{float:right;border:0;background:var(--soft);color:var(--ink);font-size:18px;cursor:pointer;border-radius:8px;width:30px;height:30px}
#modal{position:fixed;inset:0;background:rgba(15,30,50,.55);z-index:50;display:none;padding:3vh 3vw}
#modal.on{display:block}
#modal .box{background:var(--panel);border-radius:18px;height:100%;overflow:auto;padding:16px}
.mat td.y{background:var(--acc);color:#fff;text-align:center}.mat td.nn{text-align:center;color:var(--mut)}
pre.code{background:var(--soft);padding:8px;border-radius:8px;overflow:auto;font-size:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13px;z-index:60;display:none}
details>summary{cursor:pointer;font-weight:600}
.rank td:first-child{font:600 14px var(--fh);color:var(--acc);width:34px}
@media (max-width:900px){#app{grid-template-columns:minmax(0,1fr)}body{overflow-x:hidden}#side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{display:none}#tabs{flex-direction:row}#tabs button{white-space:nowrap}.side-f{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- v6: tipografía fina, separadores por tipo de fuente, Ishikawa, imprimir ---- */
body{font-weight:350;letter-spacing:.005em}
h1,h2,h3{font-weight:500}
.card h2,.hero h2{font-weight:500}.ch-h b{font-weight:500}.kpi b{font-weight:600}
.ic{stroke-width:1.6}
.card,.chart,.kpi{box-shadow:0 1px 2px rgba(30,60,100,.06)}
th{font-weight:500}
#scrim{position:fixed;inset:0;background:rgba(15,30,50,.30);z-index:39;display:none}#scrim.on{display:block}
a.ext{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 45%,transparent);word-break:break-all}
a.ext:hover{background:var(--acc2)}
.sep{display:flex;align-items:center;gap:10px;margin:24px 0 10px;color:var(--tc,var(--mut));font:500 12px var(--fh);text-transform:uppercase;letter-spacing:.09em}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--tc,var(--line)))}
.sep:after{background:linear-gradient(270deg,transparent,var(--tc,var(--line)))}
.sep .n{background:var(--soft);color:var(--ink);padding:1px 9px;border-radius:999px;font-weight:500}
.sepr td{background:var(--soft2);color:var(--tc,var(--mut));font:500 11px var(--fh);text-transform:uppercase;letter-spacing:.09em;border-top:2px solid var(--tc,var(--line))}
.apa{padding-left:2.4em;text-indent:-2.4em;margin:0 0 10px;list-style:none;font-size:13.5px}
.apa .meta{display:block;text-indent:0;margin-top:3px}
.lnkb{display:inline-flex;gap:5px;align-items:center;font:500 11.5px var(--fb);padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--acc);text-decoration:none;margin:1px 3px 1px 0;background:var(--panel)}
.lnkb:hover{background:var(--acc2)}
.sd{border:1px dashed color-mix(in srgb,var(--bad) 55%,var(--line));border-radius:12px;padding:12px 14px;color:var(--mut);background:color-mix(in srgb,var(--bad) 5%,var(--panel))}
.sd b{display:block;color:var(--bad);font:500 12px var(--fh);letter-spacing:.06em;margin-bottom:3px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.tools .seg button{padding:5px 10px}
.pl{cursor:pointer}.pl rect.bg{transition:opacity .15s}.pl:hover rect.bg{stroke-width:1.8}.pl.dim{opacity:.18}
.ish-t text{fill:var(--ink)}
.pq{position:relative;margin:0 0 6px;padding:10px 14px 10px 54px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.pq .num{position:absolute;left:12px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc2);color:var(--acc);font:600 14px var(--fh)}
.pq q,.pq .qq{display:block;font:500 13.5px var(--fh);margin-bottom:3px;quotes:none}
.pq-ar{text-align:left;margin:0 0 6px 26px;color:var(--mut);height:16px;line-height:16px}
.pq.fin{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--panel))}
.idx{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr))}
.idx button{display:flex;gap:9px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 11px;border-radius:12px;font:400 13px var(--fb);cursor:pointer}
.idx button:hover{background:var(--soft)}.idx button small{display:block;color:var(--mut)}
.idx button.vac{border-style:dashed;color:var(--mut)}
.idx .ok{color:var(--ok)}.idx .no{color:var(--bad)}
@media print{
 #side,#top,#drawer,#scrim,#modal,#toast,.sub,.btn,.amp,.tools{display:none!important}
 #app{display:block}body{background:#fff;color:#000;font-size:11pt}main{max-width:none;padding:0}
 .card,.chart{box-shadow:none;break-inside:avoid;border-color:#bbb}
 section.tab:not(.on){display:none}.subpane:not(.on){display:none}
 body.print-all section.tab,body.print-all .subpane{display:block!important}
 body.print-all section.tab:before{content:attr(data-label);display:block;font:600 20pt var(--fh);margin:18pt 0 6pt;border-bottom:2px solid #333;break-before:page}
 body.print-all .subpane:before{content:attr(data-label);display:block;font:600 14pt var(--fh);margin:12pt 0 4pt;color:#333}
 .tw{overflow:visible}
}
</style>
</head>

var D={"caso":{"meta":{"titulo":"Dossier del modo de falla: chumacera de polea de faja transportadora","activo":"Chumacera (rodamiento y soporte) de polea de faja transportadora","origen_datos":"literatura leída por el equipo; sin datos de planta","n_fallas":0},"resumen":{"kpis":[{"label":"entradas en el registro (incluye pistas)","valor":"169","evidencia":["E-6001"]},{"label":"secciones con evidencia leída (sin contar Referencias)","valor":"9 de 13","evidencia":["E-6001"]},{"label":"secciones VACÍO declarado","valor":"4","evidencia":["E-6001"]}],"hallazgos":[{"id":"H1","texto":"[Mediciones y curvas] Análisis de envolvente: se filtra en una resonancia, se demodula y se buscan las frecuencias BPFO, BPFI, BSF y FTF según la geometría del rodamiento. Límite: Fuentes de introducción y revisión; datos de banco, no de poleas de faja","evidencia":["E-8006","E-8008","E-8001"]},{"id":"H2","texto":"[Mediciones y curvas] La kurtosis es buen indicador de defectos incipientes pero vuelve a valores normales cuando el defecto se extiende (curva no monótona). Una revisión no halló sustento teórico ni empírico de los umbrales 3 y 5 en las fuentes que consultó. Límite: Revisiones narrativas; ausencia de hallazgo en sus fuentes, no prueba de inexistencia; no hay tiempos de aviso","evidencia":["E-8003","E-8001"]},{"id":"H3","texto":"[Mediciones y curvas] Un rodamiento sano muestra solo frecuencias ligadas al eje, como el desbalance o la desalineación; las anomalías operacionales aparecen mínimamente en la superficie de los elementos rodantes y, con frecuencia, se energizan muchos armónicos al pasar sobre ellas. Límite: Descripción cualitativa de un preprint de banco; sin amplitudes ni umbrales","evidencia":["E-9305","E-9307"]},{"id":"H4","texto":"[Mediciones y curvas] Degradación en cuatro etapas espectrales (ultrasónica, resonancia natural, frecuencias de defecto y armónicos, ruido de fondo aleatorio), descritas de forma cualitativa y sin duración. Límite: Preprint de banco","evidencia":["E-8008"]},{"id":"H5","texto":"[Fenómenos físicos] En condiciones convencionales (ISO 281:2007, edición no verificada) la causa de falla es la fatiga de contacto con descascarado subsuperficial; fuera de ellas intervienen carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión y fretting. Límite: Rodamientos de bolas en ciclos muy altos; no es un estudio de transportadores","evidencia":["E-6002"]},{"id":"H6","texto":"[Fenómenos físicos] El autor atribuye el 90 % de las fallas prematuras de rodamientos de bolas de bombas a corrosión causada por contaminación, mala manipulación antes y durante la instalación, falla del lubricante o sobrecalentamiento por ajustes inadecuados en alojamientos o ejes. Límite: Resumen de 1988; bombas, no transportadores; sin base de datos ni n","evidencia":["E-6004"]},{"id":"H7","texto":"[Fenómenos físicos] Un preprint señala que las fallas y defectos suelen inducirse por desgaste por contaminación, mala lubricación y montaje incorrecto, entre otros. Límite: Introducción que cita otras referencias no leídas; sin cifras","evidencia":["E-9301"]},{"id":"H8","texto":"[Top de fallas y modos de falla] Cita secundaria: más del 50 % de las fallas de banda transportadora se deben a rodillos (idlers) en mal funcionamiento; daño de rodillos por lubricación impropia, contaminación y desalineación. Límite: Introducción que cita a otros; rodillos, no chumaceras de poleas; sin base de datos, tamaño ni año; la fuente primaria (E-6009) no se leyó","evidencia":["E-6001"]},{"id":"H9","texto":"[Top de fallas y modos de falla] Cita secundaria: se estima que entre 40 y 50 % de las fallas de maquinaria se atribuyen a rodamientos. Límite: Cifra tomada de otra referencia no leída; maquinaria rotativa en general, no transportadores; sin base de datos, n ni año","evidencia":["E-9102"]},{"id":"H10","texto":"[FMECA y RCM] Causas mencionadas en la literatura leída para el daño de rodamientos (insumo candidato de causas del FMECA; nivel POSIBLE por analogía, sin datos de polea): carga excesiva, desalineación, ajustes, lubricación, desgaste, corrosión, fretting, contaminación y sobrecalentamiento. Límite: Respaldo: introducción de un artículo sobre fatiga de ciclos muy altos en bolas y un resumen divulgativo de bombas; efectos, severidad, ocurrencia y detección no se puntúan sin un experto del activo","evidencia":["E-6002","E-6004"]},{"id":"H11","texto":"[Confiabilidad (Weibull y vida)] La vida nominal básica es el valor de vida que se espera que el 90 % de una población de rodamientos alcance o supere, en condiciones de operación convencionales. Límite: Contexto de aerogeneradores; no entrega horas para poleas","evidencia":["E-6003"]},{"id":"H12","texto":"[Confiabilidad (Weibull y vida)] Las observaciones censuradas son frecuentes dada la rareza de las fallas en rodamientos de bolas, y pocos estudios abordan sus consecuencias. Límite: Introducción de un preprint de banco; apoyada en referencias no leídas","evidencia":["E-9101"]},{"id":"H13","texto":"[Confiabilidad (Weibull y vida)] Existen conjuntos abiertos de rodamientos de laboratorio: Paderborn (17 rodamientos; número de fallas y censura no verificados) y un subconjunto de 2 ensayos de UNSW; ninguno es de faja ni de campo. Límite: Con 2 fallas Weibull es inviable. Solo sirven como contraste metodológico","evidencia":["E-7001","E-7003"]},{"id":"H14","texto":"[Vida útil y obsolescencia] La vida nominal es una vida de fatiga bajo condiciones convencionales; la edición de la norma de vida nominal no está verificada. Límite: Contexto de aerogeneradores","evidencia":["E-6003"]},{"id":"H15","texto":"[Modelos de aprendizaje automático y profundo] En un preprint, al retener la condición de 1000 rpm en el conjunto JNU la exactitud colapsa a 40,64 %, por debajo de la clase mayoritaria; la regresión logística (57,91 %) generaliza mejor que los conjuntos de árboles. La exactitud depende de la partición; no hay datos de campo. Límite: Solo resumen de un preprint sin texto completo; el identificador arXiv debe verificarse; conjuntos de banco","evidencia":["E-8010"]},{"id":"H16","texto":"[Modelos de aprendizaje automático y profundo] Un banco público de rodamientos (CWRU) no fue diseñado para aprendizaje automático y hay que evitar resultados engañosos; en los dos bancos descritos en ese preprint (HUST y CWRU) las velocidades van de 600 a 2100 rpm. Límite: Descripción de datasets en un marco propuesto; el documento no lista velocidades menores, pero la velocidad de una polea lenta de faja no consta en la fuente: comparación VACÍO","evidencia":["E-9203","E-9204"]},{"id":"H17","texto":"[Modelos de aprendizaje automático y profundo] La adaptación de dominio pierde exactitud cuando las categorías de falla de origen y destino no coinciden. Límite: Descripción de la literatura hecha por los autores de un método; resultados autoinformados en bancos","evidencia":["E-9209"]},{"id":"H18","texto":"[Modelos de aprendizaje automático y profundo] Un preprint evita la fuga temporal con una partición cronológica: entrenamiento con ventanas hasta un instante y prueba posterior. Límite: Equipos de telecomunicaciones, no rodamientos; validación dentro de la misma flota","evidencia":["E-9210"]},{"id":"H19","texto":"[Modelos de aprendizaje automático y profundo] Existe un conjunto de datos reales de operación de aerogeneradores (89 años de datos, 44 ventanas etiquetadas de anomalías) con un puntaje que combina detección, comportamiento normal, falsas alarmas y anticipación. Límite: Datos SCADA, no vibración ni rodamientos de poleas","evidencia":["E-9201"]},{"id":"H20","texto":"[Modelos de aprendizaje automático y profundo] En un banco de ensayo para vida remanente, todos los rodamientos se llevan a falla bajo carga muy alta para acelerar la degradación, lo que aumenta el riesgo de calentamiento local y daño incontrolado. Implicación del equipo: esa vida no representa la de una chumacera lenta de faja. Límite: Preprint no arbitrado, leído parcialmente; las métricas de error no se citan porque no figuran en el extracto registrado","evidencia":["E-8009"]},{"id":"H21","texto":"[Modelos de aprendizaje automático y profundo] Los propios autores señalan que muchas técnicas se prueban en condiciones controladas, lo que limita su adaptabilidad. Límite: Solo resumen e inicio","evidencia":["E-8011"]},{"id":"H22","texto":"[Causa raíz (ACR)] Causas mencionadas (nivel POSIBLE, por analogía): lubricación inadecuada, contaminación y desalineación en rodillos, e instalación, ajustes y lubricación en bombas. Límite: Ninguna es específica de chumaceras de polea; sin datos del activo","evidencia":["E-6001","E-6004"]},{"id":"H23","texto":"[Diagnóstico y troubleshooting] El kurtograma se basa en la curtosis espectral para detectar transitorios no estacionarios y ubicarlos en bandas de frecuencia de la señal del rodamiento. Límite: Solo introducción","evidencia":["E-8005"]}]},"tablas":[{"titulo":"Conjuntos abiertos de rodamientos de laboratorio verificados (ninguno de faja ni de campo)","evidencia":["E-7001","E-7003"],"columnas":["Id","Fuente","Nivel de evidencia"],"filas":[["E-7001","Run-to-failure data set of ball bearings subjected to time-varying load and spee","VERIFICADO-TEXTO"],["E-7003","Bearing run-to-failure dataset of UNSW - test 1 & 3 - horizontal acceleration (s","VERIFICADO-TEXTO"]],"nota":"Con 2 fallas o con vida de banco acelerado, un Weibull no describe la chumacera de una polea."},{"titulo":"Pistas de conjuntos de datos por abrir (no son evidencia)","evidencia":[],"columnas":["Id","Fuente","Nivel de evidencia"],"filas":[["E-7002","XJTU-SY Bearing Datasets (espejo en Hugging Face)","VERIFICADO-TEXTO"],["E-7004","XJTU-SY rolling element bearing accelerated life test dataset","SOLO-SNIPPET"],["E-7005","PRONOSTIA: An experimental platform for bearings accelerated degradation tests (","SOLO-SNIPPET"],["E-7006","NASA IMS bearings run-to-failure dataset","SOLO-SNIPPET"]],"nota":"Identificación del espejo de 04"],"nivel":"SINTESIS"},{"hipotesis":"H6","sintoma":"Falla temprana tras un montaje reciente","medicion":"Fecha y registro de la última instalación frente al momento de la falla","referencia":null,"evidencia":["E-6004","E-9301"],"nivel":"SINTESIS"},{"hipotesis":"H6","sintoma":"Procedimiento, herramientas o verificación de montaje ausentes","medicion":"Revisar el procedimiento vigente y las herramientas de calado","referencia":null,"evidencia":["E-6004"],"nivel":"SINTESIS"},{"hipotesis":"H7","sintoma":"Descascarado subsuperficial en la pista","medicion":"Inspección y morfología del daño tras desmontar","referencia":null,"evidencia":["E-6002"],"nivel":"EVIDENCIA"},{"hipotesis":"H7","sintoma":"Horas de servicio cercanas o superiores a la vida nominal calculada con la carga real","medicion":"Comparar horas acumuladas con la vida nominal; la nominal básica es la que alcanza o supera el 90 % de la población","referencia":"Vida nominal básica: valor que el 90 % de una población de rodamientos idénticos alcanza o supera (E-6003).","evidencia":["E-6003"],"nivel":"EVIDENCIA"},{"hipotesis":"H7","sintoma":"Frecuencias de defecto (BPFO, BPFI, BSF, FTF) y armónicos en el espectro de envolvente","medicion":"Análisis de envolvente sobre la banda elegida (kurtograma como apoyo)","referencia":null,"evidencia":["E-8008","E-8006","E-8005"],"nivel":"EVIDENCIA"},{"hipotesis":"H8","sintoma":"RMS o velocidad global estables mientras avanza el defecto","medicion":"Graficar RMS, velocidad, kurtosis y envolvente del historial","referencia":null,"evidencia":["E-8001","E-8003"],"nivel":"EVIDENCIA"},{"hipotesis":"H8","sintoma":"Kurtosis que baja al extenderse el defecto, leída como mejora","medicion":"Revisar la tendencia de kurtosis junto con envolvente","referencia":"Criterio citado en una revisión: kurtosis menor que 3 buen estado, mayor que 3 operación con restricciones, mayor que 5 inaceptable; los autores no hallaron sustento teórico ni empírico de estos límites y NO deben usarse como umbral (E-8001).","evidencia":["E-8001","E-8003"],"nivel":"EVIDENCIA"},{"hipotesis":"H8","sintoma":"Defecto incipiente sin captar por banda de adquisición baja","medicion":"Revisar rango de frecuencias del sensor y si se aplicó envolvente en banda alta","referencia":"Los defectos incipientes excitan frecuencias propias típicamente en el rango de 10 kHz o más (E-9307). Fuente de banco, no de polea lenta.","evidencia":["E-9307","E-8006"],"nivel":"SINTESIS"},{"hipotesis":"H8","sintoma":"Umbrales de alarma sin calibrar con fallas del activo","medicion":"Rastrear el origen de cada umbral y su validación","referencia":null,"evidencia":["E-9306","E-8001"],"nivel":"EVIDENCIA"},{"hipotesis":"H9","sintoma":"Fretting en el asiento","medicion":"Examen visual y con aumento de asiento y anillo","referencia":null,"evidencia":["E-6002"],"nivel":"EVIDENCIA"},{"hipotesis":"H9","sintoma":"Corrosión superficial en pistas y elementos","medicion":"Inspección de pistas; cruzar con análisis de lubricante (contaminación, H2)","referencia":null,"evidencia":["E-6002","E-6004"],"nivel":"EVIDENCIA"},{"hipotesis":"H9","sintoma":"Desgaste en elementos o asiento","medicion":"Inspección dimensional y visual de pistas, elementos y asiento","referencia":null,"evidencia":["E-6002"],"nivel":"EVIDENCIA"}],"vacios":["Valores de referencia (umbrales de temperatura, vibración, contaminación) : SIN DATOS PARA ARMARLO; se fijan con el fabricante o con datos del activo."]},"fmeca":{"funcion":"Función: soportar el eje de la polea de la faja transportadora y permitir su giro con baja fricción, transmitiendo la carga radial al bastidor, durante el tiempo de servicio requerido (estándar de desempeño cuantificado: VACÍO, sin datos del activo). Falla funcional total: la chumacera se agarrota o se destruye y la polea no gira o deja de estar soportada. Falla funcional parcial: la chumacera sigue soportando la polea pero con ruido, vibración, juego o temperatura fuera de lo aceptable (límites: VACÍO).","items":[{"id":"FM1","modo":"Fatiga de contacto por rodadura (descascarado subsuperficial)","mecanismo":"Fatiga de contacto en pistas y elementos rodantes; es la causa de falla en condiciones convencionales de operación (E-6002). Progresa por etapas espectrales cualitativas (E-8008).","efecto_local":"Rodamiento con descascarado, aumento de vibración y ruido, juego creciente en la chumacera.","efecto_sistema":"Si el rodamiento se agarrota o la polea se detiene o gira con fricción, hay pérdida parcial o total de la función de transporte; el efecto real depende del activo (VACÍO).","causa":"Fin de vida por fatiga bajo carga y velocidad de operación; vida nominal L10 como referencia estadística, sin horas para poleas en fuente leída (E-6003).","estado_causa":"posible","deteccion":"Análisis de envolvente (filtrar en la resonancia, demodular, buscar BPFO, BPFI, BSF, FTF) y kurtosis para defecto incipiente (E-8001, E-8003, E-8006, E-8008); la kurtosis vuelve a valores normales cuando el defecto se extiende y los umbrales 3 y 5 no tienen sustento hallado en la revisión (E-8001, E-8003). La vibración sola es menos confiable que combinada con aceite o grasa, termografía y otros indicadores (E-8003).","control_sugerido":"Monitoreo por condición del rodamiento con técnica de envolvente y tendencia, tras definir línea base propia; no usar umbrales de kurtosis como norma.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6003","E-8001","E-8003","E-8006","E-8008"],"nota":"SINTESIS: las fuentes describen el mecanismo y las técnicas en rodamientos de banco y revisiones; ninguna trata chumaceras de polea de faja. Se asume por analogía que aplican. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"En condición (on-condition) (consecuencia: A confirmar; si la falla es evidente y afecta la operación, operacional). Hay una técnica que la literatura asocia a detección temprana (envolvente) y etapas de degradación descritas, por lo que una tarea en condición podría ser técnicamente factible. No se propone reemplazo por edad: no hay Weibull ni β > 1 demostrado para esta chumacera (E-6003 solo define L10 de población). La factibilidad real depende de accesibilidad y del tiempo de aviso, no disponible. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM2","modo":"Desgaste del rodamiento o del asiento","mecanismo":"Pérdida progresiva de material por contacto en condiciones no convencionales; el desgaste figura entre las causas de daño clasificadas (E-6002).","efecto_local":"Aumento de juego radial, ruido y vibración, posible holgura del conjunto en el soporte.","efecto_sistema":"Desalineación de la polea y posible desvío de banda; efecto no documentado en la evidencia (VACÍO).","causa":"Contaminación, lubricación deficiente o carga excesiva como causas candidatas (E-6001, E-6002); sin datos del activo.","estado_causa":"posible","deteccion":"La evidencia no asocia una técnica específica al desgaste; por síntesis, tendencia de vibración y análisis de aceite o grasa combinados (E-8003).","control_sugerido":"Inspección en condición del estado de lubricante y juego; verificar causas raíz antes de restaurar.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6001","E-8003"],"nota":"SINTESIS: se une la clasificación de causas de daño con la recomendación de combinar vibración con aceite y termografía; no hay mecanismo de desgaste específico de chumacera de polea. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"En condición, con restauración solo si hay edad identificable (consecuencia: A confirmar). El desgaste es el candidato clásico a restauración o reemplazo programado, pero eso exige edad de desgaste identificable (β > 1) que aquí no está demostrada. Mientras tanto se propone en condición. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM3","modo":"Corrosión por contaminación","mecanismo":"Corrosión del rodamiento causada por contaminación, una de las cuatro causas que el autor de un resumen sobre bombas lista (E-6004); la contaminación también aparece como causa de daño de rodillos de transportador (E-6001).","efecto_local":"Picaduras o superficies deterioradas, aumento de fricción y ruido; fallas prematuras.","efecto_sistema":"Falla prematura con pérdida de función de la polea; efecto en el sistema no documentado (VACÍO).","causa":"Ingreso de contaminantes por sello deficiente o ambiente del sitio (premisa por analogía; sin datos de polea).","estado_causa":"posible","deteccion":"Análisis de aceite o grasa y termografía como complemento de la vibración (E-8003); no hay técnica específica para corrosión en la evidencia.","control_sugerido":"Revisión del sello y del estado de la grasa; protección del soporte frente a contaminantes. Control a definir por el experto.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6004","E-6001","E-8003"],"nota":"SINTESIS: la fuente de corrosión es de bombas (resumen de 1988) y la de contaminación es de rodillos; se transfiere por analogía a chumaceras de polea. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo. Que el rediseño sea más eficaz que la detección es criterio del equipo, sin fuente.","tarea_rcm":"Rediseño (sellado/protección) y en condición (consecuencia: A confirmar). Si la contaminación es la causa dominante, atacar la causa (sello, protección) suele ser más eficaz que detectar el daño; por eso se propone evaluar rediseño del sellado, junto a inspección en condición del lubricante. No hay datos de planta que digan si domina. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM4","modo":"Falla de lubricación (lubricante inadecuado, insuficiente o degradado)","mecanismo":"Falla del lubricante: se cita como causa de daño de rodamientos (E-6002), de falla prematura en bombas (E-6004) y, como lubricación impropia, de daño en rodillos de transportador (E-6001).","efecto_local":"Contacto metal con metal, aumento de fricción, temperatura y vibración, y daño en pistas y elementos rodantes.","efecto_sistema":"Progresión a agarrotamiento posible; efecto en el sistema no documentado (VACÍO).","causa":"Lubricación impropia, ausente o contaminada; método de relubricación del activo desconocido.","estado_causa":"posible","deteccion":"Análisis de aceite o grasa y termografía, combinados con vibración (E-8003). Etapas ultrasónicas tempranas solo detectables con sensores especializados (E-8008).","control_sugerido":"Revisar la práctica de lubricación (tipo, cantidad, método) y contrastar cada PM de engrase con el historial: si hay fallas tras la intervención, investigar sobrelubricación o contaminación al engrasar (hipótesis, sin dato).","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6001","E-6002","E-6004","E-8003","E-8008"],"nota":"SINTESIS: la lubricación es la causa más repetida en tres fuentes de contextos distintos (rodillos, bolas en fatiga y bombas); se asume que aplica a la chumacera. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo. Que el rediseño sea más eficaz que la detección es criterio del equipo, sin fuente.","tarea_rcm":"En condición y, si hay mecanismo identificable, tarea programada de lubricación (consecuencia: A confirmar). La relubricación es una tarea de prevención basada en un mecanismo identificable; su contenido (cantidad, método) y su periodicidad requieren fuente y datos del activo, que no existen en la evidencia. Se complementa con inspección del estado del lubricante. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM5","modo":"Sobrecalentamiento por ajuste inadecuado en alojamiento o eje","mecanismo":"Ajustes inadecuados (incluidos ajustes apretados) que causan sobrecalentamiento del rodamiento (E-6004, E-6002).","efecto_local":"Aumento de temperatura, pérdida de huelgo interno, degradación del lubricante y posible agarrotamiento.","efecto_sistema":"Posible parada de la polea; si el calentamiento es suficiente, riesgo de ignición descrito para rodillos en la literatura citada (E-6001: fallas de rodillos como causa principal de ignición); aplicabilidad a poleas no establecida.","causa":"Montaje con ajuste incorrecto de eje o alojamiento; mala práctica de instalación (E-6004).","estado_causa":"posible","deteccion":"Termografía combinada con vibración (E-8003); la evidencia no da umbrales de temperatura.","control_sugerido":"Verificación de ajustes y montaje en la instalación; registro de temperatura base tras el montaje.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6004","E-6002","E-6001","E-8003"],"nota":"SINTESIS: se combina la causa de ajustes (bombas y bolas) con la mención de ignición por rodillos; la consecuencia de seguridad es una hipótesis que el experto debe evaluar. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"Rediseño o corrección del procedimiento de montaje; en condición por temperatura (consecuencia: A confirmar (posible seguridad o ambiente si hay riesgo de ignición)). La causa está en la instalación; una tarea de montaje controlado actúa sobre la causa. Si el experto confirma consecuencia de seguridad, correr a la falla no sería aceptable y debe prevalecer la detección o el rediseño. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM6","modo":"Desalineación o carga excesiva","mecanismo":"Desalineación y carga excesiva figuran entre las causas de daño de rodamientos (E-6002); la desalineación es causa de daño de rodillos de transportador (E-6001).","efecto_local":"Carga desigual en pistas, aumento de temperatura y vibración, acortamiento de la vida por fatiga.","efecto_sistema":"Desvío de banda y desgaste asociado: no documentado en la evidencia (VACÍO).","causa":"Desalineación de polea o soportes, deformación o flexión del eje, sobrecarga; mecanismos propios de poleas: VACÍO en el dossier.","estado_causa":"posible","deteccion":"Vibración con análisis espectral (E-8001, E-8008) y termografía (E-8003); no hay firma específica de desalineación en la evidencia leída.","control_sugerido":"Verificación de alineación en el montaje y tras intervenciones; revisión de cargas de diseño frente a las reales.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6001","E-6002","E-8003"],"nota":"SINTESIS: causa tomada de rodamientos en general y rodillos; la evidencia no examina el eje ni el bastidor de poleas. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"Rediseño o corrección de alineación; en condición (consecuencia: A confirmar). Si la desalineación es causa, corregirla es lo que reduce la ocurrencia; la inspección en condición solo detecta sus efectos. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM7","modo":"Fretting (micro-movimiento en asientos)","mecanismo":"Fricción por micro-movimiento entre superficies en contacto, citada como causa de daño de rodamientos (E-6002).","efecto_local":"Desgaste y óxido en asientos de aro y eje o alojamiento, pérdida de ajuste.","efecto_sistema":"Aflojamiento del conjunto: no documentado (VACÍO).","causa":"Ajuste insuficiente o carga con movimiento relativo (síntesis; sin datos).","estado_causa":"posible","deteccion":"La evidencia no menciona técnica específica de detección para fretting. VACÍO.","control_sugerido":"Inspección visual de asientos al desmontar y registro fotográfico; el control debe definirlo el experto.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6002"],"nota":"SINTESIS: solo hay una mención de lista; no se desarrolla el mecanismo en poleas. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"Búsqueda de falla no aplica; inspección al desmontar (consecuencia: A confirmar). Sin técnica de detección en línea en la evidencia, solo se propone aprovechar el desmontaje para inspeccionar los asientos. Es un modo con respaldo mínimo y puede descartarse si el experto lo considera improbable. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM8","modo":"Daño por manipulación o instalación deficiente","mecanismo":"Mal manejo antes y durante la instalación como contribuyente a fallas prematuras (E-6004).","efecto_local":"Defectos de origen (marcas, contaminación en el montaje) que acortan la vida del rodamiento.","efecto_sistema":"Falla prematura tras cada reemplazo: mortalidad infantil posible, sin dato del historial (VACÍO).","causa":"Procedimiento de montaje y almacenaje deficiente (por analogía con bombas).","estado_causa":"posible","deteccion":"La evidencia no da técnica; revisar el historial de órdenes tras reemplazos (requiere datos del activo).","control_sugerido":"Procedimiento de instalación y almacenamiento; cuestionar las PM de reemplazo si el historial muestra fallas tempranas posteriores.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6004"],"nota":"SINTESIS: transferido de un resumen de bombas de 1988; sin datos del activo. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"Rediseño de procedimiento (consecuencia: A confirmar). La causa es de método de trabajo; mejora el procedimiento y verifica con el historial si existe mortalidad infantil. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."}],"vacios":["Intervalo P-F: ninguna fuente leída lo entrega para chumaceras de polea; la evidencia da etapas cualitativas sin duración (E-8008) y no cuantifica tiempos de aviso (E-8003). Por eso las tareas en condición no llevan intervalo numérico, y cualquier intervalo debe rotularse conceptual hasta tener datos.","Severidad, ocurrencia y detección: sin puntaje; requieren un experto del activo, escalas calibradas y el historial de órdenes de trabajo. Estándar exigido (FMEA clásico, Action Priority o proceso RCM) sin definir; no se lee ninguna norma (todas figuran como NO-VERIFICADO o solo resumen).","Estándar de desempeño de la función (capacidad, velocidad, vida requerida): no hay datos del activo; no se cuantifica.","Consecuencia real de cada modo (oculta, seguridad o ambiente, operacional, no operacional): no se conoce el sistema; las consecuencias de las tareas son propuestas a confirmar. El riesgo de ignición se menciona solo para rodillos (E-6001).","Edad de desgaste y β > 1: no hay Weibull ni datos de campo; por eso no se propone restauración ni reemplazo programado firme. Los conjuntos abiertos son de laboratorio y con pocas fallas (E-7001, E-7003).","Mecanismos propios de la chumacera de polea (flexión del eje, sellos en polvo, calentamiento del soporte), fallas del soporte o carcasa y modos de eje o soldadura: VACÍO (E-6005 es solo pista de buscador sin abrir).","Ranking de modos con base de datos, n y año: VACÍO; E-6001 trata rodillos, no chumaceras de poleas, y es cita secundaria.","Búsqueda de falla para funciones ocultas: no se sabe si la chumacera tiene dispositivos de protección ocultos; no se propone.","PM calendarias actuales: no se aportó plan ni historial; no se pudo contrastar ninguna PM con fallas (lista de PM cuestionadas: VACÍO).","Costos de falla, de tarea e indisponibilidad: VACÍO; la costo-efectividad de cada tarea queda sin evaluar.","Fiabilidad de las técnicas de detección en chumaceras de poleas lentas de faja: los estudios leídos son de banco o revisiones (E-8001, E-8003, E-8011); la exactitud de laboratorio puede no transferirse (E-8010).","Este FMECA es de escritorio basado solo en literatura de rodamientos en general: no es evidencia de campo."]},"arbol":{"evento_tope":"Falla funcional de la chumacera de la polea de la faja transportadora: pérdida de la función de soporte y de giro de la polea.","nodos":[{"id":"N0","texto":"Falla funcional de la chumacera (rodamiento y soporte) de la polea: pérdida de soporte y giro.","puerta":"AND","hijos":["N1","N12"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-8003","E-8001"],"nota":"Razonamiento del equipo: la falla funcional ocurre cuando se inicia un daño en el rodamiento Y el daño progresa sin detección oportuna (la literatura leída describe que ciertos indicadores solo detectan en etapas tardías). La puerta AND es una lectura del equipo, no un hecho de la literatura. Debe ser validado por un experto del activo. La detección falla solo respecto de la consecuencia; si no hay programa de monitoreo, esta rama no existe."},{"id":"N1","texto":"Se inicia un daño en el rodamiento o su montaje (por fatiga normal o por una causa fuera de condiciones convencionales, incluidas las latentes de gestión).","puerta":"OR","hijos":["N2","N3","N16"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6004"],"nota":"Agrupación del equipo de las causas que las fuentes dan para el daño de rodamientos. Las fuentes no son de poleas. Debe ser validado por un experto del activo."},{"id":"N2","texto":"Fatiga de contacto por rodadura (descascarado subsuperficial) en condiciones convencionales de operación, es decir, fin de vida esperado.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6002","E-6003"],"nota":"E-6002 la identifica como la causa de falla en condiciones convencionales. E-6003 define la vida nominal como la que alcanza o supera el 90 % de la población. La edición de la norma no está verificada."},{"id":"N3","texto":"Causas fuera de condiciones convencionales (marco del equipo): las que listan las fuentes leídas (carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión, fretting) más contaminación e instalación citadas en otras fuentes.","puerta":"OR","hijos":["N4","N5","N6","N7","N8","N9","N10"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6001","E-6004"],"nota":"E-6002 clasifica los daños por carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión y fretting. Rodamientos de bolas, no poleas."},{"id":"N4","texto":"Lubricación inadecuada o falla del lubricante.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6001","E-6002","E-6004"],"nota":"Citada como causa de daño en rodillos (E-6001), rodamientos (E-6002) y bombas (E-6004). Sin dato de polea."},{"id":"N5","texto":"Contaminación que ingresa a la chumacera (corrosión por contaminación).","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6001","E-6004"],"nota":"E-6001 la cita como causa de daño en rodillos y E-6004 como origen de corrosión en bombas. Falta fuente específica de chumaceras de polea."},{"id":"N6","texto":"Desalineación del rodamiento o del eje respecto del soporte.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6001","E-6002"],"nota":"Citada como causa en rodillos (E-6001) y en rodamientos (E-6002)."},{"id":"N7","texto":"Carga excesiva sobre el rodamiento.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6002"],"nota":"E-6002 la lista como causa de daño en rodamientos. La relación con las tensiones de banda de una polea no está respaldada en fuente leída."},{"id":"N8","texto":"Ajustes inadecuados (apretados) en el eje o el alojamiento, con sobrecalentamiento.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6002","E-6004"],"nota":"E-6002 cita los ajustes apretados y E-6004 el sobrecalentamiento por ajustes inadecuados en alojamientos o ejes."},{"id":"N9","texto":"Mala manipulación o instalación del rodamiento antes y durante el montaje.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6004"],"nota":"E-6004 la cita como causa de falla prematura en rodamientos de bombas. Aplica por analogía."},{"id":"N10","texto":"Mecanismos secundarios de daño: desgaste, corrosión y fricción por micro-movimiento (fretting).","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6002"],"nota":"Listados por E-6002 como causas de daño de rodamientos."},{"id":"N16","texto":"Causas latentes de gestión que permiten el inicio del daño.","puerta":"OR","hijos":["N17","N18"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6003","E-6004"],"nota":"Razonamiento del equipo: las causas físicas requieren una deficiencia del sistema que las permita. Debe ser validado por un experto del activo. Actúa como habilitador de las causas físicas, no como alternativa independiente."},{"id":"N17","texto":"Prácticas de lubricación, sellado, manipulación e instalación sin control suficiente, que permiten las causas de lubricación, contaminación y montaje.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6004","E-6001"],"nota":"Premisas: E-6004 atribuye las fallas prematuras a contaminación, mal manejo, falla de lubricante y ajustes inadecuados. E-6001 cita lubricación impropia y contaminación. La deficiencia de procedimiento o control es inferencia del equipo; no hay dato del activo. Debe ser validado por un experto del activo."},{"id":"N18","texto":"Selección o diseño basado en la vida nominal, que cubre solo la fatiga de contacto y no las demás causas.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6003","E-6002"],"nota":"Premisas: E-6003 indica que la vida nominal supone condiciones convencionales. E-6002 enumera causas fuera de ellas. La inferencia es del equipo. Debe ser validado por un experto del activo."},{"id":"N12","texto":"El daño progresa sin detección oportuna ni intervención.","puerta":"OR","hijos":["N13","N14","N15"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-8001","E-8003"],"nota":"Razonamiento del equipo a partir de las limitaciones de los indicadores de vibración descritas en las revisiones. Debe ser validado por un experto del activo."},{"id":"N13","texto":"Indicador de monitoreo poco sensible o en etapa tardía: RMS poco sensible a defecto incipiente, kurtosis que vuelve a lo normal al extenderse el daño, espectro de velocidad que detecta solo en etapas tardías.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-8001","E-8003"],"nota":"Afirmado por revisiones narrativas. No tratan fajas transportadoras ni dan tiempos de aviso."},{"id":"N14","texto":"Umbrales de kurtosis 3 y 5 sin sustento hallado, o modelos de diagnóstico que no generalizan del banco al campo.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-8001","E-8010","E-8011"],"nota":"E-8001: los autores de la revisión no hallaron sustento para los umbrales de kurtosis 3 y 5. E-8010: la exactitud depende de la partición. E-8011: muchas técnicas se prueban en condiciones controladas. Son bancos, no fajas. E-8010 es un preprint 2026 de identificador no contrastado."},{"id":"N15","texto":"Gestión del monitoreo sin combinar técnicas ni dar seguimiento a señales tempranas (por ejemplo, vibración sola, sin aceite ni termografía).","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-8003","E-8008"],"nota":"Premisas: E-8003 indica que la confianza mejora combinando vibración con otros indicadores. E-8008 describe etapas de degradación con señales previas a la falla. La inferencia sobre la gestión del activo es del equipo. Debe ser validado por un experto del activo."}],"vacios":["No existe caso real ni datos de planta: todas las probabilidades son null y ninguna rama puede darse por confirmada.","Las compuertas de N0 (AND), N16 y N3 son estructura propuesta por el equipo. Ninguna fuente leída da una estructura de árbol de fallas para chumaceras de polea.","Causas específicas de poleas de faja (flexión del eje, sellos en polvo, calentamiento del soporte, falla de la carcasa): sin fuente leída; solo hay pistas sin abrir.","Relación entre tensiones de banda y carga del rodamiento: las normas de cálculo son solo resumen de buscador.","Contaminación y sellado en chumaceras de transportadores: un congreso brasileño solo como pista; no se usan sus cifras.","Los nodos latentes N15 a N18 son SINTESIS pendientes de validación con un experto.","Las fuentes de causas (rodillos, bolas en fatiga de ciclos muy altos, bombas) son de comparabilidad baja o media con una chumacera de polea."]},"acr":{"hipotesis":[{"id":"H1","texto":"Lubricación inadecuada o falla del lubricante en el rodamiento de la chumacera.","estado":"posible","prueba_para_confirmar":"Evidencia del activo: historial y registros de lubricación (tipo, cantidad, frecuencia), estado del lubricante retirado y de las superficies de rodadura tras desmontar, y vibración, aceite y termografía antes de la parada. Se descarta si el lubricante y las superficies no muestran signos de falla de lubricación.","evidencia":["E-6001","E-6002","E-6004"],"nivel":"SINTESIS","nota":"Las fuentes la nombran como causa en rodillos, rodamientos en general y bombas; ninguna es chumacera de polea. Se transfiere por analogía de mecanismo. Debe ser validado por un experto del activo."},{"id":"H2","texto":"Contaminación (partículas, humedad) que ingresa a la chumacera y produce corrosión o daño de las pistas.","estado":"posible","prueba_para_confirmar":"Inspección del lubricante y las pistas retirados, estado de sellos y condiciones de polvo y humedad en el sitio. Se descarta si lubricante y sellos están íntegros y no hay rastros de corrosión.","evidencia":["E-6001","E-6004"],"nivel":"SINTESIS","nota":"E-6001 la cita en rodillos y E-6004 como origen de corrosión en bombas. Transferida por analogía. Debe ser validado por un experto del activo."},{"id":"H3","texto":"Desalineación del rodamiento o del eje de la polea respecto del soporte.","estado":"posible","prueba_para_confirmar":"Medición de alineación y asentamiento del soporte en el activo, y patrón de desgaste de las pistas tras desmontar. Se descarta si la alineación está dentro de lo que fije el fabricante y el desgaste es simétrico.","evidencia":["E-6001","E-6002"],"nivel":"SINTESIS","nota":"Causa de daño en rodillos y en rodamientos. Falta fuente específica de poleas. Debe ser validado por un experto del activo."},{"id":"H4","texto":"Carga excesiva sobre el rodamiento respecto de la prevista en el diseño (por ejemplo, tensiones de banda mayores que las supuestas).","estado":"posible","prueba_para_confirmar":"Comparar la carga real sobre la polea con la carga de diseño del rodamiento, con datos del activo. Se descarta si la carga real es menor que la de diseño.","evidencia":["E-6002","E-6003"],"nivel":"SINTESIS","nota":"E-6002 enumera la carga excesiva como causa de daño; E-6003 indica que la vida nominal supone condiciones convencionales. La conexión con tensiones de banda es razonamiento del equipo. Debe ser validado por un experto del activo."},{"id":"H5","texto":"Ajuste inadecuado (apretado) del rodamiento en el eje o en el alojamiento, con sobrecalentamiento.","estado":"posible","prueba_para_confirmar":"Medir ajustes y tolerancias del eje y el alojamiento y buscar signos de sobrecalentamiento en el rodamiento retirado. Se descarta si los ajustes cumplen la especificación y no hay signos térmicos.","evidencia":["E-6002","E-6004"],"nivel":"SINTESIS","nota":"E-6002 cita los ajustes apretados y E-6004 el sobrecalentamiento por ajustes inadecuados. Fuentes de rodamientos y bombas, no de poleas. Respaldo de rodamientos generales y bombas; transferido por analogía a poleas (criterio del equipo)."},{"id":"H6","texto":"Mala manipulación o instalación del rodamiento antes y durante el montaje.","estado":"posible","prueba_para_confirmar":"Registros y procedimiento de montaje y marcas de manipulación en las pistas del rodamiento retirado. Se descarta si el procedimiento se cumplió y no hay marcas.","evidencia":["E-6004"],"nivel":"SINTESIS","nota":"E-6004 la cita como causa de falla prematura en bombas. Aplica por analogía. La pregunta de fondo es por qué el sistema lo permitió (procedimiento, capacitación, herramienta), no quién lo hizo. Respaldo de rodamientos generales y bombas; transferido por analogía a poleas (criterio del equipo)."},{"id":"H7","texto":"Fatiga de contacto por rodadura (descascarado subsuperficial) en condiciones convencionales: fin de vida esperado y no falla prematura.","estado":"posible","prueba_para_confirmar":"Edad o ciclos del rodamiento frente a su vida nominal y morfología del daño tras desmontar. Se descarta si falló muy por debajo de su vida nominal con signos de otras causas.","evidencia":["E-6002","E-6003"],"nivel":"EVIDENCIA","nota":"Según E-6002, en condiciones convencionales la causa de falla es la fatiga de contacto. Según E-6003, la vida nominal es la que alcanza o supera el 90 % de la población. La edición de la norma no está verificada."},{"id":"H8","texto":"Detección tardía: el defecto avanza sin ser detectado por el indicador o el umbral de monitoreo en uso.","estado":"posible","prueba_para_confirmar":"Historial de mediciones previas: qué indicadores, con qué periodicidad y umbrales, y si había señales previas no atendidas. Se descarta si el defecto apareció entre dos mediciones sin señal previa detectable.","evidencia":["E-8001","E-8003","E-8008","E-8010"],"nivel":"SINTESIS","nota":"Premisas: el RMS es poco sensible a defectos incipientes (E-8001); la kurtosis vuelve a valores normales al extenderse el defecto (E-8003); el espectro de velocidad detecta solo etapas tardías (E-8001); los umbrales 3 y 5 no tienen sustento hallado (E-8001); la exactitud de los modelos depende de la partición (E-8010). Contribuye a la consecuencia, no al inicio del daño. Debe ser validado por un experto del activo. E-8010 es un preprint 2026 de identificador no contrastado."},{"id":"H9","texto":"Mecanismos secundarios de daño: corrosión, fricción por micro-movimiento (fretting) y desgaste del rodamiento o su asiento.","estado":"posible","prueba_para_confirmar":"Examen de las superficies del rodamiento y de los asientos tras desmontar. Se descarta si no presentan estos signos.","evidencia":["E-6002","E-6004"],"nivel":"SINTESIS","nota":"E-6002 los lista como causas de daño. E-6004 vincula la corrosión con la contaminación (ver H2). Respaldo de rodamientos generales y bombas; transferido por analogía a poleas (criterio del equipo)."}],"ishikawa":{"Máquina":[{"texto":"Carga radial real sobre la chumacera mayor que la de diseño (tensiones de banda mayores que las supuestas, arranques con carga). CONDICION A VERIFICAR.","mecanismo":"Una carga mayor eleva el esfuerzo de contacto y acorta la vida a fatiga; la vida nominal decrece con la relación carga dinámica / carga aplicada elevada a un exponente (E-6002).","verificar":"Recalcular la reacción en la chumacera con las tensiones reales de banda y compararla con la capacidad dinámica del rodamiento; registrar corriente del motor en arranque con carga y en régimen; revisar la huella de carga en la pista del rodamiento retirado.","evidencia":["E-6002","E-6003"],"nivel":"SINTESIS","nota":"E-6002 lista la carga excesiva como causa de daño; E-6003 dice que la vida nominal supone condiciones convencionales. La conexión con tensión de banda y arranques es razonamiento del equipo, sin fuente leída. Validar con un experto del activo."},{"texto":"Desalineación del eje de la polea respecto del soporte o entre soportes.","mecanismo":"El rodamiento queda con carga localizada y desgaste asimétrico de pista; en vibración aparece como componente de la frecuencia del eje y no como defecto de pista (E-9305).","verificar":"Medir alineación de soportes y escuadra del eje con el método que fije el fabricante; revisar la huella de contacto asimétrica en las pistas; comparar el espectro de baja frecuencia con el de envolvente.","evidencia":["E-6001","E-6002","E-9305"],"nivel":"EVIDENCIA","nota":"La desalineación está nombrada como causa de daño en rodillos (E-6001) y rodamientos (E-6002). No hay fuente leída de poleas de faja."},{"texto":"Ajuste apretado o inadecuado entre rodamiento, eje y alojamiento.","mecanismo":"Un ajuste inadecuado causa sobrecalentamiento y daño del rodamiento (E-6004); los ajustes apretados figuran como causa de daño (E-6002).","verificar":"Medir diámetros de eje y alojamiento y compararlos con la tolerancia del fabricante; buscar coloración térmica en las pistas y marcas de giro del anillo en el asiento; termografía previa a la parada.","evidencia":["E-6002","E-6004"],"nivel":"EVIDENCIA","nota":"Fuentes de rodamientos y bombas, no de poleas."},{"texto":"Barrera de sellado de la chumacera insuficiente para el medio (sellos, laberintos, tapas, puertos de engrase). CONDICION A VERIFICAR: polvo y humedad del sitio.","mecanismo":"Ingreso de partículas y humedad al interior; la contaminación puede causar corrosión y daño de pistas (E-6004) y es causa de daño en rodillos (E-6001).","verificar":"Inspeccionar estado de sellos y retenes, holgura del laberinto y limpieza de puertos de engrase; examinar el lubricante retirado en busca de partículas o agua.","evidencia":["E-6001","E-6004","E-9304"],"nivel":"SINTESIS","nota":"Premisas: contaminación como causa (E-6001, E-6004) y rodamientos en ambientes agresivos (E-9304). Que el sellado de esta chumacera sea la barrera débil es hipótesis del equipo. Validar con un experto del activo."},{"texto":"Geometría de lubricación del soporte (cámara, canal, puerto, drenaje) que no permite renovar ni retener el lubricante de forma efectiva.","mecanismo":"Una película insuficiente deja contacto metal-metal y desgaste; la falla de lubricante figura como causa de daño (E-6002, E-6004).","verificar":"Revisar planos y estado del soporte: cantidad que admite la cámara, trayectoria del lubricante hasta la pista, rastros de lubricante agotado o desplazado al desmontar.","evidencia":["E-6002","E-6004"],"nivel":"SINTESIS","nota":"Las fuentes nombran la falla de lubricante, no la geometría del soporte. Validar con un experto del activo."},{"texto":"Daño secundario de asientos y superficies: fretting, corrosión y desgaste del asiento o del anillo.","mecanismo":"Micro-movimiento entre anillo y asiento, corrosión y desgaste son causas de daño de rodamientos (E-6002).","verificar":"Examen visual y con aumento de asientos del eje y alojamiento y de las superficies del anillo tras desmontar.","evidencia":["E-6002"],"nivel":"EVIDENCIA","nota":"Fuente de rodamientos de bolas en fatiga de ciclos muy altos, no de poleas."}],"Método":[{"texto":"Práctica de relubricación (tipo, cantidad, intervalo) no ajustada a las condiciones reales de operación.","mecanismo":"Lubricante insuficiente, degradado o inadecuado produce falla de lubricación (E-6001, E-6002, E-6004); la vida del rodamiento depende de condición de operación, temperatura y nivel de mantenimiento (E-9302).","verificar":"Revisar el plan y los registros de engrase (producto, cantidad, frecuencia, quién y cuándo) y compararlos con la recomendación del fabricante del rodamiento.","evidencia":["E-6001","E-6002","E-6004","E-9302"],"nivel":"SINTESIS","nota":"La lubricación inadecuada es causa nombrada en las fuentes; que la práctica del activo esté desajustada es hipótesis sin registros. Validar con un experto del activo."},{"texto":"Montaje e instalación del rodamiento sin control suficiente (manipulación previa, método de calado, verificación posterior).","mecanismo":"El mal manejo antes y durante la instalación figura como causa de falla prematura (E-6004); el montaje inadecuado induce defectos (E-9301).","verificar":"Revisar el procedimiento de montaje, las herramientas usadas y los registros; buscar marcas de impacto o carga indebida en las pistas del rodamiento retirado.","evidencia":["E-6004","E-9301"],"nivel":"EVIDENCIA","nota":"Fuentes de bombas y de rodamientos en general. El enfoque es el sistema (procedimiento, herramienta, verificación), no quién montó."},{"texto":"Selección del rodamiento solo por vida nominal, que cubre fatiga de contacto en condiciones convencionales y no las demás causas.","mecanismo":"E-6003 define la vida nominal para población de buena calidad y condiciones convencionales; E-6002 enumera causas fuera de ellas. La vida modificada incorpora viscosidad del lubricante y contaminación (E-6003).","verificar":"Revisar la memoria de selección: ¿se usó vida nominal básica o modificada?, ¿qué factores de lubricación y contaminación se supusieron?, ¿se compararon con las condiciones reales del sitio?","evidencia":["E-6002","E-6003"],"nivel":"SINTESIS","nota":"Razonamiento del equipo a partir de ambas fuentes. Validar con un experto del activo."},{"texto":"Secuencia de arranque y parada con banda cargada. CONDICION A VERIFICAR.","mecanismo":"Si los transitorios elevan la tensión de banda por encima de lo supuesto en el diseño, la carga instantánea sobre el rodamiento excede la prevista (premisa: carga excesiva como causa, E-6002).","verificar":"Revisar el procedimiento operativo, el registro de arranques con carga y la corriente del motor; comparar con las condiciones de diseño del transportador.","evidencia":["E-6002","E-6003"],"nivel":"SINTESIS","nota":"Ninguna fuente leída trata arranques en transportadores. Es una condición a verificar, no un hecho. Validar con un experto del activo."},{"texto":"Estrategia de vigilancia con una sola técnica o con indicadores que detectan tarde, sin seguimiento a señales tempranas.","mecanismo":"El RMS es poco sensible al defecto incipiente y el espectro de velocidad detecta solo en etapas tardías (E-8001); la confianza mejora al combinar vibración con aceite y termografía (E-8003).","verificar":"Revisar el historial de rutas de medición: qué indicadores, con qué periodicidad, qué señales previas existían y qué se hizo con ellas.","evidencia":["E-8001","E-8003"],"nivel":"SINTESIS","nota":"Contribuye a que el daño llegue a la falla funcional, no a su inicio. Revisiones narrativas, no de fajas. Validar con un experto del activo."}],"Material":[{"texto":"Lubricante degradado, inadecuado o incompatible con la aplicación.","mecanismo":"La falla de lubricante es causa de daño de rodamientos (E-6002, E-6004).","verificar":"Muestra del lubricante retirado: aspecto, olor, presencia de partículas o agua; análisis de aceite o de grasa. La confianza mejora combinando vibración con aceite y termografía (E-8003).","evidencia":["E-6002","E-6004","E-8003"],"nivel":"EVIDENCIA","nota":"Fuentes de rodamientos y bombas."},{"texto":"Corrosión y desgaste de las superficies del rodamiento.","mecanismo":"La corrosión por contaminación y el desgaste son causas de daño (E-6002, E-6004).","verificar":"Inspección visual y con aumento de pistas y elementos rodantes tras desmontar.","evidencia":["E-6002","E-6004"],"nivel":"EVIDENCIA","nota":"Son mecanismos de daño; la causa de origen está en otras ramas (contaminación, lubricación)."},{"texto":"Fatiga normal del material (descascarado subsuperficial): fin de vida esperado y no falla prematura.","mecanismo":"En condiciones convencionales la causa de falla es la fatiga de contacto por rodadura (E-6002); la vida nominal es la que alcanza o supera el 90 % de la población (E-6003).","verificar":"Comparar las horas de servicio con la vida nominal calculada con la carga real; morfología del descascarado en la pista.","evidencia":["E-6002","E-6003"],"nivel":"EVIDENCIA","nota":"Edición de la norma de vida nominal no verificada. Se descarta si el rodamiento falló muy por debajo de su vida nominal con signos de otras causas."},{"texto":"Rodamiento con daño previo o calidad no verificada (almacenamiento, manejo, trazabilidad).","mecanismo":"La vida nominal supone material de alta calidad y buena manufactura (E-6003); el mal manejo antes de la instalación causa falla prematura (E-6004).","verificar":"Trazabilidad del lote, inspección dimensional y de superficies de rodamientos nuevos de la misma partida; revisión de condiciones de almacenamiento.","evidencia":["E-6003","E-6004"],"nivel":"SINTESIS","nota":"Que haya un problema de lote es hipótesis sin datos. Validar con un experto del activo."}],"Mano de obra":[{"texto":"Competencia y herramientas para el montaje del rodamiento, vistas como capacidad del sistema.","mecanismo":"El mal manejo e instalación causa falla prematura (E-6004); el montaje inadecuado induce defectos (E-9301).","verificar":"Matriz de competencias, registro de formación en montaje de rodamientos y disponibilidad de herramientas de calado; entrevista no punitiva sobre obstáculos al procedimiento.","evidencia":["E-6004","E-9301"],"nivel":"SINTESIS","nota":"No se asigna culpa a personas; la pregunta es qué del sistema lo permitió. Sin datos del activo. Validar con un experto del activo."},{"texto":"Competencia del analista de vibración para elegir la banda del filtro de envolvente e interpretar una kurtosis no monótona.","mecanismo":"Elegir la banda del filtro es la dificultad principal de la envolvente (E-8006, E-8001); la kurtosis vuelve a valores normales al extenderse el defecto (E-8003). Una lectura equivocada oculta el defecto.","verificar":"Revisar cómo se eligió la banda en el historial de análisis y si se registraron lecturas de kurtosis y envolvente en el tiempo.","evidencia":["E-8001","E-8003","E-8006"],"nivel":"SINTESIS","nota":"Premisas verificadas de las revisiones; la aplicación al personal del activo es del equipo. Validar con un experto del activo."},{"texto":"Nivel de mantenimiento e inspección rutinaria de la chumacera (limpieza, estado de sellos, engrase) como actividad con dueño y registro.","mecanismo":"La salud del rodamiento depende de condición de operación, temperatura y nivel de mantenimiento (E-9302).","verificar":"Revisar rutas de inspección, órdenes de trabajo y registros; comprobar si la chumacera tiene tarea, frecuencia y responsable definidos.","evidencia":["E-9302"],"nivel":"SINTESIS","nota":"E-9302 es cita secundaria genérica (referencia no leída). Validar con un experto del activo."},{"texto":"Traspaso de información entre turnos sobre señales tempranas (ruido, temperatura, fugas de grasa). CONDICION A VERIFICAR.","mecanismo":"Si las señales de un turno no llegan al siguiente, el seguimiento de un defecto en progreso se interrumpe. Mecanismo del equipo, sin fuente.","verificar":"Revisar libros de turno y avisos de mantenimiento: ¿se registran y escalan las anomalías de las chumaceras?","evidencia":["E-8003"],"nivel":"SINTESIS","nota":"Premisa débil: E-8003 solo dice que la confianza mejora combinando indicadores. No hay fuente sobre turnos. Validar con un experto del activo."}],"Medición":[{"texto":"RMS y espectro de velocidad detectan tarde el defecto incipiente.","mecanismo":"El RMS es poco sensible a defectos incipientes y el espectro de velocidad detecta defectos solo en etapas tardías (E-8001).","verificar":"Revisar si el programa actual depende de RMS o velocidad global y qué aviso dio antes de la parada.","evidencia":["E-8001"],"nivel":"EVIDENCIA","nota":"Revisión narrativa; no trata fajas ni da tiempos de aviso."},{"texto":"Kurtosis usada como indicador único: no es monótona con el avance del daño.","mecanismo":"Es buen indicador de defecto incipiente pero vuelve a valores normales cuando el defecto se extiende (E-8003).","verificar":"Graficar kurtosis, RMS y envolvente en el tiempo para ver si la caída de kurtosis se leyó como mejora.","evidencia":["E-8003"],"nivel":"EVIDENCIA","nota":"Revisión de 2008; no cuantifica tiempos de aviso."},{"texto":"Umbrales fijos de alarma sin sustento.","mecanismo":"Los autores de una revisión no hallaron sustento teórico ni empírico de los umbrales de kurtosis 3 y 5 (E-8001); los umbrales fijos sobre bandas predeterminadas describen pocos tipos de falla (E-9306).","verificar":"Identificar el origen de los umbrales de alarma vigentes y si se calibraron con fallas de esta chumacera.","evidencia":["E-8001","E-9306"],"nivel":"EVIDENCIA","nota":"E-9306 es opinión de introducción. Ningún umbral citado aplica a poleas lentas."},{"texto":"Adquisición con ancho de banda o banda de filtro que no capta el defecto incipiente en una polea lenta.","mecanismo":"El defecto incipiente excita frecuencias propias típicamente desde 10 kHz hacia arriba (E-9307); elegir la banda del filtro es un reto (E-8006); el kurtograma sirve para localizarla (E-8005). Los bancos públicos listados operan a velocidades de 600 rpm o más (E-9204).","verificar":"Revisar rango de frecuencias del sensor y muestreo en uso, y si se aplicó envolvente en banda alta. Registrar la velocidad real de la polea.","evidencia":["E-9307","E-8006","E-8005","E-9204"],"nivel":"SINTESIS","nota":"Las fuentes son de banco a mayor velocidad; el comportamiento a baja velocidad es inferencia del equipo. Validar con un experto del activo."},{"texto":"Modelos y reglas de diagnóstico validados en banco que no generalizan al campo.","mecanismo":"La exactitud depende de la partición y del conjunto (E-8010); muchas técnicas se prueban en condiciones controladas (E-8011); cargas similares entre entrenamiento y prueba producen resultados engañosos (E-9203).","verificar":"Si hay un detector automático, pedir cómo se validó (por activo, por condición o por segmento) y si se probó en esta flota.","evidencia":["E-8010","E-8011","E-9203"],"nivel":"EVIDENCIA","nota":"Aplica solo si el activo usa algoritmos de diagnóstico; no se sabe."},{"texto":"Vigilancia sin integrar aceite o grasa, temperatura y termografía, y sin línea base por activo.","mecanismo":"La confianza mejora al combinar vibración con aceite y termografía (E-8003); una referencia sin falla de la misma máquina es una idea de línea base por activo (E-9209).","verificar":"Revisar si existe línea base de la chumacera sana y si se cruzan vibración, temperatura y análisis de lubricante.","evidencia":["E-8003","E-9209"],"nivel":"SINTESIS","nota":"E-9209 es una idea de un preprint de aprendizaje automático. Validar con un experto del activo."}],"Medio ambiente":[{"texto":"Polvo y partículas del entorno de la chumacera. CONDICION A VERIFICAR.","mecanismo":"La contaminación es causa de daño en rodillos (E-6001) y origen de corrosión (E-6004); el desgaste por contaminación induce defectos (E-9301); los rodamientos trabajan en ambientes agresivos (E-9304).","verificar":"Registrar acumulación de polvo y material sobre el soporte, estado de limpieza y partículas en el lubricante retirado.","evidencia":["E-6001","E-6004","E-9301","E-9304"],"nivel":"SINTESIS","nota":"Las fuentes dicen contaminación en general. Que el polvo del sitio sea la fuente es condición a verificar. Validar con un experto del activo."},{"texto":"Humedad, agua de lluvia o de lavado y condensación. CONDICION A VERIFICAR.","mecanismo":"La corrosión causada por contaminación es origen de falla prematura (E-6004).","verificar":"Revisar el lubricante en busca de emulsión o agua; marcas de óxido en pistas y asientos; práctica de lavado de la zona.","evidencia":["E-6004"],"nivel":"SINTESIS","nota":"E-6004 cita la corrosión por contaminación, no la humedad del sitio. Validar con un experto del activo."},{"texto":"Temperatura de operación del soporte elevada por ambiente o por material acumulado que impide disipar calor. CONDICION A VERIFICAR.","mecanismo":"La salud del rodamiento depende de la temperatura de operación (E-9302); el sobrecalentamiento está ligado a falla de lubricante y ajustes (E-6004).","verificar":"Termografía del soporte y comparación con soportes gemelos de la misma banda.","evidencia":["E-9302","E-6004"],"nivel":"SINTESIS","nota":"E-9302 es cita secundaria sin cuantificar el efecto de la temperatura. Validar con un experto del activo."},{"texto":"Estructura de apoyo o base del soporte que se deforma o asienta, desalineando el conjunto. CONDICION A VERIFICAR.","mecanismo":"Si el soporte se mueve respecto del eje aparece desalineación, que es causa de daño (E-6001, E-6002).","verificar":"Inspeccionar pernos de anclaje, calzas, grietas de la base y desplazamiento relativo soporte-eje.","evidencia":["E-6001","E-6002"],"nivel":"SINTESIS","nota":"Mecanismo del equipo; las fuentes no tratan estructuras de apoyo. Validar con un experto del activo."}]},"ensayos":[{"ensayo":"Análisis de envolvente de la vibración (filtrado en resonancia, demodulación, FFT) para identificar frecuencias características BPFO, BPFI, BSF y FTF. Su dificultad es elegir la banda del filtro.","para_hipotesis":["H7","H8","H1","H2","H3"],"evidencia":["E-8006","E-8008","E-8001"],"nivel":"SINTESIS"},{"ensayo":"Kurtosis y kurtograma (curtosis espectral) para detectar transitorios de defecto incipiente y localizar su banda. La kurtosis no es monótona con el avance del daño.","para_hipotesis":["H8","H7"],"evidencia":["E-8003","E-8005"],"nivel":"SINTESIS"},{"ensayo":"Indicador por deconvolución ciega y kurtosis para seguir la severidad del daño. Validado en un ensayo de banco hasta la falla; solo se leyó el resumen.","para_hipotesis":["H8"],"evidencia":["E-8004"],"nivel":"SINTESIS"},{"ensayo":"Vibración combinada con análisis de aceite y termografía para mejorar la confianza del diagnóstico.","para_hipotesis":["H1","H2","H5","H8"],"evidencia":["E-8003"],"nivel":"SINTESIS"},{"ensayo":"Espectro de velocidad y RMS como evaluación general: detectan defectos solo en etapas tardías o son poco sensibles a defectos incipientes.","para_hipotesis":["H8"],"evidencia":["E-8001"],"nivel":"SINTESIS"}],"vacios":["No existe caso real ni datos de planta: ninguna hipótesis puede pasar de posible.","Causas específicas de poleas de faja (flexión y fatiga del eje, sellos en ambiente de polvo, calentamiento del sopor
