var D={"caso":{"meta":{"titulo":"Dossier del modo de falla: chumacera de polea de faja transportadora","activo":"Chumacera (rodamiento y soporte) de polea de faja transportadora","origen_datos":"literatura leída por el equipo; sin datos de planta","n_fallas":0},"resumen":{"kpis":[{"label":"entradas en el registro (incluye pistas)","valor":"63","evidencia":["E-6001"]},{"label":"secciones con evidencia leída (sin contar Referencias)","valor":"9 de 13","evidencia":["E-6001"]},{"label":"secciones VACÍO declarado","valor":"4","evidencia":["E-6001"]}],"hallazgos":[{"id":"H1","texto":"[Mediciones y curvas] Análisis de envolvente: se filtra en una resonancia, se demodula y se buscan las frecuencias BPFO, BPFI, BSF y FTF según la geometría del rodamiento. Límite: Fuentes de introducción y revisión; datos de banco, no de poleas de faja","evidencia":["E-8006","E-8008","E-8001"]},{"id":"H2","texto":"[Mediciones y curvas] La kurtosis es buen indicador de defectos incipientes pero vuelve a valores normales cuando el defecto se extiende (curva no monótona). Una revisión no halló sustento teórico ni empírico de los umbrales 3 y 5 en las fuentes que consultó. Límite: Revisiones narrativas; ausencia de hallazgo en sus fuentes, no prueba de inexistencia; no hay tiempos de aviso","evidencia":["E-8003","E-8001"]},{"id":"H3","texto":"[Mediciones y curvas] Degradación en cuatro etapas espectrales (ultrasónica, resonancia natural, frecuencias de defecto y armónicos, ruido de fondo aleatorio), descritas de forma cualitativa y sin duración. Límite: Preprint de banco","evidencia":["E-8008"]},{"id":"H4","texto":"[Fenómenos físicos] En condiciones convencionales (ISO 281:2007, edición no verificada) la causa de falla es la fatiga de contacto con descascarado subsuperficial; fuera de ellas intervienen carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión y fretting. Límite: Rodamientos de bolas en ciclos muy altos; no es un estudio de transportadores","evidencia":["E-6002"]},{"id":"H5","texto":"[Fenómenos físicos] El autor atribuye el 90 % de las fallas prematuras de rodamientos de bolas de bombas a corrosión causada por contaminación, mala manipulación antes y durante la instalación, falla del lubricante o sobrecalentamiento por ajustes inadecuados en alojamientos o ejes. Límite: Resumen de 1988; bombas, no transportadores; sin base de datos ni n","evidencia":["E-6004"]},{"id":"H6","texto":"[Top de fallas y modos de falla] Cita secundaria: más del 50 % de las fallas de banda transportadora se deben a rodillos (idlers) en mal funcionamiento; daño de rodillos por lubricación impropia, contaminación y desalineación. Límite: Introducción que cita a otros; rodillos, no chumaceras de poleas; sin base de datos, tamaño ni año; la fuente primaria (E-6009) no se leyó","evidencia":["E-6001"]},{"id":"H7","texto":"[FMECA y RCM] Causas mencionadas en la literatura leída para el daño de rodamientos (insumo candidato de causas del FMECA; nivel POSIBLE por analogía, sin datos de polea): carga excesiva, desalineación, ajustes, lubricación, desgaste, corrosión, fretting, contaminación y sobrecalentamiento. Límite: Respaldo: introducción de un artículo sobre fatiga de ciclos muy altos en bolas y un resumen divulgativo de bombas; efectos, severidad, ocurrencia y detección no se puntúan sin un experto del activo","evidencia":["E-6002","E-6004"]},{"id":"H8","texto":"[Confiabilidad (Weibull y vida)] La vida nominal básica es el valor de vida que se espera que el 90 % de una población de rodamientos alcance o supere, en condiciones de operación convencionales. Límite: Contexto de aerogeneradores; no entrega horas para poleas","evidencia":["E-6003"]},{"id":"H9","texto":"[Confiabilidad (Weibull y vida)] Existen conjuntos abiertos de rodamientos de laboratorio: Paderborn (17 rodamientos; número de fallas y censura no verificados) y un subconjunto de 2 ensayos de UNSW; ninguno es de faja ni de campo. Límite: Con 2 fallas Weibull es inviable. Solo sirven como contraste metodológico","evidencia":["E-7001","E-7003"]},{"id":"H10","texto":"[Vida útil y obsolescencia] La vida nominal es una vida de fatiga bajo condiciones convencionales; la edición de la norma de vida nominal no está verificada. Límite: Contexto de aerogeneradores","evidencia":["E-6003"]},{"id":"H11","texto":"[Modelos de aprendizaje automático y profundo] En un preprint, al retener la condición de 1000 rpm en el conjunto JNU la exactitud colapsa a 40,64 %, por debajo de la clase mayoritaria; la regresión logística (57,91 %) generaliza mejor que los conjuntos de árboles. La exactitud depende de la partición; no hay datos de campo. Límite: Solo resumen de un preprint sin texto completo; el identificador arXiv debe verificarse; conjuntos de banco","evidencia":["E-8010"]},{"id":"H12","texto":"[Modelos de aprendizaje automático y profundo] En un banco de ensayo para vida remanente, todos los rodamientos se llevan a falla bajo carga muy alta para acelerar la degradación, lo que aumenta el riesgo de calentamiento local y daño incontrolado. Implicación del equipo: esa vida no representa la de una chumacera lenta de faja. Límite: Preprint no arbitrado, leído parcialmente; las métricas de error no se citan porque no figuran en el extracto registrado","evidencia":["E-8009"]},{"id":"H13","texto":"[Modelos de aprendizaje automático y profundo] Los propios autores señalan que muchas técnicas se prueban en condiciones controladas, lo que limita su adaptabilidad. Límite: Solo resumen e inicio","evidencia":["E-8011"]},{"id":"H14","texto":"[Causa raíz (ACR)] Causas mencionadas (nivel POSIBLE, por analogía): lubricación inadecuada, contaminación y desalineación en rodillos, e instalación, ajustes y lubricación en bombas. Límite: Ninguna es específica de chumaceras de polea; sin datos del activo","evidencia":["E-6001","E-6004"]},{"id":"H15","texto":"[Diagnóstico y troubleshooting] El kurtograma se basa en la curtosis espectral para detectar transitorios no estacionarios y ubicarlos en bandas de frecuencia de la señal del rodamiento. Límite: Solo introducción","evidencia":["E-8005"]}]},"tablas":[{"titulo":"Conjuntos abiertos de rodamientos de laboratorio verificados (ninguno de faja ni de campo)","evidencia":["E-7001","E-7003"],"columnas":["Id","Fuente","Nivel de evidencia"],"filas":[["E-7001","Run-to-failure data set of ball bearings subjected to time-varying load and spee","VERIFICADO-TEXTO"],["E-7003","Bearing run-to-failure dataset of UNSW - test 1 & 3 - horizontal acceleration (s","VERIFICADO-TEXTO"]],"nota":"Con 2 fallas o con vida de banco acelerado, un Weibull no describe la chumacera de una polea."},{"titulo":"Pistas de conjuntos de datos por abrir (no son evidencia)","evidencia":[],"columnas":["Id","Fuente","Nivel de evidencia"],"filas":[["E-7002","XJTU-SY Bearing Datasets (espejo en Hugging Face)","VERIFICADO-TEXTO"],["E-7004","XJTU-SY rolling element bearing accelerated life test dataset","SOLO-SNIPPET"],["E-7005","PRONOSTIA: An experimental platform for bearings accelerated degradation tests (","SOLO-SNIPPET"],["E-7006","NASA IMS bearings run-to-failure dataset","SOLO-SNIPPET"]],"nota":"Identificación del espejo de E-7002 leída; sus cifras son solo resumen de buscador. Licencias no verificadas."},{"titulo":"Normas candidatas (pistas; ninguna leída; edición no verificada)","evidencia":[],"columnas":["Id","Norma","Estado en el registro","Nivel de evidencia"],"filas":[["E-8501","ISO 281","en el registro del repositorio","SOLO-SNIPPET"],["E-8502","ISO 15243","no está en el registro: se propone como NO-VERIFICADO","SOLO-SNIPPET"],["E-8503","ISO 20816-1","en el registro del repositorio","SOLO-SNIPPET"],["E-8504","ISO 20816-3","en el registro del repositorio","SOLO-SNIPPET"],["E-8505","ISO 13373-1","no está en el registro: se propone como NO-VERIFICADO","SOLO-SNIPPET"],["E-8506","ISO 13373-2","no está en el registro: se propone como NO-VERIFICADO","SOLO-SNIPPET"],["E-8507","ISO 13373-3","no está en el registro: se propone RODUCTION, párrafo 1 y 2 (fragmento 10.1111/ffe.13782_0001)","afirma":"Clasificación general de causas de daño en rodamientos (carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión, fricción por micro-movimiento) y que, en condiciones convencionales de operación según ISO 281:2007, la fatiga de contacto por rodadura (descascarado subsuperficial) es la causa de falla. Define L10 como la vida a la cual falla el 10 % de los rodamientos (L10=(C/F)^p, p=3 bolas, 10/3 rodillos).","limites":"Rodamientos de bolas en régimen de fatiga de ciclos muy altos; no es un estudio de transportadores ni de poleas. No da frecuencias de falla ni vida de diseño de poleas.","aplica_a":"Mecanismos físicos de falla de rodamientos (fatiga vs causas fuera de condición convencional); definición de L10. Comparabilidad: media (mecanismo general).","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Shanyavskiy, A. A., & Soldatenkov, A. P. (2022). Crack path and regularities for ball-bearing fracture in the very-high-cycle fatigue regime. Fatigue & Fracture of Engineering Materials & Structures, 45(11), 3378-3392. https://doi.org/10.1111/ffe.13782","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-6003","tipo":"paper","acceso":"fragmento","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{"autores":"Kenworthy, J., Hart, E., Stirling, J., Stock, A., Keller, J., Guo, Y., Brasseur, J., & Evans, R.","anio":2023,"titulo":"Wind turbine main bearing rating lives as determined by IEC 61400-1 and ISO 281: A critical review and exploratory case study","fuente":"Wind Energy","volumen":"27(2)","paginas":"179-197","doi":"10.1002/we.2883"},"extracto":"The basic rating life (for a population of bearings manufactured with commonly used high-quality material, of good manufacturing quality, and operating under conventional operating conditions) is the value of bearing life which 90% of the population are expected to attain or exceed.","localizador":"Sección BACKGROUND, párrafo 1 (fragmento 10.1002/we.2883_0003)","afirma":"Definición de vida nominal básica (L10) según ISO 281: vida que el 90 % de una población de rodamientos idénticos alcanza o supera, hasta el primer indicio de fatiga; la vida nominal modificada incorpora viscosidad del lubricante, contaminación y límite de carga de fatiga; ISO/TS 16281 considera desalineación, inclinación y holgura.","limites":"Contexto de aerogeneradores (rodamiento principal). No trata poleas de banda ni da horas de diseño para transportadores. La edición de ISO 281 no se verificó aquí. L10 predice solo fatiga de contacto, no otras causas.","aplica_a":"Interpretación de L10 como vida de diseño: 10 % de falla esperada antes de L10. Comparabilidad: baja en activo, alta en definición.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Kenworthy, J., Hart, E., Stirling, J., Stock, A., Keller, J., Guo, Y., Brasseur, J., & Evans, R. (2023). Wind turbine main bearing rating lives as determined by IEC 61400-1 and ISO 281: A critical review and exploratory case study. Wind Energy, 27(2), 179-197. https://doi.org/10.1002/we.2883","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-6004","tipo":"paper","acceso":"abstract","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{"autores":"Goode, T.","anio":1988,"titulo":"Preventing Early Failure of Pump Ball Bearings","fuente":"Opflow","volumen":"14(4)","paginas":"1-5","doi":"10.1002/j.1551-8701.1988.tb00751.x"},"extracto":"Ninety percent of premature pump ball bearing failure can be attributed to corrosion caused by contamination, poor handling before and during installation, lubricant failure, or overheating caused by improper fits in housings or shafts.","localizador":"Abstract (fragmento único 10.1002/j.1551-8701.1988.tb00751.x_0000)","afirma":"En bombas, el 90 % de las fallas prematuras de rodamientos de bolas se atribuye (seg erencia":{"autores":"software estadístico Institute (documentacion; datos de Nelson, 1990)","anio":2016,"titulo":"The RELIABILITY Procedure: Weibull regression example on Nelson load-accelerated rolling bearing data","url":null},"afirma":"PISTA de parametro publicado: forma Weibull 1.2434 (error estandar 0.1545; IC95 aprox. 0.97 a 1.59), 39 observaciones sin censura, datos de ensayo de rodamientos con carga acelerada (Nelson 1990).","limites":"Solo resumen de buscador; la escala depende de la carga del ensayo y no se reporta aqui; ensayo de laboratorio de rodamientos de rodillos, no de campo. No abierto. Nombre y enlace del sitio omitidos por la política de neutralidad.","aplica_a":"Contraste de la forma beta (rodamientos ~1.2) frente a supuestos","licencia":"no aplica","comparabilidad":"baja","nivel_evidencia":"SOLO-SNIPPET","apa":"software estadístico Institute (documentacion; datos de Nelson, 1990) (2016). The RELIABILITY Procedure: Weibull regression example on Nelson load-accelerated rolling bearing data.","avisos":[]},{"id":"E-7008","tipo":"otro","acceso":"snippet","via":"websearch","fecha_acceso":"2026-10-27","referencia":{"autores":"Autor no identificado en el resumen (articulo de revista tecnica)","anio":null,"titulo":"Calculating Machine Reliability from Bearing Life","url":"https://machinedesign.com/archive/article/21831948/calculating-machine-reliability-from-bearing-life"},"afirma":"PISTA: segun buscador, la forma beta para rodamientos varia con la carga (cerca de 1.0 con carga ligera, 4.0 o mas con carga pesada).","limites":"Solo resumen de buscador, articulo divulgativo sin autor ni anio verificados; no es dato de falla.","aplica_a":"Rango de beta de referencia (hipotesis)","licencia":"no aplica","comparabilidad":"baja","nivel_evidencia":"SOLO-SNIPPET","apa":"Autor no identificado en el resumen (articulo de revista tecnica) (s. f.). Calculating Machine Reliability from Bearing Life. https://machinedesign.com/archive/article/21831948/calculating-machine-reliability-from-bearing-life","avisos":[]},{"id":"E-7009","tipo":"otro","acceso":"snippet","via":"websearch","fecha_acceso":"2026-10-27","referencia":{"autores":"Autores no identificados (trabajo PSAM 12)","anio":null,"titulo":"PSAM 12 paper 168 (supuestos de forma Weibull para rodamientos)","url":"https://www.iapsam.org/psam12/proceedings/paper/paper_168_1.pdf"},"afirma":"PISTA: segun buscador, el articulo asume beta=1.5 para rodamientos de rodillos y 2.0 para de bolas (Weibayes) porque los datos de falla eran insuficientes.","limites":"Valores ASUMIDOS, no ajustados; solo resumen de buscador; no es dato de campo ni de faja.","aplica_a":"Referencia de supuesto beta para Weibayes (declarar como SUPUESTO)","licencia":"no aplica","comparabilidad":"baja","nivel_evidencia":"SOLO-SNIPPET","apa":"Autores no identificados (trabajo PSAM 12) (s. f.). PSAM 12 paper 168 (supuestos de forma Weibull para rodamientos). https://www.iapsam.org/psam12/proceedings/paper/paper_168_1.pdf","avisos":[]},{"id":"E-7010","tipo":"paper","acceso":"solo_referencia","via":"readme_repositorio","fecha_acceso":"2026-10-27","referencia":{"autores":"Javanmardi, A.; Aimiyekagbon, O. K.; Bender, A.; Kimotho, J. K.; Sextro, W.; Hullermeier, E.","anio":2024,"titulo":"Remaining Useful Lifetime Estimation of Bearings Operating under Time-Varying Conditions","fuente":"PHM Society European Conference 8(1)","doi":"10.36001/phme.2024.v8i1.4101","pais":"Alemania"},"afirma":"Articulo que describe el conjunto de E-7001 (citado en su README); no leido.","limites":"No leido: no respalda ninguna cifra. Pendiente para saber cuantos rodamientos fallaron y como se definio el fin de vida.","aplica_a":"Pendiente de lectura","nivel_evidencia":"NO-VERIFICADO","apa":"Javanmardi, A.; Aimiyekagbon, O. K.; Bender, A.; Kimotho, J. K.; Sextro, W.; Hullermeier, E. (2024). Remaining Useful Lifetime Estimation of Bearings Operating under Time-Varying Conditions. PHM Society European Conference 8(1). https://doi.org/10.36001/phme.2024.v8i1.4101","avisos":[]},{"id":"E-8001","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Burda, E. A., Zusman, G. V., Kudryavtseva, I. S., Naumenko, A. P., & Nicoletti, R.","anio":2022,"titulo":"An Overview of Vibration Analysis Techniques for the Fault Diagnostics of Rolling Bearings in Machinery","fuente":"Shock and Vibration","volumen":"2022(1)","doi":"10.1155/2022/6136231"},"extracto":"(chunk 10) If the kurtosis coefficient is less than 3, the bearing is in good condition; if the kurtosis coefficient is more than 3, operation with restrictions is permissible; if the kurtosis coefficient is more than 5, the operation of the bearing assembly is unacceptable. Unfortunately, it was not possible to find a theoretical or empirical substantiation of the given boundary values in the available sources. [...] (chunk 8) The obvious advantages of the method for determining the technical state of a rolling bearing from the spectrum of the VA signal envelope are as follows: high sensitivity, noise immunity, and the ability to identify the type and location of the defect.","localizador":"sec. 3, chunks 10 (kurtosis) y 8 (envolvente) del texto completo (conector Wiley)","afirma":"Revision: el RMS es poco sensible a defectos incipientes; la kurtosis responde a impulsos; existe un criterio de umbrales de kurtosis (3 y 5) cuyos autores de la revision no hallaron sustento teorico ni empirico; ademas no hay datos publicos sobre la fiabilidad de la kurtosis como criterio. Ademas: el espectro de la envolvente tiene alta sensibilidad, inmunidad al ruido e identifica tipo y ubicacion del defecto; su dificultad es elegir el ancho de banda del filtro; la evaluacion por espectro de velocidad detecta defectos solo en etapas tardias (segun la revision).","limites":"Revision narrativa; no mide nada propio. Los umbrales 3 y 5 NO son un estandar validado para chumaceras de fajas. Pais/institucion no verificados en la fuente leida. No trata fajas transportadoras.","aplica_a":"Deteccion: indicadores en tiempo (RMS, kurtosis); advertencia contra umbrales universales","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Burda, E. A., Zusman, G. V., Kudryavtseva, I. S., Naumenko, A. P., & Nicoletti, R. (2022). An Overview of Vibration Analysis Techniques for the Fault Diagnostics of Rolling Bearings in Machinery. Shock and Vibration, 2022(1). https://doi.org/10.1155/2022/6136231","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8003","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Jayaswal, P., Wadhwani, A. K., Mulchandani, K. B., & Kaneko, Y.","anio":2008,"titulo":"Machine Fault Signature Analysis","fuente":"International Journal of Rotating Machinery","volumen":"2008(1)","doi":"10.1155/2008/583982"},"extracto":"The statistical parameters such as kurtosis and skewness values are robust to varying bearing operating condition and are good indicators of incipient defects. The disadvantage, however, is that as the defect spreads across the bearing surfaces the values of these parameters drop back to normal","localizador":"chunk 12 del texto completo (conector Wiley)","afirma":"Revision: la kurtosis es buen indicador de defecto incipiente pero vuelve a valores normales cuando el defecto se extiende (curva no monotona); la envolvente (filtro pasabanda + demodulacion Hilbert o rectificacion) sirve con senales ruidosas; la confianza mejora combinando vibracion con aceite, termografia y otros indicadores.","limites":"Revision de 2008; no cuantifica tiempos de aviso. No trata fajas transportadoras. Pais no verificado en la fuente leida.","aplica_a":"Curva de degradacion de indicadores; diagnostico por envolvente; fusion de indicadores","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jayaswal, P., Wadhwani, A. K., Mulchandani, K. B., & Kaneko, Y. (2008). Machine Fault Signature Analysis. International Journal of Rotating Machinery, 2008(1). https://doi.org/10.1155/2008/583982","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8004","tipo":"paper","acceso":"abstract","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Buzzoni, M., Soave, E., D'Elia, G., Mucchi, E., Dalpiaz, G., & Reccia, E.","anio":2018,"titulo":"Development of an Indicator for the Assessment of Damage Level in Rolling Element Bearings Based on Blind Deconvolution Methods","fuente":"Shock and Vibration","volumen":"2018(1)","doi":"10.1155/2018/5384358"},"extracto":"The validation of the proposed indicator has been carried out by means of both simulated signal and a runtofailure experiment. The results highlight that the proposed indicator is able to detect more efficiently the fault occurrence and, most importantly, quicker than other established techniques.","localizador":"Resumen del autor (campo abstract / chunk 0, conector Wiley)","afirma":"Un indicador basado en deconvolucion ciega y kurtosis rastrea la degradacion del rodamiento (pista externa, interna, elemento rodante) y se valido con senal simulada y un ensayo hasta la falla.","limites":"Solo se leyo el resumen del autor (metadatos del conector); el ensayo hasta la falla es de banco, no de campo; no se leyeron cifras ni la condicion de carga.","aplica_a":"Deteccion temprana y seguimiento de severidad por kurtosis mejorada","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Buzzoni, M., Soave, E., D'Elia, G., Mucchi, E., Dalpiaz, G., & Reccia, E. (2018). Development of an Indicator for the Assessment of Damage Level in Rolling Element Bearings Based on Blind Deconvolution Methods. Shock and Vibration, 2018(1). https://doi.org/10.1155/2018/5384358","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8005","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Nguyen, P. H., Kim, J., & Caesarendra, W.","anio":2015,"titulo":"Multifault Diagnosis of Rolling Element Bearings Using a Wavelet Kurtogram and Vector Median-Based Feature Analysis","fuente":"Shock and Vibration","volumen":"2015(1)","doi":"10.1155/2015/320508"},"extracto":"The kurtogram method relies on spectral kurtosis, which was originally proposed by Dwyer [[5](#bib-0005)], to detect the presence of nonstationary transients and accurately indicate their location in the frequency bands of bearing signals.","localizador":"chunk 1 del texto completo (conector Wiley)","afirma":"El kurtograma (curtosis espectral) se usa para localizar la banda de frecuencia donde estan los transitorios del defecto, paso previo a la envolvente; sus variantes se proponen porque el kurtograma es sensible a componentes impulsivos ajenos.","limites":"Se leyo solo la introduccion; no se leyeron resultados ni validacion del articulo. Ensayo de banco presumible, no verificado. No trata fajas.","aplica_a":"Diagnostico: seleccion de banda con kurtograma","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Nguyen, P. H., Kim, J., & Caesarendra, W. (2015). Multifault Diagnosis of Rolling Element Bearings Using a Wavelet Kurtogram and Vector Median-Based Feature Analysis. Shock and Vibration, 2015(1). https://doi.org/10.1155/2015/320508","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8006","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Van, M., Franciosa, P., Ceglarek, D., & Lei, Y.","anio":2016,"titulo":"Rolling Element Bearing Fault Diagnosis Using Integrated Nonlocal Means Denoising with Modified Morphology Filter Operators","fuente":"Mathematical Problems in Engineering","volumen":"2016(1)","doi":"10.1155/2016/9657285"},"extracto":"In this method, first, the vibration signal is filtered around the mechanical resonance of the machine. Then, an amplitude demodulation technique and Fourier transform are applied to extract fault features. However, the selection of the filtering frequency band is a challenge in this approach.","localizador":"chunk 1 del texto completo (conector Wiley)","afirma":"Describe el procedimiento de analisis de envolvente (filtrar en la resonancia, demodular, FFT) para identificar las frecuencias caracteristicas del rodamiento y su principal dificultad (eleccion de banda).","limites":"Solo introduccion; no se leyo la validacion. No trata fajas.","aplica_a":"Diagnostico: envolvente y frecuencias caracteristicas","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Van, M., Franciosa, P., Ceglarek, D., & Lei, Y. (2016). Rolling Element Bearing Fault Diagnosis Using Integrated Nonlocal Means Denoising with Modified Morphology Filter Operators. Mathematical Problems in Engineering, 2016(1). https://doi.org/10.1155/2016/9657285","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8007","tipo":"paper","acceso":"abstract","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Dong, S., & Gupta, P.","anio":2022,"titulo":"An Integrated Method of Rolling Bearing Fault Diagnosis Based on Convolutional Neural Network Optimized by Sparrow Optimization Algorithm","fuente":"Scientific Programming","volumen":"2022(1)","doi":"10.1155/2022/6234169"},"extracto":"The model’s accuracy rate may reach 99.4 percent after repeated testing using samples, which is significantly superior to the classic fault detection approach and the fault diagnostic method based solely on shallow networks.","localizador":"Resumen del autor (campo abstract de metadatos, conector Wiley)","afirma":"Ejemplo de resultado tipico de CNN sobre rodamientos: exactitud reportada de 99,4 por ciento sobre muestras de prueba.","limites":"Solo resumen del autor. No se leyo que conjunto de datos ni que particion (por activo, por condicion o aleatoria por segmentos) uso; sin ese dato la cifra NO respalda generalizacion a campo. Es ejemplo de lo que se reporta, no prueba de desempeno en planta.","aplica_a":"Modelos de aprendizaje profundo: validacion reportada","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Dong, S., & Gupta, P. (2022). An Integrated Method of Rolling Bearing Fault Diagnosis Based on Convolutional Neural Network Optimized by Sparrow Optimization Algorithm. Scientific Programming, 2022(1). https://doi.org/10.1155/2022/6234169","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8008","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2024,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv","url":"https://arxiv.org/abs/2405.01614"},"extracto":"Stage 1 introduces ultrasonic frequencies detectable only by specialized sensors, without visible defects on the bearing. Stage 2 is marked by signals aligning with the bearing parts’ natural resonance, alongside the initial appearance of defects upon inspection. Stage 3 features the fundamental defect frequencies and their harmonics, modulated by the shaft speed, indicating a spread of defects. Stage 4 is the final stage and precedes complete failure.","localizador":"Seccion 3.2, pie de la Figura 1 (hf://papers/2405.01614/paper.md, texto leido parcialmente)","afirma":"Descripcion de 4 etapas de la degradacion de un rodamiento por su contenido espectral (ultrasonico, resonancia natural, frecuencias de defecto y armonicos, ruido de fondo aleatorio) y de las frecuencias BPFO, BPFI, BSF, FTF con sus ecuaciones en funcion de n, fr, d, D y el angulo de contacto.","limites":"Preprint (v3, abr 2025) citado como se ve en el lector; la revista mencionada (Expert Systems with Applications) no se verifico. La descripcion de etapas es cualitativa, sin duracion ni tiempos de aviso. Sus datos son de banco de ensayo acelerado. Se leyeron solo partes del texto (aprox. primeros 40 kB).","aplica_a":"Curva tipica de degradacion; frecuencias caracteristicas","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2024). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv. https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-8009","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2024,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv","url":"https://arxiv.org/abs/2405.01614"},"extracto":"All bearings are run to failure under very high load to accelerate degradation. This significantly increases the risk of initiating bearing defects, but also the risk of local flash heating and subsequent uncontrolled damage to a bearing.","localizador":"Seccion 4.1 (hf://papers/2405.01614/paper.md, texto leido parcialmente) y resumen","afirma":"Validacion de un modelo de supervivencia para vida remanente en el conjunto publico XJTU-SY: 15 rodamientos de bolas de ranura profunda, 3 condiciones, 5 por condicion, validacion cruzada de 5 particiones; error absoluto medio de 14,7 min (IC95 13,6-15,8) con CoxPH y 12,6 min (IC95 11,8-13,4) con bosque de supervivencia a la carga mas alta con 25 por ciento de censura aleatoria. Tambien afirma que las fallas son raras y los datos censurados.","limites":"Banco de ensayo con degradacion acelerada por carga muy alta (12 kN, 2100 rpm; rodamiento de 12,82 kN de carga dinamica), minutos de vida, 15 rodamientos: NO es comparable con una chumacera de polea de faja de baja velocidad en meses. El error en minutos no se traslada a tiempo de aviso en campo. No se leyeron todas las secciones de resultados ni la discusion de limites. Preprint no arbitrado segun lo leido.","aplica_a":"Modelos predictivos de RUL; limites de generalizacion a campo","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2024). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv. https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-8010","tipo":"preprint","acceso":"abstract","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A.","anio":2026,"titulo":"Neutrosophic Ensemble Classification for Uncertainty-Aware Bearing Fault Detection: Evidence from Laboratory and Variable-Speed Industrial Benchmarks","fuente":"arXiv","url":"https://arxiv.org/abs/2610.06880"},"extracto":"On JNU, holding out 1000 rpm, accuracy collapses to 40.64 percent, below a majority-class baseline; Logistic Regression (57.91 percent) generalizes far better than the tree ensembles.","localizador":"Resumen del autor (hf://papers/2610.06880/paper.md; el lector declara que el texto completo no esta disponible)","afirma":"Con particion dejando fuera una condicion (leave-one-condition-out) en CWRU y JNU, el conjunto alcanza 100 por ciento en tres de cuatro cargas retenidas y 92,27 por ciento en la cuarta en CWRU, pero cae a 40,64 por ciento en JNU al retener 1000 rpm: la exactitud depende fuertemente de la particion y del conjunto. Tambien indica que rasgos de envolvente con frecuencias de falla separan casi perfectamente las clases en CWRU (99,57 por ciento con tres rasgos).","limites":"Solo resumen (el texto completo no estaba disponible en el lector). Preprint no arbitrado; el identificador arXiv 2610 y la fecha 2026-09-18 provienen del lector y no se contrastaron con otra fuente. Conjuntos de banco (CWRU, JNU), no de campo; no hay particion por activo en planta. No trata fajas.","aplica_a":"Limites de generalizacion de ML/DL; particion de validacion","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A. (2026). Neutrosophic Ensemble Classification for Uncertainty-Aware Bearing Fault Detection: Evidence from Laboratory and Variable-Speed Industrial Benchmarks. arXiv. https://arxiv.org/abs/2610.06880","avisos":[]},{"id":"E-8011","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M.","anio":2023,"titulo":"Real-Time Vibration-Based Bearing Fault Diagnosis Under Time-Varying Speed Conditions","fuente":"arXiv","url":"https://arxiv.org/abs/2311.18547"},"extracto":"However, many existing techniques are developed and tested under strictly controlled conditions, limiting their adaptability to the diverse and dynamic settings encountered in practical applications.","localizador":"Resumen del autor (hf://papers/2311.18547/paper.md, introduccion)","afirma":"Los propios autores senalan que muchas tecnicas se desarrollan y prueban en condiciones controladas, lo que limita su adaptabilidad; proponen una CNN en tiempo real bajo velocidad variable y ruido (mejoras de hasta 15,8 por ciento en exactitud sobre el estado del arte que ellos eligen).","limites":"Resumen e inicio de la introduccion. Banco de ensayo; no se leyo la particion ni el conjunto. Comparacion contra una linea base elegida por los autores. No trata fajas.","aplica_a":"Limites de generalizacion: ensayos controlados vs campo","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M. (2023). Real-Time Vibration-Based function vDossier(host){
  var dz=D.caso.dossier,ord=dz.orden,LVC={"VERIFICADO-TEXTO":"var(--ok)","VERIFICADO-ABSTRACT":"#4b8f6b","SOLO-SNIPPET":"var(--warn)","NO-VERIFICADO":"var(--bad)","DATO-USUARIO":"var(--c4)"};
  function srcs(sid){var o={};((dz.secciones[sid]||{}).elementos||[]).forEach(function(e){(e.evidencia||[]).forEach(function(i){o[i]=1})});return Object.keys(o)}
  var con=ord.filter(function(k){return((dz.secciones[k]||{}).elementos||[]).length}).length;
  var h='<div class="card"><h2>Cobertura del dossier</h2><div class="grid"><div class="kpi"><b>'+con+' de '+ord.length+'</b><span>secciones con evidencia leída (incluye Referencias)</span></div><div class="kpi"><b>'+(ord.length-con)+'</b><span>secciones VACÍO declarado</span></div><div class="kpi"><b>'+D.evidencia.length+'</b><span>entradas en el registro (incluye pistas)</span></div></div>'+
   '<h3>Fuentes citadas por sección y nivel de evidencia</h3><div id="dzb"></div><div style="font-size:12px;color:var(--mut)">'+Object.keys(LVC).map(function(k){return '<span style="color:'+LVC[k]+'">&#9632;</span> '+k}).join("  ")+'</div></div>';
  h+='<div class="card"><h2>Secciones</h2><label>Mostrar <select id="dzf"><option value="">todas</option><option value="con">solo con evidencia</option><option value="vac">solo VACÍO</option></select></label><label>Buscar <input id="dzq" type="text" style="width:170px"></label><div id="dzs"></div></div>';
  h+='<div class="card"><h2>Matriz sección × fuente</h2><p style="font-size:13px;color:var(--mut)">Cada punto es una fuente que respalda algo de esa sección. Pulse un punto para abrir la fuente.</p><div class="tw"><table id="dzm"></table></div></div>';
  host.innerHTML=h;
  /* barras apiladas */
  var W=760,rowH=24,H=ord.length*rowH+10,x0=210,mx=1;
  ord.forEach(function(k){mx=Math.max(mx,srcs(k).length)});
  var g='';ord.forEach(function(k,i){var y=i*rowH+4,x=x0,ss=srcs(k);g+='<text x="4" y="'+(y+14)+'">'+esc(dz.titulos[k]).slice(0,34)+'</text>';
    ss.sort().forEach(function(id){var w=(W-x0-30)/mx;g+='<rect x="'+x+'" y="'+y+'" width="'+(w-1)+'" height="16" fill="'+(LVC[EV[id].nivel_evidencia]||"var(--mut)")+'"><title>'+esc(id)+' '+esc(EV[id].nivel_evidencia)+'</title></rect>';x+=w});
    if(!ss.length)g+='<text x="'+x0+'" y="'+(y+13)+'" style="fill:var(--bad)">VACÍO</text>'});
  $("#dzb").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Fuentes por sección">'+g+'</svg>';
  function draw(){
    var f=$("#dzf").value,q=($("#dzq").value||"").toLowerCase();
    $("#dzs").innerHTML=ord.filter(function(k){var s=dz.secciones[k]||{},n=(s.elementos||[]).length;return(!f||(f==="con"?n>0:n===0))&&((dz.titulos[k]+" "+JSON.stringify(s)).toLowerCase().indexOf(q)>=0)}).map(function(k){
      var s=dz.secciones[k]||{},els=s.elementos||[];
      return '<details'+(els.length?'':' open')+' style="margin:6px 0"><summary><b>'+esc(dz.titulos[k])+'</b> <span class="badge '+(els.length?'confirmada':'descartada')+'">'+(els.length?els.length+' elemento(s)':'VACÍO')+'</span> <small>frente: '+esc(dz.frentes[k]||"")+'</small></summary>'+
        els.map(function(e){return '<p>• '+esc(e.titulo)+' '+chips(e.evidencia)+(e.limite?'<br><small>Límite: '+esc(e.limite)+'</small>':'')+'</p>'}).join("")+
        (s.vacio?'<div class="note bad">VACÍO: '+esc(s.vacio)+'</div>':'')+(s.nota?'<div class="note">'+esc(s.nota)+'</div>':'')+'</details>'}).join("")||"<p>Sin secciones con ese filtro.</p>";
  }
  host.addEventListener("input",draw);draw();
  var all={};ord.forEach(function(k){srcs(k).forEach(function(i){all[i]=1})});var cols=Object.keys(all).sort();
  $("#dzm").innerHTML='<tr><th>Sección</th>'+cols.map(function(i){return '<th style="font-size:10px">'+esc(i.slice(2))+'</th>'}).join("")+'</tr>'+ord.map(function(k){var ss=srcs(k);return '<tr><td>'+esc(dz.titulos[k])+'</td>'+cols.map(function(i){return '<td>'+(ss.indexOf(i)>=0?'<button class="chip" data-ev="'+i+'" style="padding:0 5px">●</button>':'')+'</td>'}).join("")+'</tr>'}).join("");
}

function vSim(host){
  host.innerHTML='<div class="card"><h2>Simulador didáctico del reemplazo por edad</h2><div class="note bad"><b>No es evidencia ni representa a la chumacera.</b> Los valores los elige quien usa la página; no hay para este modo de falla una forma, una escala ni costos con fuente leída. Úselo para entender cómo cambia el punto óptimo cuando tenga datos o parámetros citables.</div>'+
   '<label>β forma <input type="range" id="sb" min="0.5" max="5" step="0.05" value="2"> <b id="vb"></b></label><label>η escala (horas) <input type="number" id="se" value="10000" min="1"></label>'+
   '<label>Costo preventivo <input type="number" id="sp" value="1" min="0.01" step="0.1"></label><label>Costo de falla <input type="number" id="sf" value="5" min="0.01" step="0.1"></label><span style="font-size:12px;color:var(--mut)">(costos en unidades relativas que usted define)</span>'+
   '<div id="sr"></div><div id="s1"></div><div id="s2"></div><div id="s3"></div></div>';
  function run(){
    var b=+$("#sb").value,e=+$("#se").value,cp=+$("#sp").value,cf=+$("#sf").value;$("#vb").textContent=b;
    var N=300,T=[],R=[],Hh=[],C=[],ts=e*3,i,t,cum=0,prevR=1,prevT=0;
    for(i=1;i<=N;i++){t=ts*i/N;var r=Math.exp(-Math.pow(t/e,b));cum+=(prevR+r)/2*(t-prevT);prevR=r;prevT=t;T.push(t);R.push(r);Hh.push(b/e*Math.pow(t/e,b-1));C.push((cp*r+cf*(1-r))/cum)}
    var k=0;C.forEach(function(v,j){if(v<C[k])k=j});var interior=b>1&&cf>cp&&k<N-1&&k>0,rtf=cf/(e*gamma1(b));
    $("#sr").innerHTML=interior?'<div class="grid"><div class="kpi"><b>'+fmt(T[k],0)+'</b><span>edad de reemplazo óptima (h)</span></div><div class="kpi"><b>'+fmt(C[k],5)+'</b><span>costo por hora en el óptimo</span></div><div class="kpi"><b>'+fmt(rtf,5)+'</b><span>costo por hora si se corre a la falla</span></div><div class="kpi"><b>'+fmt(100*(1-C[k]/rtf),1)+' %</b><span>ahorro teórico</span></div></div>':
      '<div class="note">Sin mínimo interior: '+(b<=1?'con β ≤ 1 el riesgo no crece con la edad y reemplazar por edad no reduce el costo.':cf<=cp?'si la falla no cuesta más que la prevención, esperar a la falla es igual o más barato.':'el mínimo cae fuera del rango mostrado.')+'</div>';
    lineChart($("#s1"),{x:T,series:[{name:"R(t) confiabilidad",y:R}],titulo:"Confiabilidad",xfmt:function(v){return fmt(v,0)},key:"s1"});
    lineChart($("#s2"),{x:T,series:[{name:"h(t) tasa de falla",y:Hh}],titulo:"Tasa de falla",xfmt:function(v){return fmt(v,0)},key:"s2"});
    lineChart($("#s3"),{x:T,series:[{name:"costo por hora C(T)",y:C}],vlines:interior?[{x:T[k],label:"óptimo",c:"var(--ok)"}]:[],hlines:[{y:rtf,label:"correr a la falla",c:"var(--warn)"}],titulo:"Costo por hora",xfmt:function(v){return fmt(v,0)},key:"s3"});
  }
  function gamma1(b){var z=1+1/b,g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
    function G(z){if(z<.5)return Math.PI/(Math.sin(Math.PI*z)*G(1-z));z-=1;var x=c[0];for(var i=1;i<g+2;i++)x+=c[i]/(z+i);var t=z+g+.5;return Math.sqrt(2*Math.PI)*Math.pow(t,z+.5)*Math.exp(-t)*x}return G(z)}
  host.addEventListener("input",run);CURSOR={};run();
  window.__sim=function(b,e,cp,cf){$("#sb").value=b;$("#se").value=e;$("#sp").value=cp;$("#sf").value=cf;run();return $("#sr").textContent};
}

function vPlan(host){
  var p=D.caso.plan||[];
  host.innerHTML='<div class="card"><h2>Plan de acciones (CAPA)</h2><div class="tw"><table><tr><th>Id</th><th>Acción</th><th>Tipo</th><th>Causa</th><th>Responsable</th><th>Fecha</th><th>Verificación de eficacia</th><th>Fuente</th></tr>'+
   p.map(function(a){return '<tr><td>'+esc(a.id)+'</td><td>'+esc(a.accion)+'</td><td>'+esc(a.tipo||"")+'</td><td>'+esc(a.causa||"")+'</td><td>'+esc(a.responsable||"por asignar")+'</td><td>'+esc(a.fecha||"")+'</td><td>'+esc(a.verificacion||"por definir")+'</td><td>'+chips(a.evidencia)+'</td></tr>'}).join("")+'</table></div></div>';
}

function vHistorial(host){
  var c=D.caso,hs=c.historial||[];
  host.innerHTML='<div class="card"><h2>Historial y línea base del caso</h2>'+(c.recurrencia?'<div class="note '+(c.recurrencia.detectada?'bad':'ok')+'"><b>Recurrencia:</b> '+esc(c.recurrencia.texto||"")+'</div>':'<div class="note">Sin casos previos comparables registrados: no se puede afirmar recurrencia ni actualizar una línea base.</div>')+
   '<div class="tw"><table><tr><th>Versión</th><th>Fecha</th><th>Cambio</th><th>Línea base</th></tr>'+hs.map(function(h){return '<tr><td>'+esc(h.version)+'</td><td>'+esc(h.fecha)+'</td><td>'+esc(h.cambio)+'</td><td>'+esc(h.baseline||"")+'</td></tr>'}).join("")+'</table></div></div>';
}

function vRastro(host){
  var c=D.caso,L=function(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+esc(typeof x==="string"?x:(x.texto||JSON.stringify(x)))+'</li>'}).join("")+'</ul>':'<p>Ninguno.</p>'};
  host.innerHTML=mkCard("Ajustes aplicados por las compuertas",D.ajustes.length?'<div class="tw"><table><tr><th>Dónde</th><th>Tipo</th><th>Detalle</th></tr>'+D.ajustes.map(function(a){return '<tr><td>'+esc(a.donde)+'</td><td>'+esc(a.tipo)+'</td><td>'+esc(a.detalle)+'</td></tr>'}).join("")+'</table></div>':'<p>Ninguno: todo lo afirmado tenía respaldo del nivel exigido.</p>')+
   mkCard("Vacíos (lo que no se encontró o no se tiene)",L(c.vacios))+mkCard("Supuestos",L(c.supuestos))+mkCard("Preguntas abiertas",L(c.preguntas))+
   mkCard("Reproducibilidad",'<p>Generado el '+esc(D.generado)+' con reliability_kit. Los números de vida se recalculan en el navegador y se contrastan con el kit de Python cuando hay valores de referencia. Todo el informe es un solo archivo sin peticiones externas.</p>'+(c.busqueda?'<pre class="code">'+esc(JSON.stringify(c.busqueda,null,1))+'</pre>':''));
}

/* ---------- arranque ---------- */
function boot(){
  if(!D){document.body.innerHTML="<p style='padding:20px'>El informe no tiene datos incrustados.</p>";return}
  D.evidencia.forEach(function(e){EV[e.id]=e});
  var m=D.caso.meta;$("#ttl").textContent=m.titulo;$("#sub").textContent=[m.activo,m.fecha_evento&&("evento "+m.fecha_evento),m.origen_datos&&("datos: "+m.origen_datos)].filter(Boolean).join(" · ");
  var c=D.caso;
  tab("res","Resumen",vResumen);
  tab("tl","Línea de tiempo",vTiempo,(c.linea_tiempo||[]).length>0);
  tab("sen","Señales",vSenales,(c.series||[]).length>0);
  tab("cau","Causas y técnicas",vCausas);
  tab("dos","Dossier",vDossier,!!c.dossier);
  tab("sim","Simulador",vSim,!!c.simulador);
  tab("dat","Datos",vDatos,(c.tablas||[]).length>0);
  tab("evi","Evidencia",vEvidencia);
  tab("vid","Vida",vVida);
  tab("pre","Predictivo",vPredictivo);
  tab("pla","Plan",vPlan,(c.plan||[]).length>0);
  tab("his","Historial",vHistorial);
  tab("ras","Rastro",vRastro);
  var tb=$("#tabs"),mn=$("#main");
  VIEWS.forEach(function(v,i){
    var b=document.createElement("button");b.textContent=v.label;b.setAttribute("role","tab");b.dataset.id=v.id;tb.appendChild(b);
    var s=document.createElement("section");s.className="tab";s.id="v-"+v.id;mn.appendChild(s);
    b.onclick=function(){sel(v.id)};
  });
  function sel(id){
    VIEWS.forEach(function(v){var s=$("#v-"+v.id),b=$('[data-id='+v.id+']',tb);var on=v.id===id;s.classList.toggle("on",on);b.setAttribute("aria-selected",on);
      if(on&&!s.dataset.done){s.dataset.done=1;try{v.fn(s)}catch(e){s.innerHTML='<div class="note bad">Error al dibujar esta vista: '+esc(e.message)+'</div>';window.__errores=(window.__errores||[]).concat(String(e))}}});
    try{history.replaceState(null,"","#"+id)}catch(e){}
  }
  var h=(location.hash||"").slice(1);sel(VIEWS.some(function(v){return v.id===h})?h:"res");
  $("#thm").onclick=function(){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
  window.__listo=true;
}
boot();
</script>
