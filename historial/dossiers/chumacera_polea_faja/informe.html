var D={"caso":{"meta":{"titulo":"Dossier del modo de falla: chumacera de polea de faja transportadora","activo":"Chumacera (rodamiento y soporte) de polea de faja transportadora","origen_datos":"literatura leída por el equipo; sin datos de planta","n_fallas":0},"resumen":{"kpis":[{"label":"entradas en el registro (incluye pistas)","valor":"63","evidencia":["E-6001"]},{"label":"secciones con evidencia leída (sin contar Referencias)","valor":"9 de 13","evidencia":["E-6001"]},{"label":"secciones VACÍO declarado","valor":"4","evidencia":["E-6001"]}],"hallazgos":[{"id":"H1","texto":"[Mediciones y curvas] Análisis de envolvente: se filtra en una resonancia, se demodula y se buscan las frecuencias BPFO, BPFI, BSF y FTF según la geometría del rodamiento. Límite: Fuentes de introducción y revisión; datos de banco, no de poleas de faja","evidencia":["E-8006","E-8008","E-8001"]},{"id":"H2","texto":"[Mediciones y curvas] La kurtosis es buen indicador de defectos incipientes pero vuelve a valores normales cuando el defecto se extiende (curva no monótona). Una revisión no halló sustento teórico ni empírico de los umbrales 3 y 5 en las fuentes que consultó. Límite: Revisiones narrativas; ausencia de hallazgo en sus fuentes, no prueba de inexistencia; no hay tiempos de aviso","evidencia":["E-8003","E-8001"]},{"id":"H3","texto":"[Mediciones y curvas] Degradación en cuatro etapas espectrales (ultrasónica, resonancia natural, frecuencias de defecto y armónicos, ruido de fondo aleatorio), descritas de forma cualitativa y sin duración. Límite: Preprint de banco","evidencia":["E-8008"]},{"id":"H4","texto":"[Fenómenos físicos] En condiciones convencionales (ISO 281:2007, edición no verificada) la causa de falla es la fatiga de contacto con descascarado subsuperficial; fuera de ellas intervienen carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión y fretting. Límite: Rodamientos de bolas en ciclos muy altos; no es un estudio de transportadores","evidencia":["E-6002"]},{"id":"H5","texto":"[Fenómenos físicos] El autor atribuye el 90 % de las fallas prematuras de rodamientos de bolas de bombas a corrosión causada por contaminación, mala manipulación antes y durante la instalación, falla del lubricante o sobrecalentamiento por ajustes inadecuados en alojamientos o ejes. Límite: Resumen de 1988; bombas, no transportadores; sin base de datos ni n","evidencia":["E-6004"]},{"id":"H6","texto":"[Top de fallas y modos de falla] Cita secundaria: más del 50 % de las fallas de banda transportadora se deben a rodillos (idlers) en mal funcionamiento; daño de rodillos por lubricación impropia, contaminación y desalineación. Límite: Introducción que cita a otros; rodillos, no chumaceras de poleas; sin base de datos, tamaño ni año; la fuente primaria (E-6009) no se leyó","evidencia":["E-6001"]},{"id":"H7","texto":"[FMECA y RCM] Causas mencionadas en la literatura leída para el daño de rodamientos (insumo candidato de causas del FMECA; nivel POSIBLE por analogía, sin datos de polea): carga excesiva, desalineación, ajustes, lubricación, desgaste, corrosión, fretting, contaminación y sobrecalentamiento. Límite: Respaldo: introducción de un artículo sobre fatiga de ciclos muy altos en bolas y un resumen divulgativo de bombas; efectos, severidad, ocurrencia y detección no se puntúan sin un experto del activo","evidencia":["E-6002","E-6004"]},{"id":"H8","texto":"[Confiabilidad (Weibull y vida)] La vida nominal básica es el valor de vida que se espera que el 90 % de una población de rodamientos alcance o supere, en condiciones de operación convencionales. Límite: Contexto de aerogeneradores; no entrega horas para poleas","evidencia":["E-6003"]},{"id":"H9","texto":"[Confiabilidad (Weibull y vida)] Existen conjuntos abiertos de rodamientos de laboratorio: Paderborn (17 rodamientos; número de fallas y censura no verificados) y un subconjunto de 2 ensayos de UNSW; ninguno es de faja ni de campo. Límite: Con 2 fallas Weibull es inviable. Solo sirven como contraste metodológico","evidencia":["E-7001","E-7003"]},{"id":"H10","texto":"[Vida útil y obsolescencia] La vida nominal es una vida de fatiga bajo condiciones convencionales; la edición de la norma de vida nominal no está verificada. Límite: Contexto de aerogeneradores","evidencia":["E-6003"]},{"id":"H11","texto":"[Modelos de aprendizaje automático y profundo] En un preprint, al retener la condición de 1000 rpm en el conjunto JNU la exactitud colapsa a 40,64 %, por debajo de la clase mayoritaria; la regresión logística (57,91 %) generaliza mejor que los conjuntos de árboles. La exactitud depende de la partición; no hay datos de campo. Límite: Solo resumen de un preprint sin texto completo; el identificador arXiv debe verificarse; conjuntos de banco","evidencia":["E-8010"]},{"id":"H12","texto":"[Modelos de aprendizaje automático y profundo] En un banco de ensayo para vida remanente, todos los rodamientos se llevan a falla bajo carga muy alta para acelerar la degradación, lo que aumenta el riesgo de calentamiento local y daño incontrolado. Implicación del equipo: esa vida no representa la de una chumacera lenta de faja. Límite: Preprint no arbitrado, leído parcialmente; las métricas de error no se citan porque no figuran en el extracto registrado","evidencia":["E-8009"]},{"id":"H13","texto":"[Modelos de aprendizaje automático y profundo] Los propios autores señalan que muchas técnicas se prueban en condiciones controladas, lo que limita su adaptabilidad. Límite: Solo resumen e inicio","evidencia":["E-8011"]},{"id":"H14","texto":"[Causa raíz (ACR)] Causas mencionadas (nivel POSIBLE, por analogía): lubricación inadecuada, contaminación y desalineación en rodillos, e instalación, ajustes y lubricación en bombas. Límite: Ninguna es específica de chumaceras de polea; sin datos del activo","evidencia":["E-6001","E-6004"]},{"id":"H15","texto":"[Diagnóstico y troubleshooting] El kurtograma se basa en la curtosis espectral para detectar transitorios no estacionarios y ubicarlos en bandas de frecuencia de la señal del rodamiento. Límite: Solo introducción","evidencia":["E-8005"]}]},"tablas":[{"titulo":"Conjuntos abiertos de rodamientos de laboratorio verificados (ninguno de faja ni de campo)","evidencia":["E-7001","E-7003"],"columnas":["Id","Fuente","Nivel de evidencia"],"filas":[["E-7001","Run-to-failure data set of ball bearings subjected to time-varying load and spee","VERIFICADO-TEXTO"],["E-7003","Bearing run-to-failure dataset of UNSW - test 1 & 3 - horizontal acceleration (s","VERIFICADO-TEXTO"]],"nota":"Con 2 fallas o con vida de banco acelerado, un Weibull no describe la chumacera de una polea."},{"titulo":"Pistas de conjuntos de datos por abrir (no son evidencia)","evidencia":[],"columnas":["Id","Fuente","Nivel de evidencia"],"filas":[["E-7002","XJTU-SY Bearing Datasets (espejo en Hugging Face)","VERIFICADO-TEXTO"],["E-7004","XJTU-SY rolling element bearing accelerated life test dataset","SOLO-SNIPPET"],["E-7005","PRONOSTIA: An experimental platform for bearings accelerated degradation tests (","SOLO-SNIPPET"],["E-7006","NASA IMS bearings run-to-failure dataset","SOLO-SNIPPET"]],"nota":"Identificación del espejo de E-7002 leída; sus cifras son solo resumen de buscador. Licencias no verificadas."},{"titulo":"Normas candidatas (pistas; ninguna leída; edición no verificada)","evidencia":[],"columnas":["Id","Norma","Estado en el registro","Nivel de evidencia"],"filas":[["E-8501","ISO 281","en el registro del repositorio","SOLO-SNIPPET"],["E-8502","ISO 15243","no está en el registro: se propone como NO-VERIFICADO","SOLO-SNIPPET"],["E-8503","ISO 20816-1","en el registro del repositorio","SOLO-SNIPPET"],["E-8504","ISO 20816-3","en el registro del repositorio","SOLO-SNIPPET"],["E-8505","ISO 13373-1","no está en el registro: se propone como NO-VERIFICADO","SOLO-SNIPPET"],["E-8506","ISO 13373-2","no está en el registro: se propone como NO-VERIFICADO","SOLO-SNIPPET"],["E-8507","ISO 13373-3","no está en el registro: se propone emplazo, horas, causa)? Permitiría Weibull y punto óptimo con datos reales.","¿Aporta costos de falla y de reemplazo para calcular el punto óptimo y el LCC?","¿Autoriza guardar este dossier en el historial del repositorio (si es compartido) o solo en local?"],"historial":[{"version":"v1","fecha":"2026-10-27","cambio":"Primer dossier del modo de falla","baseline":"VACÍO: sin datos de falla del activo"}],"recurrencia":{"detectada":false,"texto":"Sin casos reales en el historial."},"busqueda":{"frentes":["mecanismo y modos","monitoreo y ML","datos de vida","normas y fuentes formales"],"validacion_dossier":{"con_evidencia":10,"vacias":4,"total":14}},"dossier":{"orden":["mediciones","fenomenos","top_fallas","fmeca","confiabilidad","punto_optimo","lcc","vida_util","ibr","ml","acr","troubleshooting","mpd_normas","referencias"],"titulos":{"mediciones":"Mediciones y curvas","fenomenos":"Fenómenos físicos","top_fallas":"Top de fallas y modos de falla","fmeca":"FMECA y RCM","confiabilidad":"Confiabilidad (Weibull y vida)","punto_optimo":"Punto óptimo de reemplazo","lcc":"Costo-riesgo y LCC","vida_util":"Vida útil y obsolescencia","ibr":"Inspección basada en riesgo (IBR o RBI)","ml":"Modelos de aprendizaje automático y profundo","acr":"Causa raíz (ACR)","troubleshooting":"Diagnóstico y troubleshooting","mpd_normas":"Mantenimiento predictivo y normas","referencias":"Referencias"},"frentes":{"mediciones":"monitoreo","fenomenos":"mecanismo","top_fallas":"modos","fmeca":"modos","confiabilidad":"datos","punto_optimo":"economia","lcc":"economia","vida_util":"mecanismo","ibr":"normas","ml":"ml","acr":"modos","troubleshooting":"monitoreo","mpd_normas":"normas","referencias":"normas"},"secciones":{"mediciones":{"elementos":[{"tipo":"afirmacion","titulo":"Análisis de envolvente: se filtra en una resonancia, se demodula y se buscan las frecuencias BPFO, BPFI, BSF y FTF según la geometría del rodamiento","evidencia":["E-8006","E-8008","E-8001"],"limite":"Fuentes de introducción y revisión; impropia, contaminación y desalineación","evidencia":["E-6001"],"limite":"Introducción que cita a otros; rodillos, no chumaceras de poleas; sin base de datos, tamaño ni año; la fuente primaria (E-6009) no se leyó"}],"nota":"Ranking de componentes y modos con base de datos, n y año: VACÍO."},"fmeca":{"elementos":[{"tipo":"afirmacion","titulo":"Causas mencionadas en la literatura leída para el daño de rodamientos (insumo candidato de causas del FMECA; nivel POSIBLE por analogía, sin datos de polea): carga excesiva, desalineación, ajustes, lubricación, desgaste, corrosión, fretting, contaminación y sobrecalentamiento","evidencia":["E-6002","E-6004"],"limite":"Respaldo: introducción de un artículo sobre fatiga de ciclos muy altos en bolas y un resumen divulgativo de bombas; efectos, severidad, ocurrencia y detección no se puntúan sin un experto del activo"}],"nota":"Escalas S-O-D: VACÍO (requieren experto y datos del activo)."},"confiabilidad":{"elementos":[{"tipo":"afirmacion","titulo":"La vida nominal básica es el valor de vida que se espera que el 90 % de una población de rodamientos alcance o supere, en condiciones de operación convencionales","evidencia":["E-6003"],"limite":"Contexto de aerogeneradores; no entrega horas para poleas"},{"tipo":"afirmacion","titulo":"Existen conjuntos abiertos de rodamientos de laboratorio: Paderborn (17 rodamientos; número de fallas y censura no verificados) y un subconjunto de 2 ensayos de UNSW; ninguno es de faja ni de campo","evidencia":["E-7001","E-7003"],"limite":"Con 2 fallas Weibull es inviable. Solo sirven como contraste metodológico"}],"nota":"Parámetros Weibull publicados verificados y datos de campo de chumaceras de polea: VACÍO. No se ajusta ningún Weibull."},"punto_optimo":{"elementos":[],"vacio":"Sin costos de falla y de reemplazo aportados por la persona, y sin fuente leída del modelo en el registro: no se calcula ninguna edad óptima."},"lcc":{"elementos":[],"vacio":"Sin costos aportados y sin fuente de datos de costo: no se calcula LCC."},"vida_util":{"elementos":[{"tipo":"afirmacion","titulo":"La vida nominal es una vida de fatiga bajo condiciones convencionales; la edición de la norma de vida nominal no está verificada","evidencia":["E-6003"],"limite":"Contexto de aerogeneradores"}],"nota":"Vida de diseño de poleas en fuente leída: VACÍO. Existen pistas comerciales sin abrir (E-6006, E-6007) que no respaldan cifras."},"ibr":{"elementos":[],"vacio":"API RP 580 y 581 solo se vieron como resúmenes de buscador (E-8513, E-8514); a criterio del equipo, no verificado, son para equipos de proceso. No se leyó ninguna fuente de IBR aplicable a la chumacera."},"ml":{"elementos":[{"tipo":"afirmacion","titulo":"En un preprint, al retener la condición de 1000 rpm en el conjunto JNU la exactitud colapsa a 40,64 %, por debajo de la clase mayoritaria; la regresión logística (57,91 %) generaliza mejor que los conjuntos de árboles. La exactitud depende de la partición; no hay datos de campo","evidencia":["E-8010"],"limite":"Solo resumen de un preprint sin texto completo; el identificador arXiv debe verificarse; conjuntos de banco"},{"tipo":"afirmacion","titulo":"En un banco de ensayo para vida remanente, todos los rodamientos se llevan a falla bajo carga muy alta para acelerar la degradación, lo que aumenta el riesgo de calentamiento local y daño incontrolado. Implicación del equipo: esa vida no representa la de una chumacera lenta de faja","evidencia":["E-8009"],"limite":"Preprint no arbitrado, leído parcialmente; las métricas de error no se citan porque no figuran en el extracto registrado"},{"tipo":"afirmacion","titulo":"Los propios autores señalan que muchas técnicas se prueban en condiciones controladas, lo que limita su adaptabilidad","evidencia":["E-8011"],"limite":"Solo resumen e inicio"}],"nota":"Estudios de campo con partición por activo: VACÍO."},"acr":{"elementos":[{"tipo":"afirmacion","titulo":"Causas mencionadas (nivel POSIBLE, por analogía): lubricación inadecuada, contaminación y desalineación en rodillos, e instalación, ajustes y lubricación en bombas","evidencia":["E-6001","E-6004"],"limite":"Ninguna es específica de chumaceras de polea; sin datos del activo"}]},"troubleshooting":{"elementos":[{"tipo":"afirmacion","titulo":"El kurtograma se basa en la curtosis espectral para detectar transitorios no estacionarios y ubicarlos en bandas de frecuencia de la señal del rodamiento","evidencia":["E-8005"],"limite":"Solo introducción"}],"nota":"Criterios de alarma de vibración para poleas, fusión de técnicas y tiempo de aviso (P-F): VACÍO."},"mpd_normas":{"elementos":[],"vacio":"Ninguna norma se leyó: las 15 candidatas (ISO 281, 15243, 20816-3, 13373, 18436-2, 5048, DIN 22101, ISO 113, CEMA 7, API 580 y 581, SAE JA1011) están solo como resúmenes de buscador y se listan aparte como pistas con estado NO-VERIFICADO."},"referencias":{"elementos":[{"tipo":"referencia","titulo":"Fuentes realmente usadas en este dossier","evidencia":["E-6001","E-6002","E-6003","E-6004","E-7001","E-7003","E-8001","E-8003","E-8005","E-8006","E-8008","E-8009","E-8010","E-8011"],"limite":""}]}}},"simulador":true,"analisis":{"fmeca":{"funcion":"Función: soportar el eje de la polea de la faja transportadora y permitir su giro con baja fricción, transmitiendo la carga radial al bastidor, durante el tiempo de servicio requerido (estándar de desempeño cuantificado: VACÍO, sin datos del activo). Falla funcional total: la chumacera se agarrota o se destruye y la polea no gira o deja de estar soportada. Falla funcional parcial: la chumacera sigue soportando la polea pero con ruido, vibración, juego o temperatura fuera de lo aceptable (límites: VACÍO).","items":[{"id":"FM1","modo":"Fatiga de contacto por rodadura (descascarado subsuperficial)","mecanismo":"Fatiga de contacto en pistas y elementos rodantes; es la causa de falla en condiciones convencionales de operación (E-6002). Progresa por etapas espectrales cualitativas (E-8008).","efecto_local":"Rodamiento con descascarado, aumento de vibración y ruido, juego creciente en la chumacera.","efecto_sistema":"Si el rodamiento se agarrota o la polea se detiene o gira con fricción, hay pérdida parcial o total de la función de transporte; el efecto real depende del activo (VACÍO).","causa":"Fin de vida por fatiga bajo carga y velocidad de operación; vida nominal L10 como referencia estadística, sin horas para poleas en fuente leída (E-6003).","estado_causa":"posible","deteccion":"Análisis de envolvente (filtrar en la resonancia, demodular, buscar BPFO, BPFI, BSF, FTF) y kurtosis para defecto incipiente (E-8001, E-8003, E-8006, E-8008); la kurtosis vuelve a valores normales cuando el defecto se extiende y los umbrales 3 y 5 no tienen sustento hallado en la revisión (E-8001, E-8003). La vibración sola es menos confiable que combinada con aceite o grasa, termografía y otros indicadores (E-8003).","control_sugerido":"Monitoreo por condición del rodamiento con técnica de envolvente y tendencia, tras definir línea base propia; no usar umbrales de kurtosis como norma.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6003","E-8001","E-8003","E-8006","E-8008"],"nota":"SINTESIS: las fuentes describen el mecanismo y las técnicas en rodamientos de banco y revisiones; ninguna trata chumaceras de polea de faja. Se asume por analogía que aplican. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"En condición (on-condition) (consecuencia: A confirmar; si la falla es evidente y afecta la operación, operacional). Hay una técnica que la literatura asocia a detección temprana (envolvente) y etapas de degradación descritas, por lo que una tarea en condición podría ser técnicamente factible. No se propone reemplazo por edad: no hay Weibull ni β > 1 demostrado para esta chumacera (E-6003 solo define L10 de población). La factibilidad real depende de accesibilidad y del tiempo de aviso, no disponible. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM2","modo":"Desgaste del rodamiento o del asiento","mecanismo":"Pérdida progresiva de material por contacto en condiciones no convencionales; el desgaste figura entre las causas de daño clasificadas (E-6002).","efecto_local":"Aumento de juego radial, ruido y vibración, posible holgura del conjunto en el soporte.","efecto_sistema":"Desalineación de la polea y posible desvío de banda; efecto no documentado en la evidencia (VACÍO).","causa":"Contaminación, lubricación deficiente o carga excesiva como causas candidatas (E-6001, E-6002); sin datos del activo.","estado_causa":"posible","deteccion":"La evidencia no asocia una técnica específica al desgaste; por síntesis, tendencia de vibración y análisis de aceite o grasa combinados (E-8003).","control_sugerido":"Inspección en condición del estado de lubricante y juego; verificar causas raíz antes de restaurar.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6001","E-8003"],"nota":"SINTESIS: se une la clasificación de causas de daño con la recomendación de combinar vibración con aceite y termografía; no hay mecanismo de desgaste específico de chumacera de polea. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"En condición, con restauración solo si hay edad identificable (consecuencia: A confirmar). El desgaste es el candidato clásico a restauración o reemplazo programado, pero eso exige edad de desgaste identificable (β > 1) que aquí no está demostrada. Mientras tanto se propone en condición. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM3","modo":"Corrosión por contaminación","mecanismo":"Corrosión del rodamiento causada por contaminación, una de las cuatro causas que el autor de un resumen sobre bombas lista (E-6004); la contaminación también aparece como causa de daño de rodillos de transportador (E-6001).","efecto_local":"Picaduras o superficies deterioradas, aumento de fricción y ruido; fallas prematuras.","efecto_sistema":"Falla prematura con pérdida de función de la polea; efecto en el sistema no documentado (VACÍO).","causa":"Ingreso de contaminantes por sello deficiente o ambiente del sitio (premisa por analogía; sin datos de polea).","estado_causa":"posible","deteccion":"Análisis de aceite o grasa y termografía como complemento de la vibración (E-8003); no hay técnica específica para corrosión en la evidencia.","control_sugerido":"Revisión del sello y del estado de la grasa; protección del soporte frente a contaminantes. Control a definir por el experto.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6004","E-6001","E-8003"],"nota":"SINTESIS: la fuente de corrosión es de bombas (resumen de 1988) y la de contaminación es de rodillos; se transfiere por analogía a chumaceras de polea. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo. Que el rediseño sea más eficaz que la detección es criterio del equipo, sin fuente.","tarea_rcm":"Rediseño (sellado/protección) y en condición (consecuencia: A confirmar). Si la contaminación es la causa dominante, atacar la causa (sello, protección) suele ser más eficaz que detectar el daño; por eso se propone evaluar rediseño del sellado, junto a inspección en condición del lubricante. No hay datos de planta que digan si domina. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM4","modo":"Falla de lubricación (lubricante inadecuado, insuficiente o degradado)","mecanismo":"Falla del lubricante: se cita como causa de daño de rodamientos (E-6002), de falla prematura en bombas (E-6004) y, como lubricación impropia, de daño en rodillos de transportador (E-6001).","efecto_local":"Contacto metal con metal, aumento de fricción, temperatura y vibración, y daño en pistas y elementos rodantes.","efecto_sistema":"Progresión a agarrotamiento posible; efecto en el sistema no documentado (VACÍO).","causa":"Lubricación impropia, ausente o contaminada; método de relubricación del activo desconocido.","estado_causa":"posible","deteccion":"Análisis de aceite o grasa y termografía, combinados con vibración (E-8003). Etapas ultrasónicas tempranas solo detectables con sensores especializados (E-8008).","control_sugerido":"Revisar la práctica de lubricación (tipo, cantidad, método) y contrastar cada PM de engrase con el historial: si hay fallas tras la intervención, investigar sobrelubricación o contaminación al engrasar (hipótesis, sin dato).","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6001","E-6002","E-6004","E-8003","E-8008"],"nota":"SINTESIS: la lubricación es la causa más repetida en tres fuentes de contextos distintos (rodillos, bolas en fatiga y bombas); se asume que aplica a la chumacera. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo. Que el rediseño sea más eficaz que la detección es criterio del equipo, sin fuente.","tarea_rcm":"En condición y, si hay mecanismo identificable, tarea programada de lubricación (consecuencia: A confirmar). La relubricación es una tarea de prevención basada en un mecanismo identificable; su contenido (cantidad, método) y su periodicidad requieren fuente y datos del activo, que no existen en la evidencia. Se complementa con inspección del estado del lubricante. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM5","modo":"Sobrecalentamiento por ajuste inadecuado en alojamiento o eje","mecanismo":"Ajustes inadecuados (incluidos ajustes apretados) que causan sobrecalentamiento del rodamiento (E-6004, E-6002).","efecto_local":"Aumento de temperatura, pérdida de huelgo interno, degradación del lubricante y posible agarrotamiento.","efecto_sistema":"Posible parada de la polea; si el calentamiento es suficiente, riesgo de ignición descrito para rodillos en la literatura citada (E-6001: fallas de rodillos como causa principal de ignición); aplicabilidad a poleas no establecida.","causa":"Montaje con ajuste incorrecto de eje o alojamiento; mala práctica de instalación (E-6004).","estado_causa":"posible","deteccion":"Termografía combinada con vibración (E-8003); la evidencia no da umbrales de temperatura.","control_sugerido":"Verificación de ajustes y montaje en la instalación; registro de temperatura base tras el montaje.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6004","E-6002","E-6001","E-8003"],"nota":"SINTESIS: se combina la causa de ajustes (bombas y bolas) con la mención de ignición por rodillos; la consecuencia de seguridad es una hipótesis que el experto debe evaluar. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"Rediseño o corrección del procedimiento de montaje; en condición por temperatura (consecuencia: A confirmar (posible seguridad o ambiente si hay riesgo de ignición)). La causa está en la instalación; una tarea de montaje controlado actúa sobre la causa. Si el experto confirma consecuencia de seguridad, correr a la falla no sería aceptable y debe prevalecer la detección o el rediseño. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM6","modo":"Desalineación o carga excesiva","mecanismo":"Desalineación y carga excesiva figuran entre las causas de daño de rodamientos (E-6002); la desalineación es causa de daño de rodillos de transportador (E-6001).","efecto_local":"Carga desigual en pistas, aumento de temperatura y vibración, acortamiento de la vida por fatiga.","efecto_sistema":"Desvío de banda y desgaste asociado: no documentado en la evidencia (VACÍO).","causa":"Desalineación de polea o soportes, deformación o flexión del eje, sobrecarga; mecanismos propios de poleas: VACÍO en el dossier.","estado_causa":"posible","deteccion":"Vibración con análisis espectral (E-8001, E-8008) y termografía (E-8003); no hay firma específica de desalineación en la evidencia leída.","control_sugerido":"Verificación de alineación en el montaje y tras intervenciones; revisión de cargas de diseño frente a las reales.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6001","E-6002","E-8003"],"nota":"SINTESIS: causa tomada de rodamientos en general y rodillos; la evidencia no examina el eje ni el bastidor de poleas. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"Rediseño o corrección de alineación; en condición (consecuencia: A confirmar). Si la desalineación es causa, corregirla es lo que reduce la ocurrencia; la inspección en condición solo detecta sus efectos. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM7","modo":"Fretting (micro-movimiento en asientos)","mecanismo":"Fricción por micro-movimiento entre superficies en contacto, citada como causa de daño de rodamientos (E-6002).","efecto_local":"Desgaste y óxido en asientos de aro y eje o alojamiento, pérdida de ajuste.","efecto_sistema":"Aflojamiento del conjunto: no documentado (VACÍO).","causa":"Ajuste insuficiente o carga con movimiento relativo (síntesis; sin datos).","estado_causa":"posible","deteccion":"La evidencia no menciona técnica específica de detección para fretting. VACÍO.","control_sugerido":"Inspección visual de asientos al desmontar y registro fotográfico; el control debe definirlo el experto.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6002"],"nota":"SINTESIS: solo hay una mención de lista; no se desarrolla el mecanismo en poleas. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"Búsqueda de falla no aplica; inspección al desmontar (consecuencia: A confirmar). Sin técnica de detección en línea en la evidencia, solo se propone aprovechar el desmontaje para inspeccionar los asientos. Es un modo con respaldo mínimo y puede descartarse si el experto lo considera improbable. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."},{"id":"FM8","modo":"Daño por manipulación o instalación deficiente","mecanismo":"Mal manejo antes y durante la instalación como contribuyente a fallas prematuras (E-6004).","efecto_local":"Defectos de origen (marcas, contaminación en el montaje) que acortan la vida del rodamiento.","efecto_sistema":"Falla prematura tras cada reemplazo: mortalidad infantil posible, sin dato del historial (VACÍO).","causa":"Procedimiento de montaje y almacenaje deficiente (por analogía con bombas).","estado_causa":"posible","deteccion":"La evidencia no da técnica; revisar el historial de órdenes tras reemplazos (requiere datos del activo).","control_sugerido":"Procedimiento de instalación y almacenamiento; cuestionar las PM de reemplazo si el historial muestra fallas tempranas posteriores.","severidad":null,"ocurrencia":null,"deteccion_puntaje":null,"nivel":"SINTESIS","evidencia":["E-6004"],"nota":"SINTESIS: transferido de un resumen de bombas de 1988; sin datos del activo. Razonamiento del equipo a partir de las fuentes citadas; debe ser validado por un experto del activo.","tarea_rcm":"Rediseño de procedimiento (consecuencia: A confirmar). La causa es de método de trabajo; mejora el procedimiento y verifica con el historial si existe mortalidad infantil. No se asigna intervalo: el P-F no tiene fuente leída (ver vacíos)."}],"vacios":["Intervalo P-F: ninguna fuente leída lo entrega para chumaceras de polea; la evidencia da etapas cualitativas sin duración (E-8008) y no cuantifica tiempos de aviso (E-8003). Por eso las tareas en condición no llevan intervalo numérico, y cualquier intervalo debe rotularse conceptual hasta tener datos.","Severidad, ocurrencia y detección: sin puntaje; requieren un experto del activo, escalas calibradas y el historial de órdenes de trabajo. Estándar exigido (FMEA clásico, Action Priority o proceso RCM) sin definir; no se lee ninguna norma (todas figuran como NO-VERIFICADO o solo resumen).","Estándar de desempeño de la función (capacidad, velocidad, vida requerida): no hay datos del activo; no se cuantifica.","Consecuencia real de cada modo (oculta, seguridad o ambiente, operacional, no operacional): no se conoce el sistema; las consecuencias de las tareas son propuestas a confirmar. El riesgo de ignición se menciona solo para rodillos (E-6001).","Edad de desgaste y β > 1: no hay Weibull ni datos de campo; por eso no se propone restauración ni reemplazo programado firme. Los conjuntos abiertos son de laboratorio y con pocas fallas (E-7001, E-7003).","Mecanismos propios de la chumacera de polea (flexión del eje, sellos en polvo, calentamiento del soporte), fallas del soporte o carcasa y modos de eje o soldadura: VACÍO (E-6005 es solo pista de buscador sin abrir).","Ranking de modos con base de datos, n y año: VACÍO; E-6001 trata rodillos, no chumaceras de poleas, y es cita secundaria.","Búsqueda de falla para funciones ocultas: no se sabe si la chumacera tiene dispositivos de protección ocultos; no se propone.","PM calendarias actuales: no se aportó plan ni historial; no se pudo contrastar ninguna PM con fallas (lista de PM cuestionadas: VACÍO).","Costos de falla, de tarea e indisponibilidad: VACÍO; la costo-efectividad de cada tarea queda sin evaluar.","Fiabilidad de las técnicas de detección en chumaceras de poleas lentas de faja: los estudios leídos son de banco o revisiones (E-8001, E-8003, E-8011); la exactitud de laboratorio puede no transferirse (E-8010).","Este FMECA es de escritorio basado solo en literatura de rodamientos en general: no es evidencia de campo."]},"arbol":{"evento_tope":"Falla funcional de la chumacera de la polea de la faja transportadora: pérdida de la función de soporte y de giro de la polea.","nodos":[{"id":"N0","texto":"Falla funcional de la chumacera (rodamiento y soporte) de la polea: pérdida de soporte y giro.","puerta":"AND","hijos":["N1","N12"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-8003","E-8001"],"nota":"Razonamiento del equipo: la falla funcional ocurre cuando se inicia un daño en el rodamiento Y el daño progresa sin detección oportuna (la literatura leída describe que ciertos indicadores solo detectan en etapas tardías). La puerta AND es una lectura del equipo, no un hecho de la literatura. Debe ser validado por un experto del activo. La detección falla solo respecto de la consecuencia; si no hay programa de monitoreo, esta rama no existe."},{"id":"N1","texto":"Se inicia un daño en el rodamiento o su montaje (por fatiga normal o por una causa fuera de condiciones convencionales, incluidas las latentes de gestión).","puerta":"OR","hijos":["N2","N3","N16"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6004"],"nota":"Agrupación del equipo de las causas que las fuentes dan para el daño de rodamientos. Las fuentes no son de poleas. Debe ser validado por un experto del activo."},{"id":"N2","texto":"Fatiga de contacto por rodadura (descascarado subsuperficial) en condiciones convencionales de operación, es decir, fin de vida esperado.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6002","E-6003"],"nota":"E-6002 la identifica como la causa de falla en condiciones convencionales. E-6003 define la vida nominal como la que alcanza o supera el 90 % de la población. La edición de la norma no está verificada."},{"id":"N3","texto":"Causas fuera de condiciones convencionales (marco del equipo): las que listan las fuentes leídas (carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión, fretting) más contaminación e instalación citadas en otras fuentes.","puerta":"OR","hijos":["N4","N5","N6","N7","N8","N9","N10"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6001","E-6004"],"nota":"E-6002 clasifica los daños por carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión y fretting. Rodamientos de bolas, no poleas."},{"id":"N4","texto":"Lubricación inadecuada o falla del lubricante.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6001","E-6002","E-6004"],"nota":"Citada como causa de daño en rodillos (E-6001), rodamientos (E-6002) y bombas (E-6004). Sin dato de polea."},{"id":"N5","texto":"Contaminación que ingresa a la chumacera (corrosión por contaminación).","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6001","E-6004"],"nota":"E-6001 la cita como causa de daño en rodillos y E-6004 como origen de corrosión en bombas. Falta fuente específica de chumaceras de polea."},{"id":"N6","texto":"Desalineación del rodamiento o del eje respecto del soporte.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6001","E-6002"],"nota":"Citada como causa en rodillos (E-6001) y en rodamientos (E-6002)."},{"id":"N7","texto":"Carga excesiva sobre el rodamiento.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6002"],"nota":"E-6002 la lista como causa de daño en rodamientos. La relación con las tensiones de banda de una polea no está respaldada en fuente leída."},{"id":"N8","texto":"Ajustes inadecuados (apretados) en el eje o el alojamiento, con sobrecalentamiento.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6002","E-6004"],"nota":"E-6002 cita los ajustes apretados y E-6004 el sobrecalentamiento por ajustes inadecuados en alojamientos o ejes."},{"id":"N9","texto":"Mala manipulación o instalación del rodamiento antes y durante el montaje.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6004"],"nota":"E-6004 la cita como causa de falla prematura en rodamientos de bombas. Aplica por analogía."},{"id":"N10","texto":"Mecanismos secundarios de daño: desgaste, corrosión y fricción por micro-movimiento (fretting).","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-6002"],"nota":"Listados por E-6002 como causas de daño de rodamientos."},{"id":"N16","texto":"Causas latentes de gestión que permiten el inicio del daño.","puerta":"OR","hijos":["N17","N18"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6003","E-6004"],"nota":"Razonamiento del equipo: las causas físicas requieren una deficiencia del sistema que las permita. Debe ser validado por un experto del activo. Actúa como habilitador de las causas físicas, no como alternativa independiente."},{"id":"N17","texto":"Prácticas de lubricación, sellado, manipulación e instalación sin control suficiente, que permiten las causas de lubricación, contaminación y montaje.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6004","E-6001"],"nota":"Premisas: E-6004 atribuye las fallas prematuras a contaminación, mal manejo, falla de lubricante y ajustes inadecuados. E-6001 cita lubricación impropia y contaminación. La deficiencia de procedimiento o control es inferencia del equipo; no hay dato del activo. Debe ser validado por un experto del activo."},{"id":"N18","texto":"Selección o diseño basado en la vida nominal, que cubre solo la fatiga de contacto y no las demás causas.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-6003","E-6002"],"nota":"Premisas: E-6003 indica que la vida nominal supone condiciones convencionales. E-6002 enumera causas fuera de ellas. La inferencia es del equipo. Debe ser validado por un experto del activo."},{"id":"N12","texto":"El daño progresa sin detección oportuna ni intervención.","puerta":"OR","hijos":["N13","N14","N15"],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-8001","E-8003"],"nota":"Razonamiento del equipo a partir de las limitaciones de los indicadores de vibración descritas en las revisiones. Debe ser validado por un experto del activo."},{"id":"N13","texto":"Indicador de monitoreo poco sensible o en etapa tardía: RMS poco sensible a defecto incipiente, kurtosis que vuelve a lo normal al extenderse el daño, espectro de velocidad que detecta solo en etapas tardías.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-8001","E-8003"],"nota":"Afirmado por revisiones narrativas. No tratan fajas transportadoras ni dan tiempos de aviso."},{"id":"N14","texto":"Umbrales de kurtosis 3 y 5 sin sustento hallado, o modelos de diagnóstico que no generalizan del banco al campo.","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"EVIDENCIA","evidencia":["E-8001","E-8010","E-8011"],"nota":"E-8001: los autores de la revisión no hallaron sustento para los umbrales de kurtosis 3 y 5. E-8010: la exactitud depende de la partición. E-8011: muchas técnicas se prueban en condiciones controladas. Son bancos, no fajas. E-8010 es un preprint 2026 de identificador no contrastado."},{"id":"N15","texto":"Gestión del monitoreo sin combinar técnicas ni dar seguimiento a señales tempranas (por ejemplo, vibración sola, sin aceite ni termografía).","puerta":"BASE","hijos":[],"probabilidad":null,"nivel":"SINTESIS","evidencia":["E-8003","E-8008"],"nota":"Premisas: E-8003 indica que la confianza mejora combinando vibración con otros indicadores. E-8008 describe etapas de degradación con señales previas a la falla. La inferencia sobre la gestión del activo es del equipo. Debe ser validado por un experto del activo."}],"vacios":["No existe caso real ni datos de planta: todas las probabilidades son null y ninguna rama puede darse por confirmada.","Las compuertas de N0 (AND), N16 y N3 son estructura propuesta por el equipo. Ninguna fuente leída da una estructura de árbol de fallas para chumaceras de polea.","Causas específicas de poleas de faja (flexión del eje, sellos en polvo, calentamiento del soporte, falla de la carcasa): sin fuente leída; solo hay pistas sin abrir.","Relación entre tensiones de banda y carga del rodamiento: las normas de cálculo son solo resumen de buscador.","Contaminación y sellado en chumaceras de transportadores: un congreso brasileño solo como pista; no se usan sus cifras.","Los nodos latentes N15 a N18 son SINTESIS pendientes de validación con un experto.","Las fuentes de causas (rodillos, bolas en fatiga de ciclos muy altos, bombas) son de comparabilidad baja o media con una chumacera de polea."]},"acr":{"hipotesis":[{"id":"H1","texto":"Lubricación inadecuada o falla del lubricante en el rodamiento de la chumacera.","estado":"posible","prueba_para_confirmar":"Evidencia del activo: historial y registros de lubricación (tipo, cantidad, frecuencia), estado del lubricante retirado y de las superficies de rodadura tras desmontar, y vibración, aceite y termografía antes de la parada. Se descarta si el lubricante y las superficies no muestran signos de falla de lubricación.","evidencia":["E-6001","E-6002","E-6004"],"nivel":"SINTESIS","nota":"Las fuentes la nombran como causa en rodillos, rodamientos en general y bombas; ninguna es chumacera de polea. Se transfiere por analogía de mecanismo. Debe ser validado por un experto del activo."},{"id":"H2","texto":"Contaminación (partículas, humedad) que ingresa a la chumacera y produce corrosión o daño de las pistas.","estado":"posible","prueba_para_confirmar":"Inspección del lubricante y las pistas retirados, estado de sellos y condiciones de polvo y humedad en el sitio. Se descarta si lubricante y sellos están íntegros y no hay rastros de corrosión.","evidencia":["E-6001","E-6004"],"nivel":"SINTESIS","nota":"E-6001 la cita en rodillos y E-6004 como origen de corrosión en bombas. Transferida por analogía. Debe ser validado por un experto del activo."},{"id":"H3","texto":"Desalineación del rodamiento o del eje de la polea respecto del soporte.","estado":"posible","prueba_para_confirmar":"Medición de alineación y asentamiento del soporte en el activo, y patrón de desgaste de las pistas tras desmontar. Se descarta si la alineación está dentro de lo que fije el fabricante y el desgaste es simétrico.","evidencia":["E-6001","E-6002"],"nivel":"SINTESIS","nota":"Causa de daño en rodillos y en rodamientos. Falta fuente específica de poleas. Debe ser validado por un experto del activo."},{"id":"H4","texto":"Carga excesiva sobre el rodamiento respecto de la prevista en el diseño (por ejemplo, tensiones de banda mayores que las supuestas).","estado":"posible","prueba_para_confirmar":"Comparar la carga real sobre la polea con la carga de diseño del rodamiento, con datos del activo. Se descarta si la carga real es menor que la de diseño.","evidencia":["E-6002","E-6003"],"nivel":"SINTESIS","nota":"E-6002 enumera la carga excesiva como causa de daño; E-6003 indica que la vida nominal supone condiciones convencionales. La conexión con tensiones de banda es razonamiento del equipo. Debe ser validado por un experto del activo."},{"id":"H5","texto":"Ajuste inadecuado (apretado) del rodamiento en el eje o en el alojamiento, con sobrecalentamiento.","estado":"posible","prueba_para_confirmar":"Medir ajustes y tolerancias del eje y el alojamiento y buscar signos de sobrecalentamiento en el rodamiento retirado. Se descarta si los ajustes cumplen la especificación y no hay signos térmicos.","evidencia":["E-6002","E-6004"],"nivel":"SINTESIS","nota":"E-6002 cita los ajustes apretados y E-6004 el sobrecalentamiento por ajustes inadecuados. Fuentes de rodamientos y bombas, no de poleas. Respaldo de rodamientos generales y bombas; transferido por analogía a poleas (criterio del equipo)."},{"id":"H6","texto":"Mala manipulación o instalación del rodamiento antes y durante el montaje.","estado":"posible","prueba_para_confirmar":"Registros y procedimiento de montaje y marcas de manipulación en las pistas del rodamiento retirado. Se descarta si el procedimiento se cumplió y no hay marcas.","evidencia":["E-6004"],"nivel":"SINTESIS","nota":"E-6004 la cita como causa de falla prematura en bombas. Aplica por analogía. La pregunta de fondo es por qué el sistema lo permitió (procedimiento, capacitación, herramienta), no quién lo hizo. Respaldo de rodamientos generales y bombas; transferido por analogía a poleas (criterio del equipo)."},{"id":"H7","texto":"Fatiga de contacto por rodadura (descascarado subsuperficial) en condiciones convencionales: fin de vida esperado y no falla prematura.","estado":"posible","prueba_para_confirmar":"Edad o ciclos del rodamiento frente a su vida nominal y morfología del daño tras desmontar. Se descarta si falló muy por debajo de su vida nominal con signos de otras causas.","evidencia":["E-6002","E-6003"],"nivel":"EVIDENCIA","nota":"Según E-6002, en condiciones convencionales la causa de falla es la fatiga de contacto. Según E-6003, la vida nominal es la que alcanza o supera el 90 % de la población. La edición de la norma no está verificada."},{"id":"H8","texto":"Detección tardía: el defecto avanza sin ser detectado por el indicador o el umbral de monitoreo en uso.","estado":"posible","prueba_para_confirmar":"Historial de mediciones previas: qué indicadores, con qué periodicidad y umbrales, y si había señales previas no atendidas. Se descarta si el defecto apareció entre dos mediciones sin señal previa detectable.","evidencia":["E-8001","E-8003","E-8008","E-8010"],"nivel":"SINTESIS","nota":"Premisas: el RMS es poco sensible a defectos incipientes (E-8001); la kurtosis vuelve a valores normales al extenderse el defecto (E-8003); el espectro de velocidad detecta solo etapas tardías (E-8001); los umbrales 3 y 5 no tienen sustento hallado (E-8001); la exactitud de los modelos depende de la partición (E-8010). Contribuye a la consecuencia, no al inicio del daño. Debe ser validado por un experto del activo. E-8010 es un preprint 2026 de identificador no contrastado."},{"id":"H9","texto":"Mecanismos secundarios de daño: corrosión, fricción por micro-movimiento (fretting) y desgaste del rodamiento o su asiento.","estado":"posible","prueba_para_confirmar":"Examen de las superficies del rodamiento y de los asientos tras desmontar. Se descarta si no presentan estos signos.","evidencia":["E-6002","E-6004"],"nivel":"SINTESIS","nota":"E-6002 los lista como causas de daño. E-6004 vincula la corrosión con la contaminación (ver H2). Respaldo de rodamientos generales y bombas; transferido por analogía a poleas (criterio del equipo)."}],"ishikawa":{"Máquina":[{"texto":"Desalineación del rodamiento o del eje respecto del soporte.","evidencia":["E-6001","E-6002"],"nivel":"SINTESIS"},{"texto":"Ajustes apretados en el eje o el alojamiento que llevan a sobrecalentamiento.","evidencia":["E-6002","E-6004"],"nivel":"SINTESIS"},{"texto":"Carga excesiva sobre el rodamiento.","evidencia":["E-6002"],"nivel":"EVIDENCIA"}],"Método":[{"texto":"Prácticas de lubricación inadecuadas (lubricante, cantidad, frecuencia) como causa de falla de lubricante.","evidencia":["E-6001","E-6004"],"nivel":"SINTESIS"},{"texto":"Procedimientos de manipulación e instalación que permiten daño antes o durante el montaje.","evidencia":["E-6004"],"nivel":"SINTESIS"},{"texto":"Selección por vida nominal, que solo predice fatiga de contacto y no otras causas.","evidencia":["E-6003","E-6002"],"nivel":"SINTESIS"}],"Material":[{"texto":"Lubricante degradado o inadecuado.","evidencia":["E-6002","E-6004"],"nivel":"SINTESIS"},{"texto":"Corrosión y desgaste de superficies del rodamiento.","evidencia":["E-6002"],"nivel":"SINTESIS"}],"Mano de obra":[{"texto":"Manipulación o montaje fuera de buena práctica; la pregunta es qué del sistema lo permitió (procedimiento, capacitación, herramienta).","evidencia":["E-6004"],"nivel":"SINTESIS"}],"Medición":[{"texto":"RMS poco sensible a defectos incipientes; la kurtosis no es monótona; el espectro de velocidad detecta solo en etapas tardías.","evidencia":["E-8001","E-8003"],"nivel":"EVIDENCIA"},{"texto":"Umbrales de kurtosis 3 y 5 sin sustento hallado por los autores de la revisión.","evidencia":["E-8001"],"nivel":"EVIDENCIA"},{"texto":"Modelos de diagnóstico probados en banco pueden no generalizar a campo.","evidencia":["E-8010","E-8011"],"nivel":"EVIDENCIA"}],"Medio ambiente":[{"texto":"Contaminación (partículas, humedad) en el entorno de la chumacera.","evidencia":["E-6001","E-6004"],"nivel":"SINTESIS"}]},"ensayos":[{"ensayo":"Análisis de envolvente de la vibración (filtrado en resonancia, demodulación, FFT) para identificar frecuencias características BPFO, BPFI, BSF y FTF. Su dificultad es elegir la banda del filtro.","para_hipotesis":["H7","H8","H1","H2","H3"],"evidencia":["E-8006","E-8008","E-8001"],"nivel":"SINTESIS"},{"ensayo":"Kurtosis y kurtograma (curtosis espectral) para detectar transitorios de defecto incipiente y localizar su banda. La kurtosis no es monótona con el avance del daño.","para_hipotesis":["H8","H7"],"evidencia":["E-8003","E-8005"],"nivel":"SINTESIS"},{"ensayo":"Indicador por deconvolución ciega y kurtosis para seguir la severidad del daño. Validado en un ensayo de banco hasta la falla; solo se leyó el resumen.","para_hipotesis":["H8"],"evidencia":["E-8004"],"nivel":"SINTESIS"},{"ensayo":"Vibración combinada con análisis de aceite y termografía para mejorar la confianza del diagnóstico.","para_hipotesis":["H1","H2","H5","H8"],"evidencia":["E-8003"],"nivel":"SINTESIS"},{"ensayo":"Espectro de velocidad y RMS como evaluación general: detectan defectos solo en etapas tardías o son poco sensibles a defectos incipientes.","para_hipotesis":["H8"],"evidencia":["E-8001"],"nivel":"SINTESIS"}],"vacios":["No existe caso real ni datos de planta: ninguna hipótesis puede pasar de posible.","Causas específicas de poleas de faja (flexión y fatiga del eje, sellos en ambiente de polvo, calentamiento del soporte): sin fuente leída; hay pistas sin abrir.","Contaminación y sellado en chumaceras de transportadores: un congreso brasileño solo como pista; no se usa ninguna cifra.","Clasificación de modos de daño (norma y guías de fabricantes): solo resúmenes de buscador.","Ranking de componentes con base de datos, tamaño y año: la fuente primaria probable no se leyó; el dato de rodillos es cita secundaria.","Sin fuente leída sobre técnicas para verificar ajustes, carga real o alineación: quedan como verificaciones de campo a definir por un experto.","Sin técnicas leídas de análisis post mortem del rodamiento (metalografía, microscopía): las pruebas propuestas son inspecciones generales, no ensayos citados.","Tiempos de aviso por técnica y criterios de alarma de vibración para poleas lentas: sin fuente leída."]},"lcc":{"modo_de_falla":"Falla de la chumacera de la polea de una faja transportadora","elementos":[{"id":"C1","nombre":"Adquisición de chumacera y rodamiento (y sello/accesorios)","tipo":"capex","como_se_calcula":"Σ(precio unitario × cantidad) de chumacera, rodamiento, sellos, adaptador, fletes e impuestos no recuperables; si se prorratea, dividir por años de vida del conjunto.","fuente_del_dato":"Cotización o contrato de compra, ERP/almacén.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6003"],"nota":"Estructura estándar de costos del equipo; los ids citados solo contextualizan el modo de falla y no son premisa de este costo. Debe ser validado por un experto.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C2","nombre":"Instalación y puesta en marcha","tipo":"capex","como_se_calcula":"Horas-persona × tarifa horaria + equipos de izaje/andamios + horas de parada de faja para el montaje (esta última se valora en C7) + alineación y verificación.","fuente_del_dato":"Orden de trabajo, planilla de personal, contratos de servicio.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6001"],"nota":"Razonamiento de ingeniería del equipo a partir de las premisas citadas; debe ser validado por un experto del activo. Premisa: desalineación y ajustes apretados figuran como causas de daño (E-6002; E-6001 menciona desalineación en rodillos). Por eso el costo de alinear bien es parte de la instalación. Dato: Orden de trabajo, planilla de personal, contratos de servicio.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C3","nombre":"Lubricación y mantenimiento rutinario","tipo":"opex","como_se_calcula":"(Frecuencia anual de engrase o cambio) × (horas-persona × tarifa + costo de lubricante y consumibles) + costo de limpieza y sellado; por año.","fuente_del_dato":"Plan de lubricación, órdenes de trabajo, consumo de almacén.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6001","E-6002"],"nota":"Razonamiento de ingeniería del equipo a partir de las premisas citadas; debe ser validado por un experto del activo. Premisa: lubricación inadecuada y contaminación son factores de daño citados (E-6001, E-6002). La frecuencia y cantidad correctas no están en el registro. Dato: Plan de lubricación, órdenes de trabajo, consumo de almacén.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C4","nombre":"Inspección y monitoreo de condición","tipo":"opex","como_se_calcula":"Costo anual de ruta de medición = (mediciones/año × horas × tarifa) + depreciación y calibración del instrumento + software/licencias; o, si es permanente, costo del sensor y su mantenimiento por año.","fuente_del_dato":"Plan de inspección, inventario de instrumentos, contratos.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-8003","E-8008"],"nota":"Razonamiento de ingeniería del equipo a partir de las premisas citadas; debe ser validado por un experto del activo. Premisa: existen técnicas de vibración y etapas de degradación que dan aviso antes de la falla (E-8003, E-8008). El costo de medirlas es del activo y se compara contra el costo de falla evitado. Dato: Plan de inspección, inventario de instrumentos, contratos.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C5","nombre":"Repuestos e inventario","tipo":"repuesto","como_se_calcula":"Costo de mantener = (valor del inventario × tasa de mantenimiento de inventario declarada) por año + costo de pedidos; cantidad a mantener según demanda observada, tiempo de reposición y nivel de servicio declarado (para demanda intermitente, método con bootstrap o variantes; declarar la herramienta).","fuente_del_dato":"Historial de consumo, tiempos de reposición del proveedor, política de almacén.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6003","E-7003"],"nota":"Razonamiento de ingeniería del equipo a partir de las premisas citadas; debe ser validado por un experto del activo. Premisa: la vida es aleatoria (E-6003) y con pocas fallas observadas la estimación de demanda es incierta (E-7003, n=2). No hay demanda observada en el registro. Dato: Historial de consumo, tiempos de reposición del proveedor, política de almacén.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C6","nombre":"Costo de falla correctiva directo","tipo":"falla","como_se_calcula":"Cf_directo = reparación de urgencia (horas × tarifa × recargo) + piezas dañadas colaterales (eje, polea, carcasa) + servicios externos + consecuencias de seguridad o ambientales valoradas. Se separa de C7 para no duplicar.","fuente_del_dato":"Órdenes correctivas, reportes de incidente, análisis de falla.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6001","E-6002"],"nota":"Estructura estándar de costos del equipo; los ids citados solo contextualizan el modo de falla y no son premisa de este costo. Debe ser validado por un experto.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C7","nombre":"Indisponibilidad y pérdida de producción","tipo":"indisponibilidad","como_se_calcula":"Horas de parada (por falla en C7a y por mantenimiento preventivo en C7b) × margen perdido por hora (o costo de recuperación con horas extra) × fracción no recuperable. Parada no planificada y planificada con valores distintos.","fuente_del_dato":"Registro de paradas (CMMS/SCADA), plan de producción y margen aportado por finanzas.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6001"],"nota":"Estructura estándar de costos del equipo; los ids citados solo contextualizan el modo de falla y no son premisa de este costo. Debe ser validado por un experto.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C8","nombre":"Disposición y fin de vida","tipo":"disposicion","como_se_calcula":"Costo de retiro y disposición del conjunto − valor de recuperación (chatarra, reacondicionado), por evento; se trae a valor presente al año del evento.","fuente_del_dato":"Contratos de disposición, valor de chatarra, política ambiental.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6002"],"nota":"Estructura estándar de costos del equipo; los ids citados solo contextualizan el modo de falla y no son premisa de este costo. Debe ser validado por un experto.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."}],"formulas":[{"nombre":"Costo de ciclo de vida (LCC)","expresion":"LCC = C1 + C2 + Σ_{t=1..N} [C3_t + C4_t + C5_t + Cf·λ_t + C7_t] / (1+r)^t + C8/(1+r)^N, con λ_t = número esperado de fallas en el año t y r = tasa de descuento declarada por la persona.","nivel":"SINTESIS","evidencia":["E-6003"],"nota":"Antes de usarla, unificar la definición de Cf (reposición, instalación, indisponibilidad por falla) con la de C(T) y separar C7 en parada por falla y parada preventiva para no contar dos veces; el índice del VPN debe coincidir con el número de flujos."},{"nombre":"Valor presente neto (VPN)","expresion":"VPN = Σ_{k=0..n} F_k / (1+r)^(t0+k), donde F_k es el flujo del año k.","nivel":"SINTESIS","evidencia":["E-6003"],"nota":"Relación estándar tomada de la teoría de renovación y de la ingeniería económica; NO tiene fuente en el registro de evidencia. Se cita como SINTESIS: verificar en una fuente (texto de ingeniería económica o de confiabilidad) antes de usar. Implementado en economics.npv."},{"nombre":"Costo anual equivalente (CAE / EAC)","expresion":"CAE = VPN · r / (1 − (1+r)^(−n)); si r = 0, CAE = VPN / n.","nivel":"SINTESIS","evidencia":["E-6003"],"nota":"Relación estándar tomada de la teoría de renovación y de la ingeniería económica; NO tiene fuente en el registro de evidencia. Se cita como SINTESIS: verificar en una fuente (texto de ingeniería económica o de confiabilidad) antes de usar. Implementado en economics.eac."},{"nombre":"Costo por unidad de tiempo con reemplazo por edad T","expresion":"C(T) = (Cp·R(T) + Cf·(1−R(T))) / ∫0^T R(t) dt, con R(t)=exp(−(t/η)^β) si se adopta Weibull. Cp = costo del reemplazo preventivo (C1+C2+C7b+C8 neto); Cf = costo del reemplazo por falla (C1+C2+C6+C7a+C8 neto).","nivel":"SINTESIS","evidencia":["E-6003","E-7003"],"nota":"Relación estándar tomada de la teoría de renovación y de la ingeniería económica; NO tiene fuente en el registro de evidencia. Se cita como SINTESIS: verificar en una fuente (texto de ingeniería económica o de confiabilidad) antes de usar. E-6003 respalda que R(t) describe la proporción de la población que sobrevive; E-7003 advierte que con n=2 fallas Weibull es inviable. β, η, Cp y Cf son datos del activo (null); sin ellos C(T) no se evalúa."},{"nombre":"Condición de existencia de edad óptima","expresion":"Mínimo interior de C(T) solo si β > 1 y Cf > Cp. Si no, se declara: no hay edad óptima calculable (no se fuerza un número). Referencia sin reemplazo preventivo: C(∞) = Cf / (η·Γ(1+1/β)).","nivel":"SINTESIS","evidencia":["E-6003","E-7003"],"nota":"Relación estándar tomada de la teoría de renovación y de la ingeniería económica; NO tiene fuente en el registro de evidencia. Se cita como SINTESIS: verificar en una fuente (texto de ingeniería económica o de confiabilidad) antes de usar. Comportamiento observado en economics.optimal_age_replacement (ver prueba_implementacion)."}],"parametros_requeridos_del_activo":{"beta":null,"eta":null,"intervalo_beta":null,"Cp":null,"Cf":null,"tasa_descuento_r":null,"horizonte_N":null,"unidad_tiempo":null,"nota":"Todos null: los ingresa la persona o un experto del activo en el informe interactivo. β debe venir del analista de vida con su intervalo."},"prueba_implementacion":{"etiqueta":"PRUEBA DE LA IMPLEMENTACIÓN, NO ES DATO DEL ACTIVO NI REFERENCIA PARA DECIDIR","kit":"tools/reliability/reliability_kit/economics.py","entrada_arbitraria":{"beta":2.5,"eta":1.0,"Cp":1.0,"Cf":5.0,"unidades":"adimensionales"},"resultado":["optimal_age_replacement devolvió T*≈0.49305 y C(T*)≈3.46204; una búsqueda en rejilla independiente de C(T)=(Cp·R+Cf·(1−R))/∫R (trapecio) dio T≈0.4932 y C≈3.46204: coinciden (diferencia en C(T*) ≈ 3e-10).","age_replacement_cost_rate(0.7) coincide con la fórmula escrita aquí (diferencia ≈ 6e-10).","El costo sin prevención del kit coincide con Cf/(η·Γ(1+1/β)) (5.6353 en ambos).","β=1.0 devuelve optimal_age=None y Cf=Cp devuelve optimal_age=None (la herramienta niega la edad óptima como indica la condición de existencia).","npv y eac coinciden con la suma directa de flujos descontados y con VPN·r/(1−(1+r)^−n) (flujos [3,2,2,2,2], r=0.1: VPN≈9.3397, CAE≈2.4638)."],"conclusion":"Las fórmulas de este archivo coinciden con la implementación del kit. Esto verifica el código, no la validez económica para el activo."},"vacios":["Sin datos de costo en el registro: ninguna de las 63 entradas contiene precios, tarifas, costos de falla ni de parada. Los 8 elementos quedan con valor y unidad en null. No se calcula LCC, CAE ni VPN.","Sin edad óptima de reemplazo: faltan Cp, Cf (datos de la persona) y β, η del activo con intervalo. No hay datos de campo de chumaceras de polea; los Weibull publicados están solo como SOLO-SNIPPET (E-7007 a E-7009), que no pueden respaldar nada. Los ensayos abiertos verificados (E-7003, n=2) no permiten ajustar Weibull.","Las fórmulas (LCC, VPN, CAE, C(T)) no tienen fuente en el registro: son SINTESIS (relaciones estándar a verificar en una fuente). Se recomienda abrir y registrar un texto de ingeniería económica y el de Barlow-Proschan (referencia que cita el docstring del kit) como evidencia verificada.","Sin tasa de descuento, horizonte ni moneda: los declara la persona.","Sin datos de repuestos: demanda observada, tiempo de reposición, nivel de servicio y criticidad por consecuencia.","Sin definición local de la tasa de repetición de fallas, cumplimiento de PM, backlog y costo de mantenimiento sobre valor de reposición: preguntar qué definición usa la planta.","Costo de indisponibilidad (margen por hora, recuperabilidad de la producción) depende de la operación: dato de finanzas/producción.","Cp y Cf deben definirse sin doble conteo entre C6 y C7, y con el mismo criterio de tramos de tiempo de reparación (incluir o no diagnóstico y espera logística): definir cuál versión se adopta.","Definición de Cf y de C7 pendiente de unificar entre la fórmula LCC y la de reemplazo por edad (posible doble conteo de la parada por falla)."]},"vida":{"hallazgos":[{"id":"V1","texto":"No existen datos de falla del activo, por lo que no se ajusta ningún Weibull ni se reporta β, η, B10 ni MTBF. Cualquier número de vida para esta chumacera sería inventado.","nivel":"SINTESIS","evidencia":["E-7003","E-8009"],"nota":"Razonamiento: las únicas series hasta la falla halladas son de banco (E-7003, E-8009), no del activo. Debe ser validado por un experto del activo."},{"id":"V2","texto":"La vida nominal básica L10 (ISO 281) es el valor de vida que el 90 % de una población de rodamientos idénticos, de buena calidad y en condiciones convencionales, alcanza o supera; es decir, se espera que 10 % falle antes. La vida nominal modificada incorpora viscosidad del lubricante, contaminación y límite de carga de fatiga; ISO/TS 16281 añade desalineación, inclinación y holgura. (ISO/TS 16281: no está en el registro de normas; NO-VERIFICADO, edición no verificada.)","nivel":"EVIDENCIA","evidencia":["E-6003"],"nota":"Fuente de aerogeneradores (rodamiento principal) usada solo por la definición. La edición de ISO 281 no se verificó."},{"id":"V3","texto":"L10 es una vida de diseño por fatiga de contacto de una población, no una predicción de la vida de la chumacera instalada: la misma fuente indica que predice solo fatiga y no otras causas. Las causas de daño listadas (carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión, fretting) quedan fuera de L10 salvo en la medida en que la vida modificada o ISO/TS 16281 las incorpore.","nivel":"SINTESIS","evidencia":["E-6003","E-6002"],"nota":"Razonamiento: se contrasta la definición de L10 (E-6003) con la lista de causas de daño (E-6002). Debe ser validado por un experto del activo. Mezcla hechos de las fuentes con inferencias del equipo: que L10 solo cubre fatiga y que el banco no representa una polea lenta de faja son criterios del equipo; la exactitud entre condiciones de banco no mide transferencia a campo."},{"id":"V4","texto":"En bombas, un autor atribuye el 90 % de las fallas prematuras de rodamientos de bolas a corrosión por contaminación, mal manejo e instalación, falla de lubricante o sobrecalentamiento por ajustes inadecuados. Por analogía de mecanismos, la vida real puede quedar muy por debajo de L10 por causas de instalación, lubricación y contaminación, lo que impide usar L10 como vida esperada.","nivel":"SINTESIS","evidencia":["E-6004","E-6003"],"nota":"Razonamiento por analogía (bombas, resumen de 1988, sin n ni base de datos). No es estadística de poleas. Debe ser validado por un experto del activo."},{"id":"V5","texto":"Las cifras de L10 de práctica comercial solo existen como pistas de buscador sin abrir (E-6006, E-6007) y no se usan como valores.","nivel":"SINTESIS","evidencia":["E-6003"],"nota":"Las pistas E-6006 y E-6007 están pendientes de abrir; no respaldan nada. Lo verificado es solo la definición de L10. Debe ser validado por un experto del activo."},{"id":"V6","texto":"Dato abierto verificado E-7001 (Paderborn, CC BY 4.0): 17 rodamientos de bolas con vibración de dos acelerómetros y bitácora, en banco con carga y velocidad variables. El README no declara cuántos terminaron en falla ni si hay censura, y los tiempos solo saldrían tras leer la bitácora. No es faja ni chumacera con soporte.","nivel":"EVIDENCIA","evidencia":["E-7001"],"nota":"n_fallas y censura quedan NO-VERIFICADO en la propia entrada."},{"id":"V7","texto":"Dato abierto verificado E-7003 (UNSW, CC BY 4.0, subconjunto): 2 ensayos (Test 1 y 3) hasta la falla por defecto de pista externa, 80 y 79 registros, banco a 6 Hz y 10,5 kN, sin censura declarada. Son 2 fallas: mínimo absoluto, inviable para un Weibull con intervalo útil; las unidades son de un mismo diseño de laboratorio, no una población de campo.","nivel":"EVIDENCIA","evidencia":["E-7003"],"nota":"Los 80 y 79 son registros de vibración de cada ensayo, no fallas."},{"id":"V8","texto":"Un tercer conjunto, XJTU-SY (copia en el Hub), no tiene licencia declarada en el espejo y sus cifras (n, condiciones) provienen solo de pistas de buscador (E-7004). Se lista como pendiente, no como dato.","nivel":"EVIDENCIA","evidencia":["E-7002"],"nota":"El ReadMe no se pudo leer; pedir licencia al autor original antes de redistribuir."},{"id":"V9","texto":"Por qué los datos abiertos no sirven para la vida de la chumacera de una polea: (1) son de laboratorio, con rodamientos pequeños sin soporte, sin polvo, sin la carga de la faja ni el montaje en chumacera; (2) en el trabajo con XJTU-SY los autores señalan que se corre hasta la falla con carga muy alta para acelerar la degradación, con riesgo de calentamiento local y daño descontrolado, es decir otro mecanismo y vidas de minutos frente a una polea de baja velocidad; (3) hay muy pocas unidades y fallas (2 en E-7003; sin declarar en E-7001); (4) son unidades de un mismo ensayo, no una población de campo con historia de operación y de mantenimiento; (5) la exactitud reportada en bancos no se traslada a campo.","nivel":"SINTESIS","evidencia":["E-8009","E-7003","E-7001","E-8520"],"nota":"E-8520 ilustra que la exactitud de laboratorio cae al cambiar de condición (40,64 % al retener 1000 rpm). Punto 1 es inferencia sobre E-7001 y E-7003; Debe ser validado por un experto del activo. Mezcla hechos de las fuentes con inferencias del equipo: que L10 solo cubre fatiga y que el banco no representa una polea lenta de faja son criterios del equipo; la exactitud entre condiciones de banco no mide transferencia a campo."},{"id":"V10","texto":"Los trabajos de vida remanente sobre bancos (XJTU-SY y PRONOSTIA) citan en su introducción que una fracción de las fallas de maquinaria se atribuye a rodamientos, pero es cita secundaria sin fuente leída y no es dato de planta. El resumen de otro trabajo afirma que las fallas son raras y los datos están censurados, lo que justifica un método con censura y no promediar solo tiempos de falla.","nivel":"SINTESIS","evidencia":["E-8519","E-8009"],"nota":"Usar como contexto, no como tasa. Mezcla hechos de las fuentes con inferencias del equipo: que L10 solo cubre fatiga y que el banco no representa una polea lenta de faja son criterios del equipo; la exactitud entre condiciones de banco no mide transferencia a campo."},{"id":"V11","texto":"Una cita secundaria indica que más de 50 % de las fallas de transportadores se deben a rodillos (idlers), no a chumaceras de poleas; la fuente primaria probable (sin leer) (E-6009) no se leyó. No se debe usar para dimensionar la población de la chumacera de polea.","nivel":"EVIDENCIA","evidencia":["E-6001"],"nota":"Cifra sin base de datos, tamaño ni año."},{"id":"V12","texto":"Los parámetros Weibull publicados que aparecen como pistas de buscador (E-7007 a E-7009) NO se usan: no se leyeron. Un β asumido (Weibayes) solo sería admisible como supuesto explícito, rotulado y con análisis de sensibilidad, nunca como resultado.","nivel":"SINTESIS","evidencia":["E-6003","E-7003"],"nota":"Razonamiento de método: sin datos propios, un β tomado de otra fuente es un supuesto, no una estimación. Las pistas E-7007 a E-7009 siguen pendientes de abrir. Debe ser validado por un experto del activo."}],"metodo_recomendado":[{"situacion":"Sin datos de falla propios (situación actual)","metodo":"No ajustar Weibull. Tratar L10 o la vida modificada solo como referencia de diseño; priorizar un registro de fallas y de censura y, mientras tanto, gestionar por condición (inspección y monitoreo) en vez de por edad. Si se usara Weibayes con β asumido, rotularlo como supuesto con rango de sensibilidad y sin conclusión de reemplazo por edad.","porque":"L10 es vida de población por fatiga de contacto (E-6003) y los datos abiertos son de banco (E-7003, E-8009).","evidencia":["E-6003","E-7003","E-8009"],"nivel":"SINTESIS"},{"situacion":"Pocas fallas propias (exploratorio)","metodo":"Weibull de máxima verosimilitud con intervalo por razón de verosimilitud (weibull_beta_ci_lr, weibull_b_life_ci_lr) y bootstrap (weibull_bootstrap_ci), corrección de sesgo de β (bias_correct_beta) reportando ambos valores, y Kaplan-Meier sin supuestos con km_failure_quantile. El kit advierte por debajo de 10 fallas (exploratorio, se rotula así) y por debajo de 30 (β con posible sesgo al alza). Si el intervalo de β contiene 1 no hay base para reemplazo por edad. Si compare_models_verdict da empate, no justificar la estrategia en la forma de la distribución.","porque":"Con n pequeño el intervalo es ancho; las dos fallas de E-7003 muestran que n=2 no permite un intervalo útil. Los umbrales 10 y 30 son criterios del kit (weibull.py), no de una fuente de la base de evidencia.","evidencia":["E-7003"],"nivel":"SINTESIS"},{"situacion":"Con censura (unidades que siguen operando o se reemplazaron sin fallar)","metodo":"Tratar toda chumacera sin falla como censura por la derecha y ajustar con verosimilitud censurada (fit_weibull_mle con censura), Kaplan-Meier y comparación lognormal y exponencial. Un reemplazo preventivo, un cambio por otra causa o una intervención es censura, no falla. No excluir las censuradas ni promediar solo los tiempos de falla.","porque":"Las fallas son raras y los datos son censurados en este tipo de problema (E-8009); quitar las censuras sesga la vida a la baja. La separación falla/censura se define con el experto del activo.","evidencia":["E-8009"],"nivel":"SINTESIS"},{"situacion":"Ítem reparable (la chumacera se cambia pero la polea o el eje sigue en servicio)","metodo":"No ajustar Weibull a los tiempos entre fallas sin probar tendencia. Por unidad: laplace_trend_test y fit_crow_amsaa. Con varias poleas y fines de observación distintos: mean_cumulative_function con intervalo, fit_crow_amsaa_multi (modelo condicional), laplace_trend_test_multi y unit_heterogeneity_test. Nunca concatenar los tiempos de varias poleas en una serie. Si cada chumacera se trata como ítem no reparable (primera vida tras cada instalación), definirlo explícitamente y usar Weibull con censura.","porque":"Reglas del protocolo de estadística de vida. La vida tras una reparación depende de la calidad del montaje, la lubricación y la alineación (E-6004, E-6002), no solo de la edad.","evidencia":["E-6004","E-6002"],"nivel":"SINTESIS"},{"situacion":"Modos de falla mezclados","metodo":"Separar por modo (fatiga de contacto, lubricación, contaminación, desalineación o ajuste, daño de montaje) y por posición de la polea (motriz y de cola), con los demás modos como censura. Un ajuste mixto con curva quebrada en el gráfico de probabilidad suele indicar poblaciones mezcladas. La clasificación del modo en cada falla requiere análisis de causa raíz o inspección del rodamiento retirado.","porque":"La literatura clasifica los daños por causas distintas (E-6002) y L10 cubre solo fatiga (E-6003). Mezclar modos da un β intermedio sin sentido físico.","evidencia":["E-6002","E-6003"],"nivel":"SINTESIS"},{"situacion":"Con covariables (carga, ambiente con polvo, tipo de lubricación, polea motriz o de cola)","metodo":"Modelos Cox o de tiempo de falla acelerado (lifelines, que el kit no trae), validados contra una referencia independiente. Solo con suficientes fallas por nivel de covariable; con pocas, estratificar y comparar con Kaplan-Meier.","porque":"El trabajo sobre XJTU-SY usó CoxPH y bosque de supervivencia con censura en banco (E-8009), lo que muestra el método pero no sus resultados en campo.","evidencia":["E-8009"],"nivel":"SINTESIS"},{"situacion":"Qué datos recolectar: registro de FALLAS (un renglón por evento)","metodo":"Campos mínimos: identificador de la chumacera y de la polea (motriz, cola, desvío), identificador de la faja o línea; fecha y hora de instalación con la unidad de tiempo elegida (horas de operación, no solo calendario); horas acumuladas de operación al fallar; fecha y hora de la falla; criterio de falla aplicado (alarma de vibración o temperatura, ruido, fuga de grasa, parada, hallazgo en inspección); modo de falla confirmado y cómo se confirmó (rodamiento retirado, análisis); si la unidad era nueva o reacondicionada y cuántas vidas previas tuvo; marca, modelo y tipo de rodamiento y de chumacera, sello y lubricante; condiciones (carga, velocidad, ambiente con polvo o humedad, historial de relubricación y de alineación); si la falla fue funcional o potencial; consecuencia (parada, horas perdidas).","porque":"Sin tiempo a la falla en horas de operación, el criterio de falla y el modo, no es posible un Weibull válido ni separar modos. Se pide registrar la vida acumulada y las intervenciones, porque L10 y la vida modificada dependen de lubricación, contaminación y desalineación (E-6003).","evidencia":["E-6003","E-6002"],"nivel":"SINTESIS"},{"situacion":"Qué datos recolectar: registro de CENSURA (un renglón por chumacera sin falla en el periodo)","metodo":"Campos mínimos: identificador de la chumacera y la polea; fecha de instalación y horas de operación acumuladas; fecha de fin de observación o de salida del estudio; motivo de la censura (sigue operando, reemplazo preventivo, reemplazo por otra falla, cambio de polea, venta o retiro de la línea); horas de operación en esa fecha; si fue retirada con daño visible; mismas covariables que el registro de fallas. Incluir TODAS las chumaceras instaladas, también las que nunca fallaron, y reportar el tamaño de la población en riesgo.","porque":"La censura por la derecha es la información de las unidades sobrevivientes; omitirla sesga la vida a la baja. Las fallas raras y los datos censurados son la norma (E-8009).","evidencia":["E-8009"],"nivel":"SINTESIS"},{"situacion":"Reglas de calidad del registro para un Weibull válido","metodo":"Todas las unidades empiezan nuevas, o la edad inicial se registra; mismo criterio de falla en todas; modos separados; una sola unidad de tiempo; sin eventos duplicados; fecha de fin de observación común y declarada; informar unidades sin eventos. Reportar sensibilidad a la ventana final, a duplicados y a la cola con pocas unidades en riesgo. Si el intervalo de β contiene 1, la conclusión es falla aleatoria y no hay base para reemplazo por edad. No se recomienda intervalo de reemplazo sin costos (lo cierra economía).","porque":"Criterios del protocolo de estadística de vida del equipo, que aplican a cualquier ajuste futuro; los umbrales numéricos son del kit, no de una fuente de la base.","evidencia":["E-6003"],"nivel":"SINTESIS"}],"vacios":["No hay datos de falla ni de censura del activo: no se calculó ningún parámetro de vida, intervalo, AIC ni MTBF.","No se verificó cuántas de las 17 unidades de E-7001 fallaron ni su censura (pendiente leer la bitácora y E-7010).","La licencia de XJTU-SY (E-7002) no está declarada en el espejo y sus cifras son solo de pistas de buscador (E-7004).","Pistas sin abrir que no respaldan nada: E-6005 a E-6008 (L10 comercial, modos de falla de poleas), E-6009 (fuente primaria del dato de rodillos), E-7004 a E-7006 (otros bancos), E-7007 a E-7009 (parámetros Weibull publicados o asumidos).","No se leyó ninguna cifra de L10 de poleas de faja ni ISO 281 en su edición vigente (E-8512 es solo snippet); las horas de diseño comerciales no se reportan.","No hay una fuente leída sobre tasa de falla ni vida de chumaceras de poleas en campo (el dato de rodillos es cita secundaria).","No se calculó nada con el kit; solo se ejecutó su suite de pruebas (las pruebas del kit) y se usó para describir criterios (umbrales del código para 10 y 30 fallas).","El criterio de falla y la definición de reemplazo y de censura deben acordarse con el experto del activo antes de recolectar datos."]},"predictivo":{"hallazgos":[{"id":"P1","texto":"La envolvente es la técnica que las revisiones narrativas describen, sin validación en fajas, para detectar y localizar el defecto: filtra en la resonancia, demodula y aplica FFT; tiene alta sensibilidad e inmunidad al ruido y permite identificar tipo y ubicación. Su dificultad declarada es elegir la banda del filtro. El espectro de velocidad solo detecta defectos en etapas tardías.","nivel":"EVIDENCIA","evidencia":["E-8001","E-8006"],"nota":"Revisiones y introducciones, sin ensayo propio ni datos de fajas."},{"id":"P2","texto":"Las frecuencias características (BPFO, BPFI, BSF, FTF) se calculan con la geometría del rodamiento, la velocidad del eje y el ángulo de contacto. En el activo requieren datos de placa del rodamiento y velocidad real de la polea; no se dan valores.","nivel":"SINTESIS","evidencia":["E-8008"],"nota":"Ecuaciones en el p
