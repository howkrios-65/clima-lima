te): sin fuente leída; hay pistas sin abrir.","Contaminación y sellado en chumaceras de transportadores: un congreso brasileño solo como pista; no se usa ninguna cifra.","Clasificación de modos de daño (norma y guías de fabricantes): solo resúmenes de buscador.","Ranking de componentes con base de datos, tamaño y año: la fuente primaria probable no se leyó; el dato de rodillos es cita secundaria.","Sin fuente leída sobre técnicas para verificar ajustes, carga real o alineación: quedan como verificaciones de campo a definir por un experto.","Sin técnicas leídas de análisis post mortem del rodamiento (metalografía, microscopía): las pruebas propuestas son inspecciones generales, no ensayos citados.","Tiempos de aviso por técnica y criterios de alarma de vibración para poleas lentas: sin fuente leída."],"ishikawa_notas":{"Mano de obra":"SIN DATOS PARA ARMARLO (parcial). Datos que faltan: rol de turnos y dotación, matriz de competencias y formación, procedimiento vigente de montaje y de engrase, registros de intervenciones y análisis humano previo.","Medio ambiente":"SIN DATOS PARA ARMARLO (parcial). Datos que faltan: concentración de polvo y humedad, temperatura ambiente y del soporte, tipo de material transportado, frecuencia de lavado, clima local y estado de la estructura de apoyo."}},"lcc":{"modo_de_falla":"Falla de la chumacera de la polea de una faja transportadora","elementos":[{"id":"C1","nombre":"Adquisición de chumacera y rodamiento (y sello/accesorios)","tipo":"capex","como_se_calcula":"Σ(precio unitario × cantidad) de chumacera, rodamiento, sellos, adaptador, fletes e impuestos no recuperables; si se prorratea, dividir por años de vida del conjunto.","fuente_del_dato":"Cotización o contrato de compra, ERP/almacén.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6003"],"nota":"Estructura estándar de costos del equipo; los ids citados solo contextualizan el modo de falla y no son premisa de este costo. Debe ser validado por un experto.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C2","nombre":"Instalación y puesta en marcha","tipo":"capex","como_se_calcula":"Horas-persona × tarifa horaria + equipos de izaje/andamios + horas de parada de faja para el montaje (esta última se valora en C7) + alineación y verificación.","fuente_del_dato":"Orden de trabajo, planilla de personal, contratos de servicio.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6002","E-6001"],"nota":"Razonamiento de ingeniería del equipo a partir de las premisas citadas; debe ser validado por un experto del activo. Premisa: desalineación y ajustes apretados figuran como causas de daño (E-6002; E-6001 menciona desalineación en rodillos). Por eso el costo de alinear bien es parte de la instalación. Dato: Orden de trabajo, planilla de personal, contratos de servicio.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C3","nombre":"Lubricación y mantenimiento rutinario","tipo":"opex","como_se_calcula":"(Frecuencia anual de engrase o cambio) × (horas-persona × tarifa + costo de lubricante y consumibles) + costo de limpieza y sellado; por año.","fuente_del_dato":"Plan de lubricación, órdenes de trabajo, consumo de almacén.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6001","E-6002"],"nota":"Razonamiento de ingeniería del equipo a partir de las premisas citadas; debe ser validado por un experto del activo. Premisa: lubricación inadecuada y contaminación son factores de daño citados (E-6001, E-6002). La frecuencia y cantidad correctas no están en el registro. Dato: Plan de lubricación, órdenes de trabajo, consumo de almacén.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C4","nombre":"Inspección y monitoreo de condición","tipo":"opex","como_se_calcula":"Costo anual de ruta de medición = (mediciones/año × horas × tarifa) + depreciación y calibración del instrumento + software/licencias; o, si es permanente, costo del sensor y su mantenimiento por año.","fuente_del_dato":"Plan de inspección, inventario de instrumentos, contratos.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-8003","E-8008"],"nota":"Razonamiento de ingeniería del equipo a partir de las premisas citadas; debe ser validado por un experto del activo. Premisa: existen técnicas de vibración y etapas de degradación que dan aviso antes de la falla (E-8003, E-8008). El costo de medirlas es del activo y se compara contra el costo de falla evitado. Dato: Plan de inspección, inventario de instrumentos, contratos.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C5","nombre":"Repuestos e inventario","tipo":"repuesto","como_se_calcula":"Costo de mantener = (valor del inventario × tasa de mantenimiento de inventario declarada) por año + costo de pedidos; cantidad a mantener según demanda observada, tiempo de reposición y nivel de servicio declarado (para demanda intermitente, método con bootstrap o variantes; declarar la herramienta).","fuente_del_dato":"Historial de consumo, tiempos de reposición del proveedor, política de almacén.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6003","E-7003"],"nota":"Razonamiento de ingeniería del equipo a partir de las premisas citadas; debe ser validado por un experto del activo. Premisa: la vida es aleatoria (E-6003) y con pocas fallas observadas la estimación de demanda es incierta (E-7003, n=2). No hay demanda observada en el registro. Dato: Historial de consumo, tiempos de reposición del proveedor, política de almacén.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C6","nombre":"Costo de falla correctiva directo","tipo":"falla","como_se_calcula":"Cf_directo = reparación de urgencia (horas × tarifa × recargo) + piezas dañadas colaterales (eje, polea, carcasa) + servicios externos + consecuencias de seguridad o ambientales valoradas. Se separa de C7 para no duplicar.","fuente_del_dato":"Órdenes correctivas, reportes de incidente, análisis de falla.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6001","E-6002"],"nota":"Estructura estándar de costos del equipo; los ids citados solo contextualizan el modo de falla y no son premisa de este costo. Debe ser validado por un experto.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C7","nombre":"Indisponibilidad y pérdida de producción","tipo":"indisponibilidad","como_se_calcula":"Horas de parada (por falla en C7a y por mantenimiento preventivo en C7b) × margen perdido por hora (o costo de recuperación con horas extra) × fracción no recuperable. Parada no planificada y planificada con valores distintos.","fuente_del_dato":"Registro de paradas (CMMS/SCADA), plan de producción y margen aportado por finanzas.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6001"],"nota":"Estructura estándar de costos del equipo; los ids citados solo contextualizan el modo de falla y no son premisa de este costo. Debe ser validado por un experto.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."},{"id":"C8","nombre":"Disposición y fin de vida","tipo":"disposicion","como_se_calcula":"Costo de retiro y disposición del conjunto − valor de recuperación (chatarra, reacondicionado), por evento; se trae a valor presente al año del evento.","fuente_del_dato":"Contratos de disposición, valor de chatarra, política ambiental.","valor":null,"unidad":null,"nivel":"SINTESIS","evidencia":["E-6002"],"nota":"Estructura estándar de costos del equipo; los ids citados solo contextualizan el modo de falla y no son premisa de este costo. Debe ser validado por un experto.","nivel_evidencia_nota":"Los ids citados solo respaldan la premisa cualitativa; ninguna fuente del registro contiene valores de costo."}],"formulas":[{"nombre":"Costo de ciclo de vida (LCC)","expresion":"LCC = C1 + C2 + Σ_{t=1..N} [C3_t + C4_t + C5_t + Cf·λ_t + C7_t] / (1+r)^t + C8/(1+r)^N, con λ_t = número esperado de fallas en el año t y r = tasa de descuento declarada por la persona.","nivel":"SINTESIS","evidencia":["E-6003"],"nota":"Antes de usarla, unificar la definición de Cf (reposición, instalación, indisponibilidad por falla) con la de C(T) y separar C7 en parada por falla y parada preventiva para no contar dos veces; el índice del VPN debe coincidir con el número de flujos."},{"nombre":"Valor presente neto (VPN)","expresion":"VPN = Σ_{k=0..n} F_k / (1+r)^(t0+k), donde F_k es el flujo del año k.","nivel":"SINTESIS","evidencia":["E-6003"],"nota":"Relación estándar tomada de la teoría de renovación y de la ingeniería económica; NO tiene fuente en el registro de evidencia. Se cita como SINTESIS: verificar en una fuente (texto de ingeniería económica o de confiabilidad) antes de usar. Implementado en economics.npv."},{"nombre":"Costo anual equivalente (CAE / EAC)","expresion":"CAE = VPN · r / (1 − (1+r)^(−n)); si r = 0, CAE = VPN / n.","nivel":"SINTESIS","evidencia":["E-6003"],"nota":"Relación estándar tomada de la teoría de renovación y de la ingeniería económica; NO tiene fuente en el registro de evidencia. Se cita como SINTESIS: verificar en una fuente (texto de ingeniería económica o de confiabilidad) antes de usar. Implementado en economics.eac."},{"nombre":"Costo por unidad de tiempo con reemplazo por edad T","expresion":"C(T) = (Cp·R(T) + Cf·(1−R(T))) / ∫0^T R(t) dt, con R(t)=exp(−(t/η)^β) si se adopta Weibull. Cp = costo del reemplazo preventivo (C1+C2+C7b+C8 neto); Cf = costo del reemplazo por falla (C1+C2+C6+C7a+C8 neto).","nivel":"SINTESIS","evidencia":["E-6003","E-7003"],"nota":"Relación estándar tomada de la teoría de renovación y de la ingeniería económica; NO tiene fuente en el registro de evidencia. Se cita como SINTESIS: verificar en una fuente (texto de ingeniería económica o de confiabilidad) antes de usar. E-6003 respalda que R(t) describe la proporción de la población que sobrevive; E-7003 advierte que con n=2 fallas Weibull es inviable. β, η, Cp y Cf son datos del activo (null); sin ellos C(T) no se evalúa."},{"nombre":"Condición de existencia de edad óptima","expresion":"Mínimo interior de C(T) solo si β > 1 y Cf > Cp. Si no, se declara: no hay edad óptima calculable (no se fuerza un número). Referencia sin reemplazo preventivo: C(∞) = Cf / (η·Γ(1+1/β)).","nivel":"SINTESIS","evidencia":["E-6003","E-7003"],"nota":"Relación estándar tomada de la teoría de renovación y de la ingeniería económica; NO tiene fuente en el registro de evidencia. Se cita como SINTESIS: verificar en una fuente (texto de ingeniería económica o de confiabilidad) antes de usar. Comportamiento observado en economics.optimal_age_replacement (ver prueba_implementacion)."}],"parametros_requeridos_del_activo":{"beta":null,"eta":null,"intervalo_beta":null,"Cp":null,"Cf":null,"tasa_descuento_r":null,"horizonte_N":null,"unidad_tiempo":null,"nota":"Todos null: los ingresa la persona o un experto del activo en el informe interactivo. β debe venir del analista de vida con su intervalo."},"prueba_implementacion":{"etiqueta":"PRUEBA DE LA IMPLEMENTACIÓN, NO ES DATO DEL ACTIVO NI REFERENCIA PARA DECIDIR","kit":"tools/reliability/reliability_kit/economics.py","entrada_arbitraria":{"beta":2.5,"eta":1.0,"Cp":1.0,"Cf":5.0,"unidades":"adimensionales"},"resultado":["optimal_age_replacement devolvió T*≈0.49305 y C(T*)≈3.46204; una búsqueda en rejilla independiente de C(T)=(Cp·R+Cf·(1−R))/∫R (trapecio) dio T≈0.4932 y C≈3.46204: coinciden (diferencia en C(T*) ≈ 3e-10).","age_replacement_cost_rate(0.7) coincide con la fórmula escrita aquí (diferencia ≈ 6e-10).","El costo sin prevención del kit coincide con Cf/(η·Γ(1+1/β)) (5.6353 en ambos).","β=1.0 devuelve optimal_age=None y Cf=Cp devuelve optimal_age=None (la herramienta niega la edad óptima como indica la condición de existencia).","npv y eac coinciden con la suma directa de flujos descontados y con VPN·r/(1−(1+r)^−n) (flujos [3,2,2,2,2], r=0.1: VPN≈9.3397, CAE≈2.4638)."],"conclusion":"Las fórmulas de este archivo coinciden con la implementación del kit. Esto verifica el código, no la validez económica para el activo."},"vacios":["Sin datos de costo en el registro: ninguna de las 63 entradas contiene precios, tarifas, costos de falla ni de parada. Los 8 elementos quedan con valor y unidad en null. No se calcula LCC, CAE ni VPN.","Sin edad óptima de reemplazo: faltan Cp, Cf (datos de la persona) y β, η del activo con intervalo. No hay datos de campo de chumaceras de polea; los Weibull publicados están solo como SOLO-SNIPPET (E-7007 a E-7009), que no pueden respaldar nada. Los ensayos abiertos verificados (E-7003, n=2) no permiten ajustar Weibull.","Las fórmulas (LCC, VPN, CAE, C(T)) no tienen fuente en el registro: son SINTESIS (relaciones estándar a verificar en una fuente). Se recomienda abrir y registrar un texto de ingeniería económica y el de Barlow-Proschan (referencia que cita el docstring del kit) como evidencia verificada.","Sin tasa de descuento, horizonte ni moneda: los declara la persona.","Sin datos de repuestos: demanda observada, tiempo de reposición, nivel de servicio y criticidad por consecuencia.","Sin definición local de la tasa de repetición de fallas, cumplimiento de PM, backlog y costo de mantenimiento sobre valor de reposición: preguntar qué definición usa la planta.","Costo de indisponibilidad (margen por hora, recuperabilidad de la producción) depende de la operación: dato de finanzas/producción.","Cp y Cf deben definirse sin doble conteo entre C6 y C7, y con el mismo criterio de tramos de tiempo de reparación (incluir o no diagnóstico y espera logística): definir cuál versión se adopta.","Definición de Cf y de C7 pendiente de unificar entre la fórmula LCC y la de reemplazo por edad (posible doble conteo de la parada por falla)."]},"vida":{"hallazgos":[{"id":"V1","texto":"No existen datos de falla del activo, por lo que no se ajusta ningún Weibull ni se reporta β, η, B10 ni MTBF. Cualquier número de vida para esta chumacera sería inventado.","nivel":"SINTESIS","evidencia":["E-7003","E-8009"],"nota":"Razonamiento: las únicas series hasta la falla halladas son de banco (E-7003, E-8009), no del activo. Debe ser validado por un experto del activo."},{"id":"V2","texto":"La vida nominal básica L10 (ISO 281) es el valor de vida que el 90 % de una población de rodamientos idénticos, de buena calidad y en condiciones convencionales, alcanza o supera; es decir, se espera que 10 % falle antes. La vida nominal modificada incorpora viscosidad del lubricante, contaminación y límite de carga de fatiga; ISO/TS 16281 añade desalineación, inclinación y holgura. (ISO/TS 16281: no está en el registro de normas; NO-VERIFICADO, edición no verificada.)","nivel":"EVIDENCIA","evidencia":["E-6003"],"nota":"Fuente de aerogeneradores (rodamiento principal) usada solo por la definición. La edición de ISO 281 no se verificó."},{"id":"V3","texto":"L10 es una vida de diseño por fatiga de contacto de una población, no una predicción de la vida de la chumacera instalada: la misma fuente indica que predice solo fatiga y no otras causas. Las causas de daño listadas (carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión, fretting) quedan fuera de L10 salvo en la medida en que la vida modificada o ISO/TS 16281 las incorpore.","nivel":"SINTESIS","evidencia":["E-6003","E-6002"],"nota":"Razonamiento: se contrasta la definición de L10 (E-6003) con la lista de causas de daño (E-6002). Debe ser validado por un experto del activo. Mezcla hechos de las fuentes con inferencias del equipo: que L10 solo cubre fatiga y que el banco no representa una polea lenta de faja son criterios del equipo; la exactitud entre condiciones de banco no mide transferencia a campo."},{"id":"V4","texto":"En bombas, un autor atribuye el 90 % de las fallas prematuras de rodamientos de bolas a corrosión por contaminación, mal manejo e instalación, falla de lubricante o sobrecalentamiento por ajustes inadecuados. Por analogía de mecanismos, la vida real puede quedar muy por debajo de L10 por causas de instalación, lubricación y contaminación, lo que impide usar L10 como vida esperada.","nivel":"SINTESIS","evidencia":["E-6004","E-6003"],"nota":"Razonamiento por analogía (bombas, resumen de 1988, sin n ni base de datos). No es estadística de poleas. Debe ser validado por un experto del activo."},{"id":"V5","texto":"Las cifras de L10 de práctica comercial solo existen como pistas de buscador sin abrir (E-6006, E-6007) y no se usan como valores.","nivel":"SINTESIS","evidencia":["E-6003"],"nota":"Las pistas E-6006 y E-6007 están pendientes de abrir; no respaldan nada. Lo verificado es solo la definición de L10. Debe ser validado por un experto del activo."},{"id":"V6","texto":"Dato abierto verificado E-7001 (Paderborn, CC BY 4.0): 17 rodamientos de bolas con vibración de dos acelerómetros y bitácora, en banco con carga y velocidad variables. El README no declara cuántos terminaron en falla ni si hay censura, y los tiempos solo saldrían tras leer la bitácora. No es faja ni chumacera con soporte.","nivel":"EVIDENCIA","evidencia":["E-7001"],"nota":"n_fallas y censura quedan NO-VERIFICADO en la propia entrada."},{"id":"V7","texto":"Dato abierto verificado E-7003 (UNSW, CC BY 4.0, subconjunto): 2 ensayos (Test 1 y 3) hasta la falla por defecto de pista externa, 80 y 79 registros, banco a 6 Hz y 10,5 kN, sin censura declarada. Son 2 fallas: mínimo absoluto, inviable para un Weibull con intervalo útil; las unidades son de un mismo diseño de laboratorio, no una población de campo.","nivel":"EVIDENCIA","evidencia":["E-7003"],"nota":"Los 80 y 79 son registros de vibración de cada ensayo, no fallas."},{"id":"V8","texto":"Un tercer conjunto, XJTU-SY (copia en el Hub), no tiene licencia declarada en el espejo y sus cifras (n, condiciones) provienen solo de pistas de buscador (E-7004). Se lista como pendiente, no como dato.","nivel":"EVIDENCIA","evidencia":["E-7002"],"nota":"El ReadMe no se pudo leer; pedir licencia al autor original antes de redistribuir."},{"id":"V9","texto":"Por qué los datos abiertos no sirven para la vida de la chumacera de una polea: (1) son de laboratorio, con rodamientos pequeños sin soporte, sin polvo, sin la carga de la faja ni el montaje en chumacera; (2) en el trabajo con XJTU-SY los autores señalan que se corre hasta la falla con carga muy alta para acelerar la degradación, con riesgo de calentamiento local y daño descontrolado, es decir otro mecanismo y vidas de minutos frente a una polea de baja velocidad; (3) hay muy pocas unidades y fallas (2 en E-7003; sin declarar en E-7001); (4) son unidades de un mismo ensayo, no una población de campo con historia de operación y de mantenimiento; (5) la exactitud reportada en bancos no se traslada a campo.","nivel":"SINTESIS","evidencia":["E-8009","E-7003","E-7001","E-8520"],"nota":"E-8520 ilustra que la exactitud de laboratorio cae al cambiar de condición (40,64 % al retener 1000 rpm). Punto 1 es inferencia sobre E-7001 y E-7003; Debe ser validado por un experto del activo. Mezcla hechos de las fuentes con inferencias del equipo: que L10 solo cubre fatiga y que el banco no representa una polea lenta de faja son criterios del equipo; la exactitud entre condiciones de banco no mide transferencia a campo."},{"id":"V10","texto":"Los trabajos de vida remanente sobre bancos (XJTU-SY y PRONOSTIA) citan en su introducción que una fracción de las fallas de maquinaria se atribuye a rodamientos, pero es cita secundaria sin fuente leída y no es dato de planta. El resumen de otro trabajo afirma que las fallas son raras y los datos están censurados, lo que justifica un método con censura y no promediar solo tiempos de falla.","nivel":"SINTESIS","evidencia":["E-8519","E-8009"],"nota":"Usar como contexto, no como tasa. Mezcla hechos de las fuentes con inferencias del equipo: que L10 solo cubre fatiga y que el banco no representa una polea lenta de faja son criterios del equipo; la exactitud entre condiciones de banco no mide transferencia a campo."},{"id":"V11","texto":"Una cita secundaria indica que más de 50 % de las fallas de transportadores se deben a rodillos (idlers), no a chumaceras de poleas; la fuente primaria probable (sin leer) (E-6009) no se leyó. No se debe usar para dimensionar la población de la chumacera de polea.","nivel":"EVIDENCIA","evidencia":["E-6001"],"nota":"Cifra sin base de datos, tamaño ni año."},{"id":"V12","texto":"Los parámetros Weibull publicados que aparecen como pistas de buscador (E-7007 a E-7009) NO se usan: no se leyeron. Un β asumido (Weibayes) solo sería admisible como supuesto explícito, rotulado y con análisis de sensibilidad, nunca como resultado.","nivel":"SINTESIS","evidencia":["E-6003","E-7003"],"nota":"Razonamiento de método: sin datos propios, un β tomado de otra fuente es un supuesto, no una estimación. Las pistas E-7007 a E-7009 siguen pendientes de abrir. Debe ser validado por un experto del activo."}],"metodo_recomendado":[{"situacion":"Sin datos de falla propios (situación actual)","metodo":"No ajustar Weibull. Tratar L10 o la vida modificada solo como referencia de diseño; priorizar un registro de fallas y de censura y, mientras tanto, gestionar por condición (inspección y monitoreo) en vez de por edad. Si se usara Weibayes con β asumido, rotularlo como supuesto con rango de sensibilidad y sin conclusión de reemplazo por edad.","porque":"L10 es vida de población por fatiga de contacto (E-6003) y los datos abiertos son de banco (E-7003, E-8009).","evidencia":["E-6003","E-7003","E-8009"],"nivel":"SINTESIS"},{"situacion":"Pocas fallas propias (exploratorio)","metodo":"Weibull de máxima verosimilitud con intervalo por razón de verosimilitud (weibull_beta_ci_lr, weibull_b_life_ci_lr) y bootstrap (weibull_bootstrap_ci), corrección de sesgo de β (bias_correct_beta) reportando ambos valores, y Kaplan-Meier sin supuestos con km_failure_quantile. El kit advierte por debajo de 10 fallas (exploratorio, se rotula así) y por debajo de 30 (β con posible sesgo al alza). Si el intervalo de β contiene 1 no hay base para reemplazo por edad. Si compare_models_verdict da empate, no justificar la estrategia en la forma de la distribución.","porque":"Con n pequeño el intervalo es ancho; las dos fallas de E-7003 muestran que n=2 no permite un intervalo útil. Los umbrales 10 y 30 son criterios del kit (weibull.py), no de una fuente de la base de evidencia.","evidencia":["E-7003"],"nivel":"SINTESIS"},{"situacion":"Con censura (unidades que siguen operando o se reemplazaron sin fallar)","metodo":"Tratar toda chumacera sin falla como censura por la derecha y ajustar con verosimilitud censurada (fit_weibull_mle con censura), Kaplan-Meier y comparación lognormal y exponencial. Un reemplazo preventivo, un cambio por otra causa o una intervención es censura, no falla. No excluir las censuradas ni promediar solo los tiempos de falla.","porque":"Las fallas son raras y los datos son censurados en este tipo de problema (E-8009); quitar las censuras sesga la vida a la baja. La separación falla/censura se define con el experto del activo.","evidencia":["E-8009"],"nivel":"SINTESIS"},{"situacion":"Ítem reparable (la chumacera se cambia pero la polea o el eje sigue en servicio)","metodo":"No ajustar Weibull a los tiempos entre fallas sin probar tendencia. Por unidad: laplace_trend_test y fit_crow_amsaa. Con varias poleas y fines de observación distintos: mean_cumulative_function con intervalo, fit_crow_amsaa_multi (modelo condicional), laplace_trend_test_multi y unit_heterogeneity_test. Nunca concatenar los tiempos de varias poleas en una serie. Si cada chumacera se trata como ítem no reparable (primera vida tras cada instalación), definirlo explícitamente y usar Weibull con censura.","porque":"Reglas del protocolo de estadística de vida. La vida tras una reparación depende de la calidad del montaje, la lubricación y la alineación (E-6004, E-6002), no solo de la edad.","evidencia":["E-6004","E-6002"],"nivel":"SINTESIS"},{"situacion":"Modos de falla mezclados","metodo":"Separar por modo (fatiga de contacto, lubricación, contaminación, desalineación o ajuste, daño de montaje) y por posición de la polea (motriz y de cola), con los demás modos como censura. Un ajuste mixto con curva quebrada en el gráfico de probabilidad suele indicar poblaciones mezcladas. La clasificación del modo en cada falla requiere análisis de causa raíz o inspección del rodamiento retirado.","porque":"La literatura clasifica los daños por causas distintas (E-6002) y L10 cubre solo fatiga (E-6003). Mezclar modos da un β intermedio sin sentido físico.","evidencia":["E-6002","E-6003"],"nivel":"SINTESIS"},{"situacion":"Con covariables (carga, ambiente con polvo, tipo de lubricación, polea motriz o de cola)","metodo":"Modelos Cox o de tiempo de falla acelerado (lifelines, que el kit no trae), validados contra una referencia independiente. Solo con suficientes fallas por nivel de covariable; con pocas, estratificar y comparar con Kaplan-Meier.","porque":"El trabajo sobre XJTU-SY usó CoxPH y bosque de supervivencia con censura en banco (E-8009), lo que muestra el método pero no sus resultados en campo.","evidencia":["E-8009"],"nivel":"SINTESIS"},{"situacion":"Qué datos recolectar: registro de FALLAS (un renglón por evento)","metodo":"Campos mínimos: identificador de la chumacera y de la polea (motriz, cola, desvío), identificador de la faja o línea; fecha y hora de instalación con la unidad de tiempo elegida (horas de operación, no solo calendario); horas acumuladas de operación al fallar; fecha y hora de la falla; criterio de falla aplicado (alarma de vibración o temperatura, ruido, fuga de grasa, parada, hallazgo en inspección); modo de falla confirmado y cómo se confirmó (rodamiento retirado, análisis); si la unidad era nueva o reacondicionada y cuántas vidas previas tuvo; marca, modelo y tipo de rodamiento y de chumacera, sello y lubricante; condiciones (carga, velocidad, ambiente con polvo o humedad, historial de relubricación y de alineación); si la falla fue funcional o potencial; consecuencia (parada, horas perdidas).","porque":"Sin tiempo a la falla en horas de operación, el criterio de falla y el modo, no es posible un Weibull válido ni separar modos. Se pide registrar la vida acumulada y las intervenciones, porque L10 y la vida modificada dependen de lubricación, contaminación y desalineación (E-6003).","evidencia":["E-6003","E-6002"],"nivel":"SINTESIS"},{"situacion":"Qué datos recolectar: registro de CENSURA (un renglón por chumacera sin falla en el periodo)","metodo":"Campos mínimos: identificador de la chumacera y la polea; fecha de instalación y horas de operación acumuladas; fecha de fin de observación o de salida del estudio; motivo de la censura (sigue operando, reemplazo preventivo, reemplazo por otra falla, cambio de polea, venta o retiro de la línea); horas de operación en esa fecha; si fue retirada con daño visible; mismas covariables que el registro de fallas. Incluir TODAS las chumaceras instaladas, también las que nunca fallaron, y reportar el tamaño de la población en riesgo.","porque":"La censura por la derecha es la información de las unidades sobrevivientes; omitirla sesga la vida a la baja. Las fallas raras y los datos censurados son la norma (E-8009).","evidencia":["E-8009"],"nivel":"SINTESIS"},{"situacion":"Reglas de calidad del registro para un Weibull válido","metodo":"Todas las unidades empiezan nuevas, o la edad inicial se registra; mismo criterio de falla en todas; modos separados; una sola unidad de tiempo; sin eventos duplicados; fecha de fin de observación común y declarada; informar unidades sin eventos. Reportar sensibilidad a la ventana final, a duplicados y a la cola con pocas unidades en riesgo. Si el intervalo de β contiene 1, la conclusión es falla aleatoria y no hay base para reemplazo por edad. No se recomienda intervalo de reemplazo sin costos (lo cierra economía).","porque":"Criterios del protocolo de estadística de vida del equipo, que aplican a cualquier ajuste futuro; los umbrales numéricos son del kit, no de una fuente de la base.","evidencia":["E-6003"],"nivel":"SINTESIS"}],"vacios":["No hay datos de falla ni de censura del activo: no se calculó ningún parámetro de vida, intervalo, AIC ni MTBF.","No se verificó cuántas de las 17 unidades de E-7001 fallaron ni su censura (pendiente leer la bitácora y E-7010).","La licencia de XJTU-SY (E-7002) no está declarada en el espejo y sus cifras son solo de pistas de buscador (E-7004).","Pistas sin abrir que no respaldan nada: E-6005 a E-6008 (L10 comercial, modos de falla de poleas), E-6009 (fuente primaria del dato de rodillos), E-7004 a E-7006 (otros bancos), E-7007 a E-7009 (parámetros Weibull publicados o asumidos).","No se leyó ninguna cifra de L10 de poleas de faja ni ISO 281 en su edición vigente (E-8512 es solo snippet); las horas de diseño comerciales no se reportan.","No hay una fuente leída sobre tasa de falla ni vida de chumaceras de poleas en campo (el dato de rodillos es cita secundaria).","No se calculó nada con el kit; solo se ejecutó su suite de pruebas (las pruebas del kit) y se usó para describir criterios (umbrales del código para 10 y 30 fallas).","El criterio de falla y la definición de reemplazo y de censura deben acordarse con el experto del activo antes de recolectar datos."]},"predictivo":{"hallazgos":[{"id":"P1","texto":"La envolvente es la técnica que las revisiones narrativas describen, sin validación en fajas, para detectar y localizar el defecto: filtra en la resonancia, demodula y aplica FFT; tiene alta sensibilidad e inmunidad al ruido y permite identificar tipo y ubicación. Su dificultad declarada es elegir la banda del filtro. El espectro de velocidad solo detecta defectos en etapas tardías.","nivel":"EVIDENCIA","evidencia":["E-8001","E-8006"],"nota":"Revisiones y introducciones, sin ensayo propio ni datos de fajas."},{"id":"P2","texto":"Las frecuencias características (BPFO, BPFI, BSF, FTF) se calculan con la geometría del rodamiento, la velocidad del eje y el ángulo de contacto. En el activo requieren datos de placa del rodamiento y velocidad real de la polea; no se dan valores.","nivel":"SINTESIS","evidencia":["E-8008"],"nota":"Ecuaciones en el preprint; los valores del activo son vacío. Las ecuaciones no figuran en el extracto registrado: verificar en la fuente."},{"id":"P3","texto":"La kurtosis detecta defecto incipiente pero NO es monótona: vuelve a valores normales cuando el defecto se extiende. Por tanto, una kurtosis baja no prueba un rodamiento sano y no sirve sola para pronóstico.","nivel":"EVIDENCIA","evidencia":["E-8003"],"nota":"Revisión de 2008 que no cuantifica tiempos de aviso ni trata fajas."},{"id":"P4","texto":"Los umbrales de kurtosis 3 (operación con restricciones) y 5 (inaceptable) circulan en la literatura, pero los autores de la revisión no hallaron sustento teórico ni empírico, y no hay datos públicos de su fiabilidad. No son estándar para chumaceras de fajas y no se adoptan como alarma.","nivel":"EVIDENCIA","evidencia":["E-8001"],"nota":"Se citan solo para advertir que no están validados."},{"id":"P5","texto":"Las etapas de degradación descritas son cualitativas: 1 ultrasonido; 2 resonancia natural con defecto inicial; 3 frecuencias de defecto y armónicos; 4 etapa final previa a la falla. No traen duraciones, por lo que no permiten fijar un intervalo P-F.","nivel":"EVIDENCIA","evidencia":["E-8008"],"nota":"Datos de banco acelerado; sin tiempos de aviso."},{"id":"P6","texto":"Los resultados de ML en banco no demuestran generalización: una exactitud de 99,4 % no dice qué partición usó (por activo, condición o segmentos al azar); con partición que retiene una condición, la exactitud cae a 40,64 % en JNU, bajo una línea base de clase mayoritaria, mientras la regresión logística (57,91 %) generaliza mejor que los conjuntos de árboles.","nivel":"EVIDENCIA","evidencia":["E-8007","E-8010"],"nota":"Resúmenes de autores, preprints no arbitrados, sin fajas. E-8010 es un preprint 2026 de identificador no contrastado."},{"id":"P7","texto":"Los propios autores reconocen que muchas técnicas se desarrollan y prueban en condiciones controladas, lo que limita su adaptabilidad. Las mejoras reportadas (hasta 15,8 %) son frente a una referencia elegida por los autores, en banco.","nivel":"EVIDENCIA","evidencia":["E-8011","E-8518"],"nota":"No son prueba de desempeño en campo."},{"id":"P8","texto":"Un modelo de supervivencia (CoxPH, bosque de supervivencia) se validó para vida remanente en un conjunto de banco acelerado, con error en minutos y censura aleatoria. Sirve como método candidato por tratar la censura, pero la escala (minutos, carga muy alta) no se traslada a una polea de baja velocidad con vida de meses.","nivel":"EVIDENCIA","evidencia":["E-8009"],"nota":"Preprint no arbitrado; el error no equivale a tiempo de aviso en campo."},{"id":"P9","texto":"Los bancos públicos abiertos (rodamientos de bolas, carga y velocidad variables o fallas aceleradas) sirven para depurar código y comparar métodos, no para fijar umbrales ni intervalos del activo. Uno de ellos tiene solo 2 ensayos de falla y sin censura declarada: mínimo absoluto para Weibull.","nivel":"SINTESIS","evidencia":["E-7001","E-7002","E-7003","E-8009"],"nota":"Razonamiento: banco no representa baja velocidad, soporte de chumacera ni lubricación de campo. Validar con un experto del activo."},{"id":"P10","texto":"La confianza mejora combinando vibración con aceite, termografía y otros indicadores, y la comparación contra una condición propia del activo es más defendible que un límite genérico.","nivel":"SINTESIS","evidencia":["E-8003","E-8001"],"nota":"Razonamiento: si el límite genérico no tiene sustento (P4), la referencia debe salir de datos propios del activo en buen estado. Validar con un experto del activo."},{"id":"P11","texto":"Un baseline de ingeniería (tendencia de envolvente en las frecuencias de defecto, más temperatura y condición del lubricante) debe existir y ser superado con evidencia antes de justificar cualquier modelo de aprendizaje. Con pocas fallas por modo, el aprendizaje supervisado no es estimable.","nivel":"SINTESIS","evidencia":["E-8010","E-8003","E-8009"],"nota":"Razonamiento: el único contraste de generalización leído muestra que un modelo simple supera a conjuntos de árboles fuera de la condición de entrenamiento. Validar con un experto del activo. E-8010 es un preprint 2026 de identificador no contrastado."}],"estrategia":[{"etapa":"0. Definición previa (sin modelo)","accion":"Fijar con el negocio el objetivo (detección, diagnóstico o RUL), el horizonte H y el costo de falso negativo frente a falso positivo; definir qué es 'falla funcional' y qué es censura (retiro preventivo, cambio por otra causa). Registrar velocidad real, datos de placa del rodamiento y configuración de la polea. Instalar el flujo de datos: mismo punto de medición, misma orientación, misma frecuencia de muestreo y bitácora de intervenciones.","condicion_para_avanzar":"Horizonte, costos y definición de falla aprobados por una persona responsable; punto y método de medición fijados. Valores: VACÍO hasta que el negocio los entregue.","evidencia":["E-8008","E-8009"],"nivel":"SINTESIS"},{"etapa":"1. Línea base y umbral desde datos propios","accion":"Medir el activo en buen estado y construir su referencia propia (RMS, kurtosis, espectro de envolvente en BPFO, BPFI, BSF, FTF, temperatura), con carta de control o tendencia. Elegir la banda de filtro de envolvente en el activo y documentarla. No usar kurtosis 3 y 5 como alarma: están sin sustento y la kurtosis cae al crecer el defecto. Los umbrales se expresan como desviación respecto de la línea base propia y los aprueba un experto del activo.","condicion_para_avanzar":"Línea base con mediciones repetidas del activo sano, verificación de repetibilidad del punto de medición y criterio de umbral aprobado por humano. Cantidad mínima de mediciones: VACÍO (no hay fuente leída).","evidencia":["E-8001","E-8003","E-8006"],"nivel":"SINTESIS"},{"etapa":"2. Detección (baseline estadístico)","accion":"Operar alerta por desviación de la línea base propia combinando envolvente, temperatura y aceite o grasa, en modo sombra (sin actuar) y registrando cada alerta con la inspección posterior. Medir falsas alarmas por activo-mes y recall por evento, no por puntos. Comparar contra el baseline de umbral de ingeniería y tendencia.","condicion_para_avanzar":"Piloto en sombra completado con alertas verificadas por inspección y falsos negativos revisados uno a uno. Para pasar a un detector aprendido: evidencia de que supera al baseline con validación hacia adelante y reserva de activos no vistos, y cantidad mínima de eventos reales según el protocolo del equipo (cifra: VACÍO).","evidencia":["E-8001","E-8003","E-8010"],"nivel":"SINTESIS","nota":"E-8010 es un preprint 2026 de identificador no contrastado."},{"etapa":"3. Diagnóstico (ubicación y tipo del defecto)","accion":"Usar el espectro de envolvente para atribuir la alerta a pista externa, interna, elemento rodante o jaula mediante las frecuencias características, y cruzarlo con las etapas de degradación (etapa 3: frecuencias de defecto y armónicos). Un clasificador supervisado solo si existen fallas etiquetadas del propio activo o flota; antes, diagnóstico basado en reglas y criterio experto.","condicion_para_avanzar":"Diagnósticos contrastados con la inspección real del rodamiento desmontado. Para clasificador aprendido: fallas etiquetadas por modo suficientes (cifra: VACÍO), partición por activo completo y por tiempo, y recall de la clase crítica superior al del diagnóstico por reglas.","evidencia":["E-8008","E-8006","E-8010"],"nivel":"SINTESIS","nota":"E-8010 es un preprint 2026 de identificador no contrastado."},{"etapa":"4. Pronóstico (RUL o tiempo de aviso)","accion":"Primero estimar con datos propios el intervalo entre la primera detección y la falla funcional (P-F) por supervivencia clásica con censura (Weibull, Kaplan-Meier), tratando la censura como tal y no como RUL = 0. Solo después, evaluar CoxPH o bosque de supervivencia, que son los candidatos con respaldo en banco. El RUL se entrega como distribución con cobertura empírica medida por activo.","condicion_para_avanzar":"Cantidad mínima de fallas por modo cumplida (cifra: VACÍO; si no se alcanza, el resultado se rotula 'exploratorio'), validación hacia adelante y en activos reservados, calibración y cobertura de intervalos medidas, y aprobación humana para actuar. Intervalo P-F: VACÍO.","evidencia":["E-8009","E-8004"],"nivel":"SINTESIS"},{"etapa":"5. Operación, deriva y reentrenamiento","accion":"Piloto en sombra antes de actuar; plan de deriva por cambio de carga, velocidad, material transportado, lubricante o cambio de rodamiento; reentrenar solo con aprobación humana, y guardar script, semilla y versiones.","condicion_para_avanzar":"Criterio de deriva y de reentrenamiento definido y aprobado por una persona; cifras de disparo: VACÍO.","evidencia":["E-8011","E-8010"],"nivel":"SINTESIS","nota":"E-8010 es un preprint 2026 de identificador no contrastado."}],"riesgos_de_validacion":[{"riesgo":"Banco frente a campo: los conjuntos abiertos son rodamientos pequeños en banco, con carga muy alta y vida de minutos, o carga y velocidad variables, no polea de faja de baja velocidad. Umbrales, errores y exactitudes no se trasladan.","evidencia":["E-8009","E-7001","E-7003","E-8011"],"nivel":"SINTESIS"},{"riesgo":"Partición que infla el desempeño: una exactitud alta sin partición declarada no respalda generalización; al retener una condición la exactitud pudo caer a 40,64 %. La partición debe ser por activo completo y por tiempo, nunca por fotograma, segmento o ventana.","evidencia":["E-8007","E-8010"],"nivel":"SINTESIS"},{"riesgo":"Fuga de datos: segmentos de un mismo rodamiento en entrenamiento y prueba; selección de variables, filtro de envolvente o normalización ajustados con todos los datos; etiquetas construidas con información posterior al evento.","evidencia":["E-8010","E-8007"],"nivel":"SINTESIS"},{"riesgo":"Pocas fallas y censura: las fallas son raras y los datos censurados; con 2 ensayos de falla el ajuste Weibull está en el mínimo absoluto y sin censura declarada. Tratar la censura como RUL = 0 o descartarla sesga el resultado.","evidencia":["E-8009","E-7003"],"nivel":"SINTESIS"},{"riesgo":"Indicador no monótono: la kurtosis vuelve a lo normal al extenderse el defecto, de modo que una tendencia de kurtosis puede dar falsa tranquilidad.","evidencia":["E-8003"],"nivel":"SINTESIS"},{"riesgo":"Umbrales genéricos sin sustento (kurtosis 3 y 5) usados como alarma o como etiqueta de entrenamiento: se propagarían errores al modelo.","evidencia":["E-8001"],"nivel":"SINTESIS"},{"riesgo":"Comparar contra una referencia débil: las mejoras reportadas son frente a referencias elegidas por los autores; el modelo debe superar al umbral, la tendencia, la supervivencia clásica y el bosque aleatorio.","evidencia":["E-8011","E-8518","E-8010"],"nivel":"SINTESIS"},{"riesgo":"Selección de banda de envolvente: es la principal dificultad de la técnica; ajustarla con datos de prueba es fuga.","evidencia":["E-8006","E-8001"],"nivel":"SINTESIS"}],"vacios":["No hay datos del activo: no se entrenó ni evaluó ningún modelo; todo desempeño del activo es VACÍO.","Umbrales de alarma (vibración, envolvente, temperatura, kurtosis) para chumaceras de polea de faja: sin fuente leída. Los 3 y 5 de kurtosis carecen de sustento según E-8001.","Intervalo P-F y tiempo de aviso en campo: ninguna fuente leída lo da (E-8008 es cualitativa; E-8009 está en minutos y banco acelerado). Se estima con datos propios.","Cantidad mínima de fallas por modo y de mediciones de línea base: sin cifra en las fuentes leídas; la fija el protocolo del equipo con data_quality.audit al disponer de datos.","Horizonte H y costos de falso negativo y falso positivo: los define el negocio.","Frecuencias características numéricas, velocidad real y datos de placa del rodamiento del activo.","Cuántos ensayos de los bancos abiertos terminaron en falla y con qué censura (E-7001, E-7002 sin verificar); lectura de los reportes originales pendiente.","Fuentes SOLO-SNIPPET y NO-VERIFICADO (E-7004 a E-7010, E-8012 a E-8015, E-8521 a E-8530) sin abrir; pistas pendientes, no respaldan nada. Entre ellas hay bancos adicionales (por ejemplo E-7005, E-7006) y un estudio de monitoreo de rodillos (E-8012) por abrir.","Sin evidencia leída de que modelos fundacionales de series, modelos de lenguaje o gemelos digitales mejoren la predicción en este modo de falla; ningún porcentaje de reducción de paradas.","Modelos NO justificados hoy, por falta de fallas propias, de partición validada por activo y de superación demostrada del baseline: (a) redes profundas o CNN de diagnóstico, cuyas exactitudes de banco no generalizan (E-8007, E-8010, E-8011); (b) regresión de RUL con aprendizaje profundo entrenado en banco y aplicado al activo (E-8009); (c) transferencia directa de modelos o umbrales de banco a la polea; (d) detector de anomalías con alarma automática sin piloto en sombra; (e) cualquier modelo que use kurtosis 3 y 5 como etiqueta o alarma (E-8001). Lo que sí procede hoy: etapas 0 y 1 y, en sombra, la 2."]},"herramientas":true},"hipotesis":[],"tecnicas":[],"raices":[],"linea_tiempo":[],"series":[],"plan":[]},"evidencia":[{"id":"E-6001","tipo":"paper","acceso":"fragmento","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{"autores":"Wijaya, H., Rajeev, P., Gad, E., & Vivekanamtham, R.","anio":2021,"titulo":"Distributed optical fibre sensor for condition monitoring of mining conveyor using wavelet transform and artificial neural network","fuente":"Structural Control and Health Monitoring","volumen":"28(11)","doi":"10.1002/stc.2827"},"extracto":"Gurjar reported that more than 50% of all the conveyor belt failures are due to malfunctioning idlers. ... The majority of idler damage occurs due to factors such as improper lubrication, contamination and misalignment.","localizador":"Sección INTRODUCTION, párrafo 1 (fragmento 10.1002/stc.2827_0001)","afirma":"Cita secundaria (de un trabajo de Gurjar) de que más del 50 % de las fallas de transportadores de banda se deben a rodillos (idlers) defectuosos; y que la mayor parte del daño en rodillos se atribuye a lubricación inadecuada, contaminación y desalineación. Cita también que fallas de rodillos fueron causa principal de ignición (51 % en Australia, 46,7 % en Reino Unido, citando a Fernandez et al.).","limites":"Es una introducción que cita a otros: la cifra del 50 % no se verificó en su fuente primaria (no dice base de datos, tamaño ni año). Se refiere a RODILLOS (idlers), no a chumaceras de poleas. El estudio en sí es un prototipo de laboratorio de monitoreo con fibra óptica. No ordena modos de falla de poleas.","aplica_a":"Mecanismos y causas raíz (lubricación, contaminación, desalineación) en rodamientos de rodillos; ranking de componentes (solo como cita secundaria). Comparabilidad: baja a media para chumacera de polea.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Wijaya, H., Rajeev, P., Gad, E., & Vivekanamtham, R. (2021). Distributed optical fibre sensor for condition monitoring of mining conveyor using wavelet transform and artificial neural network. Structural Control and Health Monitoring, 28(11). https://doi.org/10.1002/stc.2827","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-6002","tipo":"paper","acceso":"fragmento","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{"autores":"Shanyavskiy, A. A., & Soldatenkov, A. P.","anio":2022,"titulo":"Crack path and regularities for ball-bearing fracture in the very-high-cycle fatigue regime","fuente":"Fatigue & Fracture of Engineering Materials & Structures","volumen":"45(11)","paginas":"3378-3392","doi":"10.1111/ffe.13782"},"extracto":"Such cases have been thoroughly investigated and classified according to the various reasons for damage: excessive loads, misalignment, tight fits, lubricant failure, wear, corrosion, fretting, and so on.","localizador":"Sección INTRODUCTION, párrafo 1 y 2 (fragmento 10.1111/ffe.13782_0001)","afirma":"Clasificación general de causas de daño en rodamientos (carga excesiva, desalineación, ajustes apretados, falla de lubricante, desgaste, corrosión, fricción por micro-movimiento) y que, en condiciones convencionales de operación según ISO 281:2007, la fatiga de contacto por rodadura (descascarado subsuperficial) es la causa de falla. Define L10 como la vida a la cual falla el 10 % de los rodamientos (L10=(C/F)^p, p=3 bolas, 10/3 rodillos).","limites":"Rodamientos de bolas en régimen de fatiga de ciclos muy altos; no es un estudio de transportadores ni de poleas. No da frecuencias de falla ni vida de diseño de poleas.","aplica_a":"Mecanismos físicos de falla de rodamientos (fatiga vs causas fuera de condición convencional); definición de L10. Comparabilidad: media (mecanismo general).","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Shanyavskiy, A. A., & Soldatenkov, A. P. (2022). Crack path and regularities for ball-bearing fracture in the very-high-cycle fatigue regime. Fatigue & Fracture of Engineering Materials & Structures, 45(11), 3378-3392. https://doi.org/10.1111/ffe.13782","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-6003","tipo":"paper","acceso":"fragmento","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{"autores":"Kenworthy, J., Hart, E., Stirling, J., Stock, A., Keller, J., Guo, Y., Brasseur, J., & Evans, R.","anio":2023,"titulo":"Wind turbine main bearing rating lives as determined by IEC 61400-1 and ISO 281: A critical review and exploratory case study","fuente":"Wind Energy","volumen":"27(2)","paginas":"179-197","doi":"10.1002/we.2883"},"extracto":"The basic rating life (for a population of bearings manufactured with commonly used high-quality material, of good manufacturing quality, and operating under conventional operating conditions) is the value of bearing life which 90% of the population are expected to attain or exceed.","localizador":"Sección BACKGROUND, párrafo 1 (fragmento 10.1002/we.2883_0003)","afirma":"Definición de vida nominal básica (L10) según ISO 281: vida que el 90 % de una población de rodamientos idénticos alcanza o supera, hasta el primer indicio de fatiga; la vida nominal modificada incorpora viscosidad del lubricante, contaminación y límite de carga de fatiga; ISO/TS 16281 considera desalineación, inclinación y holgura.","limites":"Contexto de aerogeneradores (rodamiento principal). No trata poleas de banda ni da horas de diseño para transportadores. La edición de ISO 281 no se verificó aquí. L10 predice solo fatiga de contacto, no otras causas.","aplica_a":"Interpretación de L10 como vida de diseño: 10 % de falla esperada antes de L10. Comparabilidad: baja en activo, alta en definición.","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Kenworthy, J., Hart, E., Stirling, J., Stock, A., Keller, J., Guo, Y., Brasseur, J., & Evans, R. (2023). Wind turbine main bearing rating lives as determined by IEC 61400-1 and ISO 281: A critical review and exploratory case study. Wind Energy, 27(2), 179-197. https://doi.org/10.1002/we.2883","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-6004","tipo":"paper","acceso":"abstract","via":"conector_wiley","fecha_acceso":"2026-10-27","referencia":{" osis (3 y 5) cuyos autores de la revision no hallaron sustento teorico ni empirico; ademas no hay datos publicos sobre la fiabilidad de la kurtosis como criterio. Ademas: el espectro de la envolvente tiene alta sensibilidad, inmunidad al ruido e identifica tipo y ubicacion del defecto; su dificultad es elegir el ancho de banda del filtro; la evaluacion por espectro de velocidad detecta defectos solo en etapas tardias (segun la revision).","limites":"Revision narrativa; no mide nada propio. Los umbrales 3 y 5 NO son un estandar validado para chumaceras de fajas. Pais/institucion no verificados en la fuente leida. No trata fajas transportadoras.","aplica_a":"Deteccion: indicadores en tiempo (RMS, kurtosis); advertencia contra umbrales universales","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Burda, E. A., Zusman, G. V., Kudryavtseva, I. S., Naumenko, A. P., & Nicoletti, R. (2022). An Overview of Vibration Analysis Techniques for the Fault Diagnostics of Rolling Bearings in Machinery. Shock and Vibration, 2022(1). https://doi.org/10.1155/2022/6136231","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8003","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Jayaswal, P., Wadhwani, A. K., Mulchandani, K. B., & Kaneko, Y.","anio":2008,"titulo":"Machine Fault Signature Analysis","fuente":"International Journal of Rotating Machinery","volumen":"2008(1)","doi":"10.1155/2008/583982"},"extracto":"The statistical parameters such as kurtosis and skewness values are robust to varying bearing operating condition and are good indicators of incipient defects. The disadvantage, however, is that as the defect spreads across the bearing surfaces the values of these parameters drop back to normal","localizador":"chunk 12 del texto completo (conector Wiley)","afirma":"Revision: la kurtosis es buen indicador de defecto incipiente pero vuelve a valores normales cuando el defecto se extiende (curva no monotona); la envolvente (filtro pasabanda + demodulacion Hilbert o rectificacion) sirve con senales ruidosas; la confianza mejora combinando vibracion con aceite, termografia y otros indicadores.","limites":"Revision de 2008; no cuantifica tiempos de aviso. No trata fajas transportadoras. Pais no verificado en la fuente leida.","aplica_a":"Curva de degradacion de indicadores; diagnostico por envolvente; fusion de indicadores","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Jayaswal, P., Wadhwani, A. K., Mulchandani, K. B., & Kaneko, Y. (2008). Machine Fault Signature Analysis. International Journal of Rotating Machinery, 2008(1). https://doi.org/10.1155/2008/583982","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8004","tipo":"paper","acceso":"abstract","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Buzzoni, M., Soave, E., D'Elia, G., Mucchi, E., Dalpiaz, G., & Reccia, E.","anio":2018,"titulo":"Development of an Indicator for the Assessment of Damage Level in Rolling Element Bearings Based on Blind Deconvolution Methods","fuente":"Shock and Vibration","volumen":"2018(1)","doi":"10.1155/2018/5384358"},"extracto":"The validation of the proposed indicator has been carried out by means of both simulated signal and a runtofailure experiment. The results highlight that the proposed indicator is able to detect more efficiently the fault occurrence and, most importantly, quicker than other established techniques.","localizador":"Resumen del autor (campo abstract / chunk 0, conector Wiley)","afirma":"Un indicador basado en deconvolucion ciega y kurtosis rastrea la degradacion del rodamiento (pista externa, interna, elemento rodante) y se valido con senal simulada y un ensayo hasta la falla.","limites":"Solo se leyo el resumen del autor (metadatos del conector); el ensayo hasta la falla es de banco, no de campo; no se leyeron cifras ni la condicion de carga.","aplica_a":"Deteccion temprana y seguimiento de severidad por kurtosis mejorada","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Buzzoni, M., Soave, E., D'Elia, G., Mucchi, E., Dalpiaz, G., & Reccia, E. (2018). Development of an Indicator for the Assessment of Damage Level in Rolling Element Bearings Based on Blind Deconvolution Methods. Shock and Vibration, 2018(1). https://doi.org/10.1155/2018/5384358","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8005","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Nguyen, P. H., Kim, J., & Caesarendra, W.","anio":2015,"titulo":"Multifault Diagnosis of Rolling Element Bearings Using a Wavelet Kurtogram and Vector Median-Based Feature Analysis","fuente":"Shock and Vibration","volumen":"2015(1)","doi":"10.1155/2015/320508"},"extracto":"The kurtogram method relies on spectral kurtosis, which was originally proposed by Dwyer [[5](#bib-0005)], to detect the presence of nonstationary transients and accurately indicate their location in the frequency bands of bearing signals.","localizador":"chunk 1 del texto completo (conector Wiley)","afirma":"El kurtograma (curtosis espectral) se usa para localizar la banda de frecuencia donde estan los transitorios del defecto, paso previo a la envolvente; sus variantes se proponen porque el kurtograma es sensible a componentes impulsivos ajenos.","limites":"Se leyo solo la introduccion; no se leyeron resultados ni validacion del articulo. Ensayo de banco presumible, no verificado. No trata fajas.","aplica_a":"Diagnostico: seleccion de banda con kurtograma","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Nguyen, P. H., Kim, J., & Caesarendra, W. (2015). Multifault Diagnosis of Rolling Element Bearings Using a Wavelet Kurtogram and Vector Median-Based Feature Analysis. Shock and Vibration, 2015(1). https://doi.org/10.1155/2015/320508","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8006","tipo":"paper","acceso":"fragmento","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Van, M., Franciosa, P., Ceglarek, D., & Lei, Y.","anio":2016,"titulo":"Rolling Element Bearing Fault Diagnosis Using Integrated Nonlocal Means Denoising with Modified Morphology Filter Operators","fuente":"Mathematical Problems in Engineering","volumen":"2016(1)","doi":"10.1155/2016/9657285"},"extracto":"In this method, first, the vibration signal is filtered around the mechanical resonance of the machine. Then, an amplitude demodulation technique and Fourier transform are applied to extract fault features. However, the selection of the filtering frequency band is a challenge in this approach.","localizador":"chunk 1 del texto completo (conector Wiley)","afirma":"Describe el procedimiento de analisis de envolvente (filtrar en la resonancia, demodular, FFT) para identificar las frecuencias caracteristicas del rodamiento y su principal dificultad (eleccion de banda).","limites":"Solo introduccion; no se leyo la validacion. No trata fajas.","aplica_a":"Diagnostico: envolvente y frecuencias caracteristicas","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Van, M., Franciosa, P., Ceglarek, D., & Lei, Y. (2016). Rolling Element Bearing Fault Diagnosis Using Integrated Nonlocal Means Denoising with Modified Morphology Filter Operators. Mathematical Problems in Engineering, 2016(1). https://doi.org/10.1155/2016/9657285","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8007","tipo":"paper","acceso":"abstract","via":"scholar_gateway","fecha_acceso":"2026-10-27","referencia":{"autores":"Dong, S., & Gupta, P.","anio":2022,"titulo":"An Integrated Method of Rolling Bearing Fault Diagnosis Based on Convolutional Neural Network Optimized by Sparrow Optimization Algorithm","fuente":"Scientific Programming","volumen":"2022(1)","doi":"10.1155/2022/6234169"},"extracto":"The model’s accuracy rate may reach 99.4 percent after repeated testing using samples, which is significantly superior to the classic fault detection approach and the fault diagnostic method based solely on shallow networks.","localizador":"Resumen del autor (campo abstract de metadatos, conector Wiley)","afirma":"Ejemplo de resultado tipico de CNN sobre rodamientos: exactitud reportada de 99,4 por ciento sobre muestras de prueba.","limites":"Solo resumen del autor. No se leyo que conjunto de datos ni que particion (por activo, por condicion o aleatoria por segmentos) uso; sin ese dato la cifra NO respalda generalizacion a campo. Es ejemplo de lo que se reporta, no prueba de desempeno en planta.","aplica_a":"Modelos de aprendizaje profundo: validacion reportada","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Dong, S., & Gupta, P. (2022). An Integrated Method of Rolling Bearing Fault Diagnosis Based on Convolutional Neural Network Optimized by Sparrow Optimization Algorithm. Scientific Programming, 2022(1). https://doi.org/10.1155/2022/6234169","avisos":["sin país o institución: no se podrá resumir la cobertura geográfica"]},{"id":"E-8008","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2024,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv","url":"https://arxiv.org/abs/2405.01614"},"extracto":"Stage 1 introduces ultrasonic frequencies detectable only by specialized sensors, without visible defects on the bearing. Stage 2 is marked by signals aligning with the bearing parts’ natural resonance, alongside the initial appearance of defects upon inspection. Stage 3 features the fundamental defect frequencies and their harmonics, modulated by the shaft speed, indicating a spread of defects. Stage 4 is the final stage and precedes complete failure.","localizador":"Seccion 3.2, pie de la Figura 1 (hf://papers/2405.01614/paper.md, texto leido parcialmente)","afirma":"Descripcion de 4 etapas de la degradacion de un rodamiento por su contenido espectral (ultrasonico, resonancia natural, frecuencias de defecto y armonicos, ruido de fondo aleatorio) y de las frecuencias BPFO, BPFI, BSF, FTF con sus ecuaciones en funcion de n, fr, d, D y el angulo de contacto.","limites":"Preprint (v3, abr 2025) citado como se ve en el lector; la revista mencionada (Expert Systems with Applications) no se verifico. La descripcion de etapas es cualitativa, sin duracion ni tiempos de aviso. Sus datos son de banco de ensayo acelerado. Se leyeron solo partes del texto (aprox. primeros 40 kB).","aplica_a":"Curva tipica de degradacion; frecuencias caracteristicas","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2024). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv. https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-8009","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F.","anio":2024,"titulo":"RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings","fuente":"arXiv","url":"https://arxiv.org/abs/2405.01614"},"extracto":"All bearings are run to failure under very high load to accelerate degradation. This significantly increases the risk of initiating bearing defects, but also the risk of local flash heating and subsequent uncontrolled damage to a bearing.","localizador":"Seccion 4.1 (hf://papers/2405.01614/paper.md, texto leido parcialmente) y resumen","afirma":"Validacion de un modelo de supervivencia para vida remanente en el conjunto publico XJTU-SY: 15 rodamientos de bolas de ranura profunda, 3 condiciones, 5 por condicion, validacion cruzada de 5 particiones; error absoluto medio de 14,7 min (IC95 13,6-15,8) con CoxPH y 12,6 min (IC95 11,8-13,4) con bosque de supervivencia a la carga mas alta con 25 por ciento de censura aleatoria. Tambien afirma que las fallas son raras y los datos censurados.","limites":"Banco de ensayo con degradacion acelerada por carga muy alta (12 kN, 2100 rpm; rodamiento de 12,82 kN de carga dinamica), minutos de vida, 15 rodamientos: NO es comparable con una chumacera de polea de faja de baja velocidad en meses. El error en minutos no se traslada a tiempo de aviso en campo. No se leyeron todas las secciones de resultados ni la discusion de limites. Preprint no arbitrado segun lo leido.","aplica_a":"Modelos predictivos de RUL; limites de generalizacion a campo","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2024). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv. https://arxiv.org/abs/2405.01614","avisos":[]},{"id":"E-8010","tipo":"preprint","acceso":"abstract","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A.","anio":2026,"titulo":"Neutrosophic Ensemble Classification for Uncertainty-Aware Bearing Fault Detection: Evidence from Laboratory and Variable-Speed Industrial Benchmarks","fuente":"arXiv","url":"https://arxiv.org/abs/2610.06880"},"extracto":"On JNU, holding out 1000 rpm, accuracy collapses to 40.64 percent, below a majority-class baseline; Logistic Regression (57.91 percent) generalizes far better than the tree ensembles.","localizador":"Resumen del autor (hf://papers/2610.06880/paper.md; el lector declara que el texto completo no esta disponible)","afirma":"Con particion dejando fuera una condicion (leave-one-condition-out) en CWRU y JNU, el conjunto alcanza 100 por ciento en tres de cuatro cargas retenidas y 92,27 por ciento en la cuarta en CWRU, pero cae a 40,64 por ciento en JNU al retener 1000 rpm: la exactitud depende fuertemente de la particion y del conjunto. Tambien indica que rasgos de envolvente con frecuencias de falla separan casi perfectamente las clases en CWRU (99,57 por ciento con tres rasgos).","limites":"Solo resumen (el texto completo no estaba disponible en el lector). Preprint no arbitrado; el identificador arXiv 2610 y la fecha 2026-09-18 provienen del lector y no se contrastaron con otra fuente. Conjuntos de banco (CWRU, JNU), no de campo; no hay particion por activo en planta. No trata fajas.","aplica_a":"Limites de generalizacion de ML/DL; particion de validacion","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-ABSTRACT","apa":"Leyva-Vazquez, M., Rumbaut Rangel, D., Cevallos-Torres, L., & Matheu Perez, A. (2026). Neutrosophic Ensemble Classification for Uncertainty-Aware Bearing Fault Detection: Evidence from Laboratory and Variable-Speed Industrial Benchmarks. arXiv. https://arxiv.org/abs/2610.06880","avisos":[]},{"id":"E-8011","tipo":"preprint","acceso":"fragmento","via":"hf_papers","fecha_acceso":"2026-10-27","referencia":{"autores":"Jalonen, T., Al-Sa'd, M., Kiranyaz, S., & Gabbouj, M.","anio":2023,"titulo":"Real-Time Vibration-Based Bearing Fault Diagnosis Under Time-Varying Speed Conditions","fuente":"arXiv","url":"https://arxiv.org/abs/2311.18547"},"extracto":"However, many existing techniques are developed and tested under strictly controlled conditions, limiting their adaptability to the diverse and dynamic settings encountered in practical applications.","localizador":"Resumen del autor (hf://papers/2311.18547/paper.md, introduccion)","afirma":"Los propios autores senalan que muchas tecnicas se desarrollan y prueban en con arxiv.org/abs/2405.01614","pais":"Dinamarca","institucion":"Department of Electrical and Computer Engineering, Aarhus University"},"extracto":"Censored or incomplete observations are a prevalent phenomenon given the rarity of failures or breakdowns in ball bearings [16], but so far, only few studies have attempted to model or address the consequences of censoring","localizador":"Sección 1 Introduction, párrafo 3 (hf://papers/2405.01614/paper.md); datos: Sección 4.1, XJTU-SY, 15 rodamientos de bolas, 5 por condición de operación (leído en Introducción y Abstract)","afirma":"Los datos de vida de rodamientos suelen estar censurados porque las fallas son raras, e ignorar las observaciones censuradas pierde información e introduce sesgo de estimación; el trabajo usa análisis de supervivencia (CoxPH, Random Survival Forests) con 25 % de censura aleatoria y obtiene MAE de 14,7 min (CoxPH) y 12,6 min (RSF) frente a 18,5 min de un LASSO sin censura, en la condición C1 (12,0 kN, 2100 RPM).","limites":"Banco de ensayo acelerado de laboratorio (conjunto XJTU-SY, 5 rodamientos por condición), minutos de vida, censura inducida al azar por los autores, no censura real de campo. No ajusta Weibull, no da forma beta ni B10, no trata costos ni transportadores. Respalda solo la necesidad metodológica de manejar censura, no valores de campo. El carácter acelerado del ensayo no está verificado en el texto leído.","aplica_a":"Pregunta 1 (censura en estadística de vida de rodamientos). Comparabilidad: baja para chumacera de polea de faja (lab, bolas ranura profunda, minutos).","revista_cuartil":null,"nivel_evidencia":"VERIFICADO-TEXTO","apa":"Lillelund, C. M., Pannullo, F., Jakobsen, M. O., Morante, M., & Pedersen, C. F. (2025). RULSurv: A probabilistic survival-based method for early censoring-aware prediction of remaining useful life in ball bearings. arXiv:2405.01614v3 (cs.LG); versión de revista indicada: Expert Systems with Applications. https://arxiv.org/abs/2405.01614","avisos":[]},
