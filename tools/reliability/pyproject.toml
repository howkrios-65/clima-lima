[project]
name = "reliability-kit"
version = "0.1.0"
description = "Cálculos de confiabilidad reproducibles (Weibull, Crow-AMSAA, Kaplan-Meier, Pareto, economía, validación ML)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
