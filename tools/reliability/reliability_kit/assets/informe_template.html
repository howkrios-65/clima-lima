<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f9fa;--panel:#ffffff;--ink:#1e2b3a;--mut:#62758a;--line:#dde9ee;--soft:#eaf3f5;--soft2:#f7fbfb;--acc:#5b9fcf;--acc2:#e4f0f8;--ok:#6fb98d;--warn:#e3b06c;--bad:#e08e8b;--c1:#7fb3da;--c2:#f0b784;--c3:#8ccaa0;--c4:#c8aad6;--c5:#86bcb6;--c6:#ecd27a;--shadow:0 1px 2px rgba(40,70,100,.06),0 8px 22px rgba(40,70,100,.07);--hero1:#d9eafa;--hero2:#efe6fa;--fb:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;--fh:"Manrope","Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b22;--panel:#152233;--ink:#e5eef8;--mut:#94a9bf;--line:#243b47;--soft:#1a2b35;--soft2:#172730;--acc:#86bde6;--acc2:#1d3647;--ok:#7ccb9a;--warn:#e8b97a;--bad:#ee9a97;--c1:#86bde6;--c2:#f4c08f;--c3:#98d6ab;--c4:#d2b9e0;--c5:#92cbc5;--c6:#f0d98a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);--hero1:#18314d;--hero2:#2a2440;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b22;--panel:#152233;--ink:#e5eef8;--mut:#94a9bf;--line:#243b47;--soft:#1a2b35;--soft2:#172730;--acc:#86bde6;--acc2:#1d3647;--ok:#7ccb9a;--warn:#e8b97a;--bad:#ee9a97;--c1:#86bde6;--c2:#f4c08f;--c3:#98d6ab;--c4:#d2b9e0;--c5:#92cbc5;--c6:#f0d98a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);--hero1:#18314d;--hero2:#2a2440;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb)}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.01em}
.ic{vertical-align:-3px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;font:600 15px var(--fh);color:var(--ink)}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff}
#tabs{display:flex;flex-direction:column;gap:3px}
#tabs button{display:flex;gap:10px;align-items:center;border:0;background:none;color:var(--mut);padding:10px 12px;border-radius:10px;font:500 14px var(--fb);cursor:pointer;text-align:left}
#tabs button:hover{background:var(--soft)}
#tabs button[aria-selected=true]{background:var(--acc2);color:var(--ink)}
#tabs button[aria-selected=true] .ic{color:var(--acc)}
.side-f{margin-top:auto;font-size:12px;color:var(--mut);padding:8px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#top h1{margin:0;font-size:17px;flex:1 1 260px;min-width:0}
#top h1 small{display:block;font:400 12px var(--fb);color:var(--mut)}
.search{position:relative;flex:1 1 280px;max-width:460px}
.search input[type=text]{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit}
.search .ic{position:absolute;left:11px;top:11px;color:var(--mut)}
#sres{position:absolute;left:0;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:30}
#sres a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
#sres a:hover{background:var(--soft)}#sres small{color:var(--mut);display:block}
#sres mark{background:var(--c6);color:#000;border-radius:3px;padding:0 1px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--mut);padding:7px 11px;font:500 13px var(--fb);cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button[aria-pressed=true]{background:var(--acc2);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:7px 12px;font:500 13px var(--fb);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--soft)}
#dmenu{position:absolute;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30;min-width:250px}
#dmenu button{display:flex;gap:9px;width:100%;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;font:500 14px var(--fb);cursor:pointer;text-align:left}
#dmenu button:hover{background:var(--soft)}
main{padding:18px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px));max-width:1240px}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;gap:8px;align-items:center}.card h3{margin:12px 0 6px;font-size:14px}
.hero{border-radius:20px;padding:22px;margin:0 0 16px;background:linear-gradient(120deg,var(--hero1),var(--hero2));border:1px solid var(--line)}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0 0 14px;color:var(--mut);max-width:70ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
#app>div,main,.card,.hero,.chart{min-width:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.kpi .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--acc2);color:var(--acc);flex:none}
.kpi b{display:block;font:600 20px var(--fh);line-height:1.1;white-space:nowrap}.kpi span{color:var(--mut);font-size:12px;display:block}
.hero .kpi{background:color-mix(in srgb,var(--panel) 80%,transparent)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--mut);padding:7px 13px;border-radius:999px;font:500 13px var(--fb);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.subpane{display:none}.subpane.on{display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;background:var(--soft2);position:sticky;top:0}
.tw{overflow-x:auto;border-radius:10px}
.chip{white-space:nowrap;display:inline-block;font:500 11px var(--fb);padding:1px 7px;margin:1px 2px;border-radius:999px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);color:var(--acc);background:var(--acc2);cursor:pointer}
.lv{font:500 11px var(--fb);padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.lv.t{background:var(--ok)}.lv.a{background:#7fb69a}.lv.s{background:var(--warn)}.lv.n{background:var(--bad)}.lv.u{background:var(--c4)}
.badge{font:500 12px var(--fb);padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--soft)}
.badge.confirmada{border-color:var(--ok);color:var(--ok)}.badge.probable{border-color:var(--acc);color:var(--acc)}.badge.posible{border-color:var(--warn);color:var(--warn)}.badge.descartada{border-color:var(--bad);color:var(--bad)}
.note{border-radius:12px;background:var(--soft);padding:9px 12px;margin:8px 0;font-size:13px;border:1px solid var(--line)}
.note.bad{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.note.ok{background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
label{font-size:13px;color:var(--mut);display:inline-block;margin:4px 12px 4px 0}
input[type=range]{vertical-align:middle;width:150px;accent-color:var(--acc)}
input[type=number],input[type=text],select,textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
input[type=number]{width:96px}
.lt .mas{color:var(--acc);cursor:pointer;font-weight:600}
svg text{fill:var(--mut);font:11px var(--fb)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 16px;box-shadow:var(--shadow)}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ch-h b{font:600 14px var(--fh)}
.ch-f{margin-top:6px;font-size:12px;color:var(--mut);background:var(--soft2);border-left:3px solid var(--c5);padding:6px 10px;border-radius:8px}
.rd{font-size:12px;color:var(--mut);min-height:16px}
.leg{font-size:12px;color:var(--mut)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;margin:0 0 10px}.tl .ev:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl .ev.ot:before{background:var(--c2)}.tl .ev.medicion:before{background:var(--c3)}.tl .ev.hito:before{background:var(--bad)}.tl .ev.accion:before{background:var(--ok)}.tl .ev.analisis:before{background:var(--c4)}
.tl small{color:var(--mut)}
#drawer{position:fixed;top:0;right:0;width:min(440px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:40}
#drawer.on{transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
#drawer blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid var(--acc);background:var(--soft);font-size:13px;border-radius:0 8px 8px 0}
.x{float:right;border:0;background:var(--soft);color:var(--ink);font-size:18px;cursor:pointer;border-radius:8px;width:30px;height:30px}
#modal{position:fixed;inset:0;background:rgba(15,30,50,.55);z-index:50;display:none;padding:3vh 3vw}
#modal.on{display:block}
#modal .box{background:var(--panel);border-radius:18px;height:100%;overflow:auto;padding:16px}
.mat td.y{background:var(--acc);color:#fff;text-align:center}.mat td.nn{text-align:center;color:var(--mut)}
pre.code{background:var(--soft);padding:8px;border-radius:8px;overflow:auto;font-size:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13px;z-index:60;display:none}
details>summary{cursor:pointer;font-weight:600}
.rank td:first-child{font:600 14px var(--fh);color:var(--acc);width:34px}
@media (max-width:900px){#app{grid-template-columns:minmax(0,1fr)}body{overflow-x:hidden}#side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{display:none}#tabs{flex-direction:row}#tabs button{white-space:nowrap}.side-f{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- v6: tipografía fina, separadores por tipo de fuente, Ishikawa, imprimir ---- */
body{font-weight:350;letter-spacing:.005em}
h1,h2,h3{font-weight:500}
.card h2,.hero h2{font-weight:500}.ch-h b{font-weight:500}.kpi b{font-weight:600}
.ic{stroke-width:1.6}
.card,.chart,.kpi{box-shadow:0 1px 2px rgba(30,60,100,.06)}
th{font-weight:500}
#scrim{position:fixed;inset:0;background:rgba(15,30,50,.30);z-index:39;display:none}#scrim.on{display:block}
a.ext{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 45%,transparent);word-break:break-all}
a.ext:hover{background:var(--acc2)}
.sep{display:flex;align-items:center;gap:10px;margin:24px 0 10px;color:var(--tc,var(--mut));font:500 12px var(--fh);text-transform:uppercase;letter-spacing:.09em}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--tc,var(--line)))}
.sep:after{background:linear-gradient(270deg,transparent,var(--tc,var(--line)))}
.sep .n{background:var(--soft);color:var(--ink);padding:1px 9px;border-radius:999px;font-weight:500}
.sepr td{background:var(--soft2);color:var(--tc,var(--mut));font:500 11px var(--fh);text-transform:uppercase;letter-spacing:.09em;border-top:2px solid var(--tc,var(--line))}
.apa{padding-left:2.4em;text-indent:-2.4em;margin:0 0 10px;list-style:none;font-size:13.5px}
.apa .meta{display:block;text-indent:0;margin-top:3px}
.lnkb{display:inline-flex;gap:5px;align-items:center;font:500 11.5px var(--fb);padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--acc);text-decoration:none;margin:1px 3px 1px 0;background:var(--panel)}
.lnkb:hover{background:var(--acc2)}
.sd{border:1px dashed color-mix(in srgb,var(--bad) 55%,var(--line));border-radius:12px;padding:12px 14px;color:var(--mut);background:color-mix(in srgb,var(--bad) 5%,var(--panel))}
.sd b{display:block;color:var(--bad);font:500 12px var(--fh);letter-spacing:.06em;margin-bottom:3px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.tools .seg button{padding:5px 10px}
.pl{cursor:pointer}.pl rect.bg{transition:opacity .15s}.pl:hover rect.bg{stroke-width:1.8}.pl.dim{opacity:.18}
.ish-t text{fill:var(--ink)}
.pq{position:relative;margin:0 0 6px;padding:10px 14px 10px 54px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.pq .num{position:absolute;left:12px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc2);color:var(--acc);font:600 14px var(--fh)}
.pq q,.pq .qq{display:block;font:500 13.5px var(--fh);margin-bottom:3px;quotes:none}
.pq-ar{text-align:left;margin:0 0 6px 26px;color:var(--mut);height:16px;line-height:16px}
.pq.fin{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--panel))}
.idx{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr))}
.idx button{display:flex;gap:9px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 11px;border-radius:12px;font:400 13px var(--fb);cursor:pointer}
.idx button:hover{background:var(--soft)}.idx button small{display:block;color:var(--mut)}
.idx button.vac{border-style:dashed;color:var(--mut)}
.idx .ok{color:var(--ok)}.idx .no{color:var(--bad)}
@media print{
 #side,#top,#drawer,#scrim,#modal,#toast,.sub,.btn,.amp,.tools{display:none!important}
 #app{display:block}body{background:#fff;color:#000;font-size:11pt}main{max-width:none;padding:0}
 .card,.chart{box-shadow:none;break-inside:avoid;border-color:#bbb}
 section.tab:not(.on){display:none}.subpane:not(.on){display:none}
 body.print-all section.tab,body.print-all .subpane{display:block!important}
 body.print-all section.tab:before{content:attr(data-label);display:block;font:600 20pt var(--fh);margin:18pt 0 6pt;border-bottom:2px solid #333;break-before:page}
 body.print-all .subpane:before{content:attr(data-label);display:block;font:600 14pt var(--fh);margin:12pt 0 4pt;color:#333}
 .tw{overflow:visible}
}
/* ---- v8: paleta baby Tableau con verde suave, visor, resumen, volver ---- */
.cls{display:inline-block;font:500 10.5px var(--fb);padding:1px 8px;border-radius:999px;border:1px solid var(--cc);color:var(--ink);background:color-mix(in srgb,var(--cc) 22%,var(--panel));letter-spacing:.03em}
.autor{display:block;font:500 11.5px var(--fh);letter-spacing:.14em;color:var(--acc);margin-top:2px;text-transform:uppercase}
.abs{background:linear-gradient(180deg,color-mix(in srgb,var(--acc2) 55%,var(--panel)),var(--panel))}
.abs-t{font:500 17px/1.3 var(--fh);margin:2px 0 2px}.abs-a{font:500 12px var(--fh);letter-spacing:.12em;color:var(--acc);margin:0 0 10px}
.abs p{max-width:118ch;line-height:1.62}
a.cita{color:var(--acc);cursor:pointer;border-bottom:1px dotted var(--acc);text-decoration:none}a.cita:hover{background:var(--acc2)}
.vz{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.vz-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--soft2)}
.vz-bar .btn{padding:4px 9px;font-size:12px;border-radius:9px}.vz-bar .btn[aria-pressed=true]{background:var(--acc2);border-color:var(--acc)}
.vz-sp{flex:1}.vz-z{font:500 12px var(--fb);color:var(--mut);min-width:44px}
.vz-port{position:relative;height:min(80vh,780px);overflow:hidden;touch-action:none;background:var(--panel)}.vz-port.gr{cursor:grabbing!important}
.vz-st{transform-origin:0 0;position:absolute;left:0;top:0}
.vz .leg{padding:6px 12px;border-top:1px solid var(--line)}
.ch-h .cp{padding:2px 8px;font-size:11.5px;border-radius:8px;margin-left:auto}
#back{position:fixed;left:max(16px,calc(232px + 16px));bottom:22px;z-index:20;display:none;box-shadow:var(--shadow)}
#back.on{display:inline-flex}
@media (max-width:900px){#back{left:16px}}
.hero{background:linear-gradient(120deg,color-mix(in srgb,var(--c1) 22%,var(--panel)),color-mix(in srgb,var(--c3) 20%,var(--panel)))}
.acts .seg{order:99;margin-left:6px}
.pfg{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.pfg>div:empty{display:none}
.rc3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));margin:0 0 14px}
.rc3>div{border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:12px;padding:10px 12px;background:var(--panel);font-size:13px}
.rc3 b{display:block;font:500 12px var(--fh);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
</style>
</head>

function vArbol(host){

    var cab='<span class="badge '+(g==="AND"?'posible':g==="OR"?'probable':'')+'">'+esc(g)+'</span> '+esc(n.texto)+' '+claseTag(n.clase)+' '+nv(n.nivel)+' '+chips(n.evidencia)+(n.nota?'<br><small>'+lt(n.nota,100)+'</small>':'');
