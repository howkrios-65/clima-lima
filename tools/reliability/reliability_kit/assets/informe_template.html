<style>

<script>
"use strict";
var D=/*__INFORME_JSON__*/null;
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(x,d){if(x==null||!isFinite(x))return"n/d";d=d==null?3:d;var a=Math.abs(x);return a!==0&&(a>=1e6||a<1e-3)?x.toExponential(2):(+x.toFixed(d)).toString()}
var EV={};
var LV={"VERIFICADO-TEXTO":["t","VERIFICADO-TEXTO"],"VERIFICADO-ABSTRACT":["a","VERIFICADO-ABSTRACT"],"SOLO-SNIPPET":["s","SOLO-SNIPPET"],"NO-VERIFICADO":["n","NO-VERIFICADO"],"DATO-USUARIO":["u","DATO-USUARIO"]};
function lv(n){var l=LV[n]||["n",n];return '<span class="lv '+l[0]+'">'+esc(l[1])+'</span>'}
function chips(ids){return (ids||[]).map(function(i){return '<button class="chip" data-ev="'+esc(i)+'">'+esc(i)+'</button>'}).join("")||'<span class="badge">sin fuente</span>'}
function openEv(id){
  var e=EV[id],d=$("#drawer");if(!e)return;
  var r=e.referencia||{};
  d.innerHTML='<button class="x" aria-label="Cerrar">×</button><h3>'+esc(id)+' '+lv(e.nivel_evidencia)+'</h3><p>'+esc(e.apa)+'</p>'+
  '<p><b>Qué respalda:</b> '+esc(e.afirma)+'</p><p><b>Límites:</b> '+esc(e.limites)+'</p>'+
  (e.extracto?'<p><b>Extracto literal</b> ('+esc(e.localizador||"")+')</p><blockquote>'+esc(e.extracto)+'</blockquote>':'<p class="note">No se leyó texto de esta fuente: solo referencia o resumen de buscador.</p>')+
  '<p><b>Acceso:</b> '+esc(e.acceso||"dato aportado")+' · <b>vía:</b> '+esc(e.via||"n/d")+' · <b>fecha:</b> '+esc(e.fecha_acceso||"")+'</p>'+
  '<p><b>Cuartil de revista:</b> '+((e.revista_cuartil&&e.revista_cuartil.valor)?'Q'+e.revista_cuartil.valor+' ('+esc(e.revista_cuartil.fuente)+')':'no verificado')+'</p>'+
  (e.avisos&&e.avisos.length?'<div class="note">'+e.avisos.map(esc).join("<br>")+'</div>':'');
  d.classList.add("on");
}
document.addEventListener("click",function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.ev)openEv(t.dataset.ev);
  else if(t.classList&&t.classList.contains("x"))$("#drawer").classList.remove("on");
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("#drawer").classList.remove("on")});

/* ---------- gráfico de líneas SVG con cursor sincronizado ---------- */
var CURSOR={};
function lineChart(host,o){
  var W=760,H=o.h||210,m={l:46,r:12,t:10,b:24},x=o.x,ys=o.series;
  var xs=x.map(function(v){return +v}),x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs);
  var all=[];ys.forEach(function(s){s.y.forEach(function(v){if(isFinite(v))all.push(v)})});(o.hlines||[]).forEach(function(h){all.push(h.y)});
  var y0=Math.min.apply(0,all),y1=Math.max.apply(0,all);if(y0===y1){y0-=1;y1+=1}var pad=(y1-y0)*.06;y0-=pad;y1+=pad;
  function X(v){return m.l+(v-x0)/((x1-x0)||1)*(W-m.l-m.r)}function Y(v){return H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b)}
  var g='';for(var i=0;i<=4;i++){var yv=y0+(y1-y0)*i/4;g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(yv)+'" y2="'+Y(yv)+'" stroke="var(--line)"/><text x="4" y="'+(Y(yv)+4)+'">'+fmt(yv,2)+'</text>'}
  for(i=0;i<=4;i++){var xv=x0+(x1-x0)*i/4;g+='<text x="'+X(xv)+'" y="'+(H-6)+'" text-anchor="'+(i===4?'end':i===0?'start':'middle')+'">'+esc(o.xfmt?o.xfmt(xv):fmt(xv,1))+'</text>'}
  (o.vlines||[]).forEach(function(v){g+='<line x1="'+X(v.x)+'" x2="'+X(v.x)+'" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="'+(v.c||"var(--bad)")+'" stroke-dasharray="4 3"/><text x="'+(X(v.x)>W-90?X(v.x)-3:X(v.x)+3)+'" y="'+(m.t+9)+'" text-anchor="'+(X(v.x)>W-90?'end':'start')+'">'+esc(v.label||"")+'</text>'});
  (o.hlines||[]).forEach(function(h){g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(h.y)+'" y2="'+Y(h.y)+'" stroke="'+(h.c||"var(--warn)")+'" stroke-dasharray="5 3"/><text x="'+(W-m.r-2)+'" y="'+(Y(h.y)-3)+'" text-anchor="end">'+esc(h.label||"")+'</text>'});
  var cols=["var(--c1)","var(--c2)","var(--c3)","var(--c4)"];
  ys.forEach(function(s,k){var d="",on=false;s.y.forEach(function(v,j){if(!isFinite(v)){on=false;return}d+=(on?"L":"M")+X(xs[j]).toFixed(1)+" "+Y(v).toFixed(1);on=true});g+='<path d="'+d+'" fill="none" stroke="'+cols[k%4]+'" stroke-width="1.6"/>'});
  (o.marks||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="4" fill="var(--bad)"><title>'+esc(p.label||"")+'</title></circle>'});
  var leg=ys.map(function(s,k){return '<span style="color:'+cols[k%4]+'">&#9632;</span> '+esc(s.name||"")}).join("  ");
  host.innerHTML='<div style="font-size:12px;color:var(--mut)">'+leg+'</div><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(o.titulo||"gráfico")+'">'+g+
   '<line class="cur" x1="0" x2="0" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--ink)" opacity="0"/></svg><div class="rd" style="font-size:12px;color:var(--mut);min-height:16px"></div>';
  var svg=$("svg",host),cur=$(".cur",svg),rd=$(".rd",host);
  function show(xv,fromSelf){
    if(xv==null){cur.setAttribute("opacity",0);rd.textContent="";return}
    var j=0,b=1e99;xs.forEach(function(v,k){var dd=Math.abs(v-xv);if(dd<b){b=dd;j=k}});
    cur.setAttribute("x1",X(xs[j]));cur.setAttribute("x2",X(xs[j]));cur.setAttribute("opacity",.6);
    rd.textContent=(o.xfmt?o.xfmt(xs[j]):fmt(xs[j],1))+" · "+ys.map(function(s){return (s.name||"")+" = "+fmt(s.y[j],3)}).join(" · ");
  }
  svg.addEventListener("mousemove",function(e){var r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,xv=x0+(px-m.l)/(W-m.l-m.r)*(x1-x0);Object.keys(CURSOR).forEach(function(k){CURSOR[k](xv)})});
  svg.addEventListener("mouseleave",function(){Object.keys(CURSOR).forEach(function(k){CURSOR[k](null)})});
  CURSOR[o.key||host.id]=show;
}
function dnum(s){var t=Date.parse(s);return isNaN(t)?NaN:t/864e5}
function dfmt(n){return new Date(n*864e5).toISOString().slice(0,10)}

/* ---------- estadística robusta (réplica de signals.py: mediana y MAD) ---------- */
function median(a){var b=a.filter(isFinite).slice().sort(function(x,y){return x-y}),n=b.length;if(!n)return NaN;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2}
function baseRobusta(y,n){var w=y.slice(0,n).filter(isFinite),m=median(w),s=1.4826*median(w.map(function(v){return Math.abs(v-m)}));if(!s){var mu=w.reduce(function(a,b){return a+b},0)/w.length;s=Math.sqrt(w.reduce(function(a,b){return a+(b-mu)*(b-mu)},0)/(w.length-1))||1e-12}return{med:m,sig:s,n:w.length}}
function primerCruce(y,u,p){var run=0;for(var i=0;i<y.length;i++){if(y[i]>u){run++;if(run>=p)return i-p+1}else run=0}return -1}
function cusum(y,mu,sig,k){var s=0,o=[];y.forEach(function(v){s=Math.max(0,s+(v-mu)/sig-k);o.push(s)});return o}

/* ---------- motor Weibull (máxima verosimilitud con censura a la derecha) ---------- */
function sortedData(d){return d.slice().sort(function(a,b){return a.t-b.t})}
function profLL(beta,t,c){var r=0,sf=0,st=0;for(var i=0;i<t.length;i++){st+=Math.pow(t[i],beta);if(!c[i]){r++;sf+=Math.log(t[i])}}return r*Math.log(beta)-r*Math.log(st/r)+(beta-1)*sf-r}
function solveBeta(t,c){
  var r=0,sf=0;t.forEach(function(v,i){if(!c[i]){r++;sf+=Math.log(v)}});
  function g(b){var a=0,bb=0;t.forEach(function(v){var p=Math.pow(v,b);a+=p*Math.log(v);bb+=p});return a/bb-1/b-sf/r}
  var lo=0.02,hi=100;if(g(lo)>0||g(hi)<0)return NaN;
  for(var k=0;k<200;k++){var mid=(lo+hi)/2;if(g(mid)>0)hi=mid;else lo=mid}
  return(lo+hi)/2;
}
function fitWeibull(data){
  var t=data.map(function(d){return d.t}),c=data.map(function(d){return !!d.censurado}),r=c.filter(function(x){return!x}).length;
  if(r<2)return{error:"se necesitan al menos 2 fallas para ajustar Weibull"};
  var beta=solveBeta(t,c);if(!isFinite(beta))return{error:"el estimador no converge (¿todos los tiempos iguales?)"};
  var st=0;t.forEach(function(v){st+=Math.pow(v,beta)});var eta=Math.pow(st/r,1/beta);
  return{beta:beta,eta:eta,r:r,n:t.length,ll:profLL(beta,t,c),t:t,c:c};
}
function bisect(f,a,b){var fa=f(a);for(var i=0;i<100;i++){var m=(a+b)/2,fm=f(m);if((fa>0)===(fm>0)){a=m;fa=fm}else b=m}return(a+b)/2}
var CHI=1.9207; /* chi-cuadrado(1, 0.95)/2 */
function ciBeta(f){
  var t=f.t,c=f.c,tgt=f.ll-CHI,h=function(b){return profLL(b,t,c)-tgt};
  var lo=h(0.02)<0?bisect(h,0.02,f.beta):0.02,hi=h(100)<0?bisect(h,f.beta,100):100;return[lo,hi];
}
function bLife(beta,eta,p){return eta*Math.pow(-Math.log(1-p),1/beta)}
function llTp(beta,tp,p,t,c){var eta=tp/Math.pow(-Math.log(1-p),1/beta),r=0,sf=0,s=0;for(var i=0;i<t.length;i++){s+=Math.pow(t[i]/eta,beta);if(!c[i]){r++;sf+=Math.log(t[i])}}return r*Math.log(beta)-r*beta*Math.log(eta)+(beta-1)*sf-s}
function maxOverBeta(tp,p,t,c){var a=0.05,b=60,gr=0.6180339887;for(var i=0;i<80;i++){var x1=b-gr*(b-a),x2=a+gr*(b-a);if(llTp(x1,tp,p,t,c)<llTp(x2,tp,p,t,c))a=x1;else b=x2}return llTp((a+b)/2,tp,p,t,c)}
function ciBLife(f,p){
  var tp=bLife(f.beta,f.eta,p),tgt=f.ll-CHI,h=function(x){return maxOverBeta(x,p,f.t,f.c)-tgt};
  var lo=tp,i=0;while(h(lo)>0&&i++<60)lo/=1.5;var hi=tp;i=0;while(h(hi)>0&&i++<60)hi*=1.5;
  return[bisect(h,lo,tp),bisect(h,tp,hi)];
}
function medianRanks(data){ /* rangos de Johnson con censura + aproximación de Bernard */
  var s=sortedData(data),n=s.length,prev=0,out=[],k=n;
  s.forEach(function(d,i){var rem=n-i;if(!d.censurado){var inc=(n+1-prev)/(1+rem);prev=prev+inc;out.push({t:d.t,F:(prev-0.3)/(n+0.4)})}});
  return out;
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bootR(data,tm,B,seed){
  var rng=mulberry(seed),out=[],n=data.length;
  for(var b=0;b<B;b++){var s=[];for(var i=0;i<n;i++)s.push(data[Math.floor(rng()*n)]);var f=fitWeibull(s);if(f.error)continue;out.push(Math.exp(-Math.pow(tm/f.eta,f.beta)))}
  out.sort(function(a,b){return a-b});return out;
}
function quant(a,q){if(!a.length)return NaN;var i=(a.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return a[lo]+(a[hi]-a[lo])*(i-lo)}

/* ---------- vistas ---------- */
var VIEWS=[];
function tab(id,label,fn,show){if(show===false)return;VIEWS.push({id:id,label:label,fn:fn})}
function mkCard(h,body){return '<div class="card"><h2>'+h+'</h2>'+body+'</div>'}

function vResumen(host){
  var c=D.caso,r=c.resumen||{},m=c.meta||{},re=D.resumen_evidencia;
  var h='';
  if(D.ajustes.length)h+='<div class="note bad"><b>'+D.ajustes.length+' ajuste(s) automático(s) por falta de respaldo.</b> Ver pestaña Rastro. Lo que no tenía fuente fue degradado o marcado.</div>';
  h+='<div class="card"><h2>Indicadores</h2><div class="grid">'+(r.kpis||[]).map(function(k){return '<div class="kpi"><b>'+esc(k.valor)+'</b><span>'+esc(k.label)+'</span><div>'+chips(k.evidencia)+'</div></div>'}).join("")+
   '<div class="kpi"><b>'+re.total+'</b><span>fuentes en el registro</span></div></div></div>';
  h+=mkCard("Hallazgos",'<ol>'+(r.hallazgos||[]).map(function(x){return '<li>'+esc(x.texto)+' '+(x.sin_evidencia?'<span class="badge confirmada" style="border-color:var(--bad);color:var(--bad)">SIN EVIDENCIA</span>':chips(x.evidencia))+'</li>'}).join("")+'</ol>');
  h+=mkCard("Hipótesis de causa",'<div class="tw"><table><tr><th>Id</th><th>Hipótesis</th><th>Estado</th><th>Evidencia del caso</th><th>Respaldo científico</th><th>Contradice</th></tr>'+
   (c.hipotesis||[]).map(function(x){return '<tr><td>'+esc(x.id)+'</td><td>'+esc(x.titulo)+'<br><small>'+esc(x.tipo||"")+'</small></td><td><span class="badge '+esc(x.estado)+'">'+esc(x.estado)+(x.degradada?' ↓':'')+'</span></td><td>'+chips(x.apoyo_caso)+'</td><td>'+chips(x.apoyo_literatura)+'</td><td>'+chips(x.contradice)+'</td></tr>'}).join("")+'</table></div>'+
   '<div class="note">Una causa solo figura como confirmada con evidencia del propio caso. La literatura respalda plausibilidad, no que haya ocurrido aquí.</div>');
  h+=mkCard("Calidad de la evidencia",'<div class="tw"><table><tr><th>Nivel</th><th>Fuentes</th></tr>'+Object.keys(re.por_nivel).map(function(k){return '<tr><td>'+lv(k)+'</td><td>'+re.por_nivel[k]+'</td></tr>'}).join("")+'</table></div><p style="font-size:13px;color:var(--mut)">Cuartil verificado: '+(Object.keys(re.cuartil_verificado).length?JSON.stringify(re.cuartil_verificado):"ninguno (no se pudo comprobar en esta ejecución)")+'. Fuentes sin país declarado no se cuentan por país.</p>');
  host.innerHTML=h;

function vVida(host){
  var v=D.caso.vida;
  if(!v||!v.datos||!v.datos.length){host.innerHTML='<div class="card"><h2>Vida (Weibull)</h2><div class="note bad">No hay tiempos de vida suficientes para este análisis. No se calcula nada: un solo evento no permite ajustar una distribución.</div></div>';return}
  var f=fitWeibull(v.datos);
  if(f.error){host.innerHTML='<div class="card"><h2>Vida (Weibull)</h2><div class="note bad">'+esc(f.error)+'</div></div>';return}
  var cb=ciBeta(f),b10=bLife(f.beta,f.eta,.1),cb10=ciBLife(f,.1),ref=v.referencia,test="";
  if(ref){var okb=Math.abs(f.beta-ref.beta)/ref.beta<2e-3,oke=Math.abs(f.eta-ref.eta)/ref.eta<2e-3;
    test='<div class="note '+((okb&&oke)?'ok':'bad')+'">Autoprueba contra el kit de Python ('+esc(ref.origen||"reliability_kit")+'): β '+fmt(f.beta,4)+' frente a '+fmt(ref.beta,4)+' y η '+fmt(f.eta,2)+' frente a '+fmt(ref.eta,2)+' → <b>'+((okb&&oke)?"coinciden":"NO COINCIDEN: no use estas cifras")+'</b>.</div>'}

  var warn=f.r<10?'<div class="note bad">Solo '+f.r+' falla(s): resultado exploratorio. Los intervalos son anchos y pueden ser poco fiables; no extrapole más allá de la mayor edad observada ('+fmt(Math.max.apply(0,f.t),1)+').</div>':'';
  host.innerHTML='<div class="card"><h2>Vida: Weibull de dos parámetros por máxima verosimilitud con censura</h2><p>'+esc(v.nota||"")+' '+chips(v.evidencia)+'</p>'+warn+test+
   '<div class="grid"><div class="kpi"><b>'+fmt(f.beta,3)+'</b><span>β forma · IC 95 % verosimilitud perfilada ['+fmt(cb[0],2)+'; '+fmt(cb[1],2)+']</span></div>'+
   '<div class="kpi"><b>'+fmt(f.eta,1)+'</b><span>η escala ('+esc(v.unidad||"")+')</span></div>'+
   '<div class="kpi"><b>'+fmt(b10,1)+'</b><span>B10 · IC 95 % ['+fmt(cb10[0],1)+'; '+fmt(cb10[1],1)+']</span></div>'+
   '<div class="kpi"><b>'+f.r+' / '+f.n+'</b><span>fallas / observaciones</span></div></div>'+
   '<p style="font-size:13px">Lectura de β: '+(f.beta<.95?'menor que 1, tasa decreciente (mortalidad infantil o mezcla de modos)':f.beta>1.05?'mayor que 1, desgaste (la tasa crece con la edad)':'cercano a 1, tasa aproximadamente constante')+
   '. Si el intervalo incluye 1, los datos no distinguen entre tasa constante y variable.</p></div>'+
   '<div class="card"><h2>Papel de probabilidad Weibull</h2><div id="wp"></div></div>'+
   '<div class="card"><h2>Simulación: confiabilidad de una misión</h2><label>Duración de misión <input type="number" id="tm" value="'+fmt(Math.round(f.eta*0.25),0)+'"></label><label>Remuestreos <input type="number" id="bb" value="300"></label><button class="btn" id="go">Simular</button><div id="mc"></div></div>';
  var rk=medianRanks(v.datos);
  var W=760,H=300,m={l:50,r:14,t:10,b:30},lx=rk.map(function(p){return Math.log(p.t)}),ly=rk.map(function(p){return Math.log(-Math.log(1-p.F))});
  var xmin=Math.min.apply(0,lx.concat([Math.log(b10)]))-.3,xmax=Math.max.apply(0,lx)+.3,ymin=Math.min.apply(0,ly.concat([-3]))-.2,ymax=Math.max.apply(0,ly)+.4;
  function X(a){return m.l+(a-xmin)/(xmax-xmin)*(W-m.l-m.r)}function Y(a){return H-m.b-(a-ymin)/(ymax-ymin)*(H-m.t-m.b)}
  var s='';[.01,.05,.1,.25,.5,.75,.9,.99].forEach(function(q){var yy=Math.log(-Math.log(1-q));s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(yy)+'" y2="'+Y(yy)+'" stroke="var(--line)"/><text x="4" y="'+(Y(yy)+4)+'">'+(q*100)+'%</text>'});
  for(var e=Math.ceil(xmin/Math.LN10);e<=xmax/Math.LN10;e++){var xx=e*Math.LN10;s+='<line y1="'+m.t+'" y2="'+(H-m.b)+'" x1="'+X(xx)+'" x2="'+X(xx)+'" stroke="var(--line)"/><text x="'+X(xx)+'" y="'+(H-10)+'" text-anchor="middle">10^'+e+'</text>'}
  s+='<line x1="'+X(xmin)+'" y1="'+Y(f.beta*(xmin-Math.log(f.eta)))+'" x2="'+X(xmax)+'" y2="'+Y(f.beta*(xmax-Math.log(f.eta)))+'" stroke="var(--c1)" stroke-width="1.6"/>';
  rk.forEach(function(p,i){s+='<circle cx="'+X(lx[i])+'" cy="'+Y(ly[i])+'" r="4" fill="var(--c2)"><title>t='+fmt(p.t,1)+' F='+fmt(p.F,3)+'</title></circle>'});
  $("#wp").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Papel Weibull">'+s+'</svg><div style="font-size:12px;color:var(--mut)">Puntos: rangos de Johnson con aproximación de Bernard (solo fallas). La recta es el ajuste de máxima verosimilitud, no una regresión sobre los puntos.</div>';
  $("#go").onclick=function(){

  };
  $("#go").onclick();
}

function vSim(host){
  host.innerHTML='<div class="card"><h2>Simulador didáctico del reemplazo por edad</h2><div class="note bad"><b>No es evidencia ni representa a la chumacera.</b> Los valores los elige quien usa la página; no hay para este modo de falla una forma, una escala ni costos con fuente leída. Úselo para entender cómo cambia el punto óptimo cuando tenga datos o parámetros citables.</div>'+
   '<label>β forma <input type="range" id="sb" min="0.5" max="5" step="0.05" value="2"> <b id="vb"></b></label><label>η escala (horas) <input type="number" id="se" value="10000" min="1"></label>'+
   '<label>Costo preventivo <input type="number" id="sp" value="1" min="0.01" step="0.1"></label><label>Costo de falla <input type="number" id="sf" value="5" min="0.01" step="0.1"></label><span style="font-size:12px;color:var(--mut)">(costos en unidades relativas que usted define)</span>'+

    for(i=1;i<=N;i++){t=ts*i/N;var r=Math.exp(-Math.pow(t/e,b));cum+=(prevR+r)/2*(t-prevT);prevR=r;prevT=t;T.push(t);R.push(r);Hh.push(b/e*Math.pow(t/e,b-1));C.push((cp*r+cf*(1-r))/cum)}
    var k=0;C.forEach(function(v,j){if(v<C[k])k=j});var interior=b>1&&cf>cp&&k<N-1&&k>0,rtf=cf/(e*gamma1(b));
    $("#sr").innerHTML=interior?'<div class="grid"><div class="kpi"><b>'+fmt(T[k],0)+'</b><span>edad óptima con SUS valores de ejemplo (h)</span></div><div class="kpi"><b>'+fmt(C[k],5)+'</b><span>costo por hora en el óptimo</span></div><div class="kpi"><b>'+fmt(rtf,5)+'</b><span>costo por hora si se corre a la falla</span></div><div class="kpi"><b>'+fmt(100*(1-C[k]/rtf),1)+' %</b><span>ahorro teórico con sus valores, no un resultado del activo</span></div></div>':
      '<div class="note">Sin mínimo interior: '+(b<=1?'con β ≤ 1 el riesgo no crece con la edad y reemplazar por edad no reduce el costo.':cf<=cp?'si la falla no cuesta más que la prevención, esperar a la falla es igual o más barato.':'el mínimo cae fuera del rango mostrado.')+'</div>';
    lineChart($("#s1"),{x:T,series:[{name:"R(t) confiabilidad",y:R}],titulo:"Confiabilidad",xfmt:function(v){return fmt(v,0)},key:"s1"});
    lineChart($("#s2"),{x:T,series:[{name:"h(t) tasa de falla",y:Hh}],titulo:"Tasa de falla",xfmt:function(v){return fmt(v,0)},key:"s2"});
    lineChart($("#s3"),{x:T,series:[{name:"costo por hora C(T)",y:C}],vlines:interior?[{x:T[k],label:"óptimo",c:"var(--ok)"}]:[],hlines:[{y:rtf,label:"correr a la falla",c:"var(--warn)"}],titulo:"Costo por hora",xfmt:function(v){return fmt(v,0)},key:"s3"});
  }
  function gamma1(b){var z=1+1/b,g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
    function G(z){if(z<.5)return Math.PI/(Math.sin(Math.PI*z)*G(1-z));z-=1;var x=c[0];for(var i=1;i<g+2;i++)x+=c[i]/(z+i);var t=z+g+.5;return Math.sqrt(2*Math.PI)*Math.pow(t,z+.5)*Math.exp(-t)*x}return G(z)}
  host.addEventListener("input",run);CURSOR={};run();
  window.__sim=function(b,e,cp,cf){$("#sb").value=b;$("#se").value=e;$("#sp").value=cp;$("#sf").value=cf;run();return $("#sr").textContent};
}

function vArbol(host){
  var a=D.caso.analisis.arbol,N={};a.nodos.forEach(function(n){N[n.id]=n});
  var hijosDe={};a.nodos.forEach(function(n){(n.hijos||[]).forEach(function(h){hijosDe[h]=1})});
  var raices=a.nodos.filter(function(n){return!hijosDe[n.id]}),pv=store("arbolp")||{};
  host.innerHTML='<div class="card"><h2>Árbol de fallas</h2><p><b>Evento tope:</b> '+esc(a.evento_tope||"")+'</p><div class="note">La estructura (puertas OR y AND) es una propuesta respaldada por la evidencia citada en cada nodo o por síntesis con premisas; no está probada con datos del activo. Las probabilidades de los eventos básicos están vacías: ingrese las que conozca (de 0 a 1) y se calcula la probabilidad del evento tope suponiendo eventos independientes. <b>La compuerta AND del evento tope y la agrupación de causas latentes son hipótesis del equipo</b>: el AND supone que la falla funcional exige además que el daño avance sin ser detectado ni atendido, lo que depende de si existe un programa de monitoreo; las causas latentes actúan como habilitador de las causas físicas, no como alternativa independiente.</div><button class="btn" id="arb-ex">Expandir todo</button> <button class="btn" id="arb-co">Contraer todo</button><div id="arb-tr"></div></div><div class="card"><h2>Probabilidad del evento tope</h2><div id="arb-pt"></div></div>'+vaciosHtml(a.vacios);
  function nodo(n,depth){
    var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean),g=n.puerta;
    var cab='<span class="badge '+(g==="AND"?'posible':g==="OR"?'probable':'')+'">'+esc(g)+'</span> '+esc(n.texto)+' '+nv(n.nivel)+' '+chips(n.evidencia)+(n.nota?'<br><small>'+esc(n.nota)+'</small>':'');
    if(!hs.length)return '<li style="list-style:none;margin:4px 0">'+cab+' <label>p <input type="number" min="0" max="1" step="0.001" data-p="'+esc(n.id)+'" value="'+(pv[n.id]==null?"":pv[n.id])+'" style="width:70px"></label></li>';
    return '<li style="list-style:none;margin:4px 0"><details'+(depth<2?' open':'')+'><summary>'+cab+'</summary><ul style="border-left:2px solid var(--line);margin-left:6px;padding-left:12px">'+hs.map(function(h){return nodo(h,depth+1)}).join("")+'</ul></details></li>';
  }
  $("#arb-tr").innerHTML='<ul style="padding:0">'+raices.map(function(r){return nodo(r,0)}).join("")+'</ul>';
  function calc(n){var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean);if(!hs.length){return{p:pv[n.id]==null||pv[n.id]===""?null:+pv[n.id],falta:(pv[n.id]==null||pv[n.id]==="")?1:0}}
    var r=hs.map(calc),falta=r.reduce(function(x,y){return x+y.falta},0);if(falta)return{p:null,falta:falta};
    var p=n.puerta==="AND"?r.reduce(function(x,y){return x*y.p},1):1-r.reduce(function(x,y){return x*(1-y.p)},1);return{p:p,falta:0}}
  function out(){var tot=raices.map(calc),f=tot.reduce(function(x,y){return x+y.falta},0);
    $("#arb-pt").innerHTML=f?'<p>Faltan '+f+' probabilidad(es) de eventos básicos para calcular el evento tope.</p>':'<div class="grid">'+tot.map(function(t,i){return '<div class="kpi"><b>'+fmt(t.p,5)+'</b><span>P('+esc(raices[i].texto.slice(0,50))+')</span></div>'}).join("")+'</div><p style="font-size:12px;color:var(--mut)">Cálculo con las probabilidades que usted ingresó; no son datos de la evidencia.</p>'}
  host.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.p){pv[t.dataset.p]=t.value===""?null:Math.max(0,Math.min(1,+t.value));store("arbolp",pv);out()}});
  $("#arb-ex").onclick=function(){host.querySelectorAll("details").forEach(function(d){d.open=true})};$("#arb-co").onclick=function(){host.querySelectorAll("details").forEach(function(d){d.open=false})};
  out();
}

    for(var t=0;t<=4;t++){s+='<text x="'+(40+t/4*(W-50))+'" y="140" text-anchor="middle">'+fmt(mx*t/4,0)+' Hz</text>'}
    $("#hs").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Marcadores de frecuencia">'+s+'</svg><p style="font-size:12px;color:var(--mut)">Marcadores cinemáticos (sin deslizamiento) y sus armónicos; no son un espectro medido.</p>'}
  function l10(){var C=+$("#her-c").value,P=+$("#her-p").value,p=+$("#her-t").value,n=+$("#her-n").value;if(!(C>0&&P>0)){$("#her-o").innerHTML="<p>Ingrese C y P.</p>";return}var L=Math.pow(C/P,p);$("#her-o").innerHTML='<div class="grid"><div class="kpi"><b>'+fmt(L,2)+'</b><span>L10 (millones de revoluciones)</span></div>'+(n>0?'<div class="kpi"><b>'+fmt(L*1e6/(60*n),0)+'</b><span>L10h (horas) = L10·10^6/(60·n)</span></div>':'')+'</div>'}
  function pa(){var rows=($("#pa").value||"").split("\n").map(function(l){var m=l.split(":");return{label:(m[0]||"").trim(),value:+(m[1]||"").trim()}}).filter(function(r){return r.label&&r.value>0}).sort(function(a,b){return b.value-a.value});
    if(!rows.length){$("#pg").innerHTML="";return}var tot=rows.reduce(function(a,b){return a+b.value},0),ac=0;rows.forEach(function(r){ac+=r.value;r.label=r.label+" ("+fmt(100*ac/tot,0)+" % acum.)"});$("#pg").innerHTML='<div id="pgb"></div>';barChart($("#pgb"),rows,{titulo:"Pareto"})}
  host.addEventListener("input",function(){fr();l10();pa()});fr();l10();
}

function vPlan(host){
  var p=D.caso.plan||[];
  host.innerHTML='<div class="card"><h2>Plan de acciones (CAPA)</h2><div class="tw"><table><tr><th>Id</th><th>Acción</th><th>Tipo</th><th>Causa</th><th>Responsable</th><th>Fecha</th><th>Verificación de eficacia</th><th>Fuente</th></tr>'+
   p.map(function(a){return '<tr><td>'+esc(a.id)+'</td><td>'+esc(a.accion)+'</td><td>'+esc(a.tipo||"")+'</td><td>'+esc(a.causa||"")+'</td><td>'+esc(a.responsable||"por asignar")+'</td><td>'+esc(a.fecha||"")+'</td><td>'+esc(a.verificacion||"por definir")+'</td><td>'+chips(a.evidencia)+'</td></tr>'}).join("")+'</table></div></div>';
}

function vHistorial(host){
  var c=D.caso,hs=c.historial||[];
  host.innerHTML='<div class="card"><h2>Historial y línea base del caso</h2>'+(c.recurrencia?'<div class="note '+(c.recurrencia.detectada?'bad':'ok')+'"><b>Recurrencia:</b> '+esc(c.recurrencia.texto||"")+'</div>':'<div class="note">Sin casos previos comparables registrados: no se puede afirmar recurrencia ni actualizar una línea base.</div>')+
   '<div class="tw"><table><tr><th>Versión</th><th>Fecha</th><th>Cambio</th><th>Línea base</th></tr>'+hs.map(function(h){return '<tr><td>'+esc(h.version)+'</td><td>'+esc(h.fecha)+'</td><td>'+esc(h.cambio)+'</td><td>'+esc(h.baseline||"")+'</td></tr>'}).join("")+'</table></div></div>';
}

function vRastro(host){
  var c=D.caso,L=function(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+esc(typeof x==="string"?x:(x.texto||JSON.stringify(x)))+'</li>'}).join("")+'</ul>':'<p>Ninguno.</p>'};
  host.innerHTML=mkCard("Ajustes aplicados por las compuertas",D.ajustes.length?'<div class="tw"><table><tr><th>Dónde</th><th>Tipo</th><th>Detalle</th></tr>'+D.ajustes.map(function(a){return '<tr><td>'+esc(a.donde)+'</td><td>'+esc(a.tipo)+'</td><td>'+esc(a.detalle)+'</td></tr>'}).join("")+'</table></div>':'<p>Ninguno: todo lo afirmado tenía respaldo del nivel exigido.</p>')+
   mkCard("Vacíos (lo que no se encontró o no se tiene)",L(c.vacios))+mkCard("Supuestos",L(c.supuestos))+mkCard("Preguntas abiertas",L(c.preguntas))+
   mkCard("Reproducibilidad",'<p>Generado el '+esc(D.generado)+' con reliability_kit. Los números de vida se recalculan en el navegador y se contrastan con el kit de Python cuando hay valores de referencia. Todo el informe es un solo archivo sin peticiones externas.</p>'+(c.busqueda?'<pre class="code">'+esc(JSON.stringify(c.busqueda,null,1))+'</pre>':''));
}

/* ---------- arranque ---------- */
function boot(){
  if(!D){document.body.innerHTML="<p style='padding:20px'>El informe no tiene datos incrustados.</p>";return}
  D.evidencia.forEach(function(e){EV[e.id]=e});
  var m=D.caso.meta;$("#ttl").textContent=m.titulo;$("#sub").textContent=[m.activo,m.fecha_evento&&("evento "+m.fecha_evento),m.origen_datos&&("datos: "+m.origen_datos)].filter(Boolean).join(" · ");
  var c=D.caso;
  tab("res","Resumen",vResumen);
  tab("tl","Línea de tiempo",vTiempo,(c.linea_tiempo||[]).length>0);
  tab("sen","Señales",vSenales,(c.series||[]).length>0);
  tab("cau","Causas y técnicas",vCausas);
  tab("dos","Dossier",vDossier,!!c.dossier);
  var an=c.analisis||{};
  tab("fme","FMECA",vFmeca,!!(an.fmeca&&an.fmeca.items&&an.fmeca.items.length));
  tab("arb","Árbol de fallas",vArbol,!!(an.arbol&&an.arbol.nodos&&an.arbol.nodos.length));
  tab("acr","ACR",vAcr,!!(an.acr&&an.acr.hipotesis&&an.acr.hipotesis.length));
  tab("lcc","LCC",vLcc,!!(an.lcc&&an.lcc.elementos&&an.lcc.elementos.length));
  tab("vpr","Vida y predictivo",vVidaPred,!!(an.vida||an.predictivo));
  tab("her","Herramientas",vHerr,!!an.herramientas);
  tab("sim","Simulador",vSim,!!c.simulador);
  tab("dat","Datos",vDatos,(c.tablas||[]).length>0);
  tab("evi","Evidencia",vEvidencia);
  tab("vid","Vida",vVida);
  tab("pre","Predictivo",vPredictivo);
  tab("pla","Plan",vPlan,(c.plan||[]).length>0);
  tab("his","Historial",vHistorial);
  tab("ras","Rastro",vRastro);
  var tb=$("#tabs"),mn=$("#main");
  VIEWS.forEach(function(v,i){
    var b=document.createElement("button");b.textContent=v.label;b.setAttribute("role","tab");b.dataset.id=v.id;tb.appendChild(b);
    var s=document.createElement("section");s.className="tab";s.id="v-"+v.id;mn.appendChild(s);
    b.onclick=function(){sel(v.id)};
  });
  function sel(id){
    VIEWS.forEach(function(v){var s=$("#v-"+v.id),b=$('[data-id='+v.id+']',tb);var on=v.id===id;s.classList.toggle("on",on);b.setAttribute("aria-selected",on);
      if(on&&!s.dataset.done){s.dataset.done=1;try{v.fn(s)}catch(e){s.innerHTML='<div class="note bad">Error al dibujar esta vista: '+esc(e.message)+'</div>';window.__errores=(window.__errores||[]).concat(String(e))}}});
    try{history.replaceState(null,"","#"+id)}catch(e){}
  }
  var h=(location.hash||"").slice(1);sel(VIEWS.some(function(v){return v.id===h})?h:"res");
  $("#thm").onclick=function(){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
  window.__listo=true;
}
boot();
</script>
</body>
</html>
