<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f7fc;--panel:#ffffff;--ink:#1e2b3a;--mut:#62758a;--line:#dbe6f1;--soft:#eaf2fa;--soft2:#f6f9fd;--acc:#4e8cc2;--acc2:#e3eef9;--ok:#4f9d75;--warn:#d99a42;--bad:#d96b72;--c1:#5b9bd5;--c2:#f2a65a;--c3:#7bbf8e;--c4:#b69bd6;--c5:#6cc3c3;--c6:#ecc96b;--shadow:0 1px 2px rgba(40,70,100,.06),0 8px 22px rgba(40,70,100,.07);--hero1:#d9eafa;--hero2:#efe6fa;--fb:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;--fh:"Manrope","Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1824;--panel:#152233;--ink:#e5eef8;--mut:#94a9bf;--line:#243a52;--soft:#1b2c40;--soft2:#182738;--acc:#79b2e6;--acc2:#1c3350;--ok:#6cc08f;--warn:#e6b05a;--bad:#ea8a90;--c1:#79b2e6;--c2:#f4b676;--c3:#8fd0a0;--c4:#c8afe6;--c5:#86d3d3;--c6:#f0d583;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);--hero1:#18314d;--hero2:#2a2440;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1824;--panel:#152233;--ink:#e5eef8;--mut:#94a9bf;--line:#243a52;--soft:#1b2c40;--soft2:#182738;--acc:#79b2e6;--acc2:#1c3350;--ok:#6cc08f;--warn:#e6b05a;--bad:#ea8a90;--c1:#79b2e6;--c2:#f4b676;--c3:#8fd0a0;--c4:#c8afe6;--c5:#86d3d3;--c6:#f0d583;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);--hero1:#18314d;--hero2:#2a2440;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb)}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.01em}
.ic{vertical-align:-3px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;font:600 15px var(--fh);color:var(--ink)}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff}
#tabs{display:flex;flex-direction:column;gap:3px}
#tabs button{display:flex;gap:10px;align-items:center;border:0;background:none;color:var(--mut);padding:10px 12px;border-radius:10px;font:500 14px var(--fb);cursor:pointer;text-align:left}
#tabs button:hover{background:var(--soft)}
#tabs button[aria-selected=true]{background:var(--acc2);color:var(--ink)}
#tabs button[aria-selected=true] .ic{color:var(--acc)}
.side-f{margin-top:auto;font-size:12px;color:var(--mut);padding:8px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#top h1{margin:0;font-size:17px;flex:1 1 260px;min-width:0}
#top h1 small{display:block;font:400 12px var(--fb);color:var(--mut)}
.search{position:relative;flex:1 1 280px;max-width:460px}
.search input[type=text]{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit}
.search .ic{position:absolute;left:11px;top:11px;color:var(--mut)}
#sres{position:absolute;left:0;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:30}
#sres a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
#sres a:hover{background:var(--soft)}#sres small{color:var(--mut);display:block}
#sres mark{background:var(--c6);color:#000;border-radius:3px;padding:0 1px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--mut);padding:7px 11px;font:500 13px var(--fb);cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button[aria-pressed=true]{background:var(--acc2);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:7px 12px;font:500 13px var(--fb);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--soft)}
#dmenu{position:absolute;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30;min-width:250px}
#dmenu button{display:flex;gap:9px;width:100%;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;font:500 14px var(--fb);cursor:pointer;text-align:left}
#dmenu button:hover{background:var(--soft)}
main{padding:18px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px));max-width:1240px}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;gap:8px;align-items:center}.card h3{margin:12px 0 6px;font-size:14px}
.hero{border-radius:20px;padding:22px;margin:0 0 16px;background:linear-gradient(120deg,var(--hero1),var(--hero2));border:1px solid var(--line)}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0 0 14px;color:var(--mut);max-width:70ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
#app>div,main,.card,.hero,.chart{min-width:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.kpi .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--acc2);color:var(--acc);flex:none}
.kpi b{display:block;font:600 20px var(--fh);line-height:1.1;white-space:nowrap}.kpi span{color:var(--mut);font-size:12px;display:block}
.hero .kpi{background:color-mix(in srgb,var(--panel) 80%,transparent)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--mut);padding:7px 13px;border-radius:999px;font:500 13px var(--fb);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.subpane{display:none}.subpane.on{display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;background:var(--soft2);position:sticky;top:0}
.tw{overflow-x:auto;border-radius:10px}
.chip{white-space:nowrap;display:inline-block;font:500 11px var(--fb);padding:1px 7px;margin:1px 2px;border-radius:999px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);color:var(--acc);background:var(--acc2);cursor:pointer}
.lv{font:500 11px var(--fb);padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.lv.t{background:var(--ok)}.lv.a{background:#7fb69a}.lv.s{background:var(--warn)}.lv.n{background:var(--bad)}.lv.u{background:var(--c4)}
.badge{font:500 12px var(--fb);padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--soft)}
.badge.confirmada{border-color:var(--ok);color:var(--ok)}.badge.probable{border-color:var(--acc);color:var(--acc)}.badge.posible{border-color:var(--warn);color:var(--warn)}.badge.descartada{border-color:var(--bad);color:var(--bad)}
.note{border-radius:12px;background:var(--soft);padding:9px 12px;margin:8px 0;font-size:13px;border:1px solid var(--line)}
.note.bad{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.note.ok{background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
label{font-size:13px;color:var(--mut);display:inline-block;margin:4px 12px 4px 0}
input[type=range]{vertical-align:middle;width:150px;accent-color:var(--acc)}
input[type=number],input[type=text],select,textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
input[type=number]{width:96px}
.lt .mas{color:var(--acc);cursor:pointer;font-weight:600}
svg text{fill:var(--mut);font:11px var(--fb)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 16px;box-shadow:var(--shadow)}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ch-h b{font:600 14px var(--fh)}
.ch-f{margin-top:6px;font-size:12px;color:var(--mut);background:var(--soft2);border-left:3px solid var(--c5);padding:6px 10px;border-radius:8px}
.rd{font-size:12px;color:var(--mut);min-height:16px}
.leg{font-size:12px;color:var(--mut)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;margin:0 0 10px}.tl .ev:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl .ev.ot:before{background:var(--c2)}.tl .ev.medicion:before{background:var(--c3)}.tl .ev.hito:before{background:var(--bad)}.tl .ev.accion:before{background:var(--ok)}.tl .ev.analisis:before{background:var(--c4)}
.tl small{color:var(--mut)}
#drawer{position:fixed;top:0;right:0;width:min(440px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:40}
#drawer.on{transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
#drawer blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid var(--acc);background:var(--soft);font-size:13px;border-radius:0 8px 8px 0}
.x{float:right;border:0;background:var(--soft);color:var(--ink);font-size:18px;cursor:pointer;border-radius:8px;width:30px;height:30px}
#modal{position:fixed;inset:0;background:rgba(15,30,50,.55);z-index:50;display:none;padding:3vh 3vw}
#modal.on{display:block}
#modal .box{background:var(--panel);border-radius:18px;height:100%;overflow:auto;padding:16px}
.mat td.y{background:var(--acc);color:#fff;text-align:center}.mat td.nn{text-align:center;color:var(--mut)}
pre.code{background:var(--soft);padding:8px;border-radius:8px;overflow:auto;font-size:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13px;z-index:60;display:none}
details>summary{cursor:pointer;font-weight:600}
.rank td:first-child{font:600 14px var(--fh);color:var(--acc);width:34px}
@media (max-width:900px){#app{grid-template-columns:minmax(0,1fr)}body{overflow-x:hidden}#side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{display:none}#tabs{flex-direction:row}#tabs button{white-space:nowrap}.side-f{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- v6: tipografía fina, separadores por tipo de fuente, Ishikawa, imprimir ---- */
body{font-weight:350;letter-spacing:.005em}
h1,h2,h3{font-weight:500}
.card h2,.hero h2{font-weight:500}.ch-h b{font-weight:500}.kpi b{font-weight:600}
.ic{stroke-width:1.6}
.card,.chart,.kpi{box-shadow:0 1px 2px rgba(30,60,100,.06)}
th{font-weight:500}
#scrim{position:fixed;inset:0;background:rgba(15,30,50,.30);z-index:39;display:none}#scrim.on{display:block}
a.ext{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 45%,transparent);word-break:break-all}
a.ext:hover{background:var(--acc2)}
.sep{display:flex;align-items:center;gap:10px;margin:24px 0 10px;color:var(--tc,var(--mut));font:500 12px var(--fh);text-transform:uppercase;letter-spacing:.09em}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--tc,var(--line)))}
.sep:after{background:linear-gradient(270deg,transparent,var(--tc,var(--line)))}
.sep .n{background:var(--soft);color:var(--ink);padding:1px 9px;border-radius:999px;font-weight:500}
.sepr td{background:var(--soft2);color:var(--tc,var(--mut));font:500 11px var(--fh);text-transform:uppercase;letter-spacing:.09em;border-top:2px solid var(--tc,var(--line))}
.apa{padding-left:2.4em;text-indent:-2.4em;margin:0 0 10px;list-style:none;font-size:13.5px}
.apa .meta{display:block;text-indent:0;margin-top:3px}
.lnkb{display:inline-flex;gap:5px;align-items:center;font:500 11.5px var(--fb);padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--acc);text-decoration:none;margin:1px 3px 1px 0;background:var(--panel)}
.lnkb:hover{background:var(--acc2)}
.sd{border:1px dashed color-mix(in srgb,var(--bad) 55%,var(--line));border-radius:12px;padding:12px 14px;color:var(--mut);background:color-mix(in srgb,var(--bad) 5%,var(--panel))}
.sd b{display:block;color:var(--bad);font:500 12px var(--fh);letter-spacing:.06em;margin-bottom:3px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.tools .seg button{padding:5px 10px}
.pl{cursor:pointer}.pl rect.bg{transition:opacity .15s}.pl:hover rect.bg{stroke-width:1.8}.pl.dim{opacity:.18}
.ish-t text{fill:var(--ink)}
.pq{position:relative;margin:0 0 6px;padding:10px 14px 10px 54px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.pq .num{position:absolute;left:12px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc2);color:var(--acc);font:600 14px var(--fh)}
.pq q,.pq .qq{display:block;font:500 13.5px var(--fh);margin-bottom:3px;quotes:none}
.pq-ar{text-align:left;margin:0 0 6px 26px;color:var(--mut);height:16px;line-height:16px}
.pq.fin{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--panel))}
.idx{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr))}
.idx button{display:flex;gap:9px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 11px;border-radius:12px;font:400 13px var(--fb);cursor:pointer}
.idx button:hover{background:var(--soft)}.idx button small{display:block;color:var(--mut)}
.idx button.vac{border-style:dashed;color:var(--mut)}
.idx .ok{color:var(--ok)}.idx .no{color:var(--bad)}
@media print{
 #side,#top,#drawer,#scrim,#modal,#toast,.sub,.btn,.amp,.tools{display:none!important}
 #app{display:block}body{background:#fff;color:#000;font-size:11pt}main{max-width:none;padding:0}
 .card,.chart{box-shadow:none;break-inside:avoid;border-color:#bbb}
 section.tab:not(.on){display:none}.subpane:not(.on){display:none}
 body.print-all section.tab,body.print-all .subpane{display:block!important}
 body.print-all section.tab:before{content:attr(data-label);display:block;font:600 20pt var(--fh);margin:18pt 0 6pt;border-bottom:2px solid #333;break-before:page}
 body.print-all .subpane:before{content:attr(data-label);display:block;font:600 14pt var(--fh);margin:12pt 0 4pt;color:#333}
 .tw{overflow:visible}
}
</style>
</head>

function fitWeibull(data){
  var t=data.map(function(d){return d.t}),c=data.map(function(d){return !!d.censurado}),r=c.filter(function(x){return!x}).length;
  if(r<2)return{error:"se necesitan al menos 2 fallas para ajustar Weibull"};
  var beta=solveBeta(t,c);if(!isFinite(beta))return{error:"el estimador no converge (¿todos los tiempos iguales?)"};
  var st=0;t.forEach(function(v){st+=Math.pow(v,beta)});var eta=Math.pow(st/r,1/beta);
  return{beta:beta,eta:eta,r:r,n:t.length,ll:profLL(beta,t,c),t:t,c:c};
}
function bisect(f,a,b){var fa=f(a);for(var i=0;i<100;i++){var m=(a+b)/2,fm=f(m);if((fa>0)===(fm>0)){a=m;fa=fm}else b=m}return(a+b)/2}
var CHI=1.9207; /* chi-cuadrado(1, 0.95)/2 */
function ciBeta(f){
  var t=f.t,c=f.c,tgt=f.ll-CHI,h=function(b){return profLL(b,t,c)-tgt};
  var lo=h(0.02)<0?bisect(h,0.02,f.beta):0.02,hi=h(100)<0?bisect(h,f.beta,100):100;return[lo,hi];
}
function bLife(beta,eta,p){return eta*Math.pow(-Math.log(1-p),1/beta)}
function llTp(beta,tp,p,t,c){var eta=tp/Math.pow(-Math.log(1-p),1/beta),r=0,sf=0,s=0;for(var i=0;i<t.length;i++){s+=Math.pow(t[i]/eta,beta);if(!c[i]){r++;sf+=Math.log(t[i])}}return r*Math.log(beta)-r*beta*Math.log(eta)+(beta-1)*sf-s}
function maxOverBeta(tp,p,t,c){var a=0.05,b=60,gr=0.6180339887;for(var i=0;i<80;i++){var x1=b-gr*(b-a),x2=a+gr*(b-a);if(llTp(x1,tp,p,t,c)<llTp(x2,tp,p,t,c))a=x1;else b=x2}return llTp((a+b)/2,tp,p,t,c)}
function ciBLife(f,p){
  var tp=bLife(f.beta,f.eta,p),tgt=f.ll-CHI,h=function(x){return maxOverBeta(x,p,f.t,f.c)-tgt};
  var lo=tp,i=0;while(h(lo)>0&&i++<60)lo/=1.5;var hi=tp;i=0;while(h(hi)>0&&i++<60)hi*=1.5;
  return[bisect(h,lo,tp),bisect(h,tp,hi)];
}
function medianRanks(data){ /* rangos de Johnson con censura + aproximación de Bernard */
  var s=sortedData(data),n=s.length,prev=0,out=[],k=n;
  s.forEach(function(d,i){var rem=n-i;if(!d.censurado){var inc=(n+1-prev)/(1+rem);prev=prev+inc;out.push({t:d.t,F:(prev-0.3)/(n+0.4)})}});
  return out;
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bootR(data,tm,B,seed){
  var rng=mulberry(seed),out=[],n=data.length;
  for(var b=0;b<B;b++){var s=[];for(var i=0;i<n;i++)s.push(data[Math.floor(rng()*n)]);var f=fitWeibull(s);if(f.error)continue;out.push(Math.exp(-Math.pow(tm/f.eta,f.beta)))}
  out.sort(function(a,b){return a-b});return out;
}
function quant(a,q){if(!a.length)return NaN;var i=(a.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return a[lo]+(a[hi]-a[lo])*(i-lo)}

function vVida(host){
  var v=D.caso.vida;
  if(!v||!v.datos||!v.datos.length){host.innerHTML='<div class="card"><h2>Vida (Weibull)</h2><div class="note bad">No hay tiempos de vida suficientes para este análisis. No se calcula nada: un solo evento no permite ajustar una distribución.</div></div>';return}
  var f=fitWeibull(v.datos);
  if(f.error){host.innerHTML='<div class="card"><h2>Vida (Weibull)</h2><div class="note bad">'+esc(f.error)+'</div></div>';return}
  var cb=ciBeta(f),b10=bLife(f.beta,f.eta,.1),cb10=ciBLife(f,.1),ref=v.referencia,test="";
  if(ref){var okb=Math.abs(f.beta-ref.beta)/ref.beta<2e-3,oke=Math.abs(f.eta-ref.eta)/ref.eta<2e-3;
    test='<div class="note '+((okb&&oke)?'ok':'bad')+'">Autoprueba contra el kit de Python ('+esc(ref.origen||"reliability_kit")+'): β '+fmt(f.beta,4)+' frente a '+fmt(ref.beta,4)+' y η '+fmt(f.eta,2)+' frente a '+fmt(ref.eta,2)+' → <b>'+((okb&&oke)?"coinciden":"NO COINCIDEN: no use estas cifras")+'</b>.</div>'}
  else test='<div class="note">Sin valores de referencia incrustados: el cálculo del navegador no pudo contrastarse con el kit.</div>';
  var warn=f.r<10?'<div class="note bad">Solo '+f.r+' falla(s): resultado exploratorio. Los intervalos son anchos y pueden ser poco fiables; no extrapole más allá de la mayor edad observada ('+fmt(Math.max.apply(0,f.t),1)+').</div>':'';
  host.innerHTML='<div class="card"><h2>Vida: Weibull de dos parámetros por máxima verosimilitud con censura</h2><p>'+esc(v.nota||"")+' '+chips(v.evidencia)+'</p>'+warn+test+
   '<div class="grid"><div class="kpi"><b>'+fmt(f.beta,3)+'</b><span>β forma · IC 95 % verosimilitud perfilada ['+fmt(cb[0],2)+'; '+fmt(cb[1],2)+']</span></div>'+
   '<div class="kpi"><b>'+fmt(f.eta,1)+'</b><span>η escala ('+esc(v.unidad||"")+')</span></div>'+
   '<div class="kpi"><b>'+fmt(b10,1)+'</b><span>B10 · IC 95 % ['+fmt(cb10[0],1)+'; '+fmt(cb10[1],1)+']</span></div>'+
   '<div class="kpi"><b>'+f.r+' / '+f.n+'</b><span>fallas / observaciones</span></div></div>'+
   '<p style="font-size:13px">Lectura de β: '+(f.beta<.95?'menor que 1, tasa decreciente (mortalidad infantil o mezcla de modos)':f.beta>1.05?'mayor que 1, desgaste (la tasa crece con la edad)':'cercano a 1, tasa aproximadamente constante')+
   '. Si el intervalo incluye 1, los datos no distinguen entre tasa constante y variable.</p></div>'+
   '<div class="card"><h2>Papel de probabilidad Weibull</h2><div id="wp"></div></div>'+
   '<div class="card"><h2>Simulación: confiabilidad de una misión</h2><label>Duración de misión <input type="number" id="tm" value="'+fmt(Math.round(f.eta*0.25),0)+'"></label><label>Remuestreos <input type="number" id="bb" value="300"></label><button class="btn" id="go">Simular</button><div id="mc"></div></div>';
  var rk=medianRanks(v.datos);
  var W=760,H=300,m={l:50,r:14,t:10,b:30},lx=rk.map(function(p){return Math.log(p.t)}),ly=rk.map(function(p){return Math.log(-Math.log(1-p.F))});
  var xmin=Math.min.apply(0,lx.concat([Math.log(b10)]))-.3,xmax=Math.max.apply(0,lx)+.3,ymin=Math.min.apply(0,ly.concat([-3]))-.2,ymax=Math.max.apply(0,ly)+.4;
  function X(a){return m.l+(a-xmin)/(xmax-xmin)*(W-m.l-m.r)}function Y(a){return H-m.b-(a-ymin)/(ymax-ymin)*(H-m.t-m.b)}
  var s='';[.01,.05,.1,.25,.5,.75,.9,.99].forEach(function(q){var yy=Math.log(-Math.log(1-q));s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(yy)+'" y2="'+Y(yy)+'" stroke="var(--line)"/><text x="4" y="'+(Y(yy)+4)+'">'+(q*100)+'%</text>'});
  for(var e=Math.ceil(xmin/Math.LN10);e<=xmax/Math.LN10;e++){var xx=e*Math.LN10;s+='<line y1="'+m.t+'" y2="'+(H-m.b)+'" x1="'+X(xx)+'" x2="'+X(xx)+'" stroke="var(--line)"/><text x="'+X(xx)+'" y="'+(H-10)+'" text-anchor="middle">10^'+e+'</text>'}
  s+='<line x1="'+X(xmin)+'" y1="'+Y(f.beta*(xmin-Math.log(f.eta)))+'" x2="'+X(xmax)+'" y2="'+Y(f.beta*(xmax-Math.log(f.eta)))+'" stroke="var(--c1)" stroke-width="1.6"/>';
  rk.forEach(function(p,i){s+='<circle cx="'+X(lx[i])+'" cy="'+Y(ly[i])+'" r="4" fill="var(--c2)"><title>t='+fmt(p.t,1)+' F='+fmt(p.F,3)+'</title></circle>'});
  $("#wp").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Papel Weibull">'+s+'</svg><div style="font-size:12px;color:var(--mut)">Puntos: rangos de Johnson con aproximación de Bernard (solo fallas). La recta es el ajuste de máxima verosimilitud, no una regresión sobre los puntos.</div>';
  $("#go").onclick=function(){
    var tm=+$("#tm").value,B=Math.min(2000,Math.max(50,+$("#bb").value)),R=Math.exp(-Math.pow(tm/f.eta,f.beta)),bs=bootR(v.datos,tm,B,12345);
    $("#mc").innerHTML='<div class="grid"><div class="kpi"><b>'+fmt(R,3)+'</b><span>R(t) puntual</span></div><div class="kpi"><b>['+fmt(quant(bs,.025),3)+'; '+fmt(quant(bs,.975),3)+']</b><span>intervalo bootstrap 95 % ('+bs.length+' remuestreos válidos)</span></div></div><div class="note">Bootstrap no paramétrico sobre las observaciones, con semilla fija (12345) para que el resultado se repita. Es condicional al modelo Weibull y a que las unidades sean intercambiables.</div>';
  };
  $("#go").onclick();
}

function vSim(host){

   '<label>Costo preventivo <input type="number" id="sp" value="1" min="0.01" step="0.1"></label><label>Costo de falla <input type="number" id="sf" value="5" min="0.01" step="0.1"></label><span style="font-size:12px;color:var(--mut)">(costos en unidades relativas que usted define)</span>'+

    var k=0;C.forEach(function(v,j){if(v<C[k])k=j});var interior=b>1&&cf>cp&&k<N-1&&k>0,rtf=cf/(e*gamma1(b));

    var B10=e*Math.pow(-Math.log(0.9),1/b),B50=e*Math.pow(Math.LN2,1/b),MT=e*gamma1(b),vm=[{x:B10,label:"B10",c:"var(--c1)"},{x:B50,label:"B50",c:"var(--ok)"},{x:MT,label:"MTTF",c:"var(--warn)"}].filter(function(m){return m.x<=ts});
    var Fv=R.map(function(r){return 1-r}),fv=T.map(function(t){return b/e*Math.pow(t/e,b-1)*Math.exp(-Math.pow(t/e,b))});

    lineChart($("#s1"),{x:T,series:[{name:"R(t) confiabilidad",y:R}],vlines:vm,titulo:"R(t): confiabilidad",fixY:[0,1],xl:"horas de servicio",yl:"probabilidad de sobrevivir",desc:"Probabilidad de que el componente siga en servicio a cada edad, con los valores que usted eligió; se marcan B10, B50 y MTTF.",refsTxt:"relación estándar de la distribución Weibull; sin fuente en el registro (verificar en un texto de confiabilidad).",xfmt:function(v){return fmt(v,0)},key:"s1"});
    lineChart($("#s4"),{x:T,series:[{name:"f(t) densidad de fallas",y:fv}],vlines:vm,titulo:"f(t): densidad de fallas",xl:"horas de servicio",yl:"fallas por hora",desc:"Cómo se reparten las fallas en el tiempo; el pico es la edad de falla más probable.",refsTxt:"relación estándar de Weibull; sin fuente en el registro.",xfmt:function(v){return fmt(v,0)},key:"s4"});
    lineChart($("#s5"),{x:T,series:[{name:"F(t) probabilidad de falla",y:Fv}],vlines:vm,titulo:"F(t): probabilidad de falla",fixY:[0,1],xl:"horas de servicio",yl:"probabilidad acumulada",desc:"Probabilidad de haber fallado antes de cada edad. F = 1 menos R.",refsTxt:"relación estándar de Weibull; sin fuente en el registro.",xfmt:function(v){return fmt(v,0)},key:"s5"});
    lineChart($("#s2"),{x:T,series:[{name:"h(t) tasa de falla",y:Hh}],titulo:"h(t): tasa de riesgo",xl:"horas de servicio",yl:"fallas por hora entre los que sobreviven",desc:"Con β mayor que 1 la tasa crece con la edad (desgaste): el reemplazo preventivo puede tener sentido.",refsTxt:"relación estándar de Weibull; sin fuente en el registro.",xfmt:function(v){return fmt(v,0)},key:"s2"});
    lineChart($("#s3"),{x:T,series:[{name:"costo por hora C(T)",y:C}],vlines:interior?[{x:T[k],label:"óptimo",c:"var(--ok)"}]:[],zonas:interior?[{x0:T[k]*0.85,x1:T[k]*1.15,label:"zona óptima",c:"var(--c3)"}]:[],hlines:[{y:rtf,label:"correr a la falla",c:"var(--warn)"}],titulo:"Costo por hora frente a la edad de reemplazo",xl:"edad de reemplazo (h)",yl:"costo por hora (unidades relativas)",desc:"El mínimo marca la edad de reemplazo con menor costo por hora; la línea naranja es correr a la falla. Costos y parámetros los elige usted.",refsTxt:"modelo clásico de reemplazo por edad; costos sin fuente.",xfmt:function(v){return fmt(v,0)},key:"s3"});
  }

function vArbol(host){

  var raices=a.nodos.filter(function(n){return!hijosDe[n.id]}),pv=store("arbolp")||{};
  host.innerHTML='<div class="card"><h2>Árbol de fallas</h2><p><b>Evento tope:</b> '+esc(a.evento_tope||"")+'</p><div class="note">La estructura (puertas OR y AND) es una propuesta respaldada por la evidencia citada en cada nodo o por síntesis con premisas; no está probada con datos del activo. Las probabilidades de los eventos básicos están vacías: ingrese las que conozca (de 0 a 1) y se calcula la probabilidad del evento tope suponiendo eventos independientes. <b>La compuerta AND del evento tope y la agrupación de causas latentes son hipótesis del equipo</b>: el AND supone que la falla funcional exige además que el daño avance sin ser detectado ni atendido, lo que depende de si existe un programa de monitoreo; las causas latentes actúan como habilitador de las causas físicas, no como alternativa independiente.</div><button class="btn" id="arb-ex">Expandir todo</button> <button class="btn" id="arb-co">Contraer todo</button><div id="arb-tr"></div></div><div class="card"><h2>Probabilidad del evento tope</h2><div id="arb-pt"></div></div>'+vaciosHtml(a.vacios);
  function nodo(n,depth){
    var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean),g=n.puerta;
    var cab='<span class="badge '+(g==="AND"?'posible':g==="OR"?'probable':'')+'">'+esc(g)+'</span> '+esc(n.texto)+' '+nv(n.nivel)+' '+chips(n.evidencia)+(n.nota?'<br><small>'+lt(n.nota,100)+'</small>':'');
    if(!hs.length)return '<li style="list-style:none;margin:4px 0">'+cab+' <label>p <input type="number" min="0" max="1" step="0.001" data-p="'+esc(n.id)+'" value="'+(pv[n.id]==null?"":pv[n.id])+'" style="width:70px"></label></li>';
    return '<li style="list-style:none;margin:4px 0"><details'+(depth<2?' open':'')+'><summary>'+cab+'</summary><ul style="border-left:2px solid var(--line);margin-left:6px;padding-left:12px">'+hs.map(function(h){return nodo(h,depth+1)}).join("")+'</ul></details></li>';

  function calc(n){var hs=(n.hijos||[]).map(function(h){return N[h]}).filter(Boolean);if(!hs.length){return{p:pv[n.id]==null||pv[n.id]===""?null:+pv[n.id],falta:(pv[n.id]==null||pv[n.id]==="")?1:0}}
    var r=hs.map(calc),falta=r.reduce(function(x,y){return x+y.falta},0);if(falta)return{p:null,falta:falta};
    var p=n.puerta==="AND"?r.reduce(function(x,y){return x*y.p},1):1-r.reduce(function(x,y){return x*(1-y.p)},1);return{p:p,falta:0}}
  function out(){var tot=raices.map(calc),f=tot.reduce(function(x,y){return x+y.falta},0);

}

/* ---------- descargas, guardado y buscador ---------- */
function guardarArchivo(nombre,data){
  var ok=function(){toast("Listo: "+nombre)},fb=function(){try{var b=new Blob([data],{type:"application/octet-stream"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=nombre;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},600);ok()}catch(e){toast("No se pudo guardar")}};
  try{if(window.claude&&window.claude.use){window.claude.use("downloads").then(function(d){if(!d){fb();return}d.save({filename:nombre,data:data}).then(ok,function(e){if(!e||e.code!=="declined")toast("No se pudo guardar ("+((e&&e.code)||"error")+")")})},fb);return}}catch(e){}
  fb();
}
function csv(rows){return rows.map(function(r){return r.map(function(x){x=String(x==null?"":x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(",")}).join("\n")}
function sesion(){var o={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf("inf:")===0)o[k]=localStorage.getItem(k)}}catch(e){}return{tipo:"sesion-informe",titulo:D.caso.meta.titulo,fecha:new Date().toISOString().slice(0,10),datos:o}}
function nombreBase(){return (D.caso.meta.titulo||"informe").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50)}
var DESCARGAS=[
 ["doc","Informe completo (HTML)",function(){var c=document.documentElement.cloneNode(true);["#tabs","#main","#drawer","#mbody","#sres","#dmenu"].forEach(function(s){var e=c.querySelector(s);if(e)e.innerHTML=""});return["informe-"+nombreBase()+".html","<!doctype html>\n"+c.outerHTML]}],
 ["db","Datos del informe (JSON)",function(){return["datos-"+nombreBase()+".json",JSON.stringify({caso:D.caso,ajustes:D.ajustes,generado:D.generado},null,1)]}],
 ["libro","Registro de evidencia (CSV)",function(){return["evidencia-"+nombreBase()+".csv",csv([["id","nivel","tipo","autores","anio","titulo","fuente","doi","acceso","afirma","limites","cuartil"]].concat(D.evidencia.map(function(e){var r=e.referencia||{};return[e.id,e.nivel_evidencia,e.tipo,r.autores,r.anio,r.titulo,r.fuente,r.doi,e.acceso,e.afirma,e.limites,(e.revista_cuartil&&e.revista_cuartil.valor)?"Q"+e.revista_cuartil.valor:"sin verificar"]})))]}],
 ["doc","Referencias en APA 7 (TXT)",function(){return["referencias-"+nombreBase()+".txt",D.evidencia.filter(function(e){return e.nivel_evidencia==="VERIFICADO-TEXTO"||e.nivel_evidencia==="VERIFICADO-ABSTRACT"}).map(function(e){return e.apa}).sort().join("\n\n")]}],
 ["guardar","Mi sesión: puntajes y valores (JSON)",function(){return["sesion-"+nombreBase()+".json",JSON.stringify(sesion(),null,1)]}],
 ["imprimir","Informe para imprimir (HTML)",function(){var c=document.documentElement.cloneNode(true);["#tabs","#main","#drawer","#mbody","#sres","#dmenu"].forEach(function(s){var e=c.querySelector(s);if(e)e.innerHTML=""});c.querySelector("body").setAttribute("data-imprimir","1");return["imprimir-"+nombreBase()+".html","<!doctype html>\n"+c.outerHTML]}],
 ["faja","Réplicas y cifras (CSV)",function(){var rows=[["id","titulo","tipo","etiqueta_o_columna","valor_o_fila","ic_inferior","ic_superior","unidad","replica_de","evidencia"]];(D.caso.replicas||[]).forEach(function(r){if(r.tipo==="tabla"){rows.push([r.id,r.titulo,"tabla"].concat([(r.columnas||[]).join(" | ")]));(r.filas||[]).forEach(function(f){rows.push([r.id,r.titulo,"fila",f.join(" | ")])})}else(r.series||[]).forEach(function(s){rows.push([r.id,r.titulo,r.tipo,s.etiqueta,s.valor,s.ic?s.ic[0]:"",s.ic?s.ic[1]:"",r.unidad,r.replica_de,(r.evidencia||[]).join(" ")])})});(D.caso.cifras||[]).forEach(function(c){rows.push([c.id,c.mide,"cifra","",c.valor,"","",c.unidad,c.condiciones,(c.evidencia||[]).join(" ")])});return["replicas-"+nombreBase()+".csv",csv(rows)]}],
 ["trofeo","Ranking de fuentes (CSV)",function(){var U=usos();return["ranking-"+nombreBase()+".csv",csv([["id","tipo","nivel","anio","autores","titulo","usos_en_el_analisis","citas"]].concat(D.evidencia.map(function(e){var r=e.referencia||{};return[e.id,e.tipo,e.nivel_evidencia,r.anio,r.autores,r.titulo,U[e.id]||0,"SIN DATOS PARA ARMARLO"]})))]}]
];
function buildIndex(){
  var I=[],c=D.caso,an=c.analisis||{},dz=c.dossier;
  function add(t,txt,tab,sub,ev){I.push({t:t,x:txt,tab:tab,sub:sub,ev:ev})}
  D.evidencia.forEach(function(e){add("Fuente",e.apa+" "+e.afirma,dz?"evi":"evi",dz?"ran":null,e.id)});
  (c.resumen.hallazgos||[]).forEach(function(h){add("Hallazgo",h.texto,"res")});
  if(an.fmeca)an.fmeca.items.forEach(function(m){add("FMECA",m.id+" "+m.modo+" "+(m.mecanismo||"")+" "+(m.causa||""),"mod","fme")});
  if(an.arbol)an.arbol.nodos.forEach(function(n){add("Árbol",n.texto,"mod","arb")});
  if(an.acr){(an.acr.hipotesis||[]).forEach(function(h){add("Hipótesis",h.id+" "+h.texto,"mod","hip")});Object.keys(an.acr.ishikawa||{}).forEach(function(k){an.acr.ishikawa[k].forEach(function(x){add("Ishikawa "+k,x.texto,"mod","ish")})})}
  if(an.lcc)(an.lcc.elementos||[]).forEach(function(e){add("Costo",e.nombre+" "+(e.como_se_calcula||""),"vyc","cos")});
  if(an.vida)(an.vida.hallazgos||[]).forEach(function(h){add("Vida",h.texto,"vyc","met")});
  if(an.predictivo){(an.predictivo.hallazgos||[]).forEach(function(h){add("Predictivo",h.texto,"mon","est")});(an.predictivo.estrategia||[]).forEach(function(h){add("Estrategia",h.etapa+" "+h.accion,"mon","est")})}
  if(dz)dz.orden.forEach(function(k){var s=dz.secciones[k]||{};(s.elementos||[]).forEach(function(e){add(dz.titulos[k],e.titulo,"evi","cob")});if(s.vacio)add("SIN DATOS PARA ARMARLO "+dz.titulos[k],s.vacio,"pla","vac")});
  ((an.porques||{}).items||[]).forEach(function(h){h.cadena.forEach(function(x){add("5 porqués "+h.causa,x.porque,"mod","por")})});
  ((an.observar||{}).items||[]).forEach(function(x){add("Qué observar "+x.hipotesis,x.sintoma+" "+x.medicion,"mod","obs")});
  (c.replicas||[]).forEach(function(r){add("Réplica",r.id+" "+r.titulo+" "+(r.replica_de||""),"evi","rep")});
  (c.cifras||[]).forEach(function(x){add("Cifra",x.valor+" "+(x.unidad||"")+" "+x.mide+" "+(x.condiciones||""),"evi","rep")});
  (c.vacios||[]).forEach(function(v){add("Vacío",v,dz?"pla":"ras",dz?"vac":null)});
  return I;
}

  }
